<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 432" width="976" height="432" role="img" aria-label="What talks to what in a Chromium build on Buildbarn">
<title>What talks to what in a Chromium build on Buildbarn</title>
<rect width="976" height="432" rx="10" fill="#f5f2ea"/>
<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#202224" text-anchor="start" font-weight="700">What talks to what</text>
<text x="24" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#5b6067" text-anchor="start" font-weight="400">One Chromium build, from the developer&#x27;s machine to the worker pools and back to Hermetiq.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#795519"/></marker></defs>
<rect x="24" y="90" width="210" height="120" rx="8" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="38" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#202224" text-anchor="start" font-weight="700">Developer machine</text>
<text x="38" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">Siso (Chromium&#x27;s build tool)</text>
<text x="38" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">runs local steps itself</text>
<text x="38" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">sends the rest to Buildbarn</text>
<text x="38" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">siso-bep reports the build</text>
<rect x="300" y="90" width="200" height="120" rx="8" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="314" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#202224" text-anchor="start" font-weight="700">Buildbarn frontend</text>
<text x="314" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">checks credentials</text>
<text x="314" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">read cache: 8 GiB,</text>
<text x="314" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">10 blocks of 819 MiB</text>
<text x="314" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">routes to storage and scheduler</text>
<rect x="300" y="260" width="200" height="110" rx="8" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="314" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#202224" text-anchor="start" font-weight="700">Storage</text>
<text x="314" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">content-addressed blobs</text>
<text x="314" y="321" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">(CAS) and the action</text>
<text x="314" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">cache (AC)</text>
<rect x="566" y="90" width="180" height="120" rx="8" fill="#fffdf8" stroke="#d9d3c4" stroke-width="1.5"/>
<text x="580" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#202224" text-anchor="start" font-weight="700">Scheduler</text>
<text x="580" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">one queue per platform</text>
<text x="580" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">learns which actions</text>
<text x="580" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">need a large worker</text>
<text x="580" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">(size classes 1 and 4)</text>
<rect x="566" y="260" width="180" height="110" rx="8" fill="#fbf3e2" stroke="#eaaf4f" stroke-width="1.5"/>
<text x="580" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#202224" text-anchor="start" font-weight="700">Small pool, class 1</text>
<text x="580" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">up to 12 pods</text>
<text x="580" y="321" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">24 actions per pod</text>
<rect x="762" y="260" width="176" height="110" rx="8" fill="#fbf3e2" stroke="#eaaf4f" stroke-width="1.5"/>
<text x="776" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#202224" text-anchor="start" font-weight="700">Large pool, class 4</text>
<text x="776" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">up to 28 pods</text>
<text x="776" y="321" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">12 actions per pod</text>
<rect x="762" y="90" width="176" height="120" rx="8" fill="#eef3ff" stroke="#78a8ff" stroke-width="1.5"/>
<text x="776" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#202224" text-anchor="start" font-weight="700">Hermetiq</text>
<text x="776" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">build history, remote</text>
<text x="776" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">actions, cache events</text>
<text x="776" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">Barn Owl: dashboard</text>
<text x="776" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6067" text-anchor="start" font-weight="400">and MCP for your agent</text>
<line x1="234" y1="140" x2="298" y2="140" stroke="#795519" stroke-width="2" marker-end="url(#a)"/>
<text x="266.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#795519" text-anchor="middle" font-weight="600">REAPI</text>
<line x1="400" y1="210" x2="400" y2="258" stroke="#795519" stroke-width="2" marker-end="url(#a)"/>
<line x1="500" y1="140" x2="564" y2="140" stroke="#795519" stroke-width="2" marker-end="url(#a)"/>
<text x="532.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#795519" text-anchor="middle" font-weight="600">execute</text>
<line x1="640" y1="210" x2="640" y2="258" stroke="#795519" stroke-width="2" marker-end="url(#a)"/>
<line x1="700" y1="210" x2="820" y2="258" stroke="#795519" stroke-width="2" marker-end="url(#a)"/>
<path d="M129 210 L129 398 L950 398 L950 150 L941 150" fill="none" stroke="#78a8ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="330" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#3d64b8" text-anchor="middle" font-weight="600">siso-bep sends build events (BEP) to Hermetiq</text>
<line x1="850" y1="258" x2="850" y2="212" stroke="#78a8ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="858" y="239" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#3d64b8" text-anchor="start" font-weight="600">action logs</text>
</svg>
