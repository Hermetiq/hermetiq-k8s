suite: buildbarn config generation
templates:
  - templates/configmaps.yaml
tests:
  - it: explicitly disabled ISCC/FSAC stores have no stores or raw block devices
    set:
      storage.persistence.iscc.enabled: false
      storage.persistence.fsac.enabled: false
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: initialSizeClassCache
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: fileSystemAccessCache
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "devicePath"

  - it: default config enables ISCC/FSAC stores and sharded backends
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "initialSizeClassCache:"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "fileSystemAccessCache:"
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "initialSizeClassCache:"
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "fileSystemAccessCache:"

  - it: block-device backend emits a raw devicePath source
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "devicePath: '/dev/bb/cas'"
      # Raw blocks stay on the device; persistent metadata does not add a CAS blocks file.
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "storage-cas/cdc-v1/blocks\\.db|cas-blocks\\.db"

  # Persistence requires a persistent key-location map: an in-memory KLM store
  # must not carry a `persistent` block (its blocks would reattach after a
  # restart full of data the empty index can never reach).
  - it: explicit in-memory-KLM stores render no persistent state config
    set:
      storage.persistence.ac.keyLocationMap.type: inMemory
      storage.persistence.iscc.keyLocationMap.type: inMemory
      storage.persistence.fsac.keyLocationMap.type: inMemory
      storage.persistence.iscc.enabled: true
      storage.persistence.fsac.enabled: true
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      # CAS on filesystem always uses a file-backed KLM => stays persistent.
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "storage-cas/cdc-v1/persistent_state"
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "storage-ac/(cdc-v1/)?persistent_state"
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "storage-iscc/(cdc-v1/)?persistent_state"
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "storage-fsac/(cdc-v1/)?persistent_state"

  - it: a disk-backed AC key-location map turns persistence back on
    set:
      storage.persistence.ac.keyLocationMap.type: blockDevice
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "storage-ac/cdc-v1/ac-keys\\.db"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "storage-ac/cdc-v1/persistent_state"

  # writeConcurrencyLimit is a blockdevice.Configuration field: it must render
  # inside `source`, or bb-storage rejects the config at startup.
  - it: writeConcurrencyLimit renders inside the blockdevice source
    set:
      storage.persistence.cas.writeConcurrencyLimit: 64
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: 'writeConcurrencyLimit: 64,\n            \},\n            spareBlocks:'

  - it: legacy blockDevice.writeConcurrencyLimit alias renders inside source
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.writeConcurrencyLimit: 32
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: 'writeConcurrencyLimit: 32,\n            \},'

  - it: sizeClassAnalysis wires the feedback-driven analyzer + ISCC backend
    set:
      storage.persistence.iscc.enabled: true
      scheduler.sizeClassAnalysis.enabled: true
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "feedbackDriven:"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "initialSizeClassCache: common.initialSizeClassCache"

  - it: preserves the upstream scheduler configuration with feature hooks disabled
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - notMatchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "scheduler-routing|configurationReloadInterval|predeclaredPlatformQueues|handoverGrpcServers|coordinator:|legacyContentAddressableStorage|adminHttpServers:|browserUrl:"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "deprecatedAdminHttpServers:"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "deprecatedPortalUrl: common.portalUrl,"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "actionRouter:"
      - notExists:
          path: data["scheduler-routing.libsonnet"]
      - notExists:
          path: data["scheduler-coordinator-ca.pem"]

  - it: renders configurationReloadInterval when set with a fork scheduler image
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.configurationReloadInterval: 30s
      scheduler.handover.cdcCompatibleFork: true
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'configurationReloadInterval: "30s",'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'deprecatedAdminHttpServers:'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: '(?m)^  contentAddressableStorage: common.blobstore.contentAddressableStorage,'
      - notMatchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'legacyContentAddressableStorage:'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'deprecatedPortalUrl: common\.portalUrl,'
      - notMatchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'adminHttpServers:|browserUrl:'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "local routing = import 'scheduler-routing.libsonnet';"
      - matchRegex:
          path: data["scheduler-routing.libsonnet"]
          pattern: "actionRouter:"
      - matchRegex:
          path: data["scheduler-routing.libsonnet"]
          pattern: "predeclaredPlatformQueues:"

  - it: predeclaredPlatformQueues renders a multi-size-class queue when set
    set:
      scheduler.predeclaredPlatformQueues:
        - platform:
            - name: pool
              value: sizeclass
          sizeClasses: [1, 2]
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "predeclaredPlatformQueues:"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "sizeClasses:"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: sizeclass

  - it: omits actionResultExpiring by default, leaving completenessChecking bare
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "actionCache: completenessCheckedActionCache"
      - notMatchRegex:
          path: data["common.libsonnet"]
          pattern: "actionResultExpiring"

  - it: wraps completenessChecking in actionResultExpiring when enabled
    set:
      config.actionCache.actionResultExpiring.enabled: true
      config.actionCache.actionResultExpiring.minimumValidity: 2592000s
      config.actionCache.actionResultExpiring.maximumValidityJitter: 259200s
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: 'minimumValidity: "2592000s"'
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: 'maximumValidityJitter: "259200s"'
      # completenessChecking must survive underneath: it is the correctness layer.
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "backend: completenessCheckedActionCache"
      # minimumTimestamp must ALWAYS render. bb-storage validates it
      # unconditionally and dies on a nil Timestamp, so an unset value has to
      # fall back to the epoch rather than omitting the field.
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: 'minimumTimestamp: "1970-01-01T00:00:00Z"'

  - it: emits minimumTimestamp only when set
    set:
      config.actionCache.actionResultExpiring.enabled: true
      config.actionCache.actionResultExpiring.minimumTimestamp: "2026-07-29T00:10:00Z"
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: 'minimumTimestamp: "2026-07-29T00:10:00Z"'

  - it: renders a configurable frontend existence cache
    set:
      frontend.contentAddressableStorage.existenceCaching.cacheDuration: 30s
      frontend.contentAddressableStorage.existenceCaching.cacheSize: 500000
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["frontend.jsonnet"]
          pattern: "cacheSize: 500000"
      - matchRegex:
          path: data["frontend.jsonnet"]
          pattern: "cacheDuration: \"30s\""

  - it: drops the existence cache entirely when disabled
    set:
      frontend.contentAddressableStorage.existenceCaching.enabled: false
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - notMatchRegex:
          path: data["frontend.jsonnet"]
          pattern: "existenceCaching"
      - matchRegex:
          path: data["frontend.jsonnet"]
          pattern: "contentAddressableStorage: common.blobstore.contentAddressableStorage"

  - it: never omits minimumTimestamp, whatever the value
    # Regression: omitting the field made bb-storage fail startup with
    # "Invalid minimum timestamp: proto: invalid nil Timestamp".
    set:
      config.actionCache.actionResultExpiring.enabled: true
      config.actionCache.actionResultExpiring.minimumTimestamp: ""
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "minimumTimestamp:"

  - it: defaults to a simple action router, unchanged
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'actionRouter: \{\s*simple: \{'
      - notMatchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'demultiplexing'

  # A catch-all needs BOTH halves: a defaultActionRouter to receive the
  # leftovers AND a static platformKeyExtractor to rewrite them onto a platform
  # a pool actually advertises. A default route that keeps the `action`
  # extractor matches them exactly as before and still finds no worker, which
  # is the shape a first attempt usually takes.
  - it: renders a catch-all with both halves when demultiplexing
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    set:
      scheduler.actionRouter.mode: demultiplexing
      scheduler.actionRouter.backends:
        - instanceNamePrefix: ""
          platform:
            properties:
              - name: container-image
                value: docker://example/ubuntu
      scheduler.actionRouter.catchAll.platform.properties:
        - name: container-image
          value: docker://example/ubuntu
        - name: pool
          value: fallback
    asserts:
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'demultiplexing: \{'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'defaultActionRouter: \{'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'static: \{'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: '\{ name: "pool", value: "fallback" \}'
      # The analyzer still reaches every router body, including the catch-all's.
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: 'maximumExecutionTimeout: "7200s"'

  - it: splices raw jsonnet for mode custom
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    set:
      scheduler.actionRouter.mode: custom
      scheduler.actionRouter.custom: |
        remote: { endpoint: { address: 'router:8080' } },
    asserts:
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "remote: \\{ endpoint:"

  # The point of the default: adopting the mTLS block must not rewrite a byte of
  # anyone's ConfigMap, because that rolls every pod on upgrade — and for the
  # worker ConfigMap, every operator-managed pool with rolloutOnChange.
  - it: leaves every in-cluster hop in plaintext by default
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "serverKeyPair"
      - notMatchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "serverKeyPair"
      - notMatchRegex:
          path: data["common.libsonnet"]
          pattern: "storageClientTls"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: 'authenticationPolicy: \{\n      allow: \{\},\n    \},'
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "authenticationPolicy: \\{ allow: \\{\\} \\},"

  # mTLS is four settings in two messages. A test that only checks the server
  # key pair would pass on a config that encrypts nothing the peer verifies.
  - it: renders both halves of every in-cluster hop when grpcMtls is on
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    set:
      security.grpcMtls.enabled: true
      security.grpcMtls.certificateAuthorities: "-----BEGIN CERTIFICATE-----\nZmFrZQ==\n-----END CERTIFICATE-----\n"
      security.grpcMtls.validationExpression: "contains(dnsNames, 'scheduler')"
    asserts:
      # Listening half: the key pair, on every port a Buildbarn service dials.
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "serverKeyPair"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "certificatePath: '/etc/buildbarn/mtls/tls.crt'"
      # Verifying half: tls alone would be one-way TLS, which checks nobody.
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "tlsClientCertificate: \\{"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "contains\\(dnsNames, 'scheduler'\\)"
      # All four scheduler ports, so a new one cannot be added unprotected.
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "(?s)8982.*serverKeyPair.*tlsClientCertificate"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "(?s)8983.*serverKeyPair.*tlsClientCertificate"
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "(?s)8984.*serverKeyPair.*tlsClientCertificate"
      # Dialling half: one shared local, applied to every storage shard client.
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "local storageClientTls = \\{"
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "clientKeyPair"
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "\\} \\+ storageClientTls \\} \\},"
      - matchRegex:
          path: data["frontend.jsonnet"]
          pattern: "(?s)address: 'scheduler:8982',.*clientKeyPair"
      - matchRegex:
          path: data["portal.jsonnet"]
          pattern: "(?s)address: 'scheduler:8984',.*clientKeyPair"
      # The admin port is HTTP; it has no tlsClientCertificate arm to render.
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "(?s)7982.*authenticationPolicy: \\{ allow: \\{\\} \\},"

  - it: publishes only the shared config used by operator-managed workers
    documentSelector:
      path: metadata.name
      value: buildbarn-worker-config
    asserts:
      - isNotNull:
          path: data["common.libsonnet"]
      - equal:
          path: data["workerImage"]
          value: ghcr.io/buildbarn/bb-worker:20261113T075319Z-f22e022
      - equal:
          path: data["runnerInstallerImage"]
          value: ghcr.io/buildbarn/bb-runner-installer:20261113T075319Z-f22e022
      - notExists:
          path: data["worker-common.libsonnet"]
      - notExists:
          path: data["worker-ubuntu22-04.jsonnet"]
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "(?s)\\}\\s*\\+ \\{.*blobstore\\+: \\{.*contentAddressableStorage\\+: \\{.*chunkCache: \\{\\n *cacheSize: 2048,"

  - it: omits the worker chunk cache when its size is 0
    set:
      config.contentAddressableStorage.chunkCache.cacheSize: 0
    documentSelector:
      path: metadata.name
      value: buildbarn-worker-config
    asserts:
      - notMatchRegex:
          path: data["common.libsonnet"]
          pattern: "chunkCache"

  - it: uses customized worker chunk cache settings
    set:
      config.contentAddressableStorage.chunkCache.cacheSize: 4096
      config.contentAddressableStorage.chunkCache.cacheDuration: 1800s
      config.contentAddressableStorage.chunkCache.cacheReplacementPolicy: FIRST_IN_FIRST_OUT
    documentSelector:
      path: metadata.name
      value: buildbarn-worker-config
    asserts:
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: 'chunkCache: \{\n *cacheSize: 4096,\n *cacheDuration: "1800s",\n *cacheReplacementPolicy: "FIRST_IN_FIRST_OUT",'

  - it: preserves a complete worker common override without appending the default cache
    set:
      configOverrides:
        common.libsonnet: "{ blobstore: { contentAddressableStorage: { chunkStorage: {}, chunkMappingStorage: {} } }, portalUrl: 'custom' }"
    documentSelector:
      path: metadata.name
      value: buildbarn-worker-config
    asserts:
      - equal:
          path: data["common.libsonnet"]
          value: "{ blobstore: { contentAddressableStorage: { chunkStorage: {}, chunkMappingStorage: {} } }, portalUrl: 'custom' }"

  - it: renders RepMaxCDC chunkStorage, chunkMappingStorage, and nested keyLocationMap across configs
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "chunkStorage: shardedStorage,"
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "chunkMappingValidating:"
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "cdcParameterCache:"
      - notMatchRegex:
          path: data["common.libsonnet"]
          pattern: "chunkCache"
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: "portalUrl: 'https://browser.helm.hermetiq.dev',"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "contentAddressableStorageServer:"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "chunkingParameters:"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "path: '/storage-cas/cdc-v1/cms-blocks.db'"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "path: '/storage-ac/cdc-v1/ac-blocks.db'"
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "dataIntegrityValidationCache|keyLocationMapInMemory|keyLocationMapOnBlockDevice"
      - matchRegex:
          path: data["browser.jsonnet"]
          pattern: "address: 'frontend-internal:8980'"

  - it: wraps common.libsonnet CAS stores in deadlineEnforcing when timeout is set
    set:
      config.blobstore.deadlineEnforcing.timeout: 30s
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["common.libsonnet"]
          pattern: 'deadlineEnforcing: \{\n          timeout: "30s",\n          backend: shardedStorage,'

  - it: keeps a named mode over the grpcMtls default, for a staged rollout
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    set:
      security.grpcMtls.enabled: true
      security.grpcMtls.certificateAuthorities: "-----BEGIN CERTIFICATE-----\nZmFrZQ==\n-----END CERTIFICATE-----\n"
      scheduler.workerGrpcServers.authenticationPolicy.mode: allow
      storage.grpcServers.authenticationPolicy.mode: deny
      storage.grpcServers.authenticationPolicy.denyMessage: storage is draining
    asserts:
      # Still terminates TLS; just does not demand a client certificate yet.
      - matchRegex:
          path: data["scheduler.jsonnet"]
          pattern: "(?s)8983.*serverKeyPair.*authenticationPolicy: \\{ allow: \\{\\} \\},"
      # grpc.AuthenticationPolicy.deny is a STRING, unlike the authorizer deny.
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: 'deny: "storage is draining",'

  - it: CMS placement for filesystem
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cas/cdc-v1/cms-keys.db"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cas/cdc-v1/cms_persistent_state"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cas/cdc-v1/cms-blocks.db"

  - it: CMS placement for raw file index
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.keyLocationMap: file
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cas-meta/cdc-v1/cms-keys.db"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cas-meta/cdc-v1/cms_persistent_state"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cas-meta/cdc-v1/cms-blocks.db"

  - it: CMS placement for raw memory index
    set:
      storage.persistence.cas.blockDevice.keyLocationMap: inMemory
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "cms-keys.db"
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "cms_persistent_state"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "blockSizeBytes: 8388608"

  - it: CMS placement for explicit CMS memory index
    set:
      storage.persistence.cms.keyLocationMap.type: inMemory
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "cms-keys.db"
      - notMatchRegex:
          path: data["storage.jsonnet"]
          pattern: "cms_persistent_state"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cas/cdc-v1/cms-blocks.db"

  - it: renders a dedicated raw CMS with a file index beside filesystem ISCC and FSAC file indexes
    set:
      storage.persistence.cms.backend: blockDevice
      storage.persistence.cms.blockDevice.storageClassName: bb-block
      storage.persistence.cms.blockDevice.keyLocationMap: file
      storage.persistence.cms.writeConcurrencyLimit: 16
      storage.persistence.iscc.enabled: true
      storage.persistence.iscc.keyLocationMap.type: blockDevice
      storage.persistence.fsac.enabled: true
      storage.persistence.fsac.keyLocationMap.type: blockDevice
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "devicePath: '/dev/bb/cms'"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cms-meta/cms-keys\\.db"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-cms-meta/persistent_state"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "writeConcurrencyLimit: 16"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-iscc/cdc-v1/iscc-keys\\.db"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-iscc/cdc-v1/persistent_state"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-fsac/cdc-v1/fsac-keys\\.db"
      - matchRegex:
          path: data["storage.jsonnet"]
          pattern: "/storage-fsac/cdc-v1/persistent_state"

  - it: renders frontend readCache inside CDC chunkStorage and browser fallback when internalService is disabled
    set:
      frontend.readCache.enabled: true
      frontend.internalService.enabled: false
    documentSelector:
      path: metadata.name
      value: buildbarn-config
    asserts:
      - matchRegex:
          path: data["frontend.jsonnet"]
          pattern: "(?s)chunkStorage:.*existenceCaching:.*readCaching:"
      - matchRegex:
