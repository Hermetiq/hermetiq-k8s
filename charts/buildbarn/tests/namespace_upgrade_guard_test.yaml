suite: buildbarn namespaceOverride upgrade guard
templates:
  - templates/validate.yaml
release:
  name: buildbarn
  namespace: team-a
  upgrade: true
kubernetesProvider:
  scheme:
    "apps/v1/StatefulSet":
      gvr:
        group: "apps"
        version: "v1"
        resource: "statefulsets"
      namespaced: true
  objects:
    # What a release installed with --namespace team-a and no override left
    # behind while namespaceOverride defaulted to hermetiq.
    - kind: StatefulSet
      apiVersion: apps/v1
      metadata:
        name: storage
        namespace: hermetiq
        annotations:
          meta.helm.sh/release-name: buildbarn
          meta.helm.sh/release-namespace: team-a
tests:
  - it: refuses to move a release whose resources still live in hermetiq
    asserts:
      - failedTemplate:
          errorPattern: 'release "buildbarn" \(namespace "team-a"\) has its Buildbarn resources in hermetiq from the old default.*Set namespaceOverride=hermetiq to keep them where they are, or namespaceOverride=team-a to move them deliberately'

  - it: allows the upgrade when namespaceOverride pins hermetiq
    set:
      namespaceOverride: hermetiq
    asserts:
      - notFailedTemplate: {}

  - it: allows a deliberate move when namespaceOverride names the release namespace
    set:
      namespaceOverride: team-a
    asserts:
      - notFailedTemplate: {}

  - it: ignores a hermetiq storage StatefulSet owned by another release
    release:
      name: other-buildbarn
      namespace: team-a
    asserts:
      - notFailedTemplate: {}

  - it: ignores the same release name installed from a different namespace
    release:
      name: buildbarn
      namespace: team-b
    asserts:
      - notFailedTemplate: {}

  - it: does not apply to releases installed in hermetiq
    release:
      name: buildbarn
      namespace: hermetiq
    asserts:
      - notFailedTemplate: {}
