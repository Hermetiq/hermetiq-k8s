suite: buildbarn namespace placement
templates:
  - templates/statefulset-storage.yaml
  - templates/deployment-frontend.yaml
  - templates/vmrules.yaml
  - templates/validate.yaml
release:
  name: buildbarn
  namespace: team-a
tests:
  - it: renders into the release namespace by default
    asserts:
      - equal:
          path: metadata.namespace
          value: team-a
        template: templates/statefulset-storage.yaml
      - equal:
          path: metadata.namespace
          value: team-a
        template: templates/deployment-frontend.yaml
      - equal:
          path: metadata.namespace
          value: team-a
        template: templates/vmrules.yaml

  - it: renders into namespaceOverride when set
    set:
      namespaceOverride: pinned
    asserts:
      - equal:
          path: metadata.namespace
          value: pinned
        template: templates/statefulset-storage.yaml
      - equal:
          path: metadata.namespace
          value: pinned
        template: templates/deployment-frontend.yaml
      - equal:
          path: metadata.namespace
          value: pinned
        template: templates/vmrules.yaml

  # No cluster objects to find, so the upgrade guard in validate.yaml has
  # nothing to object to.
  - it: allows a fresh install into a namespace other than hermetiq
    template: templates/validate.yaml
    asserts:
      - notFailedTemplate: {}
