      storage.persistence.cms.backend: filesystem
      storage.persistence.cms.size: 4Gi
      storage.persistence.cms.blocksSizeGi: 2
      storage.persistence.cms.keyLocationMap.sizeMi: 256
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.cms.keyLocationMap.sizeMi to at least 484 MiB'

  - it: reports raw CAS metadata index size rather than ignored RAM entries
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.size: 340Gi
      storage.persistence.cas.blockDevice.metadata.keyLocationMapSizeMi: 1024
      storage.persistence.cas.blockDevice.keyLocationMapInMemoryEntries: 40000000
    asserts:
