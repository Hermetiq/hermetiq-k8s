    asserts:
      - failedTemplate:
          errorPattern: '_testLookup is reserved for offline chart unit tests and cannot be set during helm upgrade'

  # The authenticationPolicy `mode` enums (and scheduler.actionRouter.mode) are
  # enforced by values.schema.json, which rejects the release before any
  # template runs, so they cannot be asserted with failedTemplate — helm reports
  # a chart-level error rather than a template one. validate.yaml keeps the same
  # checks as a backstop for `--skip-schema-validation`; the enum lists
  # themselves live in values.schema.json.

  - it: reports the filesystem AC file knob after an entries-only scale-up
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.ac.size: 25Gi
      storage.persistence.ac.blocksSizeGi: 20
      storage.persistence.ac.keyLocationMap.entries: 42000000
    asserts:
      - failedTemplate:
          errorPattern: 'storage.persistence.ac: key-location map is too small.*that is 1.25x.*Set storage.persistence.ac.keyLocationMap.sizeMi to at least 2152 MiB.*RAM entry settings do not size this file index'

  - it: rejects an AC file index one MiB below the rounded minimum
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.ac.size: 25Gi
      storage.persistence.ac.blocksSizeGi: 20
      storage.persistence.ac.keyLocationMap.sizeMi: 2151
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.ac.keyLocationMap.sizeMi to at least 2152 MiB'

  - it: accepts the rounded minimum AC file index
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.ac.size: 25Gi
      storage.persistence.ac.blocksSizeGi: 20
      storage.persistence.ac.keyLocationMap.sizeMi: 2152
    asserts:
      - notFailedTemplate: {}

  - it: checks enabled filesystem ISCC file-index capacity
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.iscc.enabled: true
      storage.persistence.iscc.size: 4Gi
      storage.persistence.iscc.blocksSizeGi: 2
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.iscc.keyLocationMap.sizeMi to at least 484 MiB'

  - it: checks enabled filesystem FSAC file-index capacity
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.fsac.enabled: true
      storage.persistence.fsac.size: 12Gi
      storage.persistence.fsac.blocksSizeGi: 8
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.fsac.keyLocationMap.sizeMi to at least 484 MiB'

  - it: skips disabled filesystem FSAC even with an undersized file index
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.fsac.enabled: false
      storage.persistence.fsac.keyLocationMap.sizeMi: 1
    asserts:
      - notFailedTemplate: {}

  # The CMS index size is set in these three cases so they test the arithmetic
  # and not the chart default.
  - it: checks shared CMS file-index capacity on the CAS filesystem
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.cms.blocksSizeGi: 2
      storage.persistence.cms.keyLocationMap.sizeMi: 256
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.cms.keyLocationMap.sizeMi to at least 484 MiB'

  - it: checks shared CMS file-index capacity on raw CAS metadata
    set:
