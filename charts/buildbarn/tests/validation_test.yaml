                    commonConfigMapName: envoy-worker-config
                images:
                  runner: example.com/runner:latest
    asserts:
      - failedTemplate:
          errorPattern: 'live RbeWorker .*/worker-envoy pins pre-CDC image .* in spec\.images\.worker'

  # A ConfigMap that exists only in the release's render is not missing.
  - it: accepts a worker referencing a ConfigMap the release renders for the first time
    set:
      extraObjects:
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: new-worker-config
          data:
            common.libsonnet: "{ blobstore: { contentAddressableStorage: { chunkStorage: {}, chunkMappingStorage: {} } } }"
      _testLookup:
