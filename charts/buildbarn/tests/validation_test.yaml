suite: buildbarn validation
templates:
  - templates/validate.yaml
tests:
  - it: rejects enabled ISCC filesystem blocks that fill the PVC
    set:
      storage.persistence.iscc.enabled: true
      storage.persistence.iscc.blocksSizeGi: 8
    asserts:
      - failedTemplate:
          errorPattern: "storage.persistence.iscc.blocksSizeGi .* must be smaller than storage.persistence.iscc.size"

  - it: rejects enabled FSAC filesystem blocks that fill the PVC
    set:
      storage.persistence.fsac.enabled: true
      storage.persistence.fsac.blocksSizeGi: 8
    asserts:
      - failedTemplate:
          errorPattern: "storage.persistence.fsac.blocksSizeGi .* must be smaller than storage.persistence.fsac.size"

  - it: rejects block metadata PVCs that cannot hold the key-location map
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.keyLocationMap: file
      storage.persistence.cas.blockDevice.metadata.size: 500Mi
      storage.persistence.cas.blockDevice.metadata.keyLocationMapSizeMi: 800
    asserts:
      - failedTemplate:
          errorPattern: "storage.persistence.cas.blockDevice.metadata.size .* must be larger than storage.persistence.cas.blockDevice.metadata.keyLocationMapSizeMi"

  - it: allows grpc-cache-proxy with no NATS URL (pass-through, events disabled)
    set:
      frontend.grpcCacheProxy.enabled: true
      frontend.grpcCacheProxy.natsUrl: ""
    asserts:
      - notFailedTemplate: {}

  - it: rejects grpc-cache-proxy without a cache-event subject prefix
    set:
      frontend.grpcCacheProxy.enabled: true
      frontend.grpcCacheProxy.natsUrl: nats://n:4222
    asserts:
      - failedTemplate:
          errorPattern: "frontend.grpcCacheProxy.cacheEvents.subjectPrefix is required when frontend.grpcCacheProxy.natsUrl is set"

  - it: rejects grpc-cache-proxy enforceAuth without Stytch settings
    set:
      frontend.grpcCacheProxy.enabled: true
      frontend.grpcCacheProxy.natsUrl: nats://n:4222
      frontend.grpcCacheProxy.cacheEvents.subjectPrefix: p
      frontend.grpcCacheProxy.enforceAuth: true
      frontend.grpcCacheProxy.stytch.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: "stytch.apiHost and frontend.grpcCacheProxy.stytch.existingSecret are required"

  - it: rejects combining oauth2Proxy with the browser target-port override
    set:
      browser.oauth2Proxy.enabled: true
      browser.service.targetPortOverride: 9191
    asserts:
      - failedTemplate:
          errorPattern: "browser.service.targetPortOverride is mutually exclusive with browser.oauth2Proxy.enabled"

  - it: rejects browser fallback through a proxy that requires credentials
    set:
      frontend.internalService.enabled: false
      frontend.grpcCacheProxy.enabled: true
      frontend.grpcCacheProxy.enforceAuth: true
      frontend.grpcCacheProxy.stytch.apiHost: https://api.stytch.com
      frontend.grpcCacheProxy.stytch.existingSecret: proxy-auth
    asserts:
      - failedTemplate:
          errorPattern: "bb-browser reads CAS through the frontend without proxy credentials"

  - it: permits browser fallback through an unauthenticated proxy
    set:
      frontend.internalService.enabled: false
      frontend.grpcCacheProxy.enabled: true
      frontend.grpcCacheProxy.enforceAuth: false
    asserts:
      - notFailedTemplate: {}

  - it: permits an authenticated proxy when the browser has its internal Service
    set:
      frontend.internalService.enabled: true
      frontend.grpcCacheProxy.enabled: true
      frontend.grpcCacheProxy.enforceAuth: true
      frontend.grpcCacheProxy.stytch.apiHost: https://api.stytch.com
      frontend.grpcCacheProxy.stytch.existingSecret: proxy-auth
    asserts:
      - notFailedTemplate: {}

  - it: rejects frontend autoscaling to zero because its metric is pull-based
    set:
      keda.frontend.enabled: true
      keda.frontend.minReplicaCount: 0
    asserts:
      - failedTemplate:
          errorPattern: "keda.frontend.minReplicaCount must be at least 1"

  - it: rejects a frontend autoscaling maximum below its minimum
    set:
      keda.frontend.enabled: true
      keda.frontend.minReplicaCount: 4
      keda.frontend.maxReplicaCount: 3
    asserts:
      - failedTemplate:
          errorPattern: "keda.frontend.maxReplicaCount must be greater than or equal to keda.frontend.minReplicaCount"

  - it: rejects a non-positive frontend resource utilization target
    set:
      keda.frontend.enabled: true
      keda.frontend.cpu.targetUtilization: "0"
    asserts:
      - failedTemplate:
          errorPattern: "keda.frontend.cpu.targetUtilization must be greater than zero"

  - it: rejects block geometry above bb-storage's 100-block limit
    set:
      storage.persistence.cas.currentBlocks: 200
    asserts:
      - failedTemplate:
          errorPattern: "at most 100 blocks per store"

  - it: rejects emptyDir mode without a sizeLimit
    set:
      storage.persistence.mode: emptyDir
    asserts:
      - failedTemplate:
          errorPattern: "emptyDir.sizeLimit is required when storage.persistence.mode=emptyDir"

  # sizeLimit has to leave room for the blocks file (cas blocksSizeGi defaults
  # to 950, ac to 10), otherwise the store overruns the volume and the pod is
  # evicted — which the blocksSizeGi < sizeLimit check below now rejects.
  - it: accepts emptyDir mode when every active store sets a sizeLimit
    set:
      storage.persistence.mode: emptyDir
      storage.persistence.cas.emptyDir.sizeLimit: 1000Gi
      storage.persistence.ac.emptyDir.sizeLimit: 20Gi
      storage.persistence.iscc.emptyDir.sizeLimit: 2Gi
      storage.persistence.fsac.emptyDir.sizeLimit: 6Gi
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects a pvc-mode block device without a size
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.size: ""
    asserts:
      - failedTemplate:
          errorPattern: "blockDevice.size is required when backend=blockDevice and mode=pvc"

  # ISCC and FSAC are enabled by default; with CAS on a raw device they need
  # their own paths (see guard_hostpath_test.yaml).
  - it: accepts a hostPath-mode block device without a size
    set:
      storage.persistence.cas.blockDevice.metadata.hostPath.path: /mnt/cas-meta
      storage.persistence.mode: hostPath
      storage.persistence.blockDevice.allowHostPath: true
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.size: ""
      storage.persistence.cas.blockDevice.hostPath.devicePath: /dev/ephemeral/cas
      storage.persistence.iscc.hostPath.path: /mnt/buildbarn/iscc
      storage.persistence.fsac.hostPath.path: /mnt/buildbarn/fsac
    asserts:
      - hasDocuments:
          count: 0

  - it: accepts AC raw block storage with file-backed key-location map defaults
    set:
      storage.persistence.ac.backend: blockDevice
      storage.persistence.ac.blockDevice.storageClassName: bb-block
      storage.persistence.ac.blockDevice.keyLocationMap: file
    asserts:
      - hasDocuments:
          count: 0

  # blocksSizeGi must be compared against whatever actually bounds the volume.
  # `size` only sizes the PVC in mode=pvc, so comparing against it in
  # emptyDir/hostPath mode rejected valid configs and missed real overruns.
  - it: compares blocksSizeGi against emptyDir.sizeLimit in emptyDir mode
    set:
      storage.persistence.mode: emptyDir
      storage.persistence.cas.emptyDir.sizeLimit: 400Gi
      storage.persistence.cas.blocksSizeGi: 500
      storage.persistence.ac.emptyDir.sizeLimit: 50Gi
      storage.persistence.iscc.emptyDir.sizeLimit: 2Gi
      storage.persistence.fsac.emptyDir.sizeLimit: 6Gi
      storage.persistence.ac.blocksSizeGi: 10
    asserts:
      - failedTemplate:
          errorMessage: storage.persistence.cas.blocksSizeGi (500) must be smaller than storage.persistence.cas.emptyDir.sizeLimit (400Gi) to leave headroom for metadata

  - it: accepts blocksSizeGi under emptyDir.sizeLimit even when size is smaller
    set:
      storage.persistence.mode: emptyDir
      storage.persistence.cas.emptyDir.sizeLimit: 400Gi
      storage.persistence.cas.blocksSizeGi: 300
      storage.persistence.cas.size: 10Gi
      storage.persistence.ac.emptyDir.sizeLimit: 50Gi
      storage.persistence.iscc.emptyDir.sizeLimit: 2Gi
      storage.persistence.fsac.emptyDir.sizeLimit: 6Gi
      storage.persistence.ac.blocksSizeGi: 10
    asserts:
      - notFailedTemplate: {}

  - it: does not compare blocksSizeGi against the inert size in hostPath mode
    set:
      storage.persistence.mode: hostPath
      storage.persistence.cas.blocksSizeGi: 5000
    asserts:
      - notFailedTemplate: {}

  - it: still rejects blocksSizeGi at or above size in pvc mode
    set:
      storage.persistence.mode: pvc
      storage.persistence.cas.blocksSizeGi: 1000
      storage.persistence.cas.size: 1000Gi
    asserts:
      - failedTemplate:
          errorMessage: storage.persistence.cas.blocksSizeGi (1000) must be smaller than storage.persistence.cas.size (1000Gi) to leave headroom for metadata

  - it: rejects filesystem blocksSizeGi plus large on-disk KLM that overflows the PVC
    set:
      storage.persistence.mode: pvc
      storage.persistence.cas.size: 1Ti
      storage.persistence.cas.blocksSizeGi: 1020
      storage.persistence.cas.keyLocationMapSizeMi: 7680
    asserts:
      - failedTemplate:
          errorPattern: "storage.persistence.cas: blocksSizeGi \\(1020Gi\\) plus on-disk key-location map \\(7680Mi\\) leaves no room inside storage.persistence.cas.size \\(1Ti\\)"

  - it: rejects a zero actionResultExpiring jitter (bb-storage divides by it)
    set:
      config.actionCache.actionResultExpiring.enabled: true
      config.actionCache.actionResultExpiring.maximumValidityJitter: 0s
    asserts:
      - failedTemplate:
          errorPattern: "maximumValidityJitter must be a NONZERO duration"

  - it: rejects an absent actionResultExpiring jitter
    set:
      config.actionCache.actionResultExpiring.enabled: true
      config.actionCache.actionResultExpiring.maximumValidityJitter: ""
    asserts:
      - failedTemplate:
          errorPattern: "maximumValidityJitter must be a NONZERO duration"

  - it: accepts actionResultExpiring with a nonzero jitter
    set:
      config.actionCache.actionResultExpiring.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: key-location map sizing is not checked unless opted in
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.keyLocationMap: inMemory
      storage.persistence.cas.blockDevice.keyLocationMapInMemoryEntries: 1000
      storage.persistence.cas.blockDevice.size: 340Gi
    asserts:
      - notFailedTemplate: {}

  - it: rejects a CAS key-location map that cannot index its blocks device
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.keyLocationMap: inMemory
      storage.persistence.cas.blockDevice.keyLocationMapInMemoryEntries: 20000000
      storage.persistence.cas.blockDevice.size: 340Gi
    asserts:
      - failedTemplate:
          # Reported as a plain integer, not float64 "2e+07".
          errorPattern: "storage.persistence.cas: key-location map is too small .*keyLocationMapInMemoryEntries=20000000 indexes 20000000 objects.*that is 1.02x, below the required 2x"

  - it: accepts a CAS key-location map sized at the required ratio
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.keyLocationMap: inMemory
      storage.persistence.cas.blockDevice.keyLocationMapInMemoryEntries: 40000000
      storage.persistence.cas.blockDevice.size: 340Gi
    asserts:
      - notFailedTemplate: {}

  - it: skips a disabled store when checking key-location map sizing
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.fsac.enabled: false
      storage.persistence.fsac.keyLocationMap.type: inMemory
      storage.persistence.fsac.keyLocationMap.entries: 1000
    asserts:
      - notFailedTemplate: {}

  - it: checks an enabled store's key-location map sizing
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.fsac.enabled: true
      storage.persistence.fsac.keyLocationMap.type: inMemory
      storage.persistence.fsac.keyLocationMap.entries: 1000
    asserts:
      - failedTemplate:
          errorPattern: "storage.persistence.fsac: key-location map is too small"

  - it: honors a custom averageObjectSizeBytes when sizing the map
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.keyLocationMap: inMemory
      storage.persistence.cas.blockDevice.keyLocationMapInMemoryEntries: 20000000
      storage.persistence.cas.blockDevice.size: 340Gi
      # Larger average blobs => fewer indexable objects => 20M is now enough.
      storage.keyLocationMapSizing.averageObjectSizeBytes.cas: 65536
    asserts:
      - notFailedTemplate: {}

  - it: rejects mTLS with no certificate authority
    set:
      security.grpcMtls.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "needs the CA that signed both ends"

  - it: rejects both certificate authority forms at once
    set:
      security.grpcMtls.enabled: true
      security.grpcMtls.certificateAuthorities: pem
      security.grpcMtls.certificateAuthoritiesFile: /etc/ca.crt
    asserts:
      - failedTemplate:
          errorPattern: "not both"

  - it: rejects a relative certificateAuthoritiesFile
    set:
      security.grpcMtls.enabled: true
      security.grpcMtls.certificateAuthoritiesFile: ca.crt
    asserts:
      - failedTemplate:
          errorPattern: "resolves a relative path against the config directory"

  - it: rejects mode=mtls without the grpcMtls block
    set:
      scheduler.workerGrpcServers.authenticationPolicy.mode: mtls
    asserts:
      - failedTemplate:
          errorPattern: "requires security.grpcMtls.enabled=true"

  # An override is spliced in verbatim with no tpl, so mTLS would configure one
  # end of the hop and not the other.
  - it: rejects mTLS alongside an override of a file that carries a hop
    set:
      security.grpcMtls.enabled: true
      security.grpcMtls.certificateAuthorities: pem
      configOverrides:
        common.libsonnet: "{}"
    asserts:
      - failedTemplate:
          errorPattern: "spliced in verbatim without templating"

  - it: rejects mTLS alongside a scheduler.jsonnet override
    set:
      security.grpcMtls.enabled: true
      security.grpcMtls.certificateAuthorities: pem
      configOverrides:
        scheduler.jsonnet: "{}"
    asserts:
      - failedTemplate:
          errorPattern: "spliced in verbatim without templating"

  - it: rejects frontend.readCache.blocksSizeGi >= emptyDir.sizeLimit
    set:
      frontend.readCache.enabled: true
      frontend.readCache.blocksSizeGi: 30
      frontend.readCache.volume.emptyDir.sizeLimit: 2560Mi
    asserts:
      - failedTemplate:
          errorPattern: "frontend.readCache.blocksSizeGi .* must be smaller than frontend.readCache.volume.emptyDir.sizeLimit"

  - it: accepts an empty predeclaredPlatformQueues platform (default {} worker pool)
    set:
      scheduler.predeclaredPlatformQueues:
        - platform: []
          sizeClasses: [0]
    asserts:
      - notFailedTemplate: {}

  - it: rejects unsorted predeclaredPlatformQueues platform properties
    set:
      scheduler.predeclaredPlatformQueues:
        - platform:
            - name: os
              value: linux
            - name: cpu
              value: x86_64
          sizeClasses: [0]
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.predeclaredPlatformQueues\\[0\\].platform properties are not sorted by name then value"

  - it: rejects duplicate predeclaredPlatformQueues platform properties
    set:
      scheduler.predeclaredPlatformQueues:
        - platform:
            - name: os
              value: linux
            - name: os
              value: linux
          sizeClasses: [0]
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.predeclaredPlatformQueues\\[0\\].platform properties are not sorted by name then value"

  - it: rejects configurationReloadInterval with the upstream scheduler image
    set:
      scheduler.configurationReloadInterval: 30s
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.configurationReloadInterval requires a bb-scheduler image built from Hermetiq's fork"

  - it: accepts configurationReloadInterval with a CDC-compatible fork scheduler image
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.configurationReloadInterval: 30s
      scheduler.handover.cdcCompatibleFork: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects configurationReloadInterval with the CDC blobstore unless the fork supports CDC
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.configurationReloadInterval: 30s
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.configurationReloadInterval is not supported with the CDC blobstore unless the fork supports CDC"

  - it: rejects scheduler.handover with the CDC blobstore unless the fork supports CDC
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.enabled is not supported with the CDC blobstore unless the fork supports CDC"

  - it: rejects scheduler.handover with the upstream scheduler image
    set:
      scheduler.handover.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.enabled requires a bb-scheduler image built from Hermetiq's fork"

  - it: rejects scheduler.handover without coordinator image repository and tag
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.enabled requires scheduler.handover.coordinator.image.repository and scheduler.handover.coordinator.image.tag to be set"

  - it: rejects handoverGrpcServers mode=mtls without security.grpcMtls.enabled
    set:
      scheduler.handover.handoverGrpcServers.authenticationPolicy.mode: mtls
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.handoverGrpcServers.authenticationPolicy.mode=mtls requires security.grpcMtls.enabled=true"

  - it: rejects handoverGrpcServers mode=deny when handover is enabled
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.handover.handoverGrpcServers.authenticationPolicy.mode: deny
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.handoverGrpcServers.authenticationPolicy.mode=deny blocks the coordinator sidecar's local Ping"

  - it: rejects disabling the service account token required by the handover coordinator
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.automountServiceAccountToken: false
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.automountServiceAccountToken=false prevents the handover coordinator from accessing the Kubernetes API"

  - it: accepts disabled token mounting and an unused conflicting port when handover is disabled
    set:
      scheduler.automountServiceAccountToken: false
      scheduler.handover.port: 8982
    asserts:
      - notFailedTemplate: {}

  - it: rejects handover port collisions with the client gRPC listener
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.handover.port: 8982
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.port=8982 conflicts with an existing scheduler listener"

  - it: rejects handover port collisions with the worker gRPC listener
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.handover.port: 8983
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.port=8983 conflicts with an existing scheduler listener"

  - it: rejects handover port collisions with the queue state gRPC listener
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.handover.port: 8984
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.port=8984 conflicts with an existing scheduler listener"

  - it: rejects handover port collisions with the admin HTTP listener
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.handover.port: 7982
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.port=7982 conflicts with an existing scheduler listener"

  - it: rejects handover port collisions with the diagnostics HTTP listener
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.handover.port: 9980
    asserts:
      - failedTemplate:
          errorPattern: "scheduler.handover.port=9980 conflicts with an existing scheduler listener"

  - it: accepts a distinct custom handover port and explicit token mounting
    set:
      images.scheduler.repository: us-docker.pkg.dev/example/bb-scheduler
      scheduler.handover.enabled: true
      scheduler.handover.coordinator.image.repository: us-docker.pkg.dev/example/bb-scheduler-coordinator
      scheduler.handover.coordinator.image.tag: v0.1.0
      scheduler.automountServiceAccountToken: true
      scheduler.handover.port: 9999
      scheduler.handover.cdcCompatibleFork: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects configOverrides containing removed pre-CDC fields
    set:
      configOverrides:
        storage.jsonnet: |
          {
            contentAddressableStorageServer: {
              contentAddressableStorage: {
                chunkStorage: {
                  'local': {
                    blocksOnBlockDevice: {
                      dataIntegrityValidationCache: { cacheSize: 1000 },
                    },
                  },
                },
              },
            },
          }
    asserts:
      - failedTemplate:
          errorPattern: 'configOverrides\["storage\.jsonnet"\] contains pre-CDC field "dataIntegrityValidationCache"'

  - it: rejects configOverrides with pre-CDC top-level contentAddressableStorage in storage.jsonnet
    set:
      configOverrides:
        storage.jsonnet: |
          {
            contentAddressableStorage: {
              backend: {},
            },
          }
    asserts:
      - failedTemplate:
          errorPattern: 'configOverrides\["storage\.jsonnet"\] uses pre-CDC top-level field "contentAddressableStorage"'

  - it: permits zstdPool in CDC storage frontend and portal configurations
    set:
      configOverrides:
        storage.jsonnet: "{ zstdPool: {} }"
        frontend.jsonnet: "{ zstdPool: {}, grpcServers: [{ stopGracefully: true }] }"
        portal.jsonnet: "{ zstdPool: {} }"
    asserts:
      - notFailedTemplate: {}

  - it: rejects zstdPool in a CDC scheduler configuration
    set:
      configOverrides:
        scheduler.jsonnet: "{ zstdPool: {} }"
    asserts:
      - failedTemplate:
          errorPattern: 'configOverrides\["scheduler\.jsonnet"\] contains pre-CDC field "zstdPool"'

  - it: rejects zstdPool in a CDC remote asset configuration
    set:
      configOverrides:
        asset.jsonnet: "{ zstdPool: {} }"
    asserts:
      - failedTemplate:
          errorPattern: 'configOverrides\["asset\.jsonnet"\] contains pre-CDC field "zstdPool"'

  - it: rejects configOverrides with pre-CDC single-store contentAddressableStorage in common.libsonnet
    set:
      configOverrides:
        common.libsonnet: |
          {
            blobstore: {
              contentAddressableStorage: {
                sharding: {},
              },
            },
          }
    asserts:
      - failedTemplate:
          errorPattern: 'configOverrides\["common\.libsonnet"\] defines a pre-CDC single-store "contentAddressableStorage" without "chunkStorage"'

  # files is a ConfigMap reference, not inline Jsonnet. Use the shipped CRD's
  # real shape so this guard exercises the data a live worker actually mounts.
  - it: rejects a files-mode worker referencing legacy config under an arbitrary ConfigMap name
    set:
      _testLookup:
        rbeWorkers:
          items:
            - metadata:
                name: worker-legacy
              spec:
                config:
                  files:
                    configMapName: arbitrary-config
                    workerConfigPath: /config/worker.jsonnet
                    runnerConfigPath: /config/runner.jsonnet
                images:
                  runner: example.com/runner:latest
        configMaps:
