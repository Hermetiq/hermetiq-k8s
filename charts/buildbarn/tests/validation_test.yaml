  - it: rejects sharedCas CMS exceeding filesystem CAS PVC headroom
    set:
      storage.persistence.cas.size: 958Gi
      storage.persistence.cas.blocksSizeGi: 950
      storage.persistence.cas.keyLocationMapSizeMi: 7168
      storage.persistence.cms.blocksSizeGi: 1
      storage.persistence.cms.keyLocationMap.sizeMi: 256
    asserts:
      - failedTemplate:
          errorPattern: 'sharedCas cms\.blocksSizeGi .* leaves no room inside storage\.persistence\.cas\.size'

  - it: rejects sharedCas CMS exceeding emptyDir CAS sizeLimit headroom
    set:
      storage.persistence.mode: emptyDir
      storage.persistence.cas.emptyDir.sizeLimit: 958Gi
      storage.persistence.ac.emptyDir.sizeLimit: 20Gi
