  - it: reports raw ISCC metadata index capacity
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.iscc.enabled: true
      storage.persistence.iscc.backend: blockDevice
      storage.persistence.iscc.blockDevice.size: 4Gi
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.iscc.blockDevice.metadata.keyLocationMapSizeMi to at least 968 MiB'

  - it: reports raw FSAC metadata index capacity
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.fsac.enabled: true
      storage.persistence.fsac.backend: blockDevice
      storage.persistence.fsac.blockDevice.size: 12Gi
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.fsac.blockDevice.metadata.keyLocationMapSizeMi to at least 726 MiB'

  - it: reports dedicated raw CMS metadata index capacity
    set:
      storage.keyLocationMapSizing.validate: true
      storage.persistence.cms.backend: blockDevice
      storage.persistence.cms.blockDevice.size: 4Gi
    asserts:
      - failedTemplate:
          errorPattern: 'Set storage.persistence.cms.blockDevice.metadata.keyLocationMapSizeMi to at least 968 MiB'
