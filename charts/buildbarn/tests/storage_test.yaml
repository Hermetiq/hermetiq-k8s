suite: storage statefulset
templates:
  - templates/statefulset-storage.yaml
tests:
  - it: renders the storage StatefulSet with the configured image tag
    set:
      images.storage.tag: test-tag-123
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: storage
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "storage")].image
          pattern: bb-storage:test-tag-123$

  # --- backward compatibility: default (filesystem) backend ---
  - it: default filesystem backend keeps cas/ac claim names and no block plumbing
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: cas
      - equal:
          path: spec.volumeClaimTemplates[1].metadata.name
          value: ac
      - isNull:
          path: spec.volumeClaimTemplates[0].spec.volumeMode
      - isNull:
          path: spec.template.spec.containers[?(@.name == "storage")].volumeDevices
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65534
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - isNull:
          path: spec.template.spec.securityContext.supplementalGroups
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: volume-init
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 65534
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.drop
          content: ALL

  # --- block-device backend, explicit in-memory KLM, deviceAccess=group ---
  - it: block backend renders Block PVCs, volumeDevices, and pod securityContext
    set:
      storage.persistence.cas.blockDevice.keyLocationMap: inMemory
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "cas-blocks")].spec.volumeMode
          value: Block
      - equal:
          path: spec.template.spec.containers[?(@.name == "storage")].volumeDevices[?(@.name == "cas-blocks")].devicePath
          value: /dev/bb/cas
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65534
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - contains:
          path: spec.template.spec.securityContext.supplementalGroups
          content: 6
      # in-memory KLM => no companion metadata claim, ac stays filesystem
      - notExists:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "cas-meta")]
      - equal:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "ac")].spec.storageClassName
          value: premium-rwo

  # --- block-device backend, deviceAccess=chownInit ---
  - it: chownInit adds a CHOWN-capable device-chown init container
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.blockDevice.deviceAccess: chownInit
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "device-chown")].name
          value: device-chown
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "device-chown")].securityContext.capabilities.add
          content: CHOWN
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "device-chown")].volumeDevices[?(@.name == "cas-blocks")].devicePath
          value: /dev/bb/cas

  # --- block-device backend, file KLM (persistent) ---
  - it: file KLM adds a companion metadata claim and mount
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
      storage.persistence.cas.blockDevice.keyLocationMap: file
    asserts:
      # raw blocks volume is still Block; companion meta claim exists (Filesystem)
      - equal:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "cas-blocks")].spec.volumeMode
          value: Block
      - isNotNull:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "cas-meta")].metadata.name
      - equal:
          path: spec.template.spec.containers[?(@.name == "storage")].volumeMounts[?(@.name == "cas-meta")].mountPath
          value: /storage-cas-meta

  - it: prepares separate CDC and shared CMS state on the four default data PVCs
    asserts:
      - lengthEqual:
          path: spec.volumeClaimTemplates
          count: 4
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'mkdir -p /storage-cas/cdc-v1/persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'mkdir -p /storage-cas/cdc-v1/cms_persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'mkdir -p /storage-ac/cdc-v1/persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'Pre-CDC CAS files detected'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'Pre-CDC AC files detected'
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'rm |truncate |dd '

  - it: prepares CDC and CMS state on the existing raw CAS metadata volume
    set:
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.keyLocationMap: file
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'mkdir -p /storage-cas-meta/cdc-v1/persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'mkdir -p /storage-cas-meta/cdc-v1/cms_persistent_state'
      - notContains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: cms
          any: true

  # --- pre-CDC file guard in volume-init ---
  # Each guarded directory gets one `if ...; then echo ...; exit 1; fi` block
  # naming the legacy index, blocks file and state directory. CMS has no
  # pre-CDC format and therefore no guard. storage_migration_test.sh runs the
  # same scripts against real files.
  - it: volume-init refuses pre-CDC files in raw ISCC and FSAC metadata directories
    set:
      storage.persistence.iscc.backend: blockDevice
      storage.persistence.iscc.blockDevice.storageClassName: bb-block
      storage.persistence.fsac.backend: blockDevice
      storage.persistence.fsac.blockDevice.storageClassName: bb-block
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-iscc-meta/iscc-keys\.db \] \|\| \[ -L /storage-iscc-meta/iscc-keys\.db \]
            \|\| \[ -e /storage-iscc-meta/iscc-blocks\.db \] \|\| \[ -L /storage-iscc-meta/iscc-blocks\.db \]
            \|\| \[ -e /storage-iscc-meta/persistent_state \] \|\| \[ -L /storage-iscc-meta/persistent_state \];
            then\n  echo 'Pre-CDC ISCC files detected in /storage-iscc-meta\. [^\n]*' >&2\n  exit 1\nfi
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-fsac-meta/fsac-keys\.db \] \|\| \[ -L /storage-fsac-meta/fsac-keys\.db \]
            \|\| \[ -e /storage-fsac-meta/fsac-blocks\.db \] \|\| \[ -L /storage-fsac-meta/fsac-blocks\.db \]
            \|\| \[ -e /storage-fsac-meta/persistent_state \] \|\| \[ -L /storage-fsac-meta/persistent_state \];
            then\n  echo 'Pre-CDC FSAC files detected in /storage-fsac-meta\. [^\n]*' >&2\n  exit 1\nfi
      # The filesystem CAS and AC beside them keep their own guards.
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "Pre-CDC CAS files detected in /storage-cas\\. "
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "Pre-CDC AC files detected in /storage-ac\\. "
      # Every guard runs before anything is created.
      - notMatchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "(?s)(mkdir|chmod|chown) .*Pre-CDC"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "mkdir -p /storage-iscc-meta/cdc-v1/persistent_state\\n(?s:.*)mkdir -p /storage-fsac-meta/cdc-v1/persistent_state\\n"

  - it: a raw ISCC with an in-memory index has no metadata directory to guard
    set:
      storage.persistence.iscc.backend: blockDevice
      storage.persistence.iscc.blockDevice.storageClassName: bb-block
      storage.persistence.iscc.blockDevice.keyLocationMap: inMemory
    asserts:
      - notMatchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "Pre-CDC ISCC|storage-iscc"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "Pre-CDC FSAC files detected in /storage-fsac\\. "

  - it: volume-init refuses pre-CDC files for every filesystem store in hostPath mode
    set:
      storage.persistence.mode: hostPath
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-cas/cas-keys\.db \] \|\| \[ -L /storage-cas/cas-keys\.db \]
            \|\| \[ -e /storage-cas/cas-blocks\.db \] \|\| \[ -L /storage-cas/cas-blocks\.db \]
            \|\| \[ -e /storage-cas/persistent_state \] \|\| \[ -L /storage-cas/persistent_state \];
            then\n  echo 'Pre-CDC CAS files detected in /storage-cas\. [^\n]*' >&2\n  exit 1\nfi
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-ac/ac-keys\.db \] \|\| \[ -L /storage-ac/ac-keys\.db \]
            \|\| \[ -e /storage-ac/ac-blocks\.db \] \|\| \[ -L /storage-ac/ac-blocks\.db \]
            \|\| \[ -e /storage-ac/persistent_state \] \|\| \[ -L /storage-ac/persistent_state \];
            then\n  echo 'Pre-CDC AC files detected in /storage-ac\. [^\n]*' >&2\n  exit 1\nfi
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-iscc/iscc-keys\.db \] \|\| \[ -L /storage-iscc/iscc-keys\.db \]
            \|\| \[ -e /storage-iscc/iscc-blocks\.db \] \|\| \[ -L /storage-iscc/iscc-blocks\.db \]
            \|\| \[ -e /storage-iscc/persistent_state \] \|\| \[ -L /storage-iscc/persistent_state \];
            then\n  echo 'Pre-CDC ISCC files detected in /storage-iscc\. [^\n]*' >&2\n  exit 1\nfi
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-fsac/fsac-keys\.db \] \|\| \[ -L /storage-fsac/fsac-keys\.db \]
            \|\| \[ -e /storage-fsac/fsac-blocks\.db \] \|\| \[ -L /storage-fsac/fsac-blocks\.db \]
            \|\| \[ -e /storage-fsac/persistent_state \] \|\| \[ -L /storage-fsac/persistent_state \];
            then\n  echo 'Pre-CDC FSAC files detected in /storage-fsac\. [^\n]*' >&2\n  exit 1\nfi
      # hostPath mode chowns the mounted directories as root. That, like every
      # mkdir, comes after the last guard: a refused start changes nothing.
      - notMatchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "(?s)(mkdir|chmod|chown) .*Pre-CDC"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "(?s)Pre-CDC FSAC files detected.*chown 65534:65534 /storage-cas\\n"

  - it: volume-init refuses pre-CDC files in every raw metadata directory in hostPath mode
    set:
      storage.persistence.mode: hostPath
      storage.persistence.blockDevice.allowHostPath: true
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.hostPath.devicePath: /dev/ephemeral/cas
      storage.persistence.cas.blockDevice.metadata.hostPath.path: /mnt/buildbarn/cas-meta
      storage.persistence.ac.backend: blockDevice
      storage.persistence.ac.blockDevice.hostPath.devicePath: /dev/ephemeral/ac
      storage.persistence.ac.blockDevice.metadata.hostPath.path: /mnt/buildbarn/ac-meta
      storage.persistence.iscc.backend: blockDevice
      storage.persistence.iscc.blockDevice.hostPath.devicePath: /dev/ephemeral/iscc
      storage.persistence.iscc.blockDevice.metadata.hostPath.path: /mnt/buildbarn/iscc-meta
      storage.persistence.fsac.backend: blockDevice
      storage.persistence.fsac.blockDevice.hostPath.devicePath: /dev/ephemeral/fsac
      storage.persistence.fsac.blockDevice.metadata.hostPath.path: /mnt/buildbarn/fsac-meta
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-cas-meta/cas-keys\.db \] \|\| \[ -L /storage-cas-meta/cas-keys\.db \]
            \|\| \[ -e /storage-cas-meta/cas-blocks\.db \] \|\| \[ -L /storage-cas-meta/cas-blocks\.db \]
            \|\| \[ -e /storage-cas-meta/persistent_state \] \|\| \[ -L /storage-cas-meta/persistent_state \];
            then\n  echo 'Pre-CDC CAS files detected in /storage-cas-meta\. [^\n]*' >&2\n  exit 1\nfi
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-ac-meta/ac-keys\.db \] \|\| \[ -L /storage-ac-meta/ac-keys\.db \]
            \|\| \[ -e /storage-ac-meta/ac-blocks\.db \] \|\| \[ -L /storage-ac-meta/ac-blocks\.db \]
            \|\| \[ -e /storage-ac-meta/persistent_state \] \|\| \[ -L /storage-ac-meta/persistent_state \];
            then\n  echo 'Pre-CDC AC files detected in /storage-ac-meta\. [^\n]*' >&2\n  exit 1\nfi
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-iscc-meta/iscc-keys\.db \] \|\| \[ -L /storage-iscc-meta/iscc-keys\.db \]
            \|\| \[ -e /storage-iscc-meta/iscc-blocks\.db \] \|\| \[ -L /storage-iscc-meta/iscc-blocks\.db \]
            \|\| \[ -e /storage-iscc-meta/persistent_state \] \|\| \[ -L /storage-iscc-meta/persistent_state \];
            then\n  echo 'Pre-CDC ISCC files detected in /storage-iscc-meta\. [^\n]*' >&2\n  exit 1\nfi
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: >-
            if \[ -e /storage-fsac-meta/fsac-keys\.db \] \|\| \[ -L /storage-fsac-meta/fsac-keys\.db \]
            \|\| \[ -e /storage-fsac-meta/fsac-blocks\.db \] \|\| \[ -L /storage-fsac-meta/fsac-blocks\.db \]
            \|\| \[ -e /storage-fsac-meta/persistent_state \] \|\| \[ -L /storage-fsac-meta/persistent_state \];
            then\n  echo 'Pre-CDC FSAC files detected in /storage-fsac-meta\. [^\n]*' >&2\n  exit 1\nfi
      - notMatchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "(?s)(mkdir|chmod|chown) .*Pre-CDC"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: "(?s)Pre-CDC FSAC files detected.*chown 65534:65534 /storage-cas-meta\\n"

  - it: retains explicit ephemeral CMS without creating persistent mapping state
    set:
      storage.persistence.cms.keyLocationMap.type: inMemory
    asserts:
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'cms_persistent_state'
      - notContains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: cms
          any: true

  # --- hostPath mode with a raw block device (node-local NVMe LV) ---
  - it: hostPath block mode bind-mounts the device node and goes privileged
    set:
      storage.persistence.cas.blockDevice.metadata.hostPath.path: /mnt/cas-meta
      storage.persistence.mode: hostPath
      storage.persistence.blockDevice.allowHostPath: true
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.hostPath.devicePath: /dev/ephemeral/cas
      # With a raw CAS, validate.yaml refuses filesystem ISCC and FSAC stores
      # left on the chart default hostPath.
      storage.persistence.iscc.hostPath.path: /mnt/buildbarn/iscc
      storage.persistence.fsac.hostPath.path: /mnt/buildbarn/fsac
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "storage")].securityContext.privileged
          value: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cas-blocks
            hostPath:
              path: /dev/ephemeral/cas
              type: BlockDevice
      - equal:
          path: spec.template.spec.containers[?(@.name == "storage")].volumeMounts[?(@.name == "cas-blocks")].mountPath
          value: /dev/bb/cas
      # hostPath sources cannot use volumeDevices, and no PVCs are templated
      - notExists:
          path: spec.template.spec.containers[?(@.name == "storage")].volumeDevices
      - notExists:
          path: spec.volumeClaimTemplates

  # --- terminationGracePeriodSeconds passthrough ---
  - it: persistent stores get a two-minute termination grace period by default
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: an explicit null grace period uses the Kubernetes default
    set:
      storage.terminationGracePeriodSeconds: null
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds

  - it: terminationGracePeriodSeconds passes through when set
    set:
      storage.terminationGracePeriodSeconds: 180
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 180

  # The kubelet creates a DirectoryOrCreate hostPath as root:root 0755, and
  # fsGroup is not applied to hostPath volumes, so an unprivileged volume-init
  # could not mkdir inside it — the StatefulSet stuck in Init:Error.
  - it: runs volume-init as root with CHOWN in hostPath mode
    set:
      storage.persistence.mode: hostPath
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: volume-init
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: false
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
          content: CHOWN
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "chown 65534:65534 /storage-cas"

  - it: keeps volume-init unprivileged in pvc mode, where fsGroup applies
    set:
      storage.persistence.mode: pvc
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: chown

  - it: keeps volume-init unprivileged in emptyDir mode
    set:
      storage.persistence.mode: emptyDir
      storage.persistence.cas.emptyDir.sizeLimit: 1000Gi
      storage.persistence.ac.emptyDir.sizeLimit: 20Gi
      # ISCC and FSAC are enabled by default and need a limit too.
      storage.persistence.iscc.emptyDir.sizeLimit: 2Gi
      storage.persistence.fsac.emptyDir.sizeLimit: 6Gi
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 65534
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: chown

  - it: CMS placement for raw memory index
    set:
      storage.persistence.cas.blockDevice.keyLocationMap: inMemory
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.storageClassName: bb-block
    asserts:
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "cms_persistent_state"
      - notContains:
          path: spec.volumeClaimTemplates
          content:
            metadata:
              name: cms
          any: true

  - it: provisions dedicated CMS filesystem PVC and state dir when cms.backend=filesystem
    set:
      storage.persistence.cms.backend: filesystem
      storage.persistence.cms.size: 4Gi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "cms")].spec.resources.requests.storage
          value: 4Gi
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'mkdir -p /storage-cms/persistent_state'

  - it: provisions dedicated CMS raw block + metadata PVCs and device-chown when cms.backend=blockDevice
    set:
      storage.persistence.cms.backend: blockDevice
      storage.persistence.cms.blockDevice.storageClassName: bb-block
      storage.persistence.cms.blockDevice.keyLocationMap: file
      storage.persistence.blockDevice.deviceAccess: chownInit
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "cms-blocks")].spec.volumeMode
          value: Block
      - isNotNull:
          path: spec.volumeClaimTemplates[?(@.metadata.name == "cms-meta")].metadata.name
      - equal:
          path: spec.template.spec.containers[?(@.name == "storage")].volumeDevices[?(@.name == "cms-blocks")].devicePath
          value: /dev/bb/cms
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: 'mkdir -p /storage-cms-meta/persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "device-chown")].command[2]
          pattern: '/dev/bb/cms'

  - it: honors custom security.pod UID and GID for hostPath volume-init and device-chown
    set:
      storage.persistence.mode: hostPath
      storage.persistence.blockDevice.allowHostPath: true
      storage.persistence.blockDevice.deviceAccess: chownInit
      storage.persistence.cas.backend: blockDevice
      storage.persistence.cas.blockDevice.hostPath.devicePath: /dev/ephemeral/cas
      storage.persistence.cas.blockDevice.keyLocationMap: file
      storage.persistence.cas.blockDevice.metadata.hostPath.path: /mnt/cas-meta
      # With a raw CAS, validate.yaml refuses filesystem ISCC and FSAC stores
      # left on the chart default hostPath.
      storage.persistence.iscc.hostPath.path: /mnt/buildbarn/iscc
      storage.persistence.fsac.hostPath.path: /mnt/buildbarn/fsac
      security.pod.runAsUser: 1000
      security.pod.runAsGroup: 2000
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: 'chown 1000:2000 /storage-cas-meta/cdc-v1'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: 'chown 1000:2000 /storage-cas-meta/cdc-v1/persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: 'chown 1000:2000 /storage-cas-meta/cdc-v1/cms_persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "volume-init")].command[2]
          pattern: 'chown 1000:2000 /storage-ac/cdc-v1/persistent_state'
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "device-chown")].command[2]
          pattern: 'chown 1000:2000 "\$dev"'
