suite: buildbarn labels and availability defaults
values:
  - ../ci-values/ci.yaml
templates:
  - templates/deployment-frontend.yaml
  - templates/statefulset-storage.yaml
  - templates/pdb.yaml
  - templates/jwks-sync.yaml
  - templates/deployment-browser.yaml
  - templates/configmaps.yaml
  - templates/gateway-routes.yaml
tests:
  - it: gives frontend stable labels and preferred pod anti-affinity
    template: templates/deployment-frontend.yaml
    set:
      commonLabels:
        app.kubernetes.io/component: must-not-override-component
      podLabels:
        owner: platform
        app: must-not-override-selector
        helm.sh/chart: must-not-roll-with-chart
        app.kubernetes.io/version: must-not-roll-with-version
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.selector.matchLabels.app
          value: frontend
      - equal:
          path: spec.template.metadata.labels.app
          value: frontend
      - equal:
          path: spec.template.metadata.labels.owner
          value: platform
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: buildbarn
      - isNotNull:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: buildbarn
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels.app
          value: frontend
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - notExists:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution

  - it: keeps storage anti-affinity hard-required
    template: templates/statefulset-storage.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: storage
      - equal:
          path: spec.selector.matchLabels.app
          value: storage
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: storage
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels.app
          value: storage
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname
      - notExists:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution

  - it: enables storage and frontend disruption budgets by default
    template: templates/pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentSelector:
          path: metadata.name
          value: storage
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
        documentSelector:
          path: metadata.name
          value: storage
      - equal:
          path: spec.selector.matchLabels.app
          value: storage
        documentSelector:
          path: metadata.name
          value: storage
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: storage
        documentSelector:
          path: metadata.name
          value: storage
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentSelector:
          path: metadata.name
          value: frontend
      - equal:
          path: spec.selector.matchLabels.app
          value: frontend
        documentSelector:
          path: metadata.name
          value: frontend
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
        documentSelector:
          path: metadata.name
          value: frontend

  - it: allows frontend preferred pod anti-affinity to be disabled
    template: templates/deployment-frontend.yaml
    set:
      frontend.podAntiAffinity.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: allows storage required pod anti-affinity to be disabled
    template: templates/statefulset-storage.yaml
    set:
      storage.podAntiAffinity.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: disables ServiceAccount token automount by default except on jwks-sync
    set:
      frontend.jwks.enabled: true
      frontend.jwks.sync.enabled: true
      frontend.jwks.sync.url: https://issuer.example.com/.well-known/jwks.json
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: templates/deployment-frontend.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: templates/statefulset-storage.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: true
        template: templates/jwks-sync.yaml
        documentSelector:
          path: kind
          value: CronJob

  - it: renders podAnnotations on workloads and strips x-forwarded-client-cert on Gateway gRPC routes
    set:
      podAnnotations:
        example.com/pod-only: "true"
      portal.enabled: true
      portal.podDisruptionBudget.enabled: true
      remoteAsset.enabled: true
      routing.provider: gateway
      gateway.enabled: true
      gateway.name: hermetiq-gateway
      browser.oauth2Proxy.enabled: true
      browser.oauth2Proxy.existingConfigMap: ""
      browser.oauth2Proxy.oidcIssuerUrl: https://issuer.example.com
      browser.oauth2Proxy.whitelistDomain: .example.com
      imagePullSecrets:
        - name: regcred
      frontend.jwks.enabled: true
      frontend.jwks.sync.enabled: true
      frontend.jwks.sync.url: https://issuer.example.com/.well-known/jwks.json
      frontend.jwks.sync.nodeSelector:
        pool: system
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/pod-only"]
          value: "true"
        template: templates/deployment-frontend.yaml
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["example.com/pod-only"]
          value: "true"
        template: templates/jwks-sync.yaml
        documentSelector:
          path: kind
          value: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          content:
            name: regcred
        template: templates/jwks-sync.yaml
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.nodeSelector.pool
          value: system
        template: templates/jwks-sync.yaml
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.startingDeadlineSeconds
          value: 600
        template: templates/jwks-sync.yaml
        documentSelector:
          path: kind
          value: CronJob
      - equal:
          path: spec.maxUnavailable
          value: 1
        template: templates/pdb.yaml
        documentSelector:
          path: metadata.name
          value: bb-portal
      - contains:
          path: spec.template.spec.containers[?(@.name == "oauth2-proxy")].env
          content:
            name: OAUTH2_PROXY_SKIP_AUTH_ROUTES
            value: ""
        template: templates/deployment-browser.yaml
      - equal:
          path: data.OAUTH2_PROXY_WHITELIST_DOMAINS
          value: .example.com
        template: templates/configmaps.yaml
        documentSelector:
          path: metadata.name
          value: oauth2-proxy-config-browser
      - contains:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove
          content: x-forwarded-client-cert
        template: templates/gateway-routes.yaml
        documentSelector:
          path: metadata.name
          value: frontend-bb-cloud-grpc
