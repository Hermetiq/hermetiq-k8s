apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
    {{- include "buildbarn.componentLabel" (dict "component" "storage") | nindent 4 }}
spec:
  replicas: {{ .Values.storage.replicas }}
  serviceName: storage
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        {{- include "buildbarn.podLabels" (dict "root" . "component" "storage") | nindent 8 }}
        app: storage
        kubernetes_service: storage
      annotations:
        {{- with .Values.commonAnnotations }}
        {{- include "buildbarn.commonAnnotations" $ | nindent 8 }}
        {{- end }}
        checksum/config: {{ include "buildbarn.configChecksum" (dict "root" . "files" (list "common.libsonnet" "storage.jsonnet")) }}
    spec:
      {{- include "buildbarn.imagePullSecrets" . | nindent 6 }}
      {{- include "buildbarn.automountServiceAccountToken" (dict "root" . "workload" .Values.storage) | nindent 6 }}
      {{- with .Values.storage.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if .Values.storage.podAntiAffinity.enabled }}
      {{- include "buildbarn.requiredPodAntiAffinity" (dict "app" "storage") | nindent 6 }}
      {{- end }}
      {{- if or (include "buildbarn.storage.anyFsPrep" .) (include "buildbarn.storage.anyBlock" .) }}
      {{- include "buildbarn.storage.podSecurityContext" . | nindent 6 }}
      {{- end }}
      {{- if or (include "buildbarn.storage.anyFsPrep" .) (and (include "buildbarn.storage.anyBlock" .) (eq .Values.storage.persistence.blockDevice.deviceAccess "chownInit")) }}
      initContainers:
        {{- if (include "buildbarn.storage.anyFsPrep" .) }}
        - name: volume-init
          image: {{ include "buildbarn.imageString" (dict "root" . "name" "images.busybox" "image" .Values.images.busybox.image) | quote }}
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command:
            - sh
            - -c
            - |
{{- include "buildbarn.storage.volumeInitScript" . | nindent 14 }}
          securityContext:
            {{- include "buildbarn.storage.volumeInitSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "buildbarn.storage.fsVolumeMounts" . | nindent 12 }}
        {{- end }}
        {{- if and ((include "buildbarn.storage.anyBlock" .)) (eq .Values.storage.persistence.blockDevice.deviceAccess "chownInit") }}
        {{- include "buildbarn.storage.deviceChownInit" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: storage
          image: {{ include "buildbarn.image" (dict "root" . "name" "images.storage" "repository" .Values.images.storage.repository "tag" .Values.images.storage.tag "digest" .Values.images.storage.digest) }}
          imagePullPolicy: {{ .Values.images.storage.pullPolicy }}
          args:
            - /config/storage.jsonnet
          {{- if or .Values.tracing.enabled .Values.storage.env }}
          env:
            {{- include "buildbarn.tracingEnv" (dict "root" . "serviceName" "bb-storage") | nindent 12 }}
            {{- range $name, $value := .Values.storage.env }}
            - name: {{ $name }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: 9980
              protocol: TCP
              name: metrics
            - containerPort: 8981
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9980
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9980
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.storage.resources | nindent 12 }}
          securityContext:
            {{- if and (include "buildbarn.storage.anyBlock" .) (eq .Values.storage.persistence.mode "hostPath") }}
            # Raw block devices provided via hostPath require a privileged
            # container: Kubernetes only allowlists a device in the container's
            # device cgroup when it is attached through a PVC (volumeDevices), so
            # a non-privileged pod cannot open a hostPath-backed block device.
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            {{- else }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            {{- end }}
          volumeMounts:
            {{- if .Values.storage.mtlsClientCert.enabled }}
            - name: mtls-client-cert
              readOnly: true
              mountPath: /etc/mtls-client-cert
            {{- end }}
            {{- include "buildbarn.tracingVolumeMount" . | nindent 12 }}
            - mountPath: /config/
              name: configs
              readOnly: true
            {{- include "buildbarn.storage.fsVolumeMounts" . | nindent 12 }}
            {{- if eq .Values.storage.persistence.mode "hostPath" }}
            {{- include "buildbarn.storage.blockDeviceMounts" . | nindent 12 }}
            {{- end }}
          {{- if and (include "buildbarn.storage.anyBlock" .) (ne .Values.storage.persistence.mode "hostPath") }}
          volumeDevices:
            {{- include "buildbarn.storage.volumeDevices" . | nindent 12 }}
          {{- end }}
      {{- include "buildbarn.podScheduling" (dict "root" . "workload" .Values.storage) | nindent 6 }}
      volumes:
        {{- if .Values.storage.mtlsClientCert.enabled }}
        - name: mtls-client-cert
          secret:
            secretName: {{ required "secrets.mtlsClientCert is required when storage.mtlsClientCert.enabled is true" .Values.secrets.mtlsClientCert }}
        {{- end }}
        {{- include "buildbarn.tracingVolume" . | nindent 8 }}
        - name: configs
          configMap:
            name: {{ include "buildbarn.configName" . }}
            items:
              - key: common.libsonnet
                path: common.libsonnet
              - key: storage.jsonnet
                path: storage.jsonnet
        {{- if ne .Values.storage.persistence.mode "pvc" }}
        {{- include "buildbarn.storage.podStoreVolumes" . | nindent 8 }}
        {{- end }}
  {{- if eq .Values.storage.persistence.mode "pvc" }}
  volumeClaimTemplates:
    {{- include "buildbarn.storage.volumeClaimTemplates" . | nindent 4 }}
  {{- end }}
