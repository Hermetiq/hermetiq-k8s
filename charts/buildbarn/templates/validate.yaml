{{- $full := eq (default "full" .Values.deploymentMode) "full" -}}
{{- $manageStorage := include "buildbarn.manageStorage" . -}}
{{- $storageName := include "buildbarn.storageName" . -}}
{{- if not (has (default "full" .Values.deploymentMode) (list "full" "storage-only")) -}}
{{- fail "deploymentMode must be full or storage-only" -}}
{{- end -}}
{{- if and (not $full) (not $manageStorage) -}}
{{- fail "deploymentMode=storage-only requires storage.enabled=true" -}}
{{- end -}}
{{/* hostPath stores live at fixed node paths and devices that do not depend
     on storage.name, and pod anti-affinity only separates pods of one ring. A
     second ring could land on a node running the current storage and open the
     same block devices and index files. */}}
{{- if and (not $full) (eq (toString .Values.storage.persistence.mode) "hostPath") -}}
{{- fail "deploymentMode=storage-only does not support storage.persistence.mode=hostPath: hostPath stores use fixed node paths and devices, and pod anti-affinity only separates pods of the same ring, so the new ring could share a node and its disks with the storage already running there. Stage the new ring with storage.persistence.mode=pvc" -}}
{{- end -}}
{{- if or (gt (len $storageName) 63) (not (regexMatch "^[a-z]([-a-z0-9]*[a-z0-9])?$" $storageName)) -}}
{{- fail "storage.name must be a DNS service label: 1-63 lowercase letters, digits or hyphens, starting with a letter and ending with a letter or digit" -}}
{{- end -}}
{{- if lt (int .Values.storage.replicas) 1 -}}
{{- fail "storage.replicas must be at least 1, including when storage.enabled=false" -}}
{{- end -}}
{{- if and (not $manageStorage) (index (default (dict) .Values.configOverrides) "common.libsonnet") -}}
{{- fail "storage.enabled=false requires the generated common.libsonnet so storage.name and storage.replicas select the external ring; remove configOverrides[\"common.libsonnet\"]" -}}
{{- end -}}
{{- if $full -}}
{{- if not (semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version) -}}
{{- fail "frontend graceful shutdown requires Kubernetes 1.30 or newer with PodLifecycleSleepAction enabled (stable in 1.34): the distroless frontend uses a native preStop sleep hook" -}}
{{- end -}}
{{- $shutdown := .Values.frontend.shutdown -}}
{{- $minimumGrace := add $shutdown.drainDelaySeconds 15 -}}
{{- if .Values.frontend.grpcCacheProxy.enabled -}}
{{- /* Include proxy RPCs, cache events, 5s OTEL shutdown and 15s headroom.
       This also leaves time after the backend's drain + RPC + 5s preStop. */ -}}
{{- $minimumGrace = add $minimumGrace $shutdown.rpcGracePeriodSeconds $shutdown.eventDrainTimeoutSeconds 5 -}}
{{- range $name := list "SHUTDOWN_DRAIN_DELAY" "SHUTDOWN_TIMEOUT" "CACHE_EVENT_DRAIN_TIMEOUT" -}}
{{- if hasKey (default (dict) $.Values.frontend.grpcCacheProxy.env) $name -}}
{{- fail (printf "frontend.grpcCacheProxy.env.%s is reserved: configure frontend.shutdown instead so the proxy and backend shutdown budgets stay consistent" $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if lt (int .Values.frontend.terminationGracePeriodSeconds) (int $minimumGrace) -}}
{{- fail (printf "frontend.terminationGracePeriodSeconds must be at least %d for frontend.shutdown (including cache-event and OTEL cleanup and shutdown headroom)" $minimumGrace) -}}
{{- end -}}
{{- end -}}
{{/* Scheduler action router. The scheduler REJECTS an unsorted platform with
     InvalidArgument rather than sorting it (platform.NewKey), so a misordered
     list here is not a style problem — it stops the scheduler starting. Fail
     the install instead, where the message can say which list and what order. */}}
{{- $router := $.Values.scheduler.actionRouter -}}
{{- if $full -}}
{{- if not (has $router.mode (list "simple" "demultiplexing" "custom")) -}}
{{- fail (printf "scheduler.actionRouter.mode is %q; must be one of: simple, demultiplexing, custom" $router.mode) -}}
{{- end -}}
{{- if eq $router.mode "demultiplexing" -}}
{{- if not $router.catchAll.platform.properties -}}
{{- fail "scheduler.actionRouter.mode=demultiplexing needs scheduler.actionRouter.catchAll.platform.properties: unmatched actions are rewritten onto that platform, and an empty one is the {} queue that a pool advertising no properties serves — almost never what is meant. Use mode=custom if you really want it." -}}
{{- end -}}
{{- range $i, $b := $router.backends -}}
{{- $keys := list -}}
{{- range $b.platform.properties -}}
{{- $keys = append $keys (printf "%s\x00%s" .name .value) -}}
{{- end -}}
{{- if ne (join "\n" $keys) (join "\n" (uniq (sortAlpha $keys))) -}}
{{- fail (printf "scheduler.actionRouter.backends[%d].platform.properties are not sorted by name then value (or contain duplicates); the scheduler rejects an unsorted platform and will not start" $i) -}}
{{- end -}}
{{- end -}}
{{- $catch := list -}}
{{- range $router.catchAll.platform.properties -}}
{{- $catch = append $catch (printf "%s\x00%s" .name .value) -}}
{{- end -}}
{{- if ne (join "\n" $catch) (join "\n" (uniq (sortAlpha $catch))) -}}
{{- fail "scheduler.actionRouter.catchAll.platform.properties are not sorted by name then value (or contain duplicates); the scheduler rejects an unsorted platform and will not start" -}}
{{- end -}}
{{- end -}}
{{- range $i, $q := $.Values.scheduler.predeclaredPlatformQueues -}}
{{- $keys := list -}}
{{- range $q.platform -}}
{{- $keys = append $keys (printf "%s\x00%s" .name .value) -}}
{{- end -}}
{{- if ne (join "\n" $keys) (join "\n" (uniq (sortAlpha $keys))) -}}
{{- fail (printf "scheduler.predeclaredPlatformQueues[%d].platform properties are not sorted by name then value (or contain duplicates); the scheduler rejects an unsorted platform and will not start" $i) -}}
{{- end -}}
{{- end -}}
{{- /* configurationReloadInterval and the handover settings only exist in
     Hermetiq's fork of bb-remote-execution. The upstream image parses its
     configuration strictly, so it would crash-loop on them. */ -}}
{{- with $.Values.scheduler.configurationReloadInterval -}}
{{- if gt (int64 (first (splitList "." (trimSuffix "s" .)))) (int64 315576000000) -}}
{{- fail "scheduler.configurationReloadInterval exceeds the maximum protobuf duration of 315576000000 seconds" -}}
{{- end -}}
{{- end -}}
{{- $schedulerRepo := include "buildbarn.rewriteImageRepository" (dict "repository" $.Values.images.scheduler.repository "registry" (default (dict) $.Values.global).imageRegistry) -}}
{{- $upstreamSchedulerDigest := "sha256:f8ff583267708354d2550e43c3b89c358d6e0c28fa5f4216521275b431db9fa8" -}}
{{- $schedulerDigest := trimPrefix "@" (default "" $.Values.images.scheduler.digest) -}}
{{- if or (eq $.Values.images.scheduler.repository "ghcr.io/buildbarn/bb-scheduler") (hasSuffix "/buildbarn/bb-scheduler" $schedulerRepo) (eq $schedulerDigest $upstreamSchedulerDigest) -}}
{{- if $.Values.scheduler.configurationReloadInterval -}}
{{- fail "scheduler.configurationReloadInterval requires a bb-scheduler image built from Hermetiq's fork of bb-remote-execution; the upstream ghcr.io/buildbarn/bb-scheduler image rejects this option and will not start. Point images.scheduler.repository (and clear images.scheduler.digest if pinned to upstream) at the fork's image, or leave scheduler.configurationReloadInterval empty." -}}
{{- end -}}
{{- if $.Values.scheduler.handover.enabled -}}
{{- fail "scheduler.handover.enabled requires a bb-scheduler image built from Hermetiq's fork of bb-remote-execution; the upstream ghcr.io/buildbarn/bb-scheduler image rejects the handover options and will not start. Point images.scheduler.repository (and clear images.scheduler.digest if pinned to upstream) at the fork's image, or disable scheduler.handover." -}}
{{- end -}}
{{- end -}}
{{- if $.Values.scheduler.handover.enabled -}}
{{- $coordImage := $.Values.scheduler.handover.coordinator.image -}}
{{- if or (not $coordImage.repository) (not $coordImage.tag) -}}
{{- fail "scheduler.handover.enabled requires scheduler.handover.coordinator.image.repository and scheduler.handover.coordinator.image.tag to be set" -}}
{{- end -}}
{{- if eq $.Values.scheduler.handover.handoverGrpcServers.authenticationPolicy.mode "deny" -}}
{{- fail "scheduler.handover.handoverGrpcServers.authenticationPolicy.mode=deny blocks the coordinator sidecar's local Ping health check and prevents the scheduler from acquiring the Lease" -}}
{{- end -}}
{{- if and (kindIs "bool" $.Values.scheduler.automountServiceAccountToken) (not $.Values.scheduler.automountServiceAccountToken) -}}
{{- fail "scheduler.automountServiceAccountToken=false prevents the handover coordinator from accessing the Kubernetes API; set it to true or null when scheduler.handover.enabled=true" -}}
{{- end -}}
{{- if has (int $.Values.scheduler.handover.port) (list 7982 8982 8983 8984 9980) -}}
{{- fail (printf "scheduler.handover.port=%d conflicts with an existing scheduler listener; choose a port other than 7982, 8982, 8983, 8984, or 9980" (int $.Values.scheduler.handover.port)) -}}
{{- end -}}
{{- end -}}
{{- $provider := include "buildbarn.routingProvider" . -}}
{{- $validRoutingProviders := list "contour" "gateway" "gateway-httproute-only" "ingress" "none" -}}
{{- $requestedRoutingProvider := default "" .Values.routing.provider -}}
{{- if and $requestedRoutingProvider (not (has $requestedRoutingProvider $validRoutingProviders)) -}}
{{- fail "routing.provider must be one of: contour, gateway, gateway-httproute-only, ingress, none" -}}
{{- end -}}
{{- if not (has $provider $validRoutingProviders) -}}
{{- fail "routing.provider must be one of: contour, gateway, gateway-httproute-only, ingress, none" -}}
{{- end -}}
{{- end -}}
{{- if $manageStorage -}}
{{- if not (has .Values.storage.persistence.mode (list "pvc" "emptyDir" "hostPath")) -}}
{{- fail "storage.persistence.mode must be one of: pvc, emptyDir, hostPath" -}}
{{- end -}}
{{- end -}}
{{- if $full -}}
{{- if not (has .Values.frontend.actionCache.putAuthorizer.mode (list "allow" "deny" "requireCanWriteToCache" "custom")) -}}
{{- fail "frontend.actionCache.putAuthorizer.mode must be one of: allow, deny, requireCanWriteToCache, custom" -}}
{{- end -}}
{{- if and (eq .Values.frontend.actionCache.putAuthorizer.mode "custom") (not .Values.frontend.actionCache.putAuthorizer.custom) -}}
{{- fail "frontend.actionCache.putAuthorizer.custom is required when frontend.actionCache.putAuthorizer.mode=custom" -}}
{{- end -}}
{{- end -}}
{{- if $manageStorage -}}
{{- if not (has .Values.storage.persistence.ac.keyLocationMap.type (list "inMemory" "blockDevice")) -}}
{{- fail "storage.persistence.ac.keyLocationMap.type must be one of: inMemory, blockDevice" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.tracing.enabled (not .Values.tracing.nodeLocal.enabled) (not .Values.tracing.endpoint) -}}
{{- fail "tracing.endpoint is required when tracing.enabled=true and tracing.nodeLocal.enabled=false" -}}
{{- end -}}
{{- if and .Values.tracing.enabled .Values.tracing.tls.clientCertificate.enabled (not .Values.tracing.tls.enabled) -}}
{{- fail "tracing.tls.enabled must be true when tracing.tls.clientCertificate.enabled=true" -}}
{{- end -}}
{{- if $full -}}
{{- $authorizerModes := list "allow" "deny" "requireCanWriteToCache" "custom" -}}
{{- if not (has .Values.frontend.contentAddressableStorage.putAuthorizer.mode $authorizerModes) -}}
{{- fail "frontend.contentAddressableStorage.putAuthorizer.mode must be one of: allow, deny, requireCanWriteToCache, custom" -}}
{{- end -}}
{{- if and (eq .Values.frontend.contentAddressableStorage.putAuthorizer.mode "custom") (not .Values.frontend.contentAddressableStorage.putAuthorizer.custom) -}}
{{- fail "frontend.contentAddressableStorage.putAuthorizer.custom is required when frontend.contentAddressableStorage.putAuthorizer.mode=custom" -}}
{{- end -}}
{{- if not (has .Values.frontend.executeAuthorizer.mode $authorizerModes) -}}
{{- fail "frontend.executeAuthorizer.mode must be one of: allow, deny, requireCanWriteToCache, custom" -}}
{{- end -}}
{{- if and (eq .Values.frontend.executeAuthorizer.mode "custom") (not .Values.frontend.executeAuthorizer.custom) -}}
{{- fail "frontend.executeAuthorizer.custom is required when frontend.executeAuthorizer.mode=custom" -}}
{{- end -}}
{{- if and .Values.keda.enabled .Values.keda.frontend.enabled -}}
{{- if lt (int .Values.keda.frontend.minReplicaCount) 1 -}}
{{- fail "keda.frontend.minReplicaCount must be at least 1 because frontend metrics cannot reactivate a deployment scaled to zero" -}}
{{- end -}}
{{- if lt (int .Values.keda.frontend.maxReplicaCount) (int .Values.keda.frontend.minReplicaCount) -}}
{{- fail "keda.frontend.maxReplicaCount must be greater than or equal to keda.frontend.minReplicaCount" -}}
{{- end -}}
{{- if not .Values.keda.prometheusServerAddress -}}
{{- fail "keda.prometheusServerAddress is required when frontend autoscaling is enabled" -}}
{{- end -}}
{{- range $resource := list "cpu" "memory" -}}
{{- $trigger := index $.Values.keda.frontend $resource -}}
{{- if and $trigger.enabled (lt (int $trigger.targetUtilization) 1) -}}
{{- fail (printf "keda.frontend.%s.targetUtilization must be greater than zero when the trigger is enabled" $resource) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $manageStorage -}}
{{/* --- Storage backend, sizing, raw block-device, CMS, and ISCC/FSAC validation --- */}}
{{- $bd := .Values.storage.persistence.blockDevice -}}
{{- if not (has $bd.deviceAccess (list "group" "chownInit")) -}}
{{- fail "storage.persistence.blockDevice.deviceAccess must be one of: group, chownInit" -}}
{{- end -}}
{{- $cms := .Values.storage.persistence.cms -}}
{{- $casNoFsGlobal := and (eq .Values.storage.persistence.cas.backend "blockDevice") (ne .Values.storage.persistence.cas.blockDevice.keyLocationMap "file") -}}
{{- $cmsBlocksInMemory := and (eq $cms.backend "sharedCas") $casNoFsGlobal -}}
{{- if not (has $cms.backend (list "sharedCas" "filesystem" "blockDevice")) -}}
{{- fail "storage.persistence.cms.backend must be one of: sharedCas, filesystem, blockDevice" -}}
{{- end -}}
{{- if not (has $cms.keyLocationMap.type (list "inMemory" "blockDevice")) -}}
{{- fail "storage.persistence.cms.keyLocationMap.type must be one of: inMemory, blockDevice" -}}
{{- end -}}
{{- if ne (int $cms.newBlocks) 1 -}}
{{- fail (printf "storage.persistence.cms.newBlocks is %d; bb-storage requires newBlocks=1 for CMS (mutable store)" (int $cms.newBlocks)) -}}
{{- end -}}
{{- if and $cmsBlocksInMemory (le (int64 $cms.blocksInMemoryBlockSizeBytes) (int64 0)) -}}
{{- fail "storage.persistence.cms.blocksInMemoryBlockSizeBytes must be greater than zero when CMS uses blocksInMemory" -}}
{{- end -}}
{{- $cmsTotalBlocks := add (int $cms.spareBlocks) (int $cms.oldBlocks) (int $cms.currentBlocks) (int $cms.newBlocks) -}}
{{- if and (not $cmsBlocksInMemory) (gt $cmsTotalBlocks 100) -}}
{{- fail (printf "storage.persistence.cms: spareBlocks+oldBlocks+currentBlocks+newBlocks is %d; bb-storage supports at most 100 blocks per store" (int $cmsTotalBlocks)) -}}
{{- end -}}
{{- range $store := list "cas" "cms" "ac" "iscc" "fsac" -}}
{{- $s := index $.Values.storage.persistence $store -}}
{{- $active := or (eq $store "cas") (eq $store "ac") (and (eq $store "cms") (ne $s.backend "sharedCas")) (and (has $store (list "iscc" "fsac")) $s.enabled) -}}
{{- if $active -}}
{{- if not (has $s.backend (list "filesystem" "blockDevice")) -}}
{{- fail (printf "storage.persistence.%s.backend must be one of: filesystem, blockDevice" $store) -}}
{{- end -}}
{{- if and (ne $store "cas") (not (has $s.keyLocationMap.type (list "inMemory" "blockDevice"))) -}}
{{- fail (printf "storage.persistence.%s.keyLocationMap.type must be one of: inMemory, blockDevice" $store) -}}
{{- end -}}
{{- $totalBlocks := add (int $s.spareBlocks) (int $s.oldBlocks) (int $s.currentBlocks) (int $s.newBlocks) -}}
{{- if gt $totalBlocks 100 -}}
{{- fail (printf "storage.persistence.%s: spareBlocks+oldBlocks+currentBlocks+newBlocks is %d; bb-storage supports at most 100 blocks per store" $store (int $totalBlocks)) -}}
{{- end -}}
{{- if and (eq $.Values.storage.persistence.mode "emptyDir") (not $s.emptyDir.sizeLimit) -}}
{{- fail (printf "storage.persistence.%s.emptyDir.sizeLimit is required when storage.persistence.mode=emptyDir — an unbounded emptyDir can fill the node and get the pod evicted" $store) -}}
{{- end -}}
{{- if ne $s.backend "blockDevice" -}}
{{/* Compare blocksSizeGi (plus any on-disk key-location map) against whatever
     actually bounds the volume: the PVC request in mode=pvc, or emptyDir.sizeLimit
     in mode=emptyDir. In hostPath mode nothing in the chart bounds it — the host
     device does — so `size` is inert there and comparing against it would reject
     valid configs. */}}
{{- $klmDiskMi := 0 -}}
{{- if eq $store "cas" -}}
{{- $klmDiskMi = int $s.keyLocationMapSizeMi -}}
{{- else if eq $s.keyLocationMap.type "blockDevice" -}}
{{- $klmDiskMi = int $s.keyLocationMap.sizeMi -}}
{{- end -}}
{{- $blocksMi := mul (int $s.blocksSizeGi) 1024 -}}
{{- $sharedCmsBlocksMi := 0 -}}
{{- $sharedCmsKlmMi := 0 -}}
{{- if and (eq $store "cas") (eq $cms.backend "sharedCas") -}}
{{- $sharedCmsBlocksMi = mul (int $cms.blocksSizeGi) 1024 -}}
{{- if eq $cms.keyLocationMap.type "blockDevice" -}}
{{- $sharedCmsKlmMi = int $cms.keyLocationMap.sizeMi -}}
{{- end -}}
{{- end -}}
{{- if eq $.Values.storage.persistence.mode "pvc" -}}
{{- $storeSizeGi := include "buildbarn.storageSizeGi" (dict "name" (printf "storage.persistence.%s.size" $store) "value" $s.size) -}}
{{- if ge (int $s.blocksSizeGi) (int $storeSizeGi) -}}
{{- fail (printf "storage.persistence.%s.blocksSizeGi (%d) must be smaller than storage.persistence.%s.size (%s) to leave headroom for metadata" $store (int $s.blocksSizeGi) $store $s.size) -}}
{{- end -}}
{{- if ge (add $blocksMi $klmDiskMi) (mul (int $storeSizeGi) 1024) -}}
{{- fail (printf "storage.persistence.%s: blocksSizeGi (%dGi) plus on-disk key-location map (%dMi) leaves no room inside storage.persistence.%s.size (%s) for persistent state and filesystem metadata" $store (int $s.blocksSizeGi) $klmDiskMi $store $s.size) -}}
{{- end -}}
{{- if and (eq $store "cas") (eq $cms.backend "sharedCas") (ge (add $blocksMi $klmDiskMi $sharedCmsBlocksMi $sharedCmsKlmMi) (mul (int $storeSizeGi) 1024)) -}}
{{- fail (printf "storage.persistence.cas: blocksSizeGi (%dGi) + on-disk KLM (%dMi) + sharedCas cms.blocksSizeGi (%dGi) + cms KLM (%dMi) leaves no room inside storage.persistence.cas.size (%s) for persistent state and filesystem metadata" (int $s.blocksSizeGi) $klmDiskMi (int $cms.blocksSizeGi) $sharedCmsKlmMi $s.size) -}}
{{- end -}}
{{- else if eq $.Values.storage.persistence.mode "emptyDir" -}}
{{- $limitGi := include "buildbarn.storageSizeGi" (dict "name" (printf "storage.persistence.%s.emptyDir.sizeLimit" $store) "value" $s.emptyDir.sizeLimit) -}}
{{- if ge (int $s.blocksSizeGi) (int $limitGi) -}}
{{- fail (printf "storage.persistence.%s.blocksSizeGi (%d) must be smaller than storage.persistence.%s.emptyDir.sizeLimit (%s) to leave headroom for metadata" $store (int $s.blocksSizeGi) $store $s.emptyDir.sizeLimit) -}}
{{- end -}}
{{- if ge (add $blocksMi $klmDiskMi) (mul (int $limitGi) 1024) -}}
{{- fail (printf "storage.persistence.%s: blocksSizeGi (%dGi) plus on-disk key-location map (%dMi) leaves no room inside storage.persistence.%s.emptyDir.sizeLimit (%s) for persistent state and filesystem metadata" $store (int $s.blocksSizeGi) $klmDiskMi $store $s.emptyDir.sizeLimit) -}}
{{- end -}}
{{- if and (eq $store "cas") (eq $cms.backend "sharedCas") (ge (add $blocksMi $klmDiskMi $sharedCmsBlocksMi $sharedCmsKlmMi) (mul (int $limitGi) 1024)) -}}
{{- fail (printf "storage.persistence.cas: blocksSizeGi (%dGi) + on-disk KLM (%dMi) + sharedCas cms.blocksSizeGi (%dGi) + cms KLM (%dMi) leaves no room inside storage.persistence.cas.emptyDir.sizeLimit (%s) for persistent state and filesystem metadata" (int $s.blocksSizeGi) $klmDiskMi (int $cms.blocksSizeGi) $sharedCmsKlmMi $s.emptyDir.sizeLimit) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if eq $s.backend "blockDevice" -}}
{{- if not (has $s.blockDevice.keyLocationMap (list "inMemory" "file")) -}}
{{- fail (printf "storage.persistence.%s.blockDevice.keyLocationMap must be one of: inMemory, file" $store) -}}
{{- end -}}
{{- if not (has $.Values.storage.persistence.mode (list "pvc" "hostPath")) -}}
{{- fail (printf "storage.persistence.%s.backend=blockDevice requires storage.persistence.mode to be pvc or hostPath (got %s)" $store $.Values.storage.persistence.mode) -}}
{{- end -}}
{{- if and (eq $.Values.storage.persistence.mode "hostPath") (not $bd.allowHostPath) -}}
{{- fail (printf "storage.persistence.%s.backend=blockDevice with mode=hostPath requires storage.persistence.blockDevice.allowHostPath=true" $store) -}}
{{- end -}}
{{- if and (eq $.Values.storage.persistence.mode "pvc") (not $s.blockDevice.size) -}}
{{- fail (printf "storage.persistence.%s.blockDevice.size is required when backend=blockDevice and mode=pvc (it sizes the Block PVC; with mode=hostPath the device's real size is authoritative)" $store) -}}
{{- end -}}
{{- if eq $s.blockDevice.keyLocationMap "file" -}}
{{- if not $s.blockDevice.metadata.size -}}
{{- fail (printf "storage.persistence.%s.blockDevice.metadata.size is required when blockDevice.keyLocationMap=file" $store) -}}
{{- end -}}
{{- $metadataSizeMi := include "buildbarn.storageSizeMi" (dict "name" (printf "storage.persistence.%s.blockDevice.metadata.size" $store) "value" $s.blockDevice.metadata.size) -}}
{{- $keyLocationMapSizeMi := int $s.blockDevice.metadata.keyLocationMapSizeMi -}}
{{- if le (int $metadataSizeMi) $keyLocationMapSizeMi -}}
{{- fail (printf "storage.persistence.%s.blockDevice.metadata.size (%s) must be larger than storage.persistence.%s.blockDevice.metadata.keyLocationMapSizeMi (%dMi) to leave headroom for persistent state" $store $s.blockDevice.metadata.size $store $keyLocationMapSizeMi) -}}
{{- end -}}
{{- if and (eq $store "cas") (eq $cms.backend "sharedCas") -}}
{{- $sharedCmsMetaMi := mul (int $cms.blocksSizeGi) 1024 -}}
{{- if eq $cms.keyLocationMap.type "blockDevice" -}}
{{- $sharedCmsMetaMi = add $sharedCmsMetaMi (int $cms.keyLocationMap.sizeMi) -}}
{{- end -}}
{{- if le (int $metadataSizeMi) (add $keyLocationMapSizeMi $sharedCmsMetaMi) -}}
{{- fail (printf "storage.persistence.cas.blockDevice.metadata.size (%s) must be larger than cas.blockDevice.metadata.keyLocationMapSizeMi (%dMi) plus sharedCas CMS files (%dMi) to leave headroom for persistent state" $s.blockDevice.metadata.size $keyLocationMapSizeMi $sharedCmsMetaMi) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{/* hostPath mode with CAS moved off the chart default path. ISCC and FSAC are
     enabled by default, so values that never mention them still gain two
     hostPath volumes at the chart-default directory. Where that directory is
     not a mounted SSD, the kubelet creates it on the node boot disk. Raw block
     stores already refuse to guess a path; do the same here. */}}
{{- if eq .Values.storage.persistence.mode "hostPath" -}}
{{- $hpCas := .Values.storage.persistence.cas -}}
{{- $hpCasRaw := eq $hpCas.backend "blockDevice" -}}
{{- $hpCasPath := toString (default "" $hpCas.hostPath.path) -}}
{{- if or $hpCasRaw (ne $hpCasPath (include "buildbarn.storage.defaultHostPath" "cas")) -}}
{{- range $store := list "iscc" "fsac" -}}
{{- $s := index $.Values.storage.persistence $store -}}
{{- $defaultPath := include "buildbarn.storage.defaultHostPath" $store -}}
{{- if and $s.enabled (ne $s.backend "blockDevice") (eq (toString (default "" $s.hostPath.path)) $defaultPath) -}}
{{- fail (printf "storage.persistence.%s.hostPath.path is still the chart default (%s) in storage.persistence.mode=hostPath, but CAS does not use the chart default path (%s). %s is enabled by default; where that directory is not a mounted SSD, a DirectoryOrCreate hostPath is created on the node boot disk. Set storage.persistence.%s.hostPath.path to a directory next to the other stores, or set storage.persistence.%s.enabled=false." $store $defaultPath (ternary "storage.persistence.cas.backend=blockDevice" (printf "storage.persistence.cas.hostPath.path=%s" $hpCasPath) $hpCasRaw) (upper $store) $store $store) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $full -}}
{{- if and .Values.scheduler.sizeClassAnalysis.enabled (not .Values.storage.persistence.iscc.enabled) -}}
{{- fail "scheduler.sizeClassAnalysis.enabled=true requires storage.persistence.iscc.enabled=true" -}}
{{- end -}}
{{- if and .Values.frontend.readCache.enabled (not .Values.frontend.readCache.volume.hostPath.enabled) .Values.frontend.readCache.volume.emptyDir.sizeLimit -}}
{{- $rcLimitMi := int (include "buildbarn.storageSizeMi" (dict "name" "frontend.readCache.volume.emptyDir.sizeLimit" "value" .Values.frontend.readCache.volume.emptyDir.sizeLimit)) -}}
{{- $rcBlocksMi := mul (int .Values.frontend.readCache.blocksSizeGi) 1024 -}}
{{- if ge $rcBlocksMi $rcLimitMi -}}
{{- fail (printf "frontend.readCache.blocksSizeGi (%dGi = %dMi) must be smaller than frontend.readCache.volume.emptyDir.sizeLimit (%s = %dMi) to leave headroom for metadata and prevent kubelet from evicting the frontend pod" (int .Values.frontend.readCache.blocksSizeGi) $rcBlocksMi .Values.frontend.readCache.volume.emptyDir.sizeLimit $rcLimitMi) -}}
{{- end -}}
{{- end -}}
{{- $are := .Values.config.actionCache.actionResultExpiring -}}
{{- if $are.enabled -}}
{{- if not $are.minimumValidity -}}
{{- fail "config.actionCache.actionResultExpiring.minimumValidity is required when actionResultExpiring.enabled=true" -}}
{{- end -}}
{{/* bb-storage derives the jitter as `uint64(t.Unix()) * K % jitter`, so a
     zero or absent value panics with an integer divide-by-zero on the first AC
     hit. All three actionResultExpiring fields are CheckValid()d unconditionally
     in bb-storage, which is why the template always renders them. */}}
{{- if or (not $are.maximumValidityJitter) (regexMatch "^0+(\\.0+)?[a-z]*$" ($are.maximumValidityJitter | toString)) -}}
{{- fail "config.actionCache.actionResultExpiring.maximumValidityJitter must be a NONZERO duration when actionResultExpiring.enabled=true (bb-storage takes a modulo by it, so zero panics with an integer divide-by-zero on the first Action Cache hit)" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{/* Capacity arithmetic and remedies are shared with NOTES so a disabled guard
     still exposes undersized indexes during install/upgrade. */}}
{{- if and $manageStorage .Values.storage.keyLocationMapSizing.validate -}}
{{- range $diagnostic := (include "buildbarn.storage.indexSizingDiagnostics" . | fromJsonArray) -}}
{{- fail $diagnostic -}}
{{- end -}}
{{- end -}}
{{- if $full -}}
{{- if .Values.frontend.grpcCacheProxy.enabled -}}
{{/* An empty natsUrl is legal: it runs the sidecar as a pure pass-through with
     cache-event capture disabled. The subject prefix only matters when events
     are actually published. */}}
{{- if and .Values.frontend.grpcCacheProxy.natsUrl (not .Values.frontend.grpcCacheProxy.cacheEvents.subjectPrefix) -}}
{{- fail "frontend.grpcCacheProxy.cacheEvents.subjectPrefix is required when frontend.grpcCacheProxy.natsUrl is set" -}}
{{- end -}}
{{/* Backstop for --skip-schema-validation, where the schema enum does not run.
     The proxy would fall back to "on" with only a log line. */}}
{{- if not (has (toString .Values.frontend.grpcCacheProxy.cacheEvents.trackingMode) (list "on" "off" "header")) -}}
{{- fail "frontend.grpcCacheProxy.cacheEvents.trackingMode must be one of: on, off, header (quoted, since YAML reads a bare on/off as a boolean)" -}}
{{- end -}}
{{- if and .Values.frontend.grpcCacheProxy.enforceAuth (or (not .Values.frontend.grpcCacheProxy.stytch.apiHost) (not .Values.frontend.grpcCacheProxy.stytch.existingSecret)) -}}
{{- fail "frontend.grpcCacheProxy.stytch.apiHost and frontend.grpcCacheProxy.stytch.existingSecret are required when frontend.grpcCacheProxy.enforceAuth=true" -}}
{{- end -}}
{{- if and .Values.frontend.grpcCacheProxy.enforceAuth (not .Values.frontend.internalService.enabled) (gt (int .Values.browser.replicas) 0) (not (hasKey (default (dict) .Values.configOverrides) "browser.jsonnet")) -}}
{{- fail "frontend.internalService.enabled must be true when frontend.grpcCacheProxy.enforceAuth=true and bb-browser is enabled: bb-browser reads CAS through the frontend without proxy credentials and cannot use the authenticated frontend-grpc fallback" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.browser.oauth2Proxy.enabled .Values.browser.service.targetPortOverride -}}
{{- fail "browser.service.targetPortOverride is mutually exclusive with browser.oauth2Proxy.enabled — both claim the browser Service port" -}}
{{- end -}}
{{- end -}}
{{/* In-cluster mutual TLS. Every failure here is one that only shows up as a
     crash-looping pod or a cluster that has silently stopped talking to
     itself, so the install is the right place to catch it. */}}
{{- $mtls := $.Values.security.grpcMtls -}}
{{- $policies := dict -}}
{{- if $manageStorage -}}
{{- $_ := set $policies "storage.grpcServers" $.Values.storage.grpcServers.authenticationPolicy -}}
{{- end -}}
{{- if $full -}}
{{- range $name := list "clientGrpcServers" "workerGrpcServers" "buildQueueStateGrpcServers" -}}
{{- $_ := set $policies (printf "scheduler.%s" $name) (index $.Values.scheduler $name).authenticationPolicy -}}
{{- end -}}
{{- $_ := set $policies "scheduler.handover.handoverGrpcServers" $.Values.scheduler.handover.handoverGrpcServers.authenticationPolicy -}}
{{- end -}}
{{- range $path, $policy := $policies -}}
{{- if not (has $policy.mode (list "" "allow" "deny" "mtls" "custom")) -}}
{{- fail (printf "%s.authenticationPolicy.mode is %q; must be one of: allow, deny, mtls, custom, or \"\" to follow security.grpcMtls" $path $policy.mode) -}}
{{- end -}}
{{- if and (eq $policy.mode "mtls") (not $mtls.enabled) -}}
{{- fail (printf "%s.authenticationPolicy.mode=mtls requires security.grpcMtls.enabled=true: the client CA, and the key pair the callers present, both come from that block" $path) -}}
{{- end -}}
{{- end -}}
{{- if $full -}}
{{- $adminMode := $.Values.scheduler.adminHttpServers.authenticationPolicy.mode -}}
{{- if not (has $adminMode (list "" "allow" "deny" "custom")) -}}
{{- fail (printf "scheduler.adminHttpServers.authenticationPolicy.mode is %q; must be one of: allow, deny, custom. It is an HTTP server, and http.server.AuthenticationPolicy has no tlsClientCertificate arm — mutual TLS is not available on this port at all" $adminMode) -}}
{{- end -}}
{{- end -}}
{{- if $mtls.enabled -}}
{{- if and $mtls.certificateAuthorities $mtls.certificateAuthoritiesFile -}}
{{- fail "security.grpcMtls: set certificateAuthorities or certificateAuthoritiesFile, not both" -}}
{{- end -}}
{{- if not (or $mtls.certificateAuthorities $mtls.certificateAuthoritiesFile) -}}
{{- fail "security.grpcMtls.enabled=true needs the CA that signed both ends: set certificateAuthorities (the PEM) or certificateAuthoritiesFile (an absolute path). An empty CA is not an open policy — bb-storage refuses to start with \"Failed to parse client certificate authorities\"" -}}
{{- end -}}
{{- if and $mtls.certificateAuthoritiesFile (not (hasPrefix "/" $mtls.certificateAuthoritiesFile)) -}}
{{- fail (printf "security.grpcMtls.certificateAuthoritiesFile is %q; it is read with jsonnet importstr, which resolves a relative path against the config directory, so it must be absolute" $mtls.certificateAuthoritiesFile) -}}
{{- end -}}
{{- if not $mtls.validationExpression -}}
{{- fail "security.grpcMtls.validationExpression is required: x509.ClientCertificateVerifierConfiguration takes no default and bb-storage fails to start with \"No JMESPath expression configuration provided\". Use \"`true`\" to accept every CA-signed certificate" -}}
{{- end -}}
{{- if not $mtls.metadataExtractionExpression -}}
{{- fail "security.grpcMtls.metadataExtractionExpression is required for the same reason as validationExpression. Use \"`{}`\" to extract nothing" -}}
{{- end -}}
{{/* An overridden file is spliced in verbatim, with no tpl and therefore none
     of the tls blocks rendered below. Overriding one END of a hop while the
     other end starts demanding a client certificate is how a cluster stops
     talking to itself on upgrade, so name the file rather than let it fail at
     runtime. */}}
{{- range $name, $_ := $.Values.configOverrides -}}
{{- if and (or $full (has $name (list "common.libsonnet" "storage.jsonnet"))) (or $manageStorage (ne $name "storage.jsonnet")) (has $name (list "common.libsonnet" "storage.jsonnet" "frontend.jsonnet" "scheduler.jsonnet" "portal.jsonnet")) -}}
{{- fail (printf "configOverrides[%q] replaces a file that carries one half of an in-cluster mTLS hop, and an override is spliced in verbatim without templating — security.grpcMtls would configure the other half only, leaving that hop broken. Add the tls block to your override and remove this file from the check, or turn security.grpcMtls off" $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{/* --- CDC schema upgrade guardrails (render-time values & cluster lookup) --- */}}
{{- $cdcGuide := "https://github.com/Hermetiq/hermetiq-k8s/blob/main/docs/migrate-to-1.0.0-buildbarn.md#upgrading-configurations-to-cdc" -}}
{{- $recreateGuide := "https://github.com/Hermetiq/hermetiq-k8s/blob/main/docs/buildbarn-storage-operations.md#recreate-the-storage-statefulset" -}}
{{- /* Handover and reload require a fork built with the CDC CAS schema.
       Older fork images only support the pre-CDC configuration, with or
       without these features: turning them off is not enough while
       images.scheduler still points at such a fork. */ -}}
{{- if and $full (not $.Values.scheduler.handover.cdcCompatibleFork) -}}
{{- if $.Values.scheduler.handover.enabled -}}
{{- fail "scheduler.handover.enabled is not supported with the CDC blobstore unless the fork supports CDC: disable scheduler.handover for this upgrade and remove any images.scheduler repository, tag or digest override that pins a fork image built without CDC support (that scheduler rejects the CDC configuration whether or not handover is enabled), or set scheduler.handover.cdcCompatibleFork=true with a fork image that supports CDC" -}}
{{- end -}}
{{- if $.Values.scheduler.configurationReloadInterval -}}
{{- fail "scheduler.configurationReloadInterval is not supported with the CDC blobstore unless the fork supports CDC: leave it empty for this upgrade and remove any images.scheduler repository, tag or digest override that pins a fork image built without CDC support (that scheduler rejects the CDC configuration whether or not reload is enabled), or set scheduler.handover.cdcCompatibleFork=true with a fork image that supports CDC" -}}
{{- end -}}
{{- end -}}
{{- /* The release's own Buildbarn images must be CDC builds: the chart renders
       CDC configuration for all of them. images.browser is not checked
       because bb-browser is still a pre-CDC binary and reads through
       frontend-internal. Only upstream date stamps can be classified. */ -}}
{{- $releaseImages := list "storage" -}}
{{- if $full -}}
{{- $releaseImages = concat $releaseImages (list "scheduler" "worker" "runnerInstaller") -}}
{{- end -}}
{{- if and $full $.Values.remoteAsset.enabled -}}
{{- $releaseImages = append $releaseImages "remoteAsset" -}}
{{- end -}}
{{- if and $full $.Values.portal.enabled -}}
{{- $releaseImages = append $releaseImages "portal" -}}
{{- end -}}
{{- range $imageName := $releaseImages -}}
{{- $image := default (dict) (index $.Values.images $imageName) -}}
{{- $imageRef := printf "%s:%s" (toString (default "" $image.repository)) (toString (default "" $image.tag)) -}}
{{- with $image.digest -}}
{{- $imageRef = printf "%s@%s" $imageRef (trimPrefix "@" (toString .)) -}}
{{- end -}}
{{- if include "buildbarn.cdc.preCdcImage" $imageRef -}}
{{- fail (printf "images.%s pins pre-CDC image %q: its tag carries an upstream date stamp before 20261102, and a pre-CDC binary rejects the CDC configuration this chart renders. Remove the images.%s tag and digest overrides to use the chart's CDC image, or pin a build stamped 20261102 or later. Tags without an upstream date stamp and digest-only references cannot be classified and are not checked; see %s" $imageName $imageRef $imageName $cdcGuide) -}}
{{- end -}}
{{- end -}}
{{- /* The checks below read configuration as text; nothing is evaluated. A
       field is recognised bare or quoted and with any jsonnet separator
       (name:, name::, name+:). Comments are removed first. A rule without its
       own pattern matches its field name as an object key. */ -}}
{{- $removedCdcFields := list
      (dict "field" "dataIntegrityValidationCache" "hint" "remove dataIntegrityValidationCache (integrity validation is now performed per RepMaxCDC chunk and via chunkMappingValidating)")
      (dict "field" "keyLocationMapInMemory" "hint" "replace keyLocationMapInMemory with keyLocationMap: { inMemory: ... }")
      (dict "field" "keyLocationMapOnBlockDevice" "hint" "replace keyLocationMapOnBlockDevice with keyLocationMap: { onBlockDevice: ... }")
      (dict "field" "keyLocationMapMaximumGetAttempts" "hint" "move maximumGetAttempts inside keyLocationMap: { ..., maximumGetAttempts: 16 }")
      (dict "field" "keyLocationMapMaximumPutAttempts" "hint" "move maximumPutAttempts inside keyLocationMap: { ..., maximumPutAttempts: 64 }")
      (dict "field" "browserUrl" "pattern" "(^|[^a-zA-Z0-9_])browserUrl([[:space:]]*:|[^a-zA-Z0-9_]|$)" "hint" "replace browserUrl with portalUrl (or deprecatedPortalUrl in scheduler.jsonnet)")
      (dict "field" "adminHttpServers" "hint" "replace adminHttpServers with deprecatedAdminHttpServers")
      (dict "field" "adminRoutePrefix" "hint" "replace adminRoutePrefix with deprecatedAdminRoutePrefix (or remove it)")
      (dict "field" "legacyContentAddressableStorage" "hint" "replace legacyContentAddressableStorage with contentAddressableStorage (using the CDC { chunkStorage, chunkMappingStorage, cdcParameterCache } shape)")
      (dict "field" "zstdPool" "excludedFiles" (list "storage.jsonnet" "frontend.jsonnet" "portal.jsonnet") "hint" "remove zstdPool (removed from scheduler, worker, and remote-asset configurations; still supported by bb-storage and bb-portal)")
      (dict "field" "instanceNameAuthorizer" "configFiles" (list "portal.jsonnet") "hint" "remove instanceNameAuthorizer and configure per-service authorizers (readAuthorizer / publishAuthorizer)")
      (dict "field" "enableGraphqlPlayground" "configFiles" (list "portal.jsonnet") "hint" "remove enableGraphqlPlayground (replaced by graphqlApiServiceConfiguration)")
      (dict "field" "databaseCleanupConfiguration" "configFiles" (list "portal.jsonnet") "hint" "move database cleanup settings under top-level database.cleanupConfiguration") -}}
{{- range $rule := $removedCdcFields -}}
{{- if not (hasKey $rule "pattern") -}}
{{- $_ := set $rule "pattern" (include "buildbarn.cdc.keyPattern" $rule.field) -}}
{{- end -}}
{{- end -}}
{{- /* Escape hatches. The text scan matches patterns and cannot evaluate
       jsonnet, and the live checks need list access the installer may not
       have; each one can be turned off on its own. */ -}}
{{- $upgradeChecks := default (dict) $.Values.upgradeChecks -}}
{{- $skipConfigTextCheck := index $upgradeChecks "skipConfigTextCheck" -}}
{{- $skipWorkerChecks := or (not $full) (index $upgradeChecks "skipWorkerChecks") -}}
{{- $casKey := include "buildbarn.cdc.keyPattern" "contentAddressableStorage" -}}
{{- $casServerKey := include "buildbarn.cdc.keyPattern" "contentAddressableStorageServer" -}}
{{- /* Evidence that a contentAddressableStorage definition is the CDC message:
       it sets one of the fields only that message has, or it delegates to the
       chart's common.blobstore.contentAddressableStorage. */ -}}
{{- $cdcShape := printf "(%s|common\\.blobstore\\.contentAddressableStorage)" (include "buildbarn.cdc.keyPattern" "(chunkStorage|chunkMappingStorage|chunkMappingCache|cdcParameterCache|chunkCache)") -}}
{{- if not $skipConfigTextCheck -}}
{{- range $name, $content := default (dict) $.Values.configOverrides -}}
{{- if and (or $full (has $name (list "common.libsonnet" "storage.jsonnet"))) (or $manageStorage (ne $name "storage.jsonnet")) -}}
{{- $text := include "buildbarn.cdc.stripComments" $content -}}
{{- range $rule := $removedCdcFields -}}
{{- $inScope := and (or (not (hasKey $rule "configFiles")) (has $name $rule.configFiles)) (or (not (hasKey $rule "excludedFiles")) (not (has $name $rule.excludedFiles))) -}}
{{- if and $inScope (regexMatch $rule.pattern $text) -}}
{{- fail (printf "configOverrides[%q] contains pre-CDC field %q which is rejected by the CDC Buildbarn binaries: %s; see %s" $name $rule.field $rule.hint $cdcGuide) -}}
{{- end -}}
{{- end -}}
{{- if and (has $name (list "storage.jsonnet" "frontend.jsonnet" "portal.jsonnet")) (regexMatch $casKey $text) (not (regexMatch $casServerKey $text)) -}}
{{- fail (printf "configOverrides[%q] uses pre-CDC top-level field \"contentAddressableStorage\"; rename it to \"contentAddressableStorageServer\" with chunkStorage and chunkMappingStorage; see %s" $name $cdcGuide) -}}
{{- end -}}
{{- if and (has $name (list "storage.jsonnet" "frontend.jsonnet" "portal.jsonnet")) (regexMatch $casServerKey $text) (regexMatch $casKey $text) (not (regexMatch $cdcShape $text)) -}}
{{- fail (printf "configOverrides[%q] defines contentAddressableStorageServer with a single-store \"contentAddressableStorage\" missing \"chunkStorage\"; update it to the CDC { chunkStorage, chunkMappingStorage } shape; see %s" $name $cdcGuide) -}}
{{- end -}}
{{- if eq $name "frontend.jsonnet" -}}
{{- $graceKey := include "buildbarn.cdc.keyPattern" "stopGracefully" -}}
{{- if or (not (regexMatch (printf "%s[[:space:]]*true([[:space:],}]|$)" $graceKey) $text)) (regexMatch (printf "%s[[:space:]]*false([[:space:],}]|$)" $graceKey) $text) -}}
{{- fail "configOverrides[\"frontend.jsonnet\"] must set stopGracefully: true on every grpcServers entry to preserve active RPCs during rollout; for an evaluated Jsonnet expression, verify every server and set upgradeChecks.skipConfigTextCheck=true" -}}
{{- end -}}
{{- end -}}
{{- if and (has $name (list "common.libsonnet" "scheduler.jsonnet" "asset.jsonnet")) (regexMatch $casKey $text) (not (regexMatch $cdcShape $text)) -}}
{{- fail (printf "configOverrides[%q] defines a pre-CDC single-store \"contentAddressableStorage\" without \"chunkStorage\"; update it to the CDC { chunkStorage, chunkMappingStorage, cdcParameterCache } shape; see %s" $name $cdcGuide) -}}
{{- end -}}
{{- if and (eq $name "browser.jsonnet") (regexMatch "blobstore[[:space:]]*:[[:space:]]*common\\.blobstore([^a-zA-Z0-9_.]|$)" $text) -}}
{{- fail (printf "configOverrides[\"browser.jsonnet\"] passes CDC common.blobstore directly to pre-CDC bb-browser; point contentAddressableStorage at frontend-internal:8980 and actionCache at common.blobstore.actionCache; see %s" $cdcGuide) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $full (eq $router.mode "custom") $router.custom -}}
{{- $routerText := include "buildbarn.cdc.stripComments" $router.custom -}}
{{- range $rule := $removedCdcFields -}}
{{- $inScope := and (or (not (hasKey $rule "configFiles")) (has "scheduler.jsonnet" $rule.configFiles)) (or (not (hasKey $rule "excludedFiles")) (not (has "scheduler.jsonnet" $rule.excludedFiles))) -}}
{{- if and $inScope (regexMatch $rule.pattern $routerText) -}}
{{- fail (printf "scheduler.actionRouter.custom contains pre-CDC field %q which is rejected by the CDC Buildbarn binaries: %s" $rule.field $rule.hint) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $ns := include "buildbarn.namespace" . -}}
{{- if and .Release.IsUpgrade $.Values._testLookup -}}
{{- fail "_testLookup is reserved for offline chart unit tests and cannot be set during helm upgrade" -}}
{{- end -}}
{{- $mockLookup := default (dict) $.Values._testLookup -}}
{{- /* Claim-template preflight. Kubernetes forbids changing a StatefulSet's
       volumeClaimTemplates, and Helm patches every other object of the release
       before that one patch is refused. Compare the live StatefulSet with the
       render and stop here, before anything is applied. Nothing is checked
       when there is no live StatefulSet (first install, offline render, or
       after the StatefulSet was deleted for recreation). */ -}}
{{- if and $manageStorage (not (index (default (dict) $.Values.upgradeChecks) "skipStorageClaimTemplateCheck")) -}}
{{- $liveStorage := dict -}}
{{- if hasKey $mockLookup "statefulSets" -}}
{{- range $sts := default (list) (index (default (dict) (index $mockLookup "statefulSets")) "items") -}}
{{- if eq (toString (index (default (dict) (index $sts "metadata")) "name")) $storageName -}}
{{- $liveStorage = $sts -}}
{{- end -}}
{{- end -}}
{{- else -}}
{{- $liveStorage = default (dict) (lookup "apps/v1" "StatefulSet" $ns $storageName) -}}
{{- end -}}
{{- if $liveStorage -}}
{{- $renderedClaims := dict "claims" (list) -}}
{{- if eq $.Values.storage.persistence.mode "pvc" -}}
{{- $renderedClaims = fromYaml (printf "claims:\n%s" (include "buildbarn.storage.volumeClaimTemplates" $)) -}}
{{- end -}}
{{- /* An unparsable render is reported by the StatefulSet template itself. */ -}}
{{- if not (hasKey $renderedClaims "Error") -}}
{{- $claimDifferences := include "buildbarn.storage.claimTemplateDifferences" (dict "live" (index (default (dict) (index $liveStorage "spec")) "volumeClaimTemplates") "rendered" (index $renderedClaims "claims")) | fromJsonArray -}}
{{- if $claimDifferences -}}
{{- fail (printf "live StatefulSet %s/%s has different volumeClaimTemplates than this release renders: %s. Kubernetes forbids changing volumeClaimTemplates in place, and Helm applies every other object of the release before that patch is refused, which leaves the release half-applied on the old StatefulSet. Stop storage first (scale statefulset/%s to 0 and wait for its pods to terminate), run `kubectl delete statefulset %s --namespace %s --cascade=orphan`, then run this upgrade again so the StatefulSet is recreated with the rendered templates. Existing PersistentVolumeClaims are kept as they are: a changed class or size only applies to claims that do not exist yet. The same recreation is needed when rolling back to a revision whose claim templates differ; helm rollback does not run this check. Set upgradeChecks.skipStorageClaimTemplateCheck=true to skip it. See %s" $ns $storageName (join "; " $claimDifferences) $storageName $storageName $ns $recreateGuide) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $skipWorkerChecks -}}
{{- $configMaps := default (lookup "v1" "ConfigMap" $ns "") (index $mockLookup "configMaps") -}}
{{- $configMapsByName := dict -}}
{{- range $cm := default (list) (index (default (dict) $configMaps) "items") -}}
{{- $_ := set $configMapsByName $cm.metadata.name $cm -}}
{{- end -}}
{{- /* A ConfigMap this release renders through extraObjects replaces its live
       copy in this upgrade (or is created by it), so the worker checks below
       read the rendered data: what workers will mount, not what they mount
       now. A live pre-CDC copy then cannot block the upgrade that migrates it,
       and a rendered pre-CDC copy is still refused. One entry may hold several
       YAML documents or a List; Helm applies all of them, so read all of them. */ -}}
{{- $releaseConfigMaps := dict -}}
{{- range $object := .Values.extraObjects -}}
{{- range $document := regexSplit "(?m)^---[ \\t\\r]*(#.*)?$" (include "buildbarn.tplvalues.render" (dict "value" $object "context" $)) -1 -}}
{{- $parsed := fromYaml $document -}}
{{- $candidates := list $parsed -}}
{{- if and (hasSuffix "List" (toString (default "" (index $parsed "kind")))) (kindIs "slice" (index $parsed "items")) -}}
{{- $candidates = index $parsed "items" -}}
{{- end -}}
{{- range $rendered := $candidates -}}
{{- if kindIs "map" $rendered -}}
{{- $renderedMeta := default (dict) (index $rendered "metadata") -}}
{{- $renderedName := toString (default "" (index $renderedMeta "name")) -}}
{{- if and (eq (toString (default "" (index $rendered "kind"))) "ConfigMap") $renderedName (eq (toString (default $ns (index $renderedMeta "namespace"))) $ns) -}}
{{- $_ := set $configMapsByName $renderedName $rendered -}}
{{- $_ := set $releaseConfigMaps $renderedName true -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $chartConfigNames := list (include "buildbarn.configName" $) (include "buildbarn.workerConfigName" $) -}}
{{- $referencedConfigMaps := dict -}}
{{- $rbeWorkers := dict -}}
{{- if index $mockLookup "rbeWorkers" -}}
{{- $rbeWorkers = index $mockLookup "rbeWorkers" -}}
{{- else if .Capabilities.APIVersions.Has "bb.hermetiq.com/v1/RbeWorker" -}}
{{- $rbeWorkers = lookup "bb.hermetiq.com/v1" "RbeWorker" $ns "" -}}
{{- end -}}
{{- $rbeWorkerItems := default (list) (index (default (dict) $rbeWorkers) "items") -}}
{{- range $worker := $rbeWorkerItems -}}
{{- $wName := (default (dict) $worker.metadata).name | default "<unknown>" -}}
{{- $wSpec := default (dict) $worker.spec -}}
{{- $wConfig := default (dict) $wSpec.config -}}
{{- $refName := "" -}}
{{- $refItems := list -}}
{{- if $wConfig.files -}}
{{- $refName = default "" $wConfig.files.configMapName -}}
{{- $refItems = default (list) $wConfig.files.items -}}
{{- else if $wConfig.generated -}}
{{- $refName = default "" $wConfig.generated.commonConfigMapName -}}
{{- $refItems = default (list (dict "key" "common.libsonnet" "path" "common.libsonnet")) $wConfig.generated.commonItems -}}
{{- end -}}
{{- $refData := dict -}}
{{- if and $refName (not (has $refName $chartConfigNames)) -}}
{{- if not (hasKey $configMapsByName $refName) -}}
{{- fail (printf "live RbeWorker %s/%s references missing ConfigMap %q; restore and migrate that configuration before upgrading the buildbarn chart" $ns $wName $refName) -}}
{{- end -}}
{{- $refData = default (dict) (index $configMapsByName $refName).data -}}
{{- $selected := default (dict "all" false "keys" (dict)) (index $referencedConfigMaps $refName) -}}
{{- if not $refItems -}}
{{- $_ := set $selected "all" true -}}
{{- end -}}
{{- range $item := $refItems -}}
{{- $_ := set $selected.keys $item.key true -}}
{{- end -}}
{{- $_ := set $referencedConfigMaps $refName $selected -}}
{{- end -}}
{{- $wImages := default (dict) $wSpec.images -}}
{{- $installerEnabled := ne (default "" (default (dict) $wSpec.docker).mode) "sysbox" -}}
{{- $runner := default (dict) $wSpec.runner -}}
{{- if and (hasKey $runner "installerEnabled") (not (kindIs "invalid" $runner.installerEnabled)) -}}
{{- $installerEnabled = $runner.installerEnabled -}}
{{- end -}}
{{- range $imgField, $imgVal := dict
      "spec.images.worker" (default (default "" (index $refData "workerImage")) (index $wImages "worker"))
      "spec.images.runnerInstaller" (default (default "" (index $refData "runnerInstallerImage")) (index $wImages "runnerInstaller")) -}}
{{- if and (or $installerEnabled (not (contains "runnerInstaller" $imgField))) $imgVal (include "buildbarn.cdc.preCdcImage" $imgVal) -}}
{{- fail (printf "live RbeWorker %s/%s pins pre-CDC image %q in %s (including ConfigMap image defaults); remove the pin so the worker inherits buildbarn-worker-config's CDC image or update it to >= 20261102T before upgrading the buildbarn chart" $ns $wName ($imgVal | toString) $imgField) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* Live ConfigMaps, with release-rendered replacements and additions.
       A ConfigMap is read when an RbeWorker references it. One that nothing
       references is still read when it looks like a worker configuration (the
       hermetiq.com/worker-pool label or a name ending in -worker-config) and
       the operator does not own it; the message then says why it was picked. */ -}}
{{- range $cmKey, $cm := $configMapsByName -}}
{{- $cmMeta := default (dict) $cm.metadata -}}
{{- $cmName := $cmMeta.name | default "" -}}
{{- $cmLabels := default (dict) $cmMeta.labels -}}
{{- $isChartCm := has $cmName $chartConfigNames -}}
{{- $isReferenced := hasKey $referencedConfigMaps $cmName -}}
{{- $selected := default (dict "all" true "keys" (dict)) (index $referencedConfigMaps $cmName) -}}
{{- $isOperatorOwned := false -}}
{{- range $owner := default (list) $cmMeta.ownerReferences -}}
{{- if eq (default "" $owner.kind) "RbeWorker" -}}{{- $isOperatorOwned = true -}}{{- end -}}
{{- end -}}
{{- $selectedBy := "" -}}
{{- if and (not $isReferenced) (not $isOperatorOwned) -}}
{{- if hasKey $cmLabels "hermetiq.com/worker-pool" -}}
{{- $selectedBy = "its hermetiq.com/worker-pool label" -}}
{{- else if hasSuffix "-worker-config" $cmName -}}
{{- $selectedBy = "its name ending in -worker-config" -}}
{{- end -}}
{{- end -}}
{{- if and (not $isChartCm) (or $isReferenced $selectedBy) -}}
{{- $cmOrigin := ternary "release-rendered" "live" (hasKey $releaseConfigMaps $cmName) -}}
{{- $cmRemedy := ternary "migrate it in the release values (extraObjects) before upgrading the buildbarn chart" "migrate the ConfigMap before upgrading the buildbarn chart" (hasKey $releaseConfigMaps $cmName) -}}
{{- if $selectedBy -}}
{{- $cmRemedy = printf "%s. No RbeWorker references this ConfigMap; it was selected by %s. If it is not a worker configuration (for example a backup copy), rename it or keep it outside this namespace" $cmRemedy $selectedBy -}}
{{- end -}}
{{- range $fName, $fContent := default (dict) $cm.data -}}
{{- if or $selected.all (hasKey $selected.keys $fName) -}}
{{- $fText := include "buildbarn.cdc.stripComments" $fContent -}}
{{- if not $skipConfigTextCheck -}}
{{- range $rule := $removedCdcFields -}}
{{- $inScope := and (or (not (hasKey $rule "configFiles")) (has $fName $rule.configFiles)) (or (not (hasKey $rule "excludedFiles")) (not (has $fName $rule.excludedFiles))) -}}
{{- if and $inScope (regexMatch $rule.pattern $fText) -}}
{{- fail (printf "%s worker ConfigMap %s/%s data[%q] contains pre-CDC field %q (%s); %s" $cmOrigin $ns $cmName $fName $rule.field $rule.hint $cmRemedy) -}}
{{- end -}}
{{- end -}}
{{- if and (regexMatch $casKey $fText) (not (regexMatch $cdcShape $fText)) -}}
{{- fail (printf "%s worker ConfigMap %s/%s data[%q] defines a pre-CDC single-store contentAddressableStorage without chunkStorage; %s" $cmOrigin $ns $cmName $fName $cmRemedy) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* Neither the worker operator nor Hermetiq is checked. Both are upgraded
       with this chart: an operator older than v1.0.0 generates pre-CDC worker
       configuration, which shows up as crash-looping worker pools, and
       Hermetiq 1.0.0 reads the CDC schema only. */ -}}
{{- /* External-storage preflight. With storage.enabled=false this upgrade
       deletes any storage StatefulSet the release still owns and rewrites
       every client to dial storage.name with storage.replicas shards, so check
       the target before anything is applied: it must exist, belong to another
       release (or to none), and run the same number of shards. A missing ring
       or a wrong name is a full outage; a replica mismatch sends part of the
       keyspace to shards that do not exist. An offline render (helm template,
       client-side dry run) has no list result and checks nothing. */ -}}
{{- if and $full (not $manageStorage) (not (index $upgradeChecks "skipExternalStorageCheck")) -}}
{{- $statefulSets := dict -}}
{{- if hasKey $mockLookup "statefulSets" -}}
{{- $statefulSets = default (dict) (index $mockLookup "statefulSets") -}}
{{- else -}}
{{- $statefulSets = default (dict) (lookup "apps/v1" "StatefulSet" $ns "") -}}
{{- end -}}
{{- if hasKey $statefulSets "items" -}}
{{- $target := dict -}}
{{- range $sts := default (list) (index $statefulSets "items") -}}
{{- if eq (toString (index (default (dict) (index $sts "metadata")) "name")) $storageName -}}
{{- $target = $sts -}}
{{- end -}}
{{- end -}}
{{- $skipHint := "Set upgradeChecks.skipExternalStorageCheck=true to skip this check" -}}
{{- if not $target -}}
{{- fail (printf "storage.enabled=false points every client at StatefulSet %s/%s, which does not exist. Install the storage-only release first (deploymentMode=storage-only, storage.name=%s) and wait for its pods, or correct storage.name. %s" $ns $storageName $storageName $skipHint) -}}
{{- end -}}
{{- $targetMeta := default (dict) (index $target "metadata") -}}
{{- $annotations := default (dict) (index $targetMeta "annotations") -}}
{{- if and (eq (toString (index $annotations "meta.helm.sh/release-name")) $.Release.Name) (eq (toString (index $annotations "meta.helm.sh/release-namespace")) $.Release.Namespace) -}}
{{- fail (printf "storage.enabled=false targets StatefulSet %s/%s, which this release (%s) owns: the upgrade would delete it and leave every client without storage. Set storage.name to the StatefulSet of the storage-only release. %s" $ns $storageName $.Release.Name $skipHint) -}}
{{- end -}}
{{- $targetSpec := default (dict) (index $target "spec") -}}
{{- $liveReplicas := 1 -}}
{{- if hasKey $targetSpec "replicas" -}}
{{- $liveReplicas = int (index $targetSpec "replicas") -}}
{{- end -}}
{{- if ne $liveReplicas (int $.Values.storage.replicas) -}}
{{- fail (printf "storage.replicas is %d but StatefulSet %s/%s is set to %d replicas. Clients shard by storage.replicas, so a mismatch sends part of the keyspace to shards that do not exist or leaves shards unused. Set storage.replicas to the storage-only release's value. %s" (int $.Values.storage.replicas) $ns $storageName $liveReplicas $skipHint) -}}
{{- end -}}
{{- end -}}
{{- end -}}
