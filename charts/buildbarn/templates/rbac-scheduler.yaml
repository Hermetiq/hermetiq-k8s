{{- if .Values.scheduler.handover.enabled }}
{{- $ns := include "buildbarn.namespace" . -}}
{{- $saName := "scheduler" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
    {{- include "buildbarn.componentLabel" (dict "component" "scheduler") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "buildbarn.commonAnnotations" $ | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
    {{- include "buildbarn.componentLabel" (dict "component" "scheduler") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "buildbarn.commonAnnotations" $ | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ $ns }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
    {{- include "buildbarn.componentLabel" (dict "component" "scheduler") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "buildbarn.commonAnnotations" $ | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
{{- end }}
