{{- if and .Values.browser.oauth2Proxy.enabled (not .Values.browser.oauth2Proxy.client.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildbarn.oauth2ProxySecretName" . }}
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_ID: {{ required "browser.oauth2Proxy.client.clientId or existingSecret is required when oauth2Proxy is enabled" .Values.browser.oauth2Proxy.client.clientId | quote }}
  OAUTH2_PROXY_CLIENT_SECRET: {{ required "browser.oauth2Proxy.client.clientSecret or existingSecret is required when oauth2Proxy is enabled" .Values.browser.oauth2Proxy.client.clientSecret | quote }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ required "browser.oauth2Proxy.client.cookieSecret or existingSecret is required when oauth2Proxy is enabled" .Values.browser.oauth2Proxy.client.cookieSecret | quote }}
{{- end }}
