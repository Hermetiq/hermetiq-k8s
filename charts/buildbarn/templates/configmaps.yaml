{{- $root := . -}}
{{- /* Validate configOverrides keys against actual chart files. */ -}}
{{- $configOverrides := default dict .Values.configOverrides -}}
{{- $configValid := dict -}}
{{- range $path, $_ := .Files.Glob "files/config/*" -}}
  {{- $_ := set $configValid (base $path) true -}}
{{- end -}}
{{- range $name, $_ := $configOverrides -}}
  {{- if not (hasKey $configValid $name) -}}
    {{- fail (printf "configOverrides[%q]: no such file in chart files/config/. Valid keys: %v" $name (keys $configValid | sortAlpha)) -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "buildbarn.configName" . }}
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/config/*" }}
{{- $name := base $path -}}
{{- $override := index $configOverrides $name | default "" }}
  {{ $name }}: |-
{{- if $override }}
{{ $override | nindent 4 }}
{{- else }}
{{ tpl ($root.Files.Get $path) $root | nindent 4 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "buildbarn.workerConfigName" . }}
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
data:
{{- /* RbeWorker pods use the shared common.libsonnet; the operator generates
       their worker and runner configs. Honor configOverrides so an override
       propagates to both ConfigMaps consistently. */ -}}
{{- $commonOverride := index $configOverrides "common.libsonnet" | default "" }}
  common.libsonnet: |-
{{- if $commonOverride }}
{{ $commonOverride | nindent 4 }}
{{- else }}
{{ tpl (.Files.Get "files/config/common.libsonnet") . | nindent 4 }}
{{- end }}
{{- if and .Values.browser.oauth2Proxy.enabled (not .Values.browser.oauth2Proxy.existingConfigMap) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "buildbarn.oauth2ProxyConfigName" . }}
  namespace: {{ include "buildbarn.namespace" . }}
  labels:
    {{- include "buildbarn.labels" . | nindent 4 }}
data:
{{- include "buildbarn.oauth2ProxyConfigData" . | nindent 2 }}
{{- end }}
