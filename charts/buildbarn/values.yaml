# By default this chart renders all namespaced resources into hermetiq.
namespaceOverride: hermetiq
createNamespace: false

global:
  imageRegistry: ""
  imagePullSecrets: []

imagePullSecrets: []

commonLabels: {}
# Additional labels applied to every chart-managed Pod. Built-in identity,
# selector, and metrics labels cannot be overridden. Changing these labels
# rolls workloads.
podLabels: {}
commonAnnotations: {}
extraObjects: []

standardLabels:
  appVersion: false

serviceAccount:
  # Set to true/false to apply a pod-level ServiceAccount token mount default
  # across chart workloads. Leave null to preserve Kubernetes/default-SA behavior.
  automountServiceAccountToken: null

# Per-file overrides for the jsonnet configs in charts/buildbarn/files/config/.
# Keys MUST match a filename present in that directory; an unknown key fails
# `helm template` with the list of valid filenames. The value REPLACES that
# file VERBATIM in the rendered ConfigMap — Helm templating is NOT applied,
# so what you write is exactly what lands in the ConfigMap.
#
# Recommended use: copy a chart default as a starting point, customize, then
# load via `--set-file`:
#
#   helm install ... \
#     --set-file 'configOverrides.frontend\.jsonnet'=./my-frontend.jsonnet
#
# The chart's frontend.jsonnet and storage.jsonnet currently use Helm
# templating (JWKS, OTEL endpoint, storage block size). If you override
# either, you take responsibility for those features — inline the values
# you need directly in your override.
configOverrides: {}

# Same pattern for files in charts/buildbarn/files/worker-config/.
workerConfigOverrides: {}

project:
  id: "0" # hermetiq project ID (from bootstrap DB job)

# Shared Buildbarn configuration knobs templated into files/config/*.
config:
  # Maximum gRPC message size in bytes, applied across all Buildbarn components
  # via common.libsonnet (frontend, storage, scheduler, browser, workers,
  # remote asset). Large unary payloads (BatchUpdateBlobs, Tree messages) must
  # fit under this limit; streaming ByteStream traffic is unaffected.
  maximumMessageSizeBytes: 10485760 # 10 MiB
  actionCache:
    # Hide ActionResults whose ExecutedActionMetadata.worker_completed_timestamp
    # is older than minimumValidity (+ jitter), so every target is rebuilt
    # periodically. This is a FRESHNESS knob, not a correctness one: it surfaces
    # non-hermetic actions and inputs that are not really part of the action key
    # (a moved base-image tag, a repo rule that fetches from the network).
    #
    # It is NOT what protects you from ActionResults referencing CAS blobs that
    # have been evicted — completenessChecking (always rendered on the AC) does
    # that by verifying every referenced blob still exists before returning a
    # hit. You can leave this disabled and still be correct.
    #
    # Renders as blobstore.actionCache.actionResultExpiring wrapping
    # completenessChecking in common.libsonnet.
    actionResultExpiring:
      enabled: false
      # Floor on entry lifetime. Set this comfortably BELOW how long the CAS
      # actually retains blobs, or you pay re-execution for entries whose
      # outputs were still present. Derive CAS retention from the eviction rate:
      #   retention ≈ (oldBlocks+currentBlocks+newBlocks) x blockBytes / bytesPerDay
      # `bytesPerDay` comes from the blob_access Put counters; a store whose
      # block_allocator_releases_total is still 0 has not evicted anything yet
      # and its retention is unbounded so far.
      minimumValidity: 2592000s # 30d
      # Spreads expiry so a batch of ActionResults written by one large build
      # does not all expire in the same instant and stampede the scheduler.
      # Effective lifetime is minimumValidity + jitter, where jitter is derived
      # deterministically from the ActionResult's own worker_completed_timestamp
      # (bb-storage: `uint64(t.Unix()) * 0x936a0d2a41e8c779 % jitter`). Repeated
      # lookups of one entry therefore agree on its expiry, though entries that
      # completed in the same second share a jitter value — the spread comes from
      # a build spanning many seconds.
      #
      # MUST BE NONZERO when enabled: that expression takes a modulo by this
      # value, so 0s panics with an integer divide-by-zero on the first AC hit.
      # Enforced in templates/validate.yaml.
      maximumValidityJitter: 259200s # 3d
      # Emergency AC flush: ActionResults completed before this RFC3339 instant
      # are hidden regardless of minimumValidity. Bumping it to "now" invalidates
      # the entire Action Cache, so treat it as a break-glass control rather than
      # routine configuration.
      #
      # Empty => the Unix epoch, NOT an omitted field. bb-storage validates this
      # field unconditionally and refuses to start on a nil Timestamp
      # ("Invalid minimum timestamp: proto: invalid nil Timestamp"), so the chart
      # always renders it. The epoch is the identity value: every ActionResult
      # with a real worker_completed_timestamp clears it.
      minimumTimestamp: ""

images:
  storage:
    repository: ghcr.io/buildbarn/bb-storage
    tag: 20260814T085338Z-fffe73b
    digest: ""
    pullPolicy: IfNotPresent
  scheduler:
    repository: ghcr.io/buildbarn/bb-scheduler
    tag: 20260814T085403Z-13313e6
    digest: ""
    pullPolicy: IfNotPresent
  browser:
    repository: ghcr.io/buildbarn/bb-browser
    tag: 20260415t065533z-ee35c54
    digest: ""
    pullPolicy: IfNotPresent
  remoteAsset:
    repository: ghcr.io/buildbarn/bb-remote-asset
    tag: 20260817T230958Z-b6e412b
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/buildbarn/bb-worker
    tag: 20260814T085403Z-13313e6
    digest: ""
    pullPolicy: IfNotPresent
  runnerInstaller:
    repository: ghcr.io/buildbarn/bb-runner-installer
    tag: 20260814T085403Z-13313e6
    digest: ""
    pullPolicy: IfNotPresent
  runnerUbuntu2204:
    image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:5f9c35c25db1d51a8ddaae5c0ba8d3c163c5e9a4a6cc97acd409ac7eae239448
    pullPolicy: IfNotPresent
  # Runner for the Testcontainers worker fleet. Defaults to the same image as
  # runnerUbuntu2204; kept separate to allow divergence (e.g., a runner image
  # that bundles a `docker` CLI for actions that shell out to it directly).
  runnerTestcontainers:
    image: ghcr.io/catthehacker/ubuntu:act-22.04@sha256:5f9c35c25db1d51a8ddaae5c0ba8d3c163c5e9a4a6cc97acd409ac7eae239448
    pullPolicy: IfNotPresent
  # Sysbox runner image for the separate Testcontainers Sysbox worker fleet.
  # Must include Docker Engine/CLI and an entrypoint that starts dockerd before
  # execing the bb_runner command passed by the Deployment.
  runnerTestcontainersSysbox:
    image: ""
    pullPolicy: IfNotPresent
  # Docker-in-Docker sidecar image for the Testcontainers worker fleet.
  dind:
    repository: docker
    tag: 27.3.1-dind
    digest: ""
    pullPolicy: IfNotPresent
  busybox:
    image: busybox:1.31.1-uclibc
    pullPolicy: IfNotPresent
  oauth2Proxy:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.1
    digest: ""
    pullPolicy: IfNotPresent
  # Hermetiq grpc-cache-proxy sidecar for the frontend (frontend.grpcCacheProxy).
  # Released public image; no imagePullSecret is required.
  grpcCacheProxy:
    repository: us-docker.pkg.dev/hermetiq-cloud/hermetiq-public/grpc-cache-proxy
    tag: v0.9.0
    digest: ""
    pullPolicy: IfNotPresent
  # bb-portal build-event dashboard (portal.enabled). One image: the Go binary
  # serves the embedded web UI, the gRPC-Web APIs, and the BES gRPC endpoint.
