secrets:
  mtlsClientCert: client-mtls

hosts:
  # All buildbarn host DNS names derive from this base (browser.<domainBase>,
  # bb.<domainBase>, rbe-web.<domainBase>, asset.<domainBase>). Override individual hosts below if needed.
  domainBase: helm.hermetiq.dev
  browser: ""
  frontendGrpc: ""
  rbeWeb: ""
  remoteAsset: ""
  # bb-portal hosts (portal.<domainBase> / bes.<domainBase> when empty).
  portal: ""
  bes: ""
  # External hosts (different domain — set explicitly).
  otel: otel.cloud-grpc.hermetiq.io

bbcal:
  address: bep-nats-pub.hermetiq.svc.cluster.local:50091

security:
  # Pod and container securityContext for every workload except storage, which
  # keeps its own because it adapts to storage.persistence. Together they meet
  # the CIS Kubernetes Benchmark v2.0.1 and Pod Security Standards
  # "restricted"; containers also always get privileged: false. Set runAsUser
  # or runAsGroup to null to let the platform assign them, e.g. OpenShift's
  # restricted-v2 SCC. fsGroup is unset unless you add it.
  pod:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  container:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    dropCapabilities:
      - ALL
  # Mutual TLS on the gRPC hops BETWEEN Buildbarn services inside the cluster.
  #
  # mTLS is four settings, not one, and they live in two different protobuf
  # messages. The dialling side needs `tls.clientKeyPair`; the listening side
  # needs `tls.serverKeyPair`; and because tls.ServerConfiguration has only
  # serverKeyPair and cipherSuites — there is no client-CA field anywhere in it
  # — the listening side needs a SEPARATE `authenticationPolicy:
  # { tlsClientCertificate: ... }` to check who is calling. A server given
  # `tls` alone does one-way TLS: encrypted, caller never verified.
  #
  # This block renders all four, at both ends of every in-cluster hop the chart
  # generates, from one switch:
  #   storage   :8981  <- frontend, scheduler, workers, browser, asset, portal
  #   scheduler :8982  <- frontend
  #   scheduler :8983  <- workers
  #   scheduler :8984  <- portal
  # It does NOT touch the frontend's own :8980, which faces Bazel rather than
  # another Buildbarn service; that endpoint is normally terminated at the
  # gateway (see certificate/tls above) and its callers are authenticated by
  # frontend.jwks.
  grpcMtls:
    enabled: false
    # Key pair every Buildbarn pod presents, as both server and client.
    # cert-manager's Certificate writes tls.crt / tls.key / ca.crt into one
    # Secret, which is why the same mount serves all three paths below.
    #
    # The certificate must carry a SAN for every in-cluster name the chart
    # dials, or the peer rejects it by name rather than by CA:
    #   <storage.name>-<i>.<storage.name>.<namespace>   for i in 0..storage.replicas-1
    #   scheduler
    # A dnsNames list covering those, plus `scheduler.<namespace>.svc` style
    # aliases if you dial them elsewhere, is enough.
    secretName: buildbarn-mtls
    mountPath: /etc/buildbarn/mtls
    certificatePath: tls.crt
    privateKeyPath: tls.key
    # Only the `files` key-pair arm re-reads from disk, and only if this is set.
    # Without it the process reads the pair once at startup and a rotated
    # certificate does nothing until the pod restarts.
    refreshInterval: 20000s
    # PEM for the CA that signed both ends. Set exactly one of:
    #   certificateAuthorities      the PEM itself, rendered into the ConfigMap.
    #                               A CA certificate is public, so this is safe,
    #                               and it keeps the config evaluable offline.
    #   certificateAuthoritiesFile  an absolute path read with jsonnet importstr
    #                               at process start, e.g.
    #                               /etc/buildbarn/mtls/ca.crt from the Secret
    #                               above. Read once; rotating the CA needs a
    #                               restart.
    certificateAuthorities: ""
    certificateAuthoritiesFile: ""
    # JMESPath over the peer's subject alt names — the context is
    # {dnsNames, emailAddresses, uris}. This is what turns a valid certificate
    # into an IDENTITY: the default admits every holder of a CA-signed
    # certificate, so any workload issued a cert by the same CA can impersonate
    # any Buildbarn service. Narrow it once your SANs are settled, e.g.
    #   "contains(dnsNames, 'scheduler')"
    # A failure here returns UNAUTHENTICATED, not PERMISSION_DENIED: this is
    # authentication, and authorization stays in the authorizer fields.
    validationExpression: "`true`"
    # JMESPath producing a buildbarn.auth.AuthenticationMetadata from the same
    # context. "`{}`" extracts nothing, which is what you want unless an
    # authorizer downstream reads these attributes.
    metadataExtractionExpression: "`{}`"
    # Restricts the TLS 1.2 cipher suites on both halves. Empty keeps the Go
    # defaults, which is the right answer unless a policy says otherwise.
    cipherSuites: []

tracing:
  # Enables shared Buildbarn OTel tracing for storage, frontend, scheduler,
  # browser, workers, runners, and the optional remote asset service.
  enabled: false
  nodeLocal:
    # When enabled, spans are exported to K8S_LOCAL_NODE_IP:port.
    enabled: true
    port: 4317
  # Used when nodeLocal.enabled=false.
  endpoint: ""
  tls:
    enabled: false
    # Defaults to hosts.otel when empty.
    serverName: ""
    clientCertificate:
      enabled: false
      # Defaults to secrets.mtlsClientCert when empty.
      secretName: ""
      mountPath: /etc/tracing-mtls-client-cert
      certificatePath: tls.crt
      privateKeyPath: tls.key
      refreshInterval: 20000s
  batchSpanProcessor:
    batchTimeout: 10s
    exportTimeout: 30s
    maxExportBatchSize: 1024
    maxQueueSize: 4096
  sampler:
    parentBasedMaximumRate:
      samplesPerEpoch: 5
      epochDuration: 1s

routing:
  # Set false to skip all chart-managed external routing resources, including
  # Gateway/HTTPRoute/GRPCRoute, Contour HTTPProxy, Ingress, route TLS
  # Certificates, Envoy Gateway policies, and GKE Gateway policies. Internal
  # Services are still rendered so you can supply your own routing
  # implementation.
  enabled: true
  # Supported providers: contour, gateway, gateway-httproute-only, ingress, none.
  # Use gateway-httproute-only for GKE Gateway, which supports HTTPRoute but
  # not GRPCRoute. Use gateway for Envoy Gateway and other GRPCRoute-capable
  # Gateway API controllers.
  # Set provider to none as an alternative to routing.enabled=false.
  # Only the selected provider's resources are rendered. The per-provider
  # enabled flags below (ingress.enabled, httpProxy.enabled, gateway.enabled)
  # control sub-resources within that provider — you do not need to disable
  # the other providers.
  provider: contour

k8sNodeScheduling:
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  tolerations: []

storage:
  # False leaves storage ownership with another release, but clients still use
  # name and replicas below. The old StatefulSet is removed on Helm upgrade;
  # its PVCs are retained by Kubernetes and must be cleaned up manually. Before
  # anything is applied, the upgrade checks that StatefulSet <name> exists, is
  # owned by another release and runs <replicas> pods
  # (upgradeChecks.skipExternalStorageCheck). Only an explicit false disables
  # storage; a missing key keeps it.
  enabled: true
  # StatefulSet + headless Service name, and the target for every cache client.
  name: storage
  # Optional Kubernetes constraints, with selectors matching app: <name>.
  topologySpreadConstraints: []
  replicas: 3
  # Set to true/false to override serviceAccount.automountServiceAccountToken.
  automountServiceAccountToken: null
  # Authentication on the storage gRPC port (:8981). Same modes and the same
  # "" default as the scheduler's ports above — see scheduler.clientGrpcServers.
  # Every Buildbarn component dials this port, so closing it is the single
  # largest step in securing the mesh, and the one most likely to strand a
  # component that has not been given a certificate yet.
  grpcServers:
    authenticationPolicy:
      mode: ""
      denyMessage: ""
      custom: ""
  # Mounts secrets.mtlsClientCert into the storage pod. Use together with
  # tracing.enabled + tracing.tls.clientCertificate.enabled for mTLS tracing.
  mtlsClientCert:
    enabled: false
  resources:
    requests:
      cpu: 500m
      # Persistent indexes use file page cache in addition to Go heap/buffers.
      # With all five stores enabled, default index files total 10304 MiB
      # (10.06 GiB) on filesystem backends (CAS 7168, CMS 1280, AC 1344, ISCC
      # 256, FSAC 256) or 11008 MiB (10.75 GiB) on raw backends with shared
      # CMS (CAS 7360, CMS 1280, AC 1344, ISCC 512, FSAC 512).
      # This request does not reserve the entire index working set: increase it
      # for warm-index performance and budget CMS blocks, heap, and RPC buffers.
      # See docs/buildbarn-storage-model.md for production sizing.
      memory: 4Gi
    limits:
      cpu: 7100m
      memory: 16Gi
  # Requests and limits for the storage init containers: volume-init, and
  # device-chown when persistence.blockDevice.deviceAccess=chownInit. They only
  # create, chown and chmod directories or device nodes, then exit, so they
  # never size the pod.
  initResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
  env: {}
#    GOMEMLIMIT: 15GiB
#    GOMAXPROCS: "7"
  # Key-location-map (KLM) capacity guard.
  #
  # Every bb-storage `local` store keeps a hash table mapping digest -> location
  # on the blocks device. It is a FIXED-SIZE open-addressed table: writes probe
  # up to keyLocationMap.maximumPutAttempts (64) slots, and once live records
  # approach the table's capacity those probes start failing. A blob whose
  # location record could not be stored is written to disk but is UNREACHABLE —
  # FindMissingBlobs reports it absent while the bytes sit there. Clients see
  # this as "Lost inputs no longer available remotely" / Bazel exit 39
  # REMOTE_CACHE_EVICTED, which reads like an eviction problem but is not one.
  #
  # The table must therefore be sized against how many objects the DEVICE can
  # hold, not against your current working set:
  #
  #   maxObjects = usableBytes / averageObjectSizeBytes
  #   usableBytes = deviceBytes x (oldBlocks+currentBlocks+newBlocks)
  #                              / (oldBlocks+currentBlocks+newBlocks+spareBlocks)
  #   entries >= minimumRatio x maxObjects          (upstream advises 2-10x)
  #
  # An in-memory KLM costs ~64 B/entry of RSS as it fills (reserved lazily at
  # startup, resident as touched), so a large device pushes you toward
  # `keyLocationMap: file` (the default), which uses 66 B per disk record
  # and makes the store recoverable across restarts when its volumes survive.
  #
  # averageObjectSizeBytes is the size of one STORED record. The defaults below
  # are pre-CDC starting assumptions from one dev deployment (cas is a
  # whole-blob average taken before chunking and compression). Replace them
  # with figures from your own cluster.
  #
  # Do not derive them from
  # buildbarn_blobstore_blob_access_operations_blob_size_bytes. Under the CDC
  # image that histogram observes the size named in the request digest, not
  # the stored record:
  #   storage_type="cs"   uncompressed chunk size; the stored chunk is
  #                       ZSTD-compressed and smaller
  #   storage_type="cms"  size of the whole blob, not of its chunk mapping
  #   ac, iscc, fsac      size in the action digest that keys the record, not
  #                       the stored ActionResult, stats or access profile
  #
  # Use these instead, on the storage pods:
  #   cms: 32 + 36 x (mean blob size / mean chunk size), never below 104.
  #     Mean blob size is that histogram's _sum / _count for
  #     storage_type="cms", operation="Put". Mean chunk size is about 1.338 x
  #     config.contentAddressableStorage.chunkingParameters.minChunkSizeBytes
  #     (upstream's figure; ~343 KiB by default). Do not take it from the cs
  #     series, which also counts every blob small enough to be one chunk.
  #   cas (storage_type="cs"), ac, iscc, fsac: per storage_type,
  #       buildbarn_blobstore_flat_blob_access_refreshes_size_bytes_sum
  #         / buildbarn_blobstore_flat_blob_access_refreshes_blobs_sum
  #     This is the stored size of records that were read again after ageing
  #     into the old blocks. Both series stay at zero until data has aged that
  #     far, so there is nothing to read right after a cold cut-over or a
  #     reset. The same ratio works for cms once it has data.
  # Then watch, per name="KeyLocationMap:<storage_type>",
  #   buildbarn_lossymap_hash_map_put_too_many_iterations_total  (dropped puts)
  #   buildbarn_lossymap_hash_map_get_too_many_attempts_total    (exhausted gets)
  # The BuildbarnKeyLocationMapPutsDropped and
  # BuildbarnKeyLocationMapGetsExhausted alerts fire on them. Either one
  # rising means that index is too small, whatever the estimate said.
  keyLocationMapSizing:
    # Opt-in so upgrades cannot start failing for existing installs. Turning it
    # on is recommended: it converts a silent, very confusing runtime failure
    # into a `helm template` error that shows the arithmetic. Only checks stores
    # whose size this chart can actually see (see minimumRatio note below).
    validate: false
    minimumRatio: 2
    # For backend=blockDevice with mode=hostPath the real device size is not
    # visible to Helm, so the check uses the documentary `blockDevice.size`.
    # Keep that field truthful or the guard is meaningless.
    averageObjectSizeBytes:
      cas: 17408 # ~17 KiB; pre-CDC whole-blob average, CS stores compressed chunks
      # Chunk mappings: 36 B per chunk plus a 32 B suffix, so 512 is ~13
      # chunks. The floor is 104 (two chunks); the default CMS file index
      # (storage.persistence.cms.keyLocationMap.sizeMi) is sized for that floor.
      cms: 512
      ac: 1152   # ~1.1 KiB; ActionResult protos
      iscc: 512  # PreviousExecutionStats protos
      fsac: 2048 # path bloom filters, capped by bloomFilterMaximumSizeBytes
  persistence:
    # Volume retention alone does not make a store recoverable. The KLM and
    # persistent_state must survive with its blocks. All five stores default to
    # disk-backed indexes, on both filesystem and raw-block backends. ISCC/FSAC
    # are enabled by default; explicitly disable either unused store. Raw hostPath
    # requires retained metadata directories that already exist on the node (their
    # hostPath type defaults to Directory); raw PVCs need companion metadata claims.
    # BREAKING: combine the CDC cold cutover with this change; see
    # docs/buildbarn-storage-operations.md. Old explicit inMemory overrides still
    # win: remove them or apply custom-values/buildbarn-values-persistent.yaml.
    # Intentional volatile storage: custom-values/buildbarn-values-ephemeral.yaml.
    # emptyDir remains pod-lifetime; hostPath remains tied to retained node disks.
    # Supported modes:
    # - pvc: PersistentVolumeClaims via volumeClaimTemplates. Durability across
    #   node replacement depends on the StorageClass (local PVs remain local).
    # - emptyDir: pod-lifetime ephemeral storage; on GKE, pair with Local
    #   SSD-backed ephemeral storage node pools.
    # - hostPath: node-local path, typically backed by mounted Local SSD/NVMe.
    #   Filesystem stores mount <store>.hostPath.path with DirectoryOrCreate.
    #   When CAS is a raw block device or cas.hostPath.path is changed, the
    #   render fails until each enabled filesystem ISCC and FSAC store gets its
    #   own hostPath.path next to the other stores, or enabled: false. Left on
    #   the chart default path, the kubelet creates their directories on the
    #   node boot disk wherever that path is not a mounted SSD.
    mode: pvc
    # Global settings for the raw block-device backend (a store's
    # `backend: blockDevice`). See README "Raw block-device storage".
    blockDevice:
      # Permit backend=blockDevice together with mode=hostPath (advanced; used
      # for node-local NVMe carved by partition_ephemeral_disks). When false,
      # blockDevice requires mode=pvc.
      allowHostPath: false
      # The storage pod runs as uid/gid 65534 and uses fsGroup to prepare
      # filesystem PVC/emptyDir volumes without a root init container. For raw
      # block stores, this also controls how the non-root storage container gets
      # read/write on the device node:
      #   group     - rely on pod securityContext fsGroup/supplementalGroups.
      #               PSS "restricted"-compatible (no privileged init), but only
      #               works if the CSI presents the device group-accessible.
      #   chownInit - a root, CHOWN-capable init container chowns the device.
      #               Requires a PSS "baseline" namespace / exemption.
      deviceAccess: group
      fsGroup: 65534
      supplementalGroups: [6] # 6 = 'disk' on most distros; [] to disable
      deviceInit:
        # Only used when deviceAccess=chownInit. Escalate to privileged only if
        # adding the CHOWN capability is insufficient on your runtime/CSI.
        privileged: false
        securityContext: {}
    cas:
      # filesystem: blocks live in a file on a Filesystem PVC (default).
      # blockDevice: blocks live on a raw volumeMode:Block device; the KLM and
      #   state default to a companion Filesystem PVC or a retained hostPath
      #   metadata directory. Explicit inMemory opts out of restart recovery.
      backend: filesystem
      storageClassName: premium-rwo
      size: 1000Gi
      # Size of the CAS blocks file in GiB. Must be smaller than `size` to leave
      # headroom for cdc-v1/keys.db, persistent state, and the shared CMS blocks
      # and index (2304 MiB by default) — typically ~10% smaller.
      # Stores live in a cdc-v1 directory. volume-init refuses to start while
      # cas-keys.db, cas-blocks.db or persistent_state from a chart older than
      # 1.0.0 still exist; follow docs/migrate-to-1.0.0-buildbarn.md.
      blocksSizeGi: 950
      # 7168 MiB / 66 B = ~114M indexable objects, ~2.1x the ~54.6M objects that
      # 885 GiB usable holds at keyLocationMapSizing.averageObjectSizeBytes.cas.
      # See the keyLocationMapSizing block above before changing either number.
      keyLocationMapSizeMi: 7168
      # Block geometry. Block size = blocks bytes / (spareBlocks + oldBlocks +
      # currentBlocks + newBlocks); one block is both the eviction unit and the
      # largest storable blob. CHANGING ANY COUNT (or the blocks/device size)
      # changes the derived block size, and a persistent store discards ALL
      # existing data on next start — plan geometry changes as cache flushes.
      oldBlocks: 8
      currentBlocks: 30
      newBlocks: 3
      spareBlocks: 3
      # Optional cap on parallel write syscalls against the blocks device/file
      # (Buildbarn blockdevice writeConcurrencyLimit). Protects against OS
      # thread exhaustion on slow disks; applies to both backends. null => omit.
      writeConcurrencyLimit: null
      emptyDir:
        # Required when storage.persistence.mode=emptyDir: an unbounded emptyDir
        # can fill the node and get the pod evicted.
        sizeLimit: ""
      hostPath:
        path: /mnt/stateful_partition/kube-ephemeral-ssd/buildbarn-storage/cas
        type: DirectoryOrCreate
      # Used only when backend=blockDevice.
      blockDevice:
        storageClassName: ""     # StorageClass that provisions volumeMode:Block
        # Raw device size; block size is auto-inferred. Kept at 200Gi so this
        # default change does not resize existing devices or flush stores that
        # already persist. Size the disk index against measured chunk sizes.
        # The optional RAM index below covers ~11.5M chunks at a 2.1x ratio.
        size: 200Gi
        # Deprecated alias for storage.persistence.cas.writeConcurrencyLimit
        # (honored only when backend=blockDevice). null => omit from config.
        writeConcurrencyLimit: null
        # file (default): KLM and state on a companion Filesystem PVC, or on
        # metadata.hostPath.path (required with mode=hostPath).
        # inMemory: explicit ephemeral opt-out; starts empty after every process
        # restart even if the device remains. Shared CMS becomes in-memory too.
        # File indexes use metadata.keyLocationMapSizeMi, not RAM entries.
        keyLocationMap: file
        keyLocationMapInMemoryEntries: 24000000
        metadata:                # used only when keyLocationMap=file
          storageClassName: premium-rwo
          # With shared CMS this volume also holds the CMS blocks and index:
          # 7360 + 1024 + 1280 = 9664 MiB of files by default. Raise size
          # before raising any of the three.
          size: 10Gi
          # Deliberately retains the established file-index capacity (~117M
          # records): ~10.2x for the 200Gi raw default, with room for ~1TiB
          # shards. Set a reviewed smaller size during a cold cutover to save
          # space; do not resize an existing persistent index unintentionally.
          keyLocationMapSizeMi: 7360
          # mode=hostPath only: node directory for the KLM file and checkpoint
          # state. path is required and must already exist, on the same
          # storage as the blocks. type defaults to Directory so that a missing
          # directory fails the volume mount and the pod does not start.
          # DirectoryOrCreate would let the kubelet create it on the boot disk
          # when the metadata filesystem is not mounted, and the store would
          # then run with an empty index that does not share its blocks'
          # lifecycle. Use a directory inside the mounted filesystem, not the
          # mountpoint itself: the mountpoint exists on the boot disk whether
          # or not anything is mounted. The same applies to cms, ac, iscc and
          # fsac below.
          hostPath:
            path: ""
            type: Directory
        # Advanced (mode=hostPath): consume a pre-created node-local device node
        # (e.g. an LVM LV from partition_ephemeral_disks) instead of a PVC.
        hostPath:
          devicePath: ""         # e.g. /dev/ephemeral/cas
    # Chunk Mapping Storage (CMS): maps whole-blob CAS digests to their ordered
    # list of RepMaxCDC chunks. Required by CDC-enabled bb-storage.
    #
    # backend:
    #   sharedCas   (default) places CMS blocks on the existing CAS filesystem
    #               volume (/storage-cas/cdc-v1/cms-blocks.db), or on the CAS
    #               metadata volume (/storage-cas-meta/cdc-v1/cms-blocks.db)
    #               when cas.backend=blockDevice and cas.blockDevice.keyLocationMap=file,
    #               or in memory (blocksInMemory) when cas.backend=blockDevice
    #               has no filesystem mount (keyLocationMap=inMemory). Keeps the
    #               StatefulSet's volumeClaimTemplates unchanged across helm upgrade.
    #   filesystem  allocates a dedicated /storage-cms volume (new installs only;
    #               Kubernetes rejects adding a volumeClaimTemplate in-place).
    #   blockDevice consumes a dedicated raw block device (/dev/bb/cms).
    cms:
      backend: sharedCas
      storageClassName: premium-rwo
      # Used only by backend=filesystem. Holds the 1 GiB blocks file plus the
      # default 1280 MiB index (2304 MiB) with room for checkpoint state.
      size: 4Gi
      blocksSizeGi: 1
      # Used when backend=sharedCas and cas.backend=blockDevice with
      # cas.blockDevice.keyLocationMap=inMemory (no filesystem volume mounted).
      # blocksInMemory does not use spareBlocks, so total memory is
      # (oldBlocks + currentBlocks + newBlocks) x blocksInMemoryBlockSizeBytes
      # (33 x 8 MiB = 264 MiB usable by default). Each block must also hold the
      # largest single ChunkMapping (up to config.contentAddressableStorage.maximumChunkCount).
      blocksInMemoryBlockSizeBytes: 8388608 # 8 MiB per block x 33 blocks = 264 MiB
      keyLocationMap:
        # blockDevice uses a regular file on the shared CAS filesystem/metadata
        # volume, with checkpoint state beside it. Raw CAS with an in-memory
        # index always uses an in-memory CMS. No extra PVC is needed.
        type: blockDevice # inMemory or blockDevice
        # inMemory loses mappings on storage restart. Explicit override: ~64
        # bytes per entry of Go heap. Covers the 1 GiB blocks file 2.2x at 512
        # bytes per mapping, 0.44x at the 104-byte floor described below.
        entries: 4194304
        # File-backed index, 66 bytes per record: 1280 MiB holds ~20.3M.
        #
        # A stored mapping is 36 bytes per SHA-256 chunk (4-byte size plus
        # 32-byte hash) plus a 32-byte checksum suffix. A mapping has at least
        # two chunks, so the smallest is 104 bytes. The 512 bytes assumed by
        # storage.keyLocationMapSizing.averageObjectSizeBytes.cms is about 13
        # chunks, a blob of roughly 4.5 MiB.
        #
        # This file is sized for the 104-byte floor, not for 512: the 1 GiB
        # blocks file (33 of 36 blocks usable) holds at most ~9.5M mappings of
        # 104 bytes, and 20.3M records index that 2.15x. Disk is cheap and
        # resizing this file later empties the CMS: every blob of two or more
        # chunks is then reported missing until it is uploaded again.
        #
        # Shared CMS adds its 1 GiB of blocks plus this index (2304 MiB) to
        # the CAS filesystem or to the raw CAS metadata volume. The default
        # CAS claim and the default 10Gi raw CAS metadata claim both hold it.
        sizeMi: 1280
      # CMS is a mutable store (chunk mappings can be rewritten with valid chunk
      # lists); bb-storage enforces newBlocks == 1.
      oldBlocks: 8
      currentBlocks: 24
      newBlocks: 1
      spareBlocks: 3
      writeConcurrencyLimit: null
      emptyDir:
        # Required when storage.persistence.mode=emptyDir and backend=filesystem.
        # Needs more than 2304Mi for the default blocks file and index; 4Gi
        # matches the PVC default.
        sizeLimit: ""
      hostPath:
        path: /mnt/stateful_partition/kube-ephemeral-ssd/buildbarn-storage/cms
        type: DirectoryOrCreate
      blockDevice:
        storageClassName: ""
        size: 2Gi
        writeConcurrencyLimit: null
        keyLocationMap: file
        keyLocationMapInMemoryEntries: 8000000
        metadata:
          storageClassName: premium-rwo
          size: 1Gi
          # Dedicated raw CMS only; keyLocationMap.sizeMi above does not apply.
          # 512 MiB indexes the 2Gi device 2.1x at 512 bytes per mapping and
          # 0.43x at the 104-byte floor. Covering the floor 2x takes about
          # 2400 MiB and a metadata size of 3Gi or more.
          keyLocationMapSizeMi: 512
          # See cas.blockDevice.metadata.hostPath: the directory must exist.
          hostPath:
            path: ""
            type: Directory
        hostPath:
          devicePath: ""
    ac:
      backend: filesystem
      storageClassName: premium-rwo
      size: 12Gi
      blocksSizeGi: 10
      keyLocationMap:
        type: blockDevice # blockDevice (persistent file) or inMemory (ephemeral opt-out)
        # ~9.2 GiB usable at averageObjectSizeBytes.ac holds ~8.5M ActionResults,
        # so keep RAM entries (or sizeMi x 1Mi / 66) at >= 2x that.
        entries: 21000000
        sizeMi: 1344
      # See the CAS block-geometry comment: changing any count (or the blocks/
      # device size) flushes a persistent store. newBlocks must stay 1 for the
      # AC/ISCC/FSAC (mutable stores; enforced by bb-storage).
      oldBlocks: 8
      currentBlocks: 24
      newBlocks: 1
      spareBlocks: 3
      # Optional cap on parallel write syscalls (see cas.writeConcurrencyLimit).
      writeConcurrencyLimit: null
      emptyDir:
        # Required when storage.persistence.mode=emptyDir.
        sizeLimit: ""
      hostPath:
        path: /mnt/stateful_partition/kube-ephemeral-ssd/buildbarn-storage/ac
        type: DirectoryOrCreate
      # Used only when backend=blockDevice.
      blockDevice:
        storageClassName: ""
        # ~7.3 GiB usable / 1152 B per ActionResult = ~6.8M, indexed 2.1x by 14M.
        size: 8Gi
        # Deprecated alias for storage.persistence.ac.writeConcurrencyLimit.
        writeConcurrencyLimit: null
        keyLocationMap: file
        keyLocationMapInMemoryEntries: 14000000
        metadata:
          storageClassName: premium-rwo
          size: 3Gi
          keyLocationMapSizeMi: 1344
          # See cas.blockDevice.metadata.hostPath: the directory must exist.
          hostPath:
            path: ""
            type: Directory
        hostPath:
          devicePath: ""
    # Initial Size Class Cache (ISCC): consumed by bb-scheduler for size-class
    # analysis. Only useful when worker platforms declare multiple size classes.
    # The store is enabled by default; its scheduler consumer still requires
    # scheduler.sizeClassAnalysis.enabled and suitable multi-class worker queues.
    # When enabled, its disk-backed KLM and persistent_state retain learned
    # history through storage-process restarts. Blocks, KLM, and state must
    # survive together. Explicit inMemory opts out and loses history on restart.
    # Durable PVCs can survive node replacement; hostPath requires the same
    # retained node and disks; emptyDir loses history when the pod is replaced.
    iscc:
      enabled: true
      backend: filesystem
      storageClassName: premium-rwo
      # ISCC objects are small PreviousExecutionStats protos and there is at most
      # one per command/platform shape, so this store is deliberately SMALL.
      # A large device means millions of indexable slots the key-location map
      # would have to cover (see storage.keyLocationMapSizing above).
      size: 2Gi
      blocksSizeGi: 1
      keyLocationMap:
        type: blockDevice # persistent file on this filesystem; inMemory opts out
        entries: 4000000
        # ~4.07M disk records; fits alongside the 1Gi blocks file in the 2Gi volume.
        sizeMi: 256
      oldBlocks: 8
      currentBlocks: 24
      newBlocks: 1
      spareBlocks: 3
      writeConcurrencyLimit: null
      emptyDir:
        # Required when storage.persistence.mode=emptyDir.
        sizeLimit: ""
      hostPath:
        path: /mnt/stateful_partition/kube-ephemeral-ssd/buildbarn-storage/iscc
        type: DirectoryOrCreate
      blockDevice:
        storageClassName: ""
        size: 2Gi
        # Deprecated alias for storage.persistence.iscc.writeConcurrencyLimit.
        writeConcurrencyLimit: null
        # With file, KLM + persistent_state live on a companion metadata volume.
        # Switching an existing raw-block PVC store from inMemory adds an
        # iscc-meta claim template and requires a StatefulSet recreate (README).
        # The old volatile index cannot be recovered by switching to file.
        keyLocationMap: file
        keyLocationMapInMemoryEntries: 8000000
        metadata:
          storageClassName: premium-rwo
          size: 1Gi
          keyLocationMapSizeMi: 512
          hostPath:
            # Required in mode=hostPath: choose a retained, writable node-local
            # directory on the SAME storage as the blocks, with a paired reset
            # lifecycle. Never retain this checkpoint over replaced/wiped blocks.
            # It must already exist (type: Directory); the kubelet does not
            # create it. See cas.blockDevice.metadata.hostPath.
            path: ""
            type: Directory
        hostPath:
          devicePath: ""
    # File System Access Cache (FSAC): consumed by workers for prefetching. Only
    # useful with the virtual (FUSE/NFS) build directory. The store is enabled by
    # default; workers use it only when their prefetching is configured.
    fsac:
      enabled: true
      backend: filesystem
      storageClassName: premium-rwo
      # One path-bloom-filter per distinct action, each capped by the worker's
      # prefetching.bloomFilterMaximumSizeBytes. Larger objects than the ISCC but
      # still a small store — see storage.keyLocationMapSizing above.
      size: 6Gi
      blocksSizeGi: 4
      keyLocationMap:
        type: blockDevice # blockDevice (persistent file) or inMemory (ephemeral opt-out)
        entries: 4000000
        sizeMi: 256
      oldBlocks: 8
      currentBlocks: 24
      newBlocks: 1
      spareBlocks: 3
      writeConcurrencyLimit: null
      emptyDir:
        # Required when storage.persistence.mode=emptyDir.
        sizeLimit: ""
      hostPath:
        path: /mnt/stateful_partition/kube-ephemeral-ssd/buildbarn-storage/fsac
        type: DirectoryOrCreate
      blockDevice:
        storageClassName: ""
        size: 6Gi
        # Deprecated alias for storage.persistence.fsac.writeConcurrencyLimit.
        writeConcurrencyLimit: null
        keyLocationMap: file
        keyLocationMapInMemoryEntries: 8000000
        metadata:
          storageClassName: premium-rwo
          size: 1Gi
          keyLocationMapSizeMi: 512
          # See cas.blockDevice.metadata.hostPath: the directory must exist.
          hostPath:
            path: ""
            type: Directory
        hostPath:
          devicePath: ""
  # Deprecated no-op: dataIntegrityValidationCache was removed from
  # local.BlobAccessConfiguration in CDC bb-storage (integrity validation now
  # happens per RepMaxCDC chunk and via chunkMappingValidating). Retained so
  # existing user values files pass schema validation; NOTES.txt prints a
  # deprecation notice when set.
  dataIntegrityValidationCache:
    enabled: false
    cacheSize: 100000
    cacheDuration: 14400s
    cacheReplacementPolicy: LEAST_RECENTLY_USED
  # Set nodeSelector or tolerations here to override top-level k8sNodeScheduling.
  nodeSelector: null
  tolerations: null
  podAntiAffinity:
    # Storage shards must run on distinct nodes. With replicas=3, at least
    # three eligible nodes are required while this is enabled.
    enabled: true
  # At most one storage shard may be voluntarily disrupted at a time.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Allow persistent stores time to checkpoint during routine pod termination.
  # Tune for measured flush time; null uses the Kubernetes default (30s).
  # Persistent stores flush on shutdown with two full syncs of the blocks
  # device plus a state write; on large network-attached volumes give this
  # enough headroom or recent unsynchronized writes may be lost. The 300s
  # minimumEpochInterval is not a maximum loss window: slow or failed syncs
  # can delay persistence further.
  terminationGracePeriodSeconds: 120
  # Optional NetworkPolicy for the storage tier. Storage gRPC (:8981) accepts
  # unauthenticated traffic — authentication and cache-write authorization
  # happen at the frontend — so any pod that can reach the port can read and
  # write the whole cache. Enable to restrict ingress to Buildbarn components
  # in this namespace (app: frontend/scheduler/browser/remote-asset/bb-portal/
  # worker/storage) plus the peers listed below. Requires a
  # CNI that enforces NetworkPolicy (GKE: Dataplane V2 or Calico).
  networkPolicy:
    enabled: false
    # Extra trusted NetworkPolicyPeer entries allowed to reach gRPC :8981.
    # Standard RbeWorker pods live in this namespace and are already allowed
    # by app=worker; leave this empty unless another client needs direct access.
    additionalClientPeers: []
    # Peers allowed to scrape metrics :9980. Empty list => allow from anywhere
    # (scrapers usually run in another namespace, e.g. victoriametrics).
    metricsPeers: []

frontend:
  # 2 minimum. The frontend is the only component on the CLIENT path — Bazel
  # reaches it through the ingress, while workers and the scheduler talk to the
  # storage shards directly — so it absorbs the full concurrency of every build
  # at once and is the first thing to saturate.
  #
  # One replica is not a capacity choice, it is a cliff. Observed on a single
  # replica: a `--jobs=200` client drove 435k requests through the Envoy Gateway,
  # the proxy could only hold 81 upstream connections open, requests queued
  # waiting for one, and the gateway's default 1024-deep pending queue rejected
  # 96k of them (22%) with "UNAVAILABLE ... reset reason: overflow". CAS
  # operations averaged 776ms and peaked at 36s. Nothing crashed and no pod
  # restarted — the tier simply had nowhere to put the work.
  #
  # A second replica halves per-replica in-flight load and makes
  # podDisruptionBudget below meaningful (at 1 replica it can only ever block
  # eviction or allow an outage). Scale further with client concurrency: roughly
  # one replica per ~100 concurrent client jobs, and give each one CPU to match
  # (the 300m default request throttles hard under real load).
  replicas: 2
  # Set to true/false to override serviceAccount.automountServiceAccountToken.
  automountServiceAccountToken: null
  # Mounts secrets.mtlsClientCert into the frontend pod. Use together with
  # tracing.enabled + tracing.tls.clientCertificate.enabled for mTLS tracing.
  mtlsClientCert:
    enabled: false
  # JWT authentication for the frontend gRPC server. When enabled, the gRPC
  # authenticationPolicy is rendered as `any` of (jwt, allow) — JWT-authenticated
  # requests get `private.canWriteToCache=true` metadata, while unauthenticated
  # requests still pass through. Use cache authorizers to gate writes on that flag.
  #
  # The frontend reads JWKS from a file mounted from `configMapName`. You may
  # populate that ConfigMap yourself (kubectl, GitOps, sealed-secrets, etc.) or
  # opt into the bundled `sync` CronJob below to fetch from a JWKS URL.
  jwks:
    enabled: false
    issuer: ""    # optional; e.g. "https://dev-pwl1kfrxjue5nhgo.us.auth0.com/"
    audience: ""  # optional; the API identifier configured in Auth0
    # Optional override for the JMESPath claims-validation expression. When
    # empty, an expression is built from `issuer`/`audience` above (or `true`
    # if both are empty). Set to "`true`" (backticks included) to accept any
    # signed JWT, or write your own JMESPath to validate additional claims.
    claimsValidationExpression: ""
    # ConfigMap mounted into the frontend pod containing the JWKS file.
    # The frontend reloads the file every 300s; kubelet propagates ConfigMap
    # updates to the mounted volume within ~60s, so key rotation is hands-off.
    configMapName: frontend-jwks
    configMapKey: jwks.json
    # Optional: bundled CronJob using buildbarn's sync_jwks_to_configmap tool
    # to fetch keys from a JWKS URL into the ConfigMap above. Skip this if you
    # manage the ConfigMap externally.
    sync:
      enabled: false
      url: ""                     # JWKS source URL (e.g. https://<tenant>.auth0.com/.well-known/jwks.json)
      schedule: "0 */6 * * *"
      # When true, also runs a one-shot Job on helm install/upgrade so the
      # ConfigMap is populated before the frontend pod starts validating tokens.
      initialSyncEnabled: true
      # JWKS sync patches a ConfigMap through the Kubernetes API, so keep token
      # mounting enabled even when serviceAccount.automountServiceAccountToken=false.
      automountServiceAccountToken: true
      # Optional CronJob/Job guardrails. Leave null to preserve existing behavior.
      startingDeadlineSeconds: 600
      job:
        activeDeadlineSeconds: 300
        ttlSecondsAfterFinished: null
      initialJob:
        activeDeadlineSeconds: 300
        ttlSecondsAfterFinished: null
      # Set nodeSelector or tolerations here to override top-level k8sNodeScheduling.
      nodeSelector: null
      tolerations: null
      image:
        repository: ghcr.io/buildbarn/sync-jwks-to-configmap
        tag: "20261118T120531Z-06739f2"
        digest: "" # sha256:9f23eb6d7126423f64bf97e18ca5eb8e850d65e4e68e4c1c4ff8ddce6b7be8e1
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  actionCache:
    putAuthorizer:
      # Supported modes: allow, deny, requireCanWriteToCache, custom.
      mode: allow
      # Used when mode=custom. This string is inserted as the body of
      # `putAuthorizer: { ... }`.
      custom: ""
      requireCanWriteToCacheExpression: 'authenticationMetadata.private.canWriteToCache == `true`'
  contentAddressableStorage:
    # Server-side cache of FindMissingBlobs results, so repeated overlapping
    # lookups from one client do not each hit the storage shards.
    #
    # It composes WITH frontend.readCache rather than being replaced by it: when
    # both are on the template nests readCaching INSIDE existenceCaching.
    # ReadCachingBlobAccess overrides only Get and GetFromComposite and embeds
    # the slow backend for everything else, so FindMissingBlobs — the call a
    # Bazel client makes before every upload — would still cross to the shards.
    # existenceCaching has to sit above it to keep those local. Turning the read
    # cache on is not a reason to turn this off.
    #
    # DURABILITY COUPLING: this cache remembers that a blob was PRESENT. For up
    # to cacheDuration after a blob actually disappears, the frontend keeps
    # telling clients it exists, so they skip re-uploading it and the action
    # later fails with "Lost inputs no longer available remotely". Upstream
    # states the backend "must also be robust enough to guarantee that objects
    # don't disappear shortly after calling FindMissingBlobs".
    #
    # A store using an in-memory key-location map is NOT that robust: it comes
    # back empty after any storage pod restart. Keep cacheDuration short (or set
    # enabled=false) unless the stores behind it are persistent.
    existenceCaching:
      enabled: true
      cacheSize: 1000000
      cacheDuration: 300s
    putAuthorizer:
      # Supported modes: allow, deny, requireCanWriteToCache, custom.
      mode: allow
      # Used when mode=custom. This string is inserted as the body of
      # `putAuthorizer: { ... }`.
      custom: ""
      requireCanWriteToCacheExpression: 'authenticationMetadata.private.canWriteToCache == `true`'
  executeAuthorizer:
    # Supported modes: allow, deny, requireCanWriteToCache, custom.
    mode: allow
    # Used when mode=custom. This string is inserted as the body of
    # `executeAuthorizer: { ... }`.
    custom: ""
    requireCanWriteToCacheExpression: 'authenticationMetadata.private.canWriteToCache == `true`'
  # A per-replica read-through cache in front of the shard ring. Volatile and
  # non-authoritative: every Put still goes to the shards, only Get is served
  # locally, and each replica warms its own. See the README's "Frontend Read
  # Cache" section before changing any number here -- block size is a
  # correctness setting, not a tuning one.
  readCache:
    enabled: false
    mountPath: /storage-frontend-cas
    # 64 bytes of frontend heap each. This default is sized for a STORAGE pod
    # (1.3 GiB) and is almost never right here. It must scale with blocksSizeGi:
    #   live capacity    = blocksSizeGi * (old+current+new) / (old+current+new+spare)
    #   objects that fit = live capacity / mean size of a blob entering the cache
    #   entries          = 2 to 10 * objects that fit
    # Raise blocksSizeGi without raising this and the map fills before the disk
    # does -- blobs on disk the index can no longer reach, visible as
    # buildbarn_lossymap_hash_map_*_too_many_* (or the preserved recording rules)
    # going nonzero.
    keyLocationMapInMemoryEntries: 20971520
    # Total bytes across ALL blocks below, so block size is
    # blocksSizeGi / (old+current+new+spare). A blob larger than one block fails
    # the build rather than just missing the cache. Must stay below whatever
    # bounds the volume (validate.yaml checks blocksSizeGi < volume.emptyDir.sizeLimit
    # when sizeLimit is set, but nothing validates keyLocationMapInMemoryEntries
    # or max blob size against blocksSizeGi here).
    blocksSizeGi: 250
    oldBlocks: 8
    currentBlocks: 24
    newBlocks: 3
    # Spare blocks hold no data, so they add no capacity -- but they still divide
    # blocksSizeGi, so they shrink the block size too.
    spareBlocks: 3
    # Deprecated no-op: dataIntegrityValidationCache was removed from
    # local.BlobAccessConfiguration in CDC bb-storage. Retained as an empty map
    # so existing user values files pass schema validation and trigger the
    # NOTES.txt deprecation notice when populated.
    dataIntegrityValidationCache: {}
    # emptyDir draws from the node's allocatable ephemeral-storage (the kubelet
    # root filesystem). Which disk that is comes from the node pool: a GKE pool
    # created with --ephemeral-storage-local-ssd puts the kubelet root on a
    # local-SSD RAID, so the cache gets NVMe with no opt-in here. Raw
    # --local-nvme-ssd-block devices do NOT back emptyDir.
    #
    # emptyDir.sizeLimit is NOT a scheduling input -- kube-scheduler reads only
    # resources.requests.ephemeral-storage, and frontend.podAntiAffinity is only
    # "preferred", so replicas can share a node. Set
    # frontend.resources.requests.ephemeral-storage to match sizeLimit whenever
    # this is enabled, or the first symptom of overcommit is eviction rather than
    # a Pending pod.
    #
    # A hostPath directory survives pod replacement on the same node, but this
    # read cache still starts empty after every process restart: its index is
    # always in memory. hostPath also escapes sizeLimit, leaving the node's
    # eviction thresholds as the only ceiling.
    volume:
      emptyDir: {}
      hostPath:
        enabled: false
        path: ""
        type: DirectoryOrCreate
  tracingAttributes:
    actionCacheDigests:
      enabled: true
  # Optional ClusterIP Service for trusted in-cluster clients that need to
  # bypass the grpc-cache-proxy. This Service always targets the Buildbarn
  # frontend container on port 8980, even when grpcCacheProxy.enabled=true.
  # It performs no authentication and does not emit grpc-cache-proxy events;
  # do not attach an external route to it. bb-browser reads CAS through it;
  # when it is disabled bb-browser dials frontend-grpc:8980 instead.
  internalService:
    enabled: true
    name: frontend-internal
  # Optional Hermetiq grpc-cache-proxy sidecar that captures cache hit/miss
  # events from frontend gRPC traffic and publishes them to NATS. When enabled,
  # the frontend-grpc Service targetPort switches from the frontend container
  # (8980) to this sidecar, so externally routed traffic (Contour, Gateway,
  # Ingress) flows through it with no route changes; the sidecar forwards to
  # the frontend on 127.0.0.1:8980. bb-portal and bb-remote-asset read the
  # storage shards directly. bb-browser reads CAS through the frontend, which
  # reassembles multi-chunk CDC blobs. With frontend.internalService.enabled
  # (the default) it dials that Service on :8980 and bypasses this proxy. With
  # internalService disabled it dials frontend-grpc:8980, so its reads go
  # through the proxy like any other client's. bb-browser has no proxy
  # credentials: enforceAuth=true with internalService disabled fails the
  # render while browser.replicas is above 0.
  grpcCacheProxy:
    enabled: false
    # gRPC listen port of the sidecar (GRPC_PORT). Becomes the frontend-grpc
    # Service targetPort; the Service port stays 8980.
    port: 50081
    # NATS server cache events are published to (e.g.
    # nats://nats.nats-system.svc:4222). Leave empty to run the sidecar as a
    # plain pass-through proxy with cache-event capture switched off entirely.
    # NOTE: only unauthenticated NATS endpoints are supported — the proxy has no
    # values for NATS credentials, nkeys, or TLS.
    natsUrl: ""
    cacheEvents:
      # Subject prefix for published cache events. Required when natsUrl is
      # set, and MUST equal the Hermetiq chart's cache.subjectPrefix in its
      # NATS stream config (packaged default: cache). It also names the
      # tracking policy bucket the sidecar reads (<prefix>_tracking_policy).
      subjectPrefix: ""
      # MUST equal the bep-nats stream partition count (the hermetiq chart's
      # app.streamPartitionCount / STREAM_PARTITION_COUNT). Events published to
      # a shard nothing consumes are silently discarded.
      numShards: 1
      # Which Action Cache lookups are captured (CACHE_HIT_TRACKING_MODE). A
      # project's Action Cache Hit Tracker setting applies in every mode.
      #   "on"     - every lookup
      #   "header" - only invocations that send the opt-in header, e.g.
      #              --remote_cache_header=x-hermetiq-track-cache-hits=1
      #   "off"    - none
      # Quote the value: YAML reads a bare on/off as a boolean.
      trackingMode: "on"
    # Applied to both the sidecar's server and its upstream connection to the
    # frontend, and floored at config.maximumMessageSizeBytes: a smaller limit
    # here would reject Buildbarn responses with ResourceExhausted. A very large
    # config.maximumMessageSizeBytes may therefore warrant raising resources
    # below, since the proxy buffers a message while forwarding it.
    maxMessageSizeBytes: 67108864
    # Reject unauthenticated requests. Requires stytch.apiHost and
    # stytch.existingSecret so the proxy can validate tokens. When false the
    # sidecar is NOT an authorization boundary — it forwards every request and
    # Buildbarn's own authorizers decide.
    enforceAuth: false
    debug: false
    stytch:
      # Stytch API host used to validate tokens (e.g. https://login.example.com).
      apiHost: ""
      # Pre-created Secret with Stytch credentials, exposed via envFrom. Only
      # mounted when enforceAuth=true, since the proxy reads STYTCH_* only then.
      # Set to "" to skip.
      existingSecret: stytch-secret
    otel:
      # OTLP endpoint for the sidecar's OTEL_* env vars. Set this explicitly for
      # a non-standard collector, or to override the chart-level tracing
      # endpoint. Leave empty to derive it, in this order:
      #   1. tracing.enabled + tracing.nodeLocal.enabled
      #        -> <scheme>://$(K8S_LOCAL_NODE_IP):<tracing.nodeLocal.port>
      #   2. tracing.enabled + tracing.endpoint -> <scheme>://<tracing.endpoint>
      #   3. otherwise                          -> http://<hosts.otel>:4317
      # <scheme> is https when tracing.tls.enabled, otherwise http. hosts.otel is
      # required in case 3, since the sidecar's exporter is always configured and
      # would otherwise fall back to the OTEL SDK default of localhost:4317.
      # NOTE: hosts.otel defaults to a Hermetiq-operated host. On-prem installs
      # should point it at their own in-cluster collector.
      endpoint: ""
      protocol: grpc
      serviceName: grpc-cache-proxy
      interval: 15s
    # Native Kubernetes gRPC probes (k8s >= 1.24) against the sidecar's
    # grpc.health.v1 service — no probe binary is needed in the image. Once the
    # Service targetPort moves here these report the PROXY's health, not the
    # frontend's; the frontend keeps its own HTTP probes on :9980.
    probes:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    # Extra environment variables, name -> value (tpl-rendered). Use for the
    # proxy's tuning knobs, e.g. CACHE_EVENT_BATCH_SIZE,
    # CACHE_EVENT_FLUSH_INTERVAL, SHUTDOWN_DRAIN_DELAY, SHUTDOWN_TIMEOUT.
    env: {}
    resources:
      requests:
        cpu: 600m
        memory: 1Gi
      limits:
        # Matches the frontend it fronts: headroom to burst on the cache path.
        cpu: "2"
        memory: 2Gi
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
#  env:
#    GOMEMLIMIT: 3GiB
#    GOMAXPROCS: "2"
  # Set nodeSelector or tolerations here to override top-level k8sNodeScheduling.
  nodeSelector: null
  tolerations: null
  # Prefer replicas on different nodes without making scheduling fail when the
  # cluster has fewer eligible nodes than replicas.
  podAntiAffinity:
    enabled: true
  # At most one frontend replica may be voluntarily disrupted at a time.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

scheduler:
  replicas: 1
  # Set to true/false to override serviceAccount.automountServiceAccountToken.
  automountServiceAccountToken: null
  # Authentication on each of the scheduler's four listening ports.
  #
  # mode: allow | deny | mtls | custom, or "" to follow security.grpcMtls —
  # tlsClientCertificate when it is enabled, allow when it is not. Naming a
  # mode explicitly is how a staged rollout keeps one port open while
  # certificates reach its callers: turn on security.grpcMtls, then set
  # workerGrpcServers.authenticationPolicy.mode=allow until every worker pool
  # presents one.
  #
  # These ports carry no user identity — a worker dialling the scheduler has no
  # token to present — so a service certificate is the only credential
  # available here. That is what mtls mode is for, and it is why the
  # "internal ports must stay open" rule of a JWT rollout does not apply.
  #
  # deny takes a MESSAGE string (grpc.AuthenticationPolicy.deny is a string,
  # unlike the authorizer deny used elsewhere); custom splices raw jsonnet.
  clientGrpcServers:
    authenticationPolicy:
      mode: ""
      denyMessage: ""
      custom: ""
  workerGrpcServers:
    authenticationPolicy:
      mode: ""
      denyMessage: ""
      custom: ""
  buildQueueStateGrpcServers:
    authenticationPolicy:
      mode: ""
      denyMessage: ""
      custom: ""
  # The admin port is HTTP, not gRPC. http.server.AuthenticationPolicy has no
  # tlsClientCertificate arm at all, so this one cannot do mutual TLS however
  # security.grpcMtls is configured: allow | deny | custom only.
  adminHttpServers:
    authenticationPolicy:
      mode: allow
      denyMessage: ""
      custom: ""
  # How the scheduler decides which queue an action joins.
  #
  #   simple          (default) route on the platform the client requested.
  #   demultiplexing  serve `backends` explicitly and send everything else to
  #                   `catchAll` — a fallback pool for actions whose platform
  #                   matches no worker. Platform matching is exact string
  #                   equality with no fallback of its own, so this is the only
  #                   way to serve an unmatched action rather than failing it.
  #   custom          splice raw jsonnet from actionRouter.custom.
  #
  # Two costs before enabling demultiplexing. Every platform you want to keep
  # FAILING must be listed in `backends`, or a typo'd exec_properties key stops
  # erroring and silently runs in the catch-all pool instead. And the action
  # cache keeps the platform the CLIENT asked for, so the catch-all shares no
  # cached results between the platforms it absorbs.
  actionRouter:
    mode: simple
    # Platforms served explicitly. Properties MUST be sorted by name then value
    # — the scheduler rejects an unsorted platform rather than sorting it, and
    # validate.yaml fails the install before it can.
    backends: []
    #   - instanceNamePrefix: ""
    #     platform:
    #       properties:
    #         - name: container-image
    #           value: docker://ghcr.io/catthehacker/ubuntu:act-22.04
    # The platform unmatched actions are rewritten onto. A worker pool must
    # advertise exactly this, or the catch-all queues work nothing serves.
    catchAll:
      platform:
        properties: []
    custom: ""
  defaultExecutionTimeout: 1800s
  maximumExecutionTimeout: 7200s
  platformQueueWithNoWorkersTimeout: 900s
  # Feedback-driven initial-size-class analysis backed by the Initial Size Class
  # Cache (ISCC). Requires storage.persistence.iscc.enabled=true, and only has an
  # effect when platform queues declare multiple size classes.
  sizeClassAnalysis:
    enabled: false
    failureCacheDuration: 86400s
    historySize: 32
    pageRank:
      acceptableExecutionTimeIncreaseExponent: 0.5
      smallerSizeClassExecutionTimeoutMultiplier: 1.5
      minimumExecutionTimeout: 10s
      maximumConvergenceError: 0.002
  # Predeclared platform queues. REQUIRED to serve MULTIPLE size classes for a
  # platform: the scheduler keeps a persistent queue per class so the
  # feedback-driven analyzer + ISCC can route across them (they otherwise
  # disappear when their workers stop synchronizing). Each entry:
  #   platform:    list of {name, value} properties the worker pools advertise;
  #                all pools in one size-class group share a SINGLE platform.
  #   sizeClasses: increasing, POSITIVE size classes (recommend = worker CPU
  #                cores; the largest retries actions that fail on smaller ones).
  #                A single-class queue may use [0]. Must match the pools'
  #                runners[].sizeClass.
  #   instanceNamePrefix: optional; defaults to "" (matches all instance names).
  # Example:
  #   predeclaredPlatformQueues:
  #     - platform:
  #         - { name: pool, value: sizeclass }
  #       sizeClasses: [1, 2]
  predeclaredPlatformQueues: []
  # Interval at which bb-scheduler re-reads its configuration and applies
  # changes to predeclaredPlatformQueues and actionRouter without restarting
  # (for example "30s" or "0.5s"). Use a positive duration in protobuf
  # seconds notation; empty disables reloading. Zero, ms, m, and h are rejected.
  #
  # REQUIRES a bb-scheduler image built from Hermetiq's fork of
  # bb-remote-execution, including CDC contentAddressableStorage support.
  # Also set scheduler.handover.cdcCompatibleFork=true for that verified image.
  # The upstream ghcr.io/buildbarn/bb-scheduler image
  # rejects the configurationReloadInterval option and will not start.
  #
  # When set, those two settings move out of the scheduler's checksum/config
  # annotation: changing them updates the mounted ConfigMap in place (the
  # kubelet refreshes it within about a minute) and the scheduler applies the
  # change on its next reload instead of the pod rolling. A reload is applied
  # whole or not at all; a configuration that fails to evaluate is logged,
  # counted in buildbarn_scheduler_configuration_reloads_total{result="Failure"},
  # and the previous configuration stays in effect. Changing the sizeClasses of
  # an existing predeclared queue still needs a restart
  # (kubectl rollout restart); until then it is reported by
  # buildbarn_scheduler_predeclared_platform_queues_pending_restart.
  configurationReloadInterval: ""
  # Optional zero-downtime blue/green handover for scheduler rollouts (Phase 1).
  # Disabled by default; requires a compatible fork scheduler image and a
  # matching coordinator image. Keep opt-in images/settings in environment
  # overrides. The first upgrade from an upstream scheduler must run idle.
  # When enabled, the scheduler Deployment uses a RollingUpdate (maxSurge: 1,
  # maxUnavailable: 0) with a Lease-backed coordinator sidecar and streams its
  # in-memory build queue state to the replacement pod before retiring and
  # relaying in-flight Execute / WaitExecution streams.
  handover:
    enabled: false
    # This chart emits CDC contentAddressableStorage, including for handover
    # and reload. Set true only after selecting a fork image that implements
    # both CDC and the requested fork features. It also covers
    # scheduler.configurationReloadInterval; no fork image is selected for you.
    cdcCompatibleFork: false
    # TLS identity shared by scheduler certificates. Peer connections dial
    # Pod IPs but verify this DNS SAN, including the coordinator's local Ping.
    peerServerName: scheduler
    port: 8985
    terminationGracePeriodSeconds: 1800
    adoptionWindow: 15s
    recoveredOperationGracePeriod: 30s
    relayDrainPeriod: 1740s
    handoverGrpcServers:
      authenticationPolicy:
        mode: ""
        denyMessage: ""
        custom: ""
    coordinator:
      # Runs as a native Kubernetes sidecar (Kubernetes 1.29+) so Lease
      # renewal and handover RPCs remain available until the scheduler exits.
      leaseDurationSeconds: 10
      renewInterval: 2s
      # Required when scheduler.handover.enabled is true; left empty by default
      # so the disabled hook is a no-op.
      image:
        repository: ""
        tag: ""
        digest: ""
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # Set nodeSelector or tolerations here to override top-level k8sNodeScheduling.
  nodeSelector: null
  tolerations: null
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  # Optional NetworkPolicy admitting only the scheduler's callers:
  #   - this release's frontend on client gRPC :8982
  #   - workers on :8983
  #   - bb-portal on BuildQueueState :8984
  #   - the peers listed below
  # Without it, and without security.grpcMtls, any pod in the cluster can
  # submit actions straight to the scheduler, bypassing the frontend's
  # authorizers, or register as a worker and receive actions. Requires a CNI
  # that enforces NetworkPolicy (GKE: Dataplane V2 or Calico).
  networkPolicy:
    enabled: false
    # Extra trusted NetworkPolicyPeer entries allowed on worker gRPC :8983.
    # Standard RbeWorker pods live in this namespace and are already allowed
    # by app=worker; leave this empty unless a custom client needs access.
    additionalWorkerPeers: []
    # Extra peers allowed on client gRPC :8982 and BuildQueueState :8984,
    # beyond this release's frontend and bb-portal.
    additionalClientPeers: []
    # Peers allowed on the admin web UI :7982, which the rbeWeb route
    # publishes. Empty list => allow from anywhere, so the route keeps working.
    # List your ingress controller or Gateway namespace to narrow it.
    adminPeers: []
    # Peers allowed to scrape metrics :9980. Empty list => allow from anywhere.
    metricsPeers: []

browser:
  replicas: 1
  # Set to true/false to override serviceAccount.automountServiceAccountToken.
  automountServiceAccountToken: null
  # Set nodeSelector or tolerations here to override top-level k8sNodeScheduling.
  nodeSelector: null
  tolerations: null
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  oauth2Proxy:
    enabled: false
    # By default, reuse the oauth2-proxy ConfigMap created by the hermetiq chart.
    # Set to "" to render a Buildbarn-specific ConfigMap from the values below.
    existingConfigMap: oauth2-proxy-config-web-ui
    provider: oidc
    # Required when enabled and existingConfigMap is empty: OIDC issuer URL.
    oidcIssuerUrl: ""
    scope: openid email profile
    oidcGroupsClaim: groups
    validateUrl: ""
    backendLogoutUrl: ""
    whitelistDomain: ""
    passUserHeaders: true
    # Emit X-Auth-Request-* response headers, including groups, for ingress
    # auth-request integrations in addition to X-Forwarded-* upstream headers.
    setXAuthRequest: true
    insecureOidcAllowUnverifiedEmail: true
    insecureOidcSkipIssuerVerification: true
    skipOidcDiscovery: false
    skipProviderButton: true
    skipJwtBearerTokens: true
    sslInsecureSkipVerify: true
    skipAuthPreflight: true
    sessionCookieMinimal: false
    showDebugOnError: true
    cookieSecure: true
    # Optional shared cookie domains, for example [".example.com"] when dashboard
    # and browser hosts share a parent domain.
    cookieDomains: []
    # Reuse the oauth2-proxy Secret created by the hermetiq chart by default.
    # Set existingSecret to "" to render a Buildbarn-specific Secret from inline values.
    client:
      existingSecret: oauth2-proxy-client
      clientId: ""
      clientSecret: ""
      cookieSecret: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    # Extra environment variables appended to the oauth2-proxy container.
    env: []
  # Extension hook: extra containers appended verbatim to the browser pod
  # (rendered through tpl). Use together with service.targetPortOverride to
  # front the browser with a custom auth/proxy sidecar the chart does not
  # model. Any referenced Secrets/ConfigMaps must be pre-created.
  extraContainers: []
  service:
    # When set (a port NUMBER exposed by one of extraContainers), the browser
    # Service serves and targets this port instead of the browser container
    # (7984) or the oauth2-proxy port. All routing providers follow the
    # Service automatically. Mutually exclusive with oauth2Proxy.enabled.
    targetPortOverride: null

remoteAsset:
  enabled: false
  replicas: 1
  # Set to true/false to override serviceAccount.automountServiceAccountToken.
  automountServiceAccountToken: null
  port: 8985
  allowUpdatesForInstances: []
  fetcher:
    http:
      enabled: true
  tracingAttributes:
    fetchBlobUris:
      enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Set nodeSelector or tolerations here to override top-level k8sNodeScheduling.
  nodeSelector: null
  tolerations: null
  probes:
    enabled: true
    readiness:
      httpGet:
        path: /-/healthy
        port: 9980
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      httpGet:
        path: /-/healthy
        port: 9980
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 5
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1
  tmpDirSizeLimit: 1Gi

portal:
  # bb-portal build-event dashboard. A single Deployment serves everything: the
  # web UI and HTTP/gRPC-Web APIs on portal.<domainBase> (:8081), and the Build
  # Event Stream gRPC ingest endpoint on bes.<domainBase> (:8082, h2c). The UI
  # is embedded in the binary, so there is no separate frontend workload.
  # Requires a pre-created PostgreSQL credentials Secret (db.existingSecret).
  #
  # WARNING: bb-portal has no authentication. Both the HTTP API/UI on
  # portal.<domainBase> and the BES gRPC ingest endpoint on bes.<domainBase>
  # are served with `authenticationPolicy: { allow: {} }` and `allow` read and
  # publish authorizers, so anyone who can reach those hosts can read every
  # build's events and publish their own. The HTTP server also always serves
  # the GraphQL API and its playground (/graphql, /graphiql); no chart value
  # turns either off. The chart does not front these hosts with oauth2-proxy
  # the way browser.oauth2Proxy fronts Buildbarn Browser. Only enable this
  # behind an external auth layer, an internal-only Gateway or Ingress, or a
  # NetworkPolicy that restricts who can reach the routes.
  enabled: false
  replicas: 1
  # Set to true/false to override serviceAccount.automountServiceAccountToken.
  automountServiceAccountToken: null
  db:
    # Pre-created Secret with keys DB_USER, DB_PASSWORD, DB_HOSTNAME,
    # DB_PORT, DB_NAME; DB_CONNECTION_STRING is composed from them at pod
    # start. The chart never renders database credentials.
    existingSecret: bbportal-db-env
    # Connection pool bounds. Keep maxOpenConnections within the budget your
    # PostgreSQL server allows across all portal replicas.
    connectionPool:
      maxOpenConnections: 10
      maxIdleConnections: 10
      connectionMaxLifetime: 120s
      connectionMaxIdleTime: 30s
  bes:
    enableBepFileUpload: true
    # Ignored: false no longer disables anything. bb-portal removed
    # enableGraphqlPlayground from BesServiceConfiguration, and the pinned
    # image serves the GraphQL playground (/graphiql) whenever the GraphQL API
    # (graphqlApiServiceConfiguration) is configured, which this chart always
    # does. Control exposure at the route or network layer instead. The key is
    # kept so existing values files pass schema validation; NOTES prints a
    # warning when portal.enabled is true and this is false.
    enableGraphqlPlayground: true
    # Minimum wall time between two event batches. Larger values trade
    # dashboard freshness for less database load.
    minEventBatchDuration: 0.1s
    # buildTags key whose value groups invocations into one build. Invocations
    # without it are not associated with any build. Set to "" to disable
    # grouping.
    #
    # NOTE: build tags only exist if invocationMetadataExtractor below produces
    # them. With no extractor configured, buildTags is always empty, so this key
    # never matches and the Builds page stays empty (individual invocations
    # still show up).
    buildKey: build_id
    # Raw buildbarn.configuration.jmespath.Expression, rendered into
    # portal.jsonnet as besServiceConfiguration.invocationMetadataExtractor.
    # It runs against {"env": <Bazel's env>, "files": {...}} and returns any of
    # username, hostname, sourceControls, invocationTags, buildTags — which is
    # what populates the Builds page, the per-user views, and the source-control
    # tab. Leave empty to record none of it.
    #
    # Example (Buildkite):
    #   invocationMetadataExtractor:
    #     expression: |
    #       {
    #         "username": env.BUILDKITE_BUILD_CREATOR,
    #         "buildTags": {"build_id": env.BUILDKITE_BUILD_ID},
    #         "sourceControls": [{
    #           "repo": env.BUILDKITE_REPO,
    #           "ref": env.BUILDKITE_BRANCH,
    #           "commit": env.BUILDKITE_COMMIT
    #         }]
    #       }
    invocationMetadataExtractor: {}
    cleanup:
      cleanupInterval: 60s
      invocationMessageTimeout: 1800s
      invocationRetention: 604800s # 7 days
  # Settings injected into the embedded web UI when it serves index.html.
  frontend:
    companyName: Hermetiq
    # Page-level toggles. These only hide UI: the underlying APIs stay
    # reachable, so do not treat them as an access control mechanism. Turning
    # a page on requires the matching backend service — the bes.* pages need
    # portal.bes, `browser` needs the CAS/AC stores, and `scheduler` needs the
    # bb-scheduler connection.
    featureFlags:
      home:
        fileUpload: true
        instructions: true
      bes:
        pageBuilds: true
        pageInvocations: true
        pageTargets: true
        pageTests: true
        pageTrends: true
      # bb-portal's own CAS/Action Cache browser. Turn off if you send people
      # to Buildbarn Browser (browser.enabled) instead.
      browser: true
      scheduler: true
    # Footer links, rendered in a row at the bottom of every page. Each entry
    # is {text, href, icon}, where icon is {slack: {}}, {github: {}},
    # {discord: {}}, or {url: "https://..."}.
    footerContent: []
    # Extra columns for the build and invocation tables, sourced from build or
    # invocation tags. Each entry is {title, valueKey, urlKey}.
    additionalBuildColumns: []
    additionalBuildInvocationColumns: []
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # Set nodeSelector or tolerations here to override top-level k8sNodeScheduling.
  nodeSelector: null
  tolerations: null
  tmpDirSizeLimit: 1Gi
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

keda:
  enabled: true
  prometheusServerAddress: http://vmselect-vmks.hermetiq.svc.cluster.local:8481/select/0/prometheus
  # Optional frontend autoscaling on the total number of in-flight gRPC calls.
  # The query uses metrics from frontend-vmpodscrape (or an equivalent external
  # scrape) and does not depend on vmRules.enabled. Keep at least one replica:
  # with no frontend pod there is no pull-based metric that can reactivate it.
  frontend:
    enabled: false
    pollingInterval: 15
    cooldownPeriod: 300
    minReplicaCount: 2
    maxReplicaCount: 20
    # Average target number of open frontend gRPC calls per replica.
    threshold: "100"
    # CPU and memory use Kubernetes Metrics Server and the aggregate requests
    # of every container in the pod (including grpc-cache-proxy when enabled).
    # Keep memory scaling opt-in: a disk-backed frontend read cache contributes
    # active filesystem pages to the reported working set, so cache warming can
    # otherwise cause replicas to scale up even when request load is low.
    # KEDA does not support ScaledObject fallback with either resource trigger,
    # so the nonzero minReplicaCount above is the failure-safe floor.
    cpu:
      enabled: true
      targetUtilization: "70"
    memory:
      enabled: false
      targetUtilization: "80"

certificate:
  # Only rendered for contour and ingress providers. Gateway mode expects TLS
  # to be configured on the Gateway resource itself.
  enabled: true
  name: bb-wildcard-cert
  # SANs for the Certificate. Empty derives them from hosts.* — the
  # *.<hosts.domainBase> wildcard plus each enabled component host, which
  # requires hosts.domainBase. Set this explicitly when you override every
  # hosts.* value individually and have no shared base domain.
  dnsNames: []
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lets-encrypt-issuer

tls:
  # Existing wildcard TLS secret to share across all Contour HTTPProxy or
  # Ingress resources. When set, the chart does not render a cert-manager
  # Certificate even if certificate.enabled is true.
  secretName: ""

ingress:
  enabled: true
  className: nginx
  grpc:
    proxyReadTimeoutSeconds: "300"
    proxySendTimeoutSeconds: "300"
  browser:
    enabled: true
    name: browser-bb
    corsAllowOrigin: https://dashboard.hermetiq.io,https://web-dev.hermetiq.dev,http://localhost:3000
  rbeWeb:
    enabled: true
    name: rbe-web-bb
  frontendGrpc:
    enabled: true
    name: frontend-bb-cloud-grpc
  remoteAssetGrpc:
    enabled: false
    name: remote-asset-bb-cloud-grpc
  # bb-portal routes (rendered only when portal.enabled). Shared by the
  # contour and ingress providers, mirroring remoteAssetGrpc.
  portal:
    enabled: true
    name: portal-bb
  besGrpc:
    enabled: true
    name: bb-portal-bes-grpc

httpProxy:
  enabled: true
  name: frontend-bb-cloud-grpc
  responseTimeout: 300s
  # Idle timeout on the HTTP stream. RBE Execute is a server-streaming RPC
  # that holds the stream open while a worker runs the action; default
  # Contour idle timeouts can reset long-lived streams (RST_STREAM,
  # INTERNAL_ERROR). Set to a long duration or "infinity" to disable.
  # Empty string omits the field, leaving Contour's default in place.
  idleTimeout: 1h
  # Upstream connection idle timeout (Contour timeoutPolicy.idleConnection).
  # Empty string omits the field.
  idleConnectionTimeout: ""
  # mTLS client certificate validation on the HTTPProxy. Requires the CA secret to exist
  # in the chart's namespace. Disable if you don't have client certs to enforce.
  clientValidation:
    enabled: false
    caSecret: ""
    optionalClientCertificate: true
    forwardClientCertificate:
      cert: true
      subject: true

gateway:
  enabled: true
  name: ""
  namespace: ""
  httpRouteApiVersion: gateway.networking.k8s.io/v1
  grpcRouteApiVersion: gateway.networking.k8s.io/v1
  # Advanced override for route parentRefs. When empty, parentRefs are built
  # from gateway.name and gateway.namespace.
  parentRefs: []
  httpRoutes:
    browser:
      enabled: true
      name: browser-bb
      pathPrefix: /
    rbeWeb:
      enabled: true
      name: rbe-web-bb
      pathPrefix: /
    # Rendered only when portal.enabled.
    portal:
      enabled: true
      name: portal-bb
      pathPrefix: /
  grpcRoutes:
    frontend:
      enabled: true
      name: frontend-bb-cloud-grpc
      # Envoy Gateway BackendTrafficPolicy extending the frontend GRPCRoute
      # with long-lived stream timeouts for Bazel's Execute and ByteStream
      # calls. RBE Execute is a server-streaming RPC, and large CAS uploads use
      # client-streaming ByteStream/Write calls; default Envoy stream/idle
      # timeouts can reset them mid-build (RST_STREAM, INTERNAL_ERROR).
      backendTrafficPolicy:
        enabled: true
        name: frontend-bb-cloud-grpc-timeouts
        # "0s" disables the per-request timeout; useful for long actions.
        requestTimeout: "0s"
        # "0s" disables the max HTTP/2 stream duration; needed for large
        # ByteStream/Write uploads that can exceed Envoy's short default.
        maxStreamDuration: "0s"
        connectionIdleTimeout: "1h"
        # Envoy Gateway defaults EVERY circuit-breaker field to 1024, applied per
        # CLUSTER rather than per endpoint — so adding frontend replicas does not
        # raise these budgets, only this policy does. Without a circuitBreaker
        # block the route inherits those defaults silently.
        #
        # maxPendingRequests is the one that bites an RBE frontend. Requests wait
        # in that queue for an upstream connection, and Bazel opens far fewer
        # connections than it has in-flight requests (observed: 435k requests over
        # 81 upstream connections from a single --jobs=200 client). Once the
        # 1024-deep queue fills, Envoy resets everything after it with
        # "UNAVAILABLE ... reset reason: overflow" — measured at 96k rejections,
        # 22% of all requests, while no pod crashed or restarted.
        #
        # These are raised, not removed: the breaker is real backpressure, and
        # setting it absurdly high just moves the failure from the proxy (clean
        # resets) into the frontend (timeouts and OOM). Scale roughly with peak
        # client concurrency; watch
        #   cluster.grpcroute/<ns>/<route>/rule/0.upstream_rq_pending_overflow
        # on the Envoy proxy's admin :19000/stats and raise if it is nonzero.
        circuitBreaker:
          enabled: true
          maxConnections: 2048
          maxPendingRequests: 8192
          maxParallelRequests: 8192
          maxParallelRetries: 1024
          # null/0 => omit the field, leaving Envoy's default (unlimited). Setting
          # it forces connection cycling, which costs handshakes on a gRPC path.
          maxRequestsPerConnection: null
    remoteAsset:
      enabled: false
      name: remote-asset-bb-cloud-grpc
      # Remote Asset FetchBlob is unary but can fetch large artifacts, which
      # Envoy Gateway's 15s default route timeout would cut off.
      backendTrafficPolicy:
        enabled: true
        name: remote-asset-bb-cloud-grpc-timeouts
        requestTimeout: "300s"
        maxStreamDuration: "0s"
        connectionIdleTimeout: "1h"
        # Off by default: this route carries far less concurrency than the
        # frontend, so Envoy Gateway's 1024 defaults are fine. Flip enabled=true
        # if you see upstream_rq_pending_overflow on its cluster. See the
        # frontend route above for what these mean.
        circuitBreaker:
          enabled: false
          maxConnections: 1024
          maxPendingRequests: 1024
          maxParallelRequests: 1024
          maxParallelRetries: 1024
          maxRequestsPerConnection: null
    # BES gRPC route for bb-portal (rendered only when portal.enabled).
    bes:
      enabled: true
      name: bb-portal-bes-grpc
      # Envoy Gateway applies a 15s default route timeout when no policy
      # targets the route. BES upload drains happen after the client's
      # half-close, which is when Envoy's route timer starts, so the request
      # timeout and max stream duration are disabled here.
      backendTrafficPolicy:
        enabled: true
        name: bb-portal-bes-grpc-timeouts
        requestTimeout: "0s"
        maxStreamDuration: "0s"
        connectionIdleTimeout: "1h"
        # Off by default: this route carries far less concurrency than the
        # frontend, so Envoy Gateway's 1024 defaults are fine. Flip enabled=true
        # if you see upstream_rq_pending_overflow on its cluster. See the
        # frontend route above for what these mean.
        circuitBreaker:
          enabled: false
          maxConnections: 1024
          maxPendingRequests: 1024
          maxParallelRequests: 1024
          maxParallelRetries: 1024
          maxRequestsPerConnection: null
  # Envoy Gateway ClientTrafficPolicy tuning the downstream leg (Bazel client →
  # Envoy) of the Gateway this chart's routes attach to. Rendered only when
  # routing.provider=gateway.
  #
  # This exists for standalone Buildbarn installs. If you also install the
  # hermetiq chart, enable it THERE instead — the policy is Gateway-scoped, so
  # one covers both charts' routes, and enabling both is a misconfiguration:
  # ClientTrafficPolicy resources do not merge, so the oldest wins and the other
  # reports Overridden=True.
  #
  # Opt-in, deliberately: buffers are per-connection, the policy applies to
  # every route on the targeted listener rather than just Buildbarn's, and an
  # Envoy Gateway proxy is often a single replica. Enable it while watching the
  # Envoy pod's memory.
  #
  # These are the values Envoy Gateway v1.7.2 programs into Envoy by default —
  # all far below what a high-RTT Bazel client wants, which is what the
  # overrides below exist to correct:
  #   per_connection_buffer_limit_bytes  32Ki
  #   initial_stream_window_size         64Ki
  #   initial_connection_window_size     1Mi
  #   max_concurrent_streams             100
  #   idle_timeout                       1h
  clientTrafficPolicy:
    enabled: false
    name: bb-gateway-client-traffic
    # Optional Gateway listener (spec.listeners[].name) to scope the policy to.
    # Empty targets every listener on the Gateway. Note that ClientTrafficPolicy
    # resources do not merge: a listener-scoped policy fully overrides a
    # Gateway-scoped one, so do not run both against the same listener.
    sectionName: ""
    # The important one. Envoy Gateway's 32Ki default triggers watermark
    # backpressure almost immediately on CAS blob transfer, and every
    # drain/refill cycle costs a full client round trip — 17ms on a
    # cross-region path. Envoy's own default is 1Mi. This is per-connection
    # memory on the proxy, so check Envoy's RSS before raising it further.
    bufferLimit: 8Mi
    http2:
      # HTTP/2 flow control is a second cap, independent of bufferLimit: raising
      # only bufferLimit can still yield 413 request_payload_too_large. Keep
      # initialConnectionWindowSize >= initialStreamWindowSize, or the
      # connection window throttles a single stream before its own window fills.
      initialStreamWindowSize: 16Mi
      initialConnectionWindowSize: 24Mi
      # Bazel multiplexes concurrent RPCs onto one HTTP/2 connection, so the
      # default of 100 caps effective parallelism well below a high --jobs.
      maxConcurrentStreams: 1024
    timeout:
      http:
        # Envoy's HTTP idle timeout is REQUEST-based: HTTP/2 PINGs and TCP
        # keepalives do NOT reset it. A Bazel channel that goes quiet through a
        # long analysis or local-execution phase gets dropped, and the next RPC
        # pays full TCP+TLS setup again (~39ms cross-region) or eats a mid-build
        # retry. Do not set 0 — Envoy warns that disabling it risks connection
        # leaks from lost FINs; prefer a large finite value.
        idleTimeout: 7200s
    # Socket-level dead-peer detection. This does not hold the HTTP idle timeout
    # open; it detects half-open connections quickly instead of letting Bazel
    # hang until --remote_timeout fires. Set to null to omit the block.
    tcpKeepalive:
      idleTime: 60s
      interval: 15s
      probes: 5
  gke:
    # Rendered only when routing.provider=gateway-httproute-only.
    healthCheckPolicy:
      enabled: true
      namePrefix: hc
    backendPolicy:
      enabled: true
      namePrefix: bp
      # Backend service timeout in seconds. Matches the previous Contour
      # response timeout used for long-lived Bazel gRPC streams.
      timeoutSec: 300
  cors:
    enabled: true
    browserPolicyName: browser-bb-cors
    # Defaults to ingress.browser.corsAllowOrigin when empty.
    allowOrigins: []
    allowMethods:
      - GET
      - POST
      - OPTIONS
      - HEAD
    allowHeaders:
      - authorization
      - cache-control
      - x-hermetiq-jwt
      - x-grpc-web
      - User-Agent
      - x-accept-content-transfer-encoding
      - x-accept-response-streaming
      - x-user-agent
      - grpc-timeout
      - Grpc-Message
      - Grpc-Status
      - content-type
      - format
      - headers
      - method
      - x-hermetiq-bytestream-file
      - x-hermetiq-bytestream-type
    exposeHeaders:
      - Content-Length
      - Content-Range
      - Content-Type
      - Access-Control-Allow-Headers
      - grpc-status
      - grpc-message
    allowCredentials: true
    maxAge: 10m

vmPodScrapes:
  enabled: true
  interval: 30s

vmRules:
  # Renders VictoriaMetrics VMRule resources from files/vmrules/.
  # Disable this, and vmPodScrapes, on clusters without the VictoriaMetrics
  # operator CRDs installed.
  enabled: true
  # Defaults to the chart namespace. Override when your VM operator only watches
  # a dedicated observability namespace.
  namespaceOverride: ""
  labels: {}
  annotations: {}

# Worker pools are RbeWorker custom resources reconciled by bb-worker-operator.
# Configure them in their manifests, not in this chart.
