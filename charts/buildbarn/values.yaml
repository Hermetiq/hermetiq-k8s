# full deploys the application. storage-only stages an independent storage ring
# in an existing namespace, with its own <storage.name>-config ConfigMap.
deploymentMode: full

# Namespace for every namespaced resource. Empty follows the release namespace
# (`helm --namespace`).
namespaceOverride: ""
createNamespace: false

global:
  imageRegistry: ""
  imagePullSecrets: []

imagePullSecrets: []

commonLabels: {}
# Additional labels applied to every chart-managed Pod. Built-in identity,
# selector, and metrics labels cannot be overridden. Changing these labels
# rolls workloads.
podLabels: {}
commonAnnotations: {}
podAnnotations: {}
extraObjects: []

standardLabels:
  appVersion: false

serviceAccount:
  # Set to true/false to apply a pod-level ServiceAccount token mount default
  # across chart workloads. Leave null to preserve Kubernetes/default-SA behavior.
  automountServiceAccountToken: false

# Per-file overrides for the jsonnet configs in charts/buildbarn/files/config/.
# Keys MUST match a filename present in that directory; an unknown key fails
# `helm template` with the list of valid filenames. The value REPLACES that
# file VERBATIM in the rendered ConfigMap — Helm templating is NOT applied,
# so what you write is exactly what lands in the ConfigMap.
#
# Recommended use: copy a chart default as a starting point, customize, then
# load via `--set-file`:
#
#   helm install ... \
#     --set-file 'configOverrides.frontend\.jsonnet'=./my-frontend.jsonnet
#
# The chart's frontend.jsonnet and storage.jsonnet currently use Helm
# templating (JWKS, OTEL endpoint, storage block size). If you override
# either, you take responsibility for those features — inline the values
# you need directly in your override.
configOverrides: {}

# Cluster checks that read live objects with `lookup`. They run on `helm
# install` as well as `helm upgrade`, and are skipped by offline `helm template`
# and other client-side renders, where lookup returns nothing.
#
# Worker configuration: live RbeWorker objects and the ConfigMaps they mount
# are read for pre-CDC image pins and pre-CDC configuration. The worker
# operator itself is not checked; upgrade it to v1.0.0 in the same window.
#
# Storage claim templates: when a StatefulSet named storage already exists in
# the release namespace and its volumeClaimTemplates differ from the rendered
# ones, the release fails before anything is applied. Kubernetes forbids
# changing them in place. The error lists the differences and the
# `kubectl delete statefulset storage --cascade=orphan` step to run first, with
# storage stopped.
upgradeChecks:
  # Skip the storage claim-template comparison. Leave this false: with the
  # check skipped, a claim-template change makes Helm apply every other object
  # of the release and then fail on the StatefulSet.
  skipStorageClaimTemplateCheck: false
  # Skip the target check for storage.enabled=false. Leave this false: the
  # check refuses an upgrade whose storage.name StatefulSet is missing, is
  # still owned by this release, or runs a different number of replicas than
  # storage.replicas, each of which leaves clients without working storage.
  skipExternalStorageCheck: false
  # The two switches below exist for installs the checks cannot serve. Leave
  # them false unless you hit one of the cases named, and verify by hand what
  # the check would have verified.
  #
  # Skip every check that reads RbeWorker objects and worker ConfigMaps in the
  # release namespace: pre-CDC worker image pins, missing ConfigMaps and the
  # text scan of worker configuration. Use it when the account running Helm
  # may not list rbeworkers or ConfigMaps (Helm then stops with a "forbidden"
  # error).
  skipWorkerChecks: false
  # Skip the text scan for pre-CDC fields in configOverrides,
  # scheduler.actionRouter.custom and worker ConfigMaps. The scan matches
  # patterns and does not evaluate jsonnet, so it can refuse configuration that
  # is valid CDC (a field name inside a string, an import alias it does not
  # recognise). Use it for such a file after checking the file against the CDC
  # schema; a real pre-CDC field makes the component crash-loop.
  skipConfigTextCheck: false

# Shared Buildbarn configuration knobs templated into files/config/*.
config:
  # Maximum gRPC message size in bytes, applied across all Buildbarn components
  # via common.libsonnet (frontend, storage, scheduler, browser, workers,
  # remote asset). Large unary payloads (BatchUpdateBlobs, Tree messages) must
  # fit under this limit; streaming ByteStream traffic is unaffected.
  maximumMessageSizeBytes: 10485760 # 10 MiB
  diagnostics:
    # Serve /debug/pprof/* and active-span inspection on the unauthenticated
    # :9980 diagnostics HTTP server. Set to false to expose only /metrics and
    # /-/healthy on :9980.
    enablePprof: true
    enableActiveSpans: true
  actionCache:
    # Hide ActionResults whose ExecutedActionMetadata.worker_completed_timestamp
    # is older than minimumValidity (+ jitter), so every target is rebuilt
    # periodically. This is a FRESHNESS knob, not a correctness one: it surfaces
    # non-hermetic actions and inputs that are not really part of the action key
    # (a moved base-image tag, a repo rule that fetches from the network).
    #
    # It is NOT what protects you from ActionResults referencing CAS blobs that
    # have been evicted — completenessChecking (always rendered on the AC) does
    # that by verifying every referenced blob still exists before returning a
    # hit. You can leave this disabled and still be correct.
    #
    # Renders as blobstore.actionCache.actionResultExpiring wrapping
    # completenessChecking in common.libsonnet.
    actionResultExpiring:
      enabled: false
      # Floor on entry lifetime. Set this comfortably BELOW how long the CAS
      # actually retains blobs, or you pay re-execution for entries whose
      # outputs were still present. Derive CAS retention from the eviction rate:
      #   retention ≈ (oldBlocks+currentBlocks+newBlocks) x blockBytes / bytesPerDay
      # `bytesPerDay` comes from the blob_access Put counters; a store whose
      # block_allocator_releases_total is still 0 has not evicted anything yet
      # and its retention is unbounded so far.
      minimumValidity: 2592000s # 30d
      # Spreads expiry so a batch of ActionResults written by one large build
      # does not all expire in the same instant and stampede the scheduler.
      # Effective lifetime is minimumValidity + jitter, where jitter is derived
      # deterministically from the ActionResult's own worker_completed_timestamp
      # (bb-storage: `uint64(t.Unix()) * 0x936a0d2a41e8c779 % jitter`). Repeated
      # lookups of one entry therefore agree on its expiry, though entries that
      # completed in the same second share a jitter value — the spread comes from
      # a build spanning many seconds.
      #
      # MUST BE NONZERO when enabled: that expression takes a modulo by this
      # value, so 0s panics with an integer divide-by-zero on the first AC hit.
      # Enforced in templates/validate.yaml.
      maximumValidityJitter: 259200s # 3d
      # Emergency AC flush: ActionResults completed before this RFC3339 instant
      # are hidden regardless of minimumValidity. Bumping it to "now" invalidates
      # the entire Action Cache, so treat it as a break-glass control rather than
      # routine configuration.
      #
      # Empty => the Unix epoch, NOT an omitted field. bb-storage validates this
      # field unconditionally and refuses to start on a nil Timestamp
      # ("Invalid minimum timestamp: proto: invalid nil Timestamp"), so the chart
      # always renders it. The epoch is the identity value: every ActionResult
      # with a real worker_completed_timestamp clears it.
      minimumTimestamp: ""
  blobstore:
    deadlineEnforcing:
      # Optional per-RPC deadline wrapper around the gRPC CAS chunk and
      # chunk-mapping backends in common.libsonnet (for example "30s"). Empty
      # omits the deadlineEnforcing wrapper.
      timeout: ""
  contentAddressableStorage:
    # Upper bound on the number of RepMaxCDC chunks a single composite CAS blob
    # may span. At the 256 KiB minimum chunk size, 100,000 chunks covers blobs
    # up to ~25 GiB while bounding GetFromComposite recursion depth.
    maximumChunkCount: 100000
    # RepMaxCDC content-defined chunking parameters enforced by bb-storage on
    # CAS chunk writes and advertised to clients via GetCapabilities / CdcParameterCache.
    chunkingParameters:
      minChunkSizeBytes: 262144
      horizonSizeBytes: 2097152
    # Client-side in-memory cache of the server's RepMaxCDC parameters in
    # common.libsonnet so callers do not query storage on every upload.
    cdcParameterCache:
      cacheSize: 1000
      cacheDuration: 3600s
      cacheReplacementPolicy: LEAST_RECENTLY_USED
    # In-memory cache of decoded CAS chunks for RbeWorker pods only: merged
    # onto the common.libsonnet in the worker ConfigMap, not the one storage,
    # scheduler and browser use. bb_worker serves inputs over FUSE by reading
    # chunks at an offset, and without this cache every read decompresses
    # (ZSTD) and re-hashes (SHA-256) the whole chunk. Every worker pool shares
    # this setting, sized by entry count. With RepMaxCDC, each canonical chunk
    # is smaller than 2 x minChunkSizeBytes, so retained payload is below
    # cacheSize x 2 x minChunkSizeBytes per bb_worker. Budget additional memory
    # for heap/GC, in-flight reads, and other worker state.
    # Set cacheSize to 0 to omit the cache.
    chunkCache:
      cacheSize: 2048
      cacheDuration: 3600s
      cacheReplacementPolicy: LEAST_RECENTLY_USED

