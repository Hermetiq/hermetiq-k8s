apiVersion: v2
name: buildbarn
description: Buildbarn remote cache, CAS, and RBE deployment
type: application
version: 0.6.0
appVersion: "20260814T085338Z"
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Add stable Kubernetes application labels to chart-managed Pods, component labels to workload-related resources, configurable podLabels, and namespaced worker-pool labels while preserving all legacy selectors."
    - kind: changed
      description: "Enable maxUnavailable=1 PodDisruptionBudgets by default for the frontend Deployment and storage StatefulSet, add preferred hostname pod anti-affinity to frontend, and retain hard-required hostname anti-affinity for storage shards."
    - kind: added
      description: "Report each enabled external endpoint in NOTES.txt with its https:// or grpcs:// scheme and active routing provider."
    - kind: added
      description: "Add frontend.internalService, an opt-in ClusterIP Service that always targets the Buildbarn frontend on port 8980. Trusted in-cluster clients can bypass an authenticated grpc-cache-proxy without disabling authentication on the externally routed frontend-grpc Service. The direct Service is disabled by default and must never receive an external route."
    - kind: changed
      description: "Collapse bb-portal into a single bb-portal Deployment on ghcr.io/buildbarn/bb-portal:20260812T063819Z-57cd49d, matching upstream bb-deployments kubernetes/portal.yaml. The web UI is now embedded in the Go binary, so the separate bb-portal-frontend Next.js Deployment, its Service, and the split bb-portal-backend/bb-portal-frontend images are gone; the remaining Service is named bb-portal. Config follows the new upstream schema: frontendServiceConfiguration (frontendSource.embedded + frontendConfig) replaces the now-reserved frontendProxyUrl, blob browsing moves from browserServiceConfiguration to top-level contentAddressableStorage/actionCache/initialSizeClassCache/fileSystemAccessCache, and allowed_origins is gone upstream now that the backend always serves the frontend itself. Values follow the single workload: images.portal replaces images.portalBackend/portalFrontend, pod-level settings live on portal.* (replicas, resources, nodeSelector, tolerations, automountServiceAccountToken), the database moves to portal.db, BES settings to portal.bes, and portal.frontend keeps only UI settings. --bes_results_url moves from /invocations/ to /bazel-invocations/."
    - kind: added
      description: Expose the bb-portal UI feature flags (portal.frontend.featureFlags for the home upload/instructions areas, the five BES pages, the CAS/AC browser, and the scheduler pages), footer links (portal.frontend.footerContent), and dynamic build/invocation table columns (portal.frontend.additionalBuildColumns, portal.frontend.additionalBuildInvocationColumns). featureFlags only hide UI - the underlying APIs stay reachable, so they are not an access control mechanism.
    - kind: added
      description: Expose the bb-portal database connection pool (portal.db.connectionPool) plus portal.bes.minEventBatchDuration, portal.bes.buildKey, and portal.bes.invocationMetadataExtractor (a raw JMESPath Expression over Bazel's environment). The pool previously fell back to the Go sql defaults (unlimited open connections, 2 idle), and buildKey is what groups invocations into builds in the UI, and it reads from the build tags invocationMetadataExtractor returns - with no extractor configured buildTags is always empty, so the Builds page, the per-user views, and the source-control tab stay empty while individual invocations still record.
    - kind: changed
      description: Document a DIY mirrored storage recipe (README, Storage section) using the existing configOverrides["common.libsonnet"] and extraObjects escape hatches - no chart-managed mirroring. Covers the mirrored jsonnet shape, the common.libsonnet export contract an override must preserve, a ring-B StatefulSet/Service via extraObjects reusing the storage helpers, optional bb_replicator, and the hazards (durability-not-HA semantics, mandatory inter-ring anti-affinity under persistence.mode=hostPath, symmetric ring geometry).
    - kind: fixed
      description: Give the portal BES and Remote Asset GRPCRoutes their own Envoy Gateway BackendTrafficPolicy (gateway.grpcRoutes.bes.backendTrafficPolicy, gateway.grpcRoutes.remoteAsset.backendTrafficPolicy). Only the frontend route had one, so on routing.provider=gateway the other two kept Envoy's 15s default route timeout - truncating the post-half-close BES upload drain and capping large Remote Asset FetchBlob calls. BES disables the request timeout and max stream duration; Remote Asset is bounded at 300s.
    - kind: fixed
      description: Run the storage volume-init container as root with CHOWN/FOWNER/DAC_OVERRIDE and chown the store directories when storage.persistence.mode=hostPath. The kubelet creates a DirectoryOrCreate hostPath as root-owned 0755 and fsGroup is not applied to hostPath volumes, so the uid-65534 init container failed with EACCES on its first mkdir and the storage StatefulSet stayed in Init:Error. pvc and emptyDir modes keep the unprivileged init container.
    - kind: fixed
      description: Derive kubernetes_shard and kubernetes_replica on the storage VMPodScrape from the pod name. The packaged VMRules and bb-storage dashboards aggregate the blob-map eviction-age series by those labels and nothing emitted them, so per-shard panels collapsed to one series, the :min and :max recording rules were identical, and BuildbarnCacheRetentionLow reported a blank shard.
    - kind: fixed
      description: Compare storage blocksSizeGi against the value that actually bounds the volume - the PVC request in mode=pvc, emptyDir.sizeLimit in mode=emptyDir, and nothing in hostPath mode where the host device governs. The check previously ran against `size` in every mode, which is inert outside mode=pvc, so it rejected valid emptyDir/hostPath configs and missed emptyDir stores whose blocks file exceeded the volume limit.
    - kind: fixed
      description: Seed the frontend-jwks ConfigMap on pre-upgrade as well as pre-install, but only when it does not already exist. Newly enabling frontend.jwks on an existing release left the frontend Deployment mounting a ConfigMap nothing had created, and the rollout stalled on configmap "frontend-jwks" not found because Helm never reaches the post-upgrade sync Job while waiting on it. The existence guard keeps the empty seed from clobbering already synced keys.
    - kind: fixed
      description: Honor gateway.cors.allowOrigins for the browser Ingress CORS annotation on routing.provider=ingress. It hardcoded ingress.browser.corsAllowOrigin while the five sibling CORS annotations on the same Ingress came from gateway.cors, so the origin silently ignored gateway.cors.allowOrigins.
    - kind: added
      description: Add browser.resources (200m/512Mi requests, 1/1Gi limits). The Buildbarn Browser container rendered with no resources block and no value to set one, making it the only long-lived container in the chart running at BestEffort QoS.
    - kind: added
      description: Add certificate.dnsNames to set the wildcard Certificate SANs explicitly, and require hosts.domainBase when deriving them. certificate-ingress.yaml was the chart's only unguarded use of hosts.domainBase, so an empty value emitted an invalid "*." SAN instead of failing.
    - kind: changed
      description: Document that bb-portal is unauthenticated. Both the HTTP API/UI on portal.<domainBase> and the BES gRPC ingest endpoint on bes.<domainBase> serve with an allow authentication policy and an allow instance-name authorizer, and the chart does not front them with oauth2-proxy the way browser.oauth2Proxy fronts Buildbarn Browser. Also flag the ["*"] portal.backend.allowedOrigins default and the unauthenticated GraphQL playground.
    - kind: fixed
      description: Always render OTEL_* env for the grpc-cache-proxy sidecar, falling back to hosts.otel:4317 when Buildbarn tracing is disabled. The proxy initializes its OTLP metric exporter unconditionally, so omitting the endpoint made it dial the SDK default localhost:4317. The derived endpoint now uses https when tracing.tls.enabled, so the sidecar is not left on plaintext against a TLS-only collector that the Buildbarn containers reach over TLS. tracing.endpoint is only consulted when tracing.enabled, matching the documented precedence — a leftover tracing.endpoint with tracing disabled no longer silently overrides hosts.otel. hosts.otel is now required in the fallback path instead of rendering a malformed "http://:4317". NOTE for on-prem installs - hosts.otel defaults to a Hermetiq-operated host, so point it at your own in-cluster collector (the shipped example values already do) or set frontend.grpcCacheProxy.otel.endpoint. The sidecar mounts no client certificates, so tracing.tls.clientCertificate (mTLS) does not apply to it.
    - kind: changed
      description: Default the grpc-cache-proxy sidecar image to the released public us-docker.pkg.dev/hermetiq-cloud/hermetiq-public/grpc-cache-proxy:v0.5.0 image.
    - kind: added
      description: Size the grpc-cache-proxy sidecar's gRPC message limit from the new frontend.grpcCacheProxy.maxMessageSizeBytes, floored at config.maximumMessageSizeBytes. The sidecar previously inherited gRPC's 4MB client default on its upstream leg, so any Buildbarn response above that failed with ResourceExhausted once the sidecar was in the traffic path.
    - kind: added
      description: Allow frontend.grpcCacheProxy.natsUrl to be empty, which runs the sidecar as a pure pass-through proxy with cache-event capture switched off. cacheEvents.subjectPrefix is now required only when a NATS URL is set.
    - kind: fixed
      description: Mount frontend.grpcCacheProxy.stytch.existingSecret only when enforceAuth=true. In pass-through mode the proxy never reads the STYTCH_* vars, but the envFrom reference still failed the pod with CreateContainerConfigError wherever that Secret did not exist.
    - kind: added
      description: Add native Kubernetes gRPC readiness/liveness probes for the grpc-cache-proxy sidecar (frontend.grpcCacheProxy.probes). It serves grpc.health.v1 itself and reports NOT_SERVING while draining on shutdown.
    - kind: added
      description: Add an opt-in Envoy Gateway ClientTrafficPolicy (gateway.clientTrafficPolicy, routing.provider=gateway only) tuning the downstream leg for high-RTT Bazel clients — raises the per-connection buffer limit off Envoy Gateway's 32Ki default, lifts the HTTP/2 stream and connection flow-control windows and max concurrent streams, adds TCP keepalives, and lengthens the request-based HTTP idle timeout so quiet Bazel channels are not dropped mid-build.
    - kind: fixed
      description: Stop emitting Buildbarn `persistent` state config for filesystem-backend AC/ISCC/FSAC stores whose key-location map is in memory. Persistence requires a disk-backed key-location map; the old config reattached blocks full of unreachable data after every restart and paid fsync overhead for no durability. Set keyLocationMap.type=blockDevice to get real persistence (matching the CAS default).
    - kind: fixed
      description: Move writeConcurrencyLimit inside the blockdevice `source` message where bb-storage expects it — previously enabling it produced config bb-storage rejects at startup — and expose it for filesystem-backend stores as storage.persistence.<store>.writeConcurrencyLimit (blockDevice.writeConcurrencyLimit remains as a deprecated alias).
    - kind: changed
      description: Align CAS block geometry defaults with Buildbarn recommendations (oldBlocks 6→8, newBlocks 2→3, spareBlocks 2→3) and raise spareBlocks to 3 for AC/ISCC/FSAC. WARNING for persistent stores — block-count changes change the derived block size, and the store discards all persisted data on next start (volatile/in-memory-KLM deployments only see the usual restart cold cache).
    - kind: added
      description: Publish not-ready addresses on the headless storage Service so restarting shards resolve immediately instead of hitting DNS NXDOMAIN backoff.
    - kind: added
      description: Add an opt-in NetworkPolicy (storage.networkPolicy) restricting the unauthenticated storage gRPC port to Buildbarn components plus configurable peers, with metrics scraping configurable separately.
    - kind: added
      description: Ship VMRule alerts for key-location-map saturation (put_too_many_iterations, get_too_many_attempts) and worst-case cache retention below 24h.
    - kind: added
      description: Add storage.terminationGracePeriodSeconds passthrough for persistent stores that need time to flush (two device syncs plus a state write) on shutdown.
    - kind: added
      description: Validate block geometry (spare+old+current+new ≤ 100 per store), require emptyDir.sizeLimit when mode=emptyDir, and only require blockDevice.size when it actually sizes a Block PVC (mode=pvc).
    - kind: added
      description: Warn at install time when configOverrides replaces common.libsonnet, since the storage shard map is then no longer derived from storage.replicas.
    - kind: added
      description: Add a generic browser sidecar hook (browser.extraContainers + browser.service.targetPortOverride) for fronting Buildbarn Browser with a custom auth proxy without chart-modeled values.
    - kind: added
      description: Add optional bb-portal (portal.enabled) backend and frontend with portal.<domainBase> and bes.<domainBase> routes across contour, gateway, and ingress providers, VMPodScrape, and a templated portal.jsonnet.
    - kind: added
      description: Add config.maximumMessageSizeBytes to tune the shared Buildbarn gRPC message size limit (default unchanged at 10 MiB).
    - kind: added
      description: Add opt-in raw block-device storage (backend=blockDevice, volumeMode:Block) for CAS/AC/ISCC/FSAC, with in-memory or persistent (file) key-location maps and group/chownInit device access.
    - kind: added
      description: Add optional Initial Size Class Cache (ISCC) and File System Access Cache (FSAC) storage stores plus their bb-scheduler (sizeClassAnalysis) and worker (prefetching) consumer wiring.
    - kind: changed
      description: Refactor storage volume rendering into helpers; upgrading with default values rolls storage and worker pods once with no behavior change.
    - kind: changed
      description: Disable the legacy worker-ubuntu22-04 Deployment by default so worker pools can be managed by the Buildbarn Worker operator.
    - kind: added
      description: Add non-breaking ServiceAccount token hardening controls for Buildbarn app and worker pods, while preserving JWKS sync token access.
    - kind: added
      description: Add disabled-by-default PodDisruptionBudgets for storage, frontend, scheduler, Browser, and remote asset workloads.
    - kind: added
      description: Add configurable Remote Asset API readiness and liveness probes using the Buildbarn diagnostics endpoint.
    - kind: added
      description: Add optional JWKS sync CronJob and initial Job deadline/TTL guardrails.
    - kind: added
      description: Upgraded Buildbarn images to latest release built on Go 1.24.6
    - kind: added
      description: Add routing.provider=gateway-httproute-only for GKE Gateway deployments that require HTTPRoute resources for gRPC backends.
    - kind: added
      description: Add GKE HealthCheckPolicy and GCPBackendPolicy rendering for HTTPRoute-only Gateway installs.
    - kind: added
      description: Add h2c appProtocol hints to externally routed Buildbarn gRPC Services.
    - kind: added
      description: Add storage.persistence.mode with emptyDir and hostPath options for ephemeral NVMe-backed Buildbarn storage without PVCs.
    - kind: changed
      description: Keep routing.provider=gateway as the GRPCRoute-capable Gateway mode for Envoy Gateway and compatible controllers.
    - kind: added
      description: Add routing.enabled=false and routing.provider=none support for users who supply their own Gateway, Ingress, or other external routing resources.
keywords:
  - buildbarn
  - remote-execution
  - bazel
  - remote cache
maintainers:
  - name: Hermetiq
