apiVersion: v2
name: buildbarn
description: Buildbarn remote cache, CAS, and RBE deployment
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.5
appVersion: "20260908T142448Z"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: removed
      description: "Remove chart-managed workers; use RbeWorker pools"
    - kind: added
      description: "Roll pods when managed ConfigMaps or Secrets change"
    - kind: changed
      description: "Set ALPN on Gateway traffic policy and allow unhealthy pod eviction"
    - kind: changed
      description: "namespaceOverride defaults to the Helm release namespace"
    - kind: changed
      description: "Meet the CIS Kubernetes Benchmark v2.0.1 securityContext set and PSS restricted on every pod: seccomp RuntimeDefault and runAsGroup everywhere, explicit privileged: false, and a full securityContext for remote-asset and jwks-sync. Configure it under security.pod and security.container"
    - kind: added
      description: "Add an optional scheduler NetworkPolicy (scheduler.networkPolicy) admitting only the frontend, bb-portal, workers, and listed peers on its gRPC ports"
    - kind: changed
      description: "Set requests and limits on every container: storage init containers use the new storage.initResources, and grpc-cache-proxy gets a CPU limit"
    - kind: security
      description: "Strip x-forwarded-client-cert on Gateway gRPC routes, reset OAUTH2_PROXY_SKIP_AUTH_ROUTES on browser oauth2-proxy, default serviceAccount.automountServiceAccountToken to false, and honor security.pod/security.container across storage and oauth2-proxy"
    - kind: fixed
      description: "Validate frontend.readCache.blocksSizeGi against emptyDir.sizeLimit, include scheduler.jsonnet in mTLS configOverrides guard, wire jwks-sync scheduling/imagePullSecrets/deadlines, and bound /tmp emptyDir volumes"
    - kind: added
      description: "Add frontend.grpcCacheProxy.cacheEvents.trackingMode (on, header or off; default on) to choose which Action Cache lookups the grpc-cache-proxy sidecar captures"
keywords:
  - buildbarn
  - remote-execution
  - bazel
  - remote cache
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
