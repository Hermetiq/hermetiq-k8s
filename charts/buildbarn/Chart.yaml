apiVersion: v2
name: buildbarn
description: Production-ready Buildbarn Helm chart for Kubernetes — remote cache (CAS/AC), remote build execution (RBE), and bb-browser/portal for Bazel and other REAPI clients. Maintained by Hermetiq.
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.10.0
appVersion: "20261118T120531Z"
annotations:
  artifacthub.io/displayName: Buildbarn Helm Chart
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: "Keep the unvalidated raw Local SSD example explicitly volatile, require paired blocks/metadata lifecycle, and report volatile stores and undersized file indexes in Helm notes"
    - kind: changed
      description: "Breaking: default CAS, CMS, AC, ISCC, and FSAC to persistent indexes for filesystem and raw-block storage; add an explicit ephemeral profile and coordinated CDC cutover guidance; keep optional stores disabled"
    - kind: fixed
      description: "Isolate CDC CAS files in cdc-v1 and refuse legacy data until an explicit maintenance reset; persist shared CMS mappings by default so composite blobs survive restarts"
    - kind: fixed
      description: "Use the CDC scheduler field for fork features, validate actual worker ConfigMap references and binary capability declarations, and require the internal browser route when the cache proxy enforces auth"
    - kind: fixed
      description: "Preserve legacy CAS and CDC CS/CMS observability; validate protobuf semantics and add real storage upgrade/restart and PromQL regressions"
    - kind: changed
      description: "Update Buildbarn images and Jsonnet configurations to the RepMaxCDC chunked CAS storage model (chunkStorage, chunkMappingStorage, nested keyLocationMap, bb-portal top-level database and authorizers, and workerImage/runnerInstallerImage defaults in buildbarn-worker-config)"
    - kind: changed
      description: "Breaking: raw Jsonnet supplied through configOverrides, a custom common.libsonnet or RbeWorker spec.config.files must use the CDC schema; upgrades fail with the field to change and a link to the manual steps"
    - kind: added
      description: "helm upgrade requires verified CDC capability declarations on the operator and co-located bep-nats Deployments; upgradeChecks.operatorNamespace locates an operator in another namespace"
    - kind: changed
      description: "Scheduler handover and configurationReloadInterval require a compatible fork image and scheduler.handover.cdcCompatibleFork; their accepted configuration uses the CDC schema"
keywords:
  - buildbarn
  - buildbarn-helm-chart
  - helm-chart
  - bazel
  - bazel-remote-cache
  - remote-cache
  - remote-execution
  - rbe
  - reapi
  - cas
  - kubernetes
  - build-cache
  - chromium-siso
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
