apiVersion: v2
name: buildbarn
description: Production-ready Buildbarn Helm chart for Kubernetes — remote cache (CAS/AC), remote build execution (RBE), and bb-browser/portal for Bazel and other REAPI clients. Maintained by Hermetiq.
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.9
appVersion: "20260908T142448Z"
annotations:
  artifacthub.io/displayName: Buildbarn Helm Chart
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: security
      description: "Turn the scheduler admin UI routes (ingress.rbeWeb, gateway.httpRoutes.rbeWeb) off by default, and fail the render when one would publish :7982 while scheduler.adminHttpServers.authenticationPolicy is allow; set scheduler.adminHttpServers.allowUnauthenticatedRoute=true to keep such a route"
    - kind: security
      description: "Starter values enable the storage and scheduler NetworkPolicies, and the chart README documents security.grpcMtls as the step that also keeps build actions in worker pods off :8981 and :8983; the chart defaults stay off"
    - kind: added
      description: "frontend.jwks.allowedClientIds and clientIdClaim bind frontend JWTs to named clients, ANDed onto the claims expression; the starter values bind to the Bazel machine-to-machine client"
    - kind: changed
      description: "With scheduler.networkPolicy enabled, the admin UI :7982 admits only scheduler.networkPolicy.adminPeers (none by default); the render fails when an rbeWeb route is enabled with no adminPeers"
keywords:
  - buildbarn
  - buildbarn-helm-chart
  - helm-chart
  - bazel
  - bazel-remote-cache
  - remote-cache
  - remote-execution
  - rbe
  - reapi
  - cas
  - kubernetes
  - build-cache
  - chromium-siso
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
