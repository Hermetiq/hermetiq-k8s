apiVersion: v2
name: buildbarn
description: Production-ready Buildbarn Helm chart for Kubernetes — remote cache (CAS/AC), remote build execution (RBE), and bb-browser/portal for Bazel and other REAPI clients. Maintained by Hermetiq.
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 1.0.0
appVersion: "20261118T120531Z"
annotations:
  artifacthub.io/displayName: Buildbarn Helm Chart
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: move to the Buildbarn November 2026 images and the RepMaxCDC chunked storage model. Existing cache data cannot be read: upgrading from 0.9.9 is a cold cut-over with a cache reset, and storage refuses to start on pre-CDC files until they are removed"
    - kind: changed
      description: "Breaking: CAS, CMS, AC, ISCC and FSAC keep persistent indexes by default, and ISCC and FSAC are enabled by default. PVC releases gain claim templates, so the storage StatefulSet must be recreated; custom-values/buildbarn-values-ephemeral.yaml restores volatile stores"
    - kind: changed
      description: "Breaking: jsonnet supplied through configOverrides, a custom common.libsonnet or RbeWorker spec.config.files must use the CDC schema; installs and upgrades fail with the field to change"
    - kind: changed
      description: "Breaking: raw-block metadata hostPath type defaults to Directory, so the node directory must exist before storage starts"
    - kind: changed
      description: "Scheduler handover and configurationReloadInterval require a CDC-capable fork image and scheduler.handover.cdcCompatibleFork=true"
    - kind: added
      description: "Install and upgrade are refused before anything is applied when the storage StatefulSet volumeClaimTemplates would change, when a pre-CDC Buildbarn image is pinned, or when the bb-worker-operator is not CDC-capable. upgradeChecks holds the operator namespace and a skip switch for each check"
    - kind: added
      description: "buildbarn-worker-config publishes workerImage and runnerInstallerImage for RbeWorkers that set no images, and config.contentAddressableStorage.chunkCache gives worker pods a cache of decoded chunks"
    - kind: fixed
      description: "Key-location-map recording rules and alerts cover the storage pods only and read both the CDC and the legacy metric names"
keywords:
  - buildbarn
  - buildbarn-helm-chart
  - helm-chart
  - bazel
  - bazel-remote-cache
  - remote-cache
  - remote-execution
  - rbe
  - reapi
  - cas
  - kubernetes
  - build-cache
  - chromium-siso
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
