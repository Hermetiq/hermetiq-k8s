apiVersion: v2
name: buildbarn
description: Production-ready Buildbarn Helm chart for Kubernetes — remote cache (CAS/AC), remote build execution (RBE), and bb-browser/portal for Bazel and other REAPI clients. Maintained by Hermetiq.
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 1.0.1
appVersion: "20261118T120531Z"
annotations:
  artifacthub.io/displayName: Buildbarn Helm Chart
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: "Stage independently named storage with deploymentMode=storage-only, then point a full release at it with storage.enabled=false and storage.name"
    - kind: added
      description: "With storage.enabled=false, install and upgrade are refused when StatefulSet storage.name is missing, is owned by the same release or runs a different number of replicas; upgradeChecks.skipExternalStorageCheck skips the check"
    - kind: added
      description: "Storage topology spread constraints support placement across zones"
    - kind: changed
      description: "The grpc-cache-proxy sidecar image tag is v1.0.1; the pinned digest is unchanged"

keywords:
  - buildbarn
  - buildbarn-helm-chart
  - helm-chart
  - bazel
  - bazel-remote-cache
  - remote-cache
  - remote-execution
  - rbe
  - reapi
  - cas
  - kubernetes
  - build-cache
  - chromium-siso
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
