apiVersion: v2
name: buildbarn
description: Production-ready Buildbarn Helm chart for Kubernetes — remote cache (CAS/AC), remote build execution (RBE), and bb-browser/portal for Bazel and other REAPI clients. Maintained by Hermetiq.
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 1.0.2
appVersion: "20261118T120531Z"
annotations:
  artifacthub.io/displayName: Buildbarn Helm Chart
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: fixed
      description: "Frontend rollouts retain active RPCs with graceful gRPC shutdown, ordered proxy/backend draining and configurable shutdown budgets; install this fix while clients are idle because old pods retain their previous shutdown behavior"
    - kind: changed
      description: "The grpc-cache-proxy sidecar uses v1.0.2; its digest is resolved and pinned when the chart is published"
    - kind: added
      description: "Document workload sizing and size the Ubuntu worker example for the chunk cache"

keywords:
