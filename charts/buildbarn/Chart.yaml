apiVersion: v2
name: buildbarn
description: Production-ready Buildbarn Helm chart for Kubernetes — remote cache (CAS/AC), remote build execution (RBE), and bb-browser/portal for Bazel and other REAPI clients. Maintained by Hermetiq.
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.10.0
appVersion: "20261112T085002Z"
annotations:
  artifacthub.io/displayName: Buildbarn Helm Chart
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: "Update Buildbarn images and Jsonnet configurations to the FastCDC chunked CAS storage model (chunkStorage, chunkMappingStorage, nested keyLocationMap, bb-portal top-level database and authorizers, and workerImage/runnerInstallerImage defaults in buildbarn-worker-config)"
    - kind: changed
      description: "Breaking: raw Jsonnet supplied through configOverrides, a custom common.libsonnet or RbeWorker spec.config.files must use the CDC schema; upgrades fail with the field to change and a link to the manual steps"
    - kind: added
      description: "helm upgrade requires bb-worker-operator v0.3.14 or later and, when bep-nats runs in the release namespace, a hermetiq release after 0.9.8; upgradeChecks.operatorNamespace locates an operator in another namespace"
    - kind: changed
      description: "Scheduler handover and configurationReloadInterval are rejected with the CDC blobstore until the fork scheduler supports CDC (scheduler.handover.cdcCompatibleFork)"
keywords:
  - buildbarn
  - buildbarn-helm-chart
  - helm-chart
  - bazel
  - bazel-remote-cache
  - remote-cache
  - remote-execution
  - rbe
  - reapi
  - cas
  - kubernetes
  - build-cache
  - chromium-siso
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
