# Install this chart into the operator namespace with `helm install -n <namespace>`.
# RbeWorker custom resources can be created in any namespace the operator watches.
namespaceOverride: ""
createNamespace: false

# Single namespace the manager watches, passed as --watch-namespace. Empty (the
# default) watches all namespaces, which is what rbac.managerBindingMode=cluster
# grants.
#
# Required for legacy rbac.managerBindingMode=namespace. With
# rbac.mode=namespace the chart sets the effective watch to its release
# namespace automatically; any explicit watchNamespace must match it.
#
# Requires an operator image that accepts --watch-namespace. Older images exit
# with "flag provided but not defined", so change this together with image.tag.
watchNamespace: ""

global:
  imageRegistry: ""
  imagePullSecrets: []

replicaCount: 1
revisionHistoryLimit: 5
minReadySeconds: 5

image:
  repository: us-docker.pkg.dev/hermetiq-cloud/hermetiq-public/bb-worker-operator
  # Empty => Chart.appVersion. The CRD shipped in crds/ and the operator binary
  # must move together: the CRD is what ACCEPTS a field, the binary is what acts
  # on it. A chart whose CRD is newer than its image installs fields the operator
  # silently ignores — no error, the feature just never appears in the generated
  # worker Jsonnet.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}
extraObjects: []

standardLabels:
  appVersion: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The controller needs a Kubernetes API token to watch RbeWorker resources and
  # reconcile Deployments, ConfigMaps, and KEDA ScaledObjects.
  automountServiceAccountToken: true

rbac:
  create: true
  # namespace creates only Roles/RoleBindings and automatically scopes the
  # manager watch to the release namespace. Disable secure metrics or the
  # metrics endpoint in this mode; Kubernetes TokenReview needs cluster RBAC.
  # The repository's starter values (custom-values/bb-worker-operator-values.yaml)
  # use this mode.
  # cluster, the chart default for existing installs, binds the manager
  # ClusterRole with a ClusterRoleBinding: the operator ServiceAccount can
  # create, update and delete Deployments, ConfigMaps and KEDA ScaledObjects in
  # every namespace. A Deployment can run any ServiceAccount of its namespace,
  # so treat that token as cluster-admin equivalent.
  mode: cluster
  # How the manager ClusterRole is bound to the operator ServiceAccount.
  # Legacy setting for cluster mode; use mode=namespace for a fully namespaced
  # install. managerBindingMode=namespace still creates a ClusterRole.
  # - cluster: ClusterRoleBinding grants worker management across namespaces.
  # - namespace: RoleBinding grants the same ClusterRole only in the operator namespace.
  managerBindingMode: cluster
  # Create unbound RbeWorker admin/editor/viewer roles for humans or CI.
  # They are ClusterRoles in cluster mode and Roles in namespace mode.
  #
  # The editor and admin roles are equivalent to pod create in each namespace
  # where they are bound: the operator copies spec.pod, including
  # serviceAccountName, automountServiceAccountToken, securityContext and extra
  # containers and volumes, into the worker Deployment it creates. A holder can
  # therefore run privileged pods under any ServiceAccount in that namespace
  # and mount its Secrets and ConfigMaps. In rbac.mode=cluster with the
  # operator in the same namespace, that includes the operator's own
  # ServiceAccount and its cluster-wide Deployment create. Bind them only to
  # subjects you would also allow to create privileged pods there. The viewer
  # role is read-only.
  rbeWorkerRoles:
    create: true
  metricsReader:
    create: true

# Limits on what an RbeWorker spec may request, since the operator writes the
# worker Deployment and ScaledObject with its own credentials. Each setting is
# passed to the manager as an environment variable and is left unset when empty
# or false. A spec outside these limits gets Ready=False with reason
# SpecInvalid, and its existing Deployment and ScaledObject stop being updated.
# See the README's "RbeWorker spec policy" section. The variables need an
# operator image that enforces the policy; older images ignore them.
#
# The chart always sets POD_SERVICE_ACCOUNT to its ServiceAccount name, so no
# RbeWorker in the operator's namespace may run as the operator.
specPolicy:
  # spec.pod.serviceAccountName values allowed besides "default". A pod that
  # mounts its token (automountServiceAccountToken: true) also needs its
  # ServiceAccount, including "default", listed here. "*" allows any.
  # Rendered as ALLOWED_POD_SERVICE_ACCOUNTS.
  allowedPodServiceAccounts: []
  # Allow privileged: true and capabilities.add in spec.pod.extraContainers
  # and extraInitContainers. Rendered as ALLOW_PRIVILEGED_EXTRA_CONTAINERS.
  allowPrivilegedExtraContainers: false
  # Absolute node paths that hostPath volumes may use: spec.pod.extraVolumes,
  # spec.storage.workerVolume, spec.storage.casVolume,
  # spec.docker.dind.storageVolume, and a spec.storage.fuse.path other than
  # /dev/fuse. A prefix matches itself and
  # paths below it. Pools with a node-SSD hostPath CAS must set it before
  # upgrading, for example:
  #   - /mnt/stateful_partition/kube-ephemeral-ssd
  # Rendered as ALLOWED_HOST_PATH_PREFIXES.
  allowedHostPathPrefixes: []
  # KEDA ClusterTriggerAuthentication names that autoscaling trigger
  # authenticationRefs may reference. Namespaced TriggerAuthentications are
  # always allowed. "*" allows any.
  # Rendered as ALLOWED_CLUSTER_TRIGGER_AUTHENTICATIONS.
  allowedClusterTriggerAuthentications: []

leaderElection:
  enabled: true

metrics:
  enabled: true
  bindAddress: ":8443"
  containerPort: 8443
  secure: true
  authProxy:
    # Required when metrics.secure=true and controller-runtime metrics authn/authz is used.
    create: true
  cert:
    existingSecret: ""
    mountPath: /certs/metrics
    certName: tls.crt
    keyName: tls.key
  service:
    enabled: true
    type: ClusterIP
    port: 8443
    annotations: {}
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    # With metrics.secure=true the controller-runtime metrics endpoint runs its
    # authn/authz filter with anonymous access disabled, so an unauthenticated
    # scrape gets 401. Default to the scraping pod's own ServiceAccount token;
    # that ServiceAccount needs the ClusterRole from rbac.metricsReader.create
    # bound to it. Set to "" to scrape without credentials.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    # Optional replacement for bearerTokenFile, e.g.
    #   authorization: {credentials: {name: my-secret, key: token}}
    authorization: {}
    tlsConfig:
      insecureSkipVerify: true
  vmServiceScrape:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    # With metrics.secure=true the controller-runtime metrics endpoint runs its
    # authn/authz filter with anonymous access disabled, so an unauthenticated
    # scrape gets 401. Default to the scraping pod's own ServiceAccount token;
    # that ServiceAccount needs the ClusterRole from rbac.metricsReader.create
    # bound to it. Set to "" to scrape without credentials.
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    # Optional replacement for bearerTokenFile, e.g.
    #   authorization: {credentials: {name: my-secret, key: token}}
    authorization: {}
    tlsConfig:
      insecureSkipVerify: true

healthProbe:
  bindAddress: ":8081"
  port: 8081
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

otel:
  metrics:
    enabled: false
  logs:
    enabled: false
  endpoint: ""
  insecure: false
  # Defaults to the Helm fullname when empty.
  serviceName: ""
  # Comma-separated OTEL resource attributes, for example:
  # service.namespace=buildbarn,deployment.environment=prod
  resourceAttributes: ""

enableHTTP2: false
extraArgs: []
extraEnv: []

podAnnotations: {}
podLabels: {}

# Together these meet the CIS Kubernetes Benchmark v2.0.1 and Pod Security
# Standards "restricted". 65532 is the image's distroless nonroot user. Set
# runAsUser/runAsGroup to null to let the platform assign them, e.g.
# OpenShift's restricted-v2 SCC.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

terminationGracePeriodSeconds: 10
extraVolumeMounts: []
extraVolumes: []
