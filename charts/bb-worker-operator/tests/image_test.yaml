suite: operator image reference
templates:
  - templates/deployment.yaml
tests:
  # The default is the signed v1.0.0 image index recorded in that release's
  # release-images.json, pulled by digest.
  - it: pulls the signed v1.0.0 image by digest by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: us-docker.pkg.dev/hermetiq-cloud/hermetiq-public/bb-worker-operator:v1.0.0@sha256:edba1e563dc6dc428f00d1e904ace652a59c2589109125e48c96c324260aaddf

  - it: keeps the pinned digest even when a different tag is set
    set:
      image.tag: v0.3.13
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ':v0\.3\.13@sha256:edba1e563dc6dc428f00d1e904ace652a59c2589109125e48c96c324260aaddf$'

  - it: pulls by tag when the digest is cleared with null
    set:
      image.digest: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: us-docker.pkg.dev/hermetiq-cloud/hermetiq-public/bb-worker-operator:v1.0.0

  - it: accepts a digest written with a leading @
    set:
      image.digest: "@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ':v1\.0\.0@sha256:a{64}$'

  - it: keeps the pinned digest behind a registry mirror
    set:
      global.imageRegistry: mirror.example.com
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^mirror\.example\.com/.*bb-worker-operator:v1\.0\.0@sha256:edba1e563dc6dc428f00d1e904ace652a59c2589109125e48c96c324260aaddf$'

  - it: carries no capability annotation
    asserts:
      - notExists:
          path: metadata.annotations
