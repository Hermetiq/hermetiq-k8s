suite: bb-worker-operator pod and container securityContext
templates:
  - templates/deployment.yaml
tests:
  # CIS Kubernetes Benchmark v2.0.1 (5.2.x, 5.6.x) and PSS "restricted",
  # set explicitly rather than left to runtime defaults.
  - it: sets the restricted pod and container securityContext
    asserts:
      - isSubset:
          path: spec.template.spec.securityContext
          content:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
      - isSubset:
          path: spec.template.spec.containers[0].securityContext
          content:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  - it: omits UIDs set to null so OpenShift can assign them
    set:
      podSecurityContext.runAsUser: null
      podSecurityContext.runAsGroup: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.runAsUser
      - notExists:
          path: spec.template.spec.securityContext.runAsGroup
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
