{{- if and .Values.metrics.enabled .Values.metrics.service.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bb-worker-operator.fullname" . }}
  namespace: {{ include "bb-worker-operator.namespace" . }}
  labels:
    {{- include "bb-worker-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- include "bb-worker-operator.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "bb-worker-operator.namespace" . }}
  selector:
    matchLabels:
      {{- include "bb-worker-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ include "bb-worker-operator.metricsPortName" . }}
      path: {{ .Values.metrics.serviceMonitor.path | quote }}
      scheme: {{ include "bb-worker-operator.metricsScheme" . }}
      interval: {{ .Values.metrics.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | quote }}
      {{- if .Values.metrics.secure }}
      {{- with .Values.metrics.serviceMonitor.authorization }}
      authorization:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.metrics.serviceMonitor.bearerTokenFile }}
      bearerTokenFile: {{ . | quote }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
