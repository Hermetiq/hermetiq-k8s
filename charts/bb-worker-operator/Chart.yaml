apiVersion: v2
name: bb-worker-operator
description: Buildbarn worker pool operator for Kubernetes
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.3.9
appVersion: "v0.3.10"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: "Use bb-worker-operator v0.3.10"
    - kind: fixed
      description: "Custom pod labels on an RbeWorker can no longer override the operator's selector labels, which caused worker Deployment creation or updates to fail"
    - kind: fixed
      description: "Percent-encoded values in OTEL_RESOURCE_ATTRIBUTES are now decoded, matching standard OpenTelemetry behavior"
keywords:
  - buildbarn
  - bazel
  - remote-execution
  - operator
  - rbe
  - toolchain
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
