apiVersion: v2
name: bb-worker-operator
description: Buildbarn worker pool operator for Kubernetes
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 1.0.0
appVersion: "v1.0.0"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: operator v1.0.0 generates worker configuration for Buildbarn's CDC storage only. Run it with the Buildbarn 1.0.0 chart and upgrade the two in one maintenance window; against a pre-CDC Buildbarn, workers stop at startup with an error naming the cause"
    - kind: changed
      description: "spec.images.worker and spec.images.runnerInstaller are optional; when unset, the operator uses the workerImage and runnerInstallerImage keys of the referenced config ConfigMap. Apply the updated CRD before upgrading"
    - kind: changed
      description: "The chart version moves to 1.0.0 with the Hermetiq and Buildbarn charts and follows 0.3.12. The default image is pinned to the signed v1.0.0 digest"
    - kind: changed
      description: "The repository's starter values now install the operator namespace-scoped (rbac.mode=namespace, metrics.secure=false), matching the installation guide. The chart default stays rbac.mode=cluster. Adopting them serves metrics over plain HTTP: the metrics Service port is renamed https to http and the metrics-reader ClusterRole is removed, so update any scrape configuration that names the https port or scheme"
    - kind: security
      description: "Document that RbeWorker editor and admin roles control privileged worker pods subject to specPolicy, and that cluster mode grants the operator ServiceAccount Deployment create in every namespace"
    - kind: added
      description: "Install notes warn when the operator runs with a cluster-wide manager binding"
keywords:
  - buildbarn
  - bazel
  - remote-execution
  - operator
  - rbe
  - toolchain
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
