apiVersion: v2
name: bb-worker-operator
description: Buildbarn worker pool operator for Kubernetes
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.3.13
appVersion: "v0.3.14"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: "Use bb-worker-operator v0.3.14: generated worker configs follow the Buildbarn chart's common.libsonnet shape, emitting the CDC chunkStorage/chunkMappingStorage blobstore when it is present and the pre-CDC blobstore otherwise"
    - kind: added
      description: "spec.images.worker and spec.images.runnerInstaller are optional; when unset, the operator uses the workerImage and runnerInstallerImage keys of the referenced config ConfigMap"
    - kind: added
      description: "The operator Deployment carries hermetiq.com/cdc-compatible=true, which the buildbarn chart's CDC upgrade guard requires"
    - kind: changed
      description: "Upgrading restarts every generated-config worker pool once, because the embedded worker-common.libsonnet changed; pre-CDC worker configs evaluate unchanged"
keywords:
  - buildbarn
  - bazel
  - remote-execution
  - operator
  - rbe
  - toolchain
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
