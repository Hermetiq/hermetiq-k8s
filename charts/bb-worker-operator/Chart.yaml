apiVersion: v2
name: bb-worker-operator
description: Buildbarn worker pool operator for Kubernetes
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.3.11
appVersion: "v0.3.11"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: "The repository's starter values now install the operator namespace-scoped (rbac.mode=namespace, metrics.secure=false), matching the installation guide. The chart default stays rbac.mode=cluster"
    - kind: security
      description: "Document that the RbeWorker editor and admin roles are equivalent to privileged pod create with any ServiceAccount in their namespace, and that cluster mode gives the operator ServiceAccount Deployment create in every namespace"
    - kind: added
      description: "Install notes warn when the operator runs with a cluster-wide manager binding"
    - kind: added
      description: "specPolicy values (allowedPodServiceAccounts, allowPrivilegedExtraContainers, allowedHostPathPrefixes, allowedClusterTriggerAuthentications) configure the operator's RbeWorker spec policy, and the manager gets POD_SERVICE_ACCOUNT from the chart's ServiceAccount. Pools with hostPath CAS or worker volumes must set specPolicy.allowedHostPathPrefixes before moving to an operator image that enforces the policy"
keywords:
  - buildbarn
  - bazel
  - remote-execution
  - operator
  - rbe
  - toolchain
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
