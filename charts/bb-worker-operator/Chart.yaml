apiVersion: v2
name: bb-worker-operator
description: Buildbarn worker pool operator for Kubernetes
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 1.0.0
appVersion: "v0.3.14"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: "The chart version moves to 1.0.0 with the Hermetiq and Buildbarn charts. It follows 0.3.12 and deploys operator v0.3.14"
    - kind: added
      description: "Generated worker configuration follows the Buildbarn chart: the CDC chunkStorage and chunkMappingStorage blobstore when common.libsonnet uses it, and the pre-CDC blobstore otherwise"
    - kind: changed
      description: "spec.images.worker and spec.images.runnerInstaller are optional; when unset, the operator uses the workerImage and runnerInstallerImage keys of the referenced config ConfigMap. Apply the updated CRD before upgrading"
    - kind: added
      description: "The Deployment declares hermetiq.com/cdc-compatible for the pinned image digest, which the Buildbarn 1.0.0 chart requires; custom images need buildbarnCdcCompatible=true"
    - kind: changed
      description: "Upgrading restarts every generated-config worker pool once"
keywords:
  - buildbarn
  - bazel
  - remote-execution
  - operator
  - rbe
  - toolchain
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
