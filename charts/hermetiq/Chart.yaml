apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.8
appVersion: "0.9.8"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Hermetiq Software License Agreement
      url: https://github.com/Hermetiq/hermetiq-k8s/blob/main/charts/hermetiq/SOFTWARE-LICENSE-AGREEMENT.md
  # Keep track 0.9.9 changes here (we'll bump the chart version in the release PR when we're ready to release 0.9.9)
  artifacthub.io/changes: |
    - kind: security
      description: "Require explicit shared browser login admission and default the Grafana starter to Viewer with backend network isolation"
    - kind: fixed
      description: "Preserve dashboard gRPC-web through Envoy Gateway and the authenticated BFF to prevent HTTP 505 responses"
    - kind: fixed
      description: "Give same-origin dashboard API calls and assistant streams the configured Envoy Gateway timeout headroom"
    - kind: added
      description: "Add an explicit buildbarnCdcCompatible declaration for verified dual-schema bep-nats images; existing default images are not automatically declared compatible"
    - kind: fixed
      description: "Keep Buildbarn dashboards usable with legacy CAS and CDC chunk storage, add separate chunk-mapping views, and test shipped queries against old/new/mixed metrics"
    - kind: fixed
      description: "Bound worker-pool CPU and memory queries during pod churn"
    - kind: fixed
      description: "Correct the Buildbarn object-size panel descriptions: on CDC storage the panels show the size named in the request digest (the whole blob for CMS, the action message for AC, ISCC, and FSAC, the uncompressed chunk for CS), not the stored entry"
    - kind: added
      description: "Require project authorization with viewer, builder and admin roles, optional SCIM provisioning, independent JWT trust profiles, and a same-origin dashboard BFF"
    - kind: fixed
      description: "Allow independent publisher signing keys and configurable JWKS rotation; document required image and access migration"
keywords:
  - hermetiq
  - MCP
  - nats
  - bazel BEP
  - build analytics
  - build engineer AI agent
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
