apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.3
appVersion: "0.9.4"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Hermetiq Software License Agreement
      url: https://github.com/Hermetiq/hermetiq-k8s/blob/main/charts/hermetiq/SOFTWARE-LICENSE-AGREEMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "Default to namespace RBAC; require a stable license fingerprint override"
    - kind: changed
      description: "Derive Browser and Grafana URLs from hosts.domainBase"
    - kind: fixed
      description: "Disable unused cert-manager and Secret permissions by default"
    - kind: changed
      description: "Update the OAuth2 proxy image"
    - kind: fixed
      description: "Set APP_ENV=on-prem on subscriber pods"
    - kind: added
      description: "Roll pods when managed ConfigMaps or Secrets change"
    - kind: changed
      description: "Set ALPN on Gateway traffic policy and allow unhealthy pod eviction"
keywords:
  - hermetiq
  - MCP
  - nats
  - bazel BEP
  - build analytics
  - build engineer AI agent
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
