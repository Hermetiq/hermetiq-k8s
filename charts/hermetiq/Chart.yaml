apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
home: https://www.hermetiq.com
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.0
appVersion: "0.9.0"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Hermetiq Software License Agreement
      url: https://github.com/Hermetiq/hermetiq-k8s/blob/main/charts/hermetiq/SOFTWARE-LICENSE-AGREEMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "Allow storage MCP tools to read namespaced Pod placement without granting cluster-scoped node access"
    - kind: changed
      description: "Document what rbac.rules.rbeWorkers grants and what it costs to turn off: the list_rbe_workers and get_rbe_worker tools report not_permitted rather than failing, and nothing else degrades"
    - kind: fixed
      description: "Resync the bundled PromQL queries with the ones the bep-nats binary ships: the chart was pinning an older schedulerCompletedByCode that dropped the result label, and because the ConfigMap overlays the binary's defaults that stale query won even on an updated image"
keywords:
  - hermetiq
  - MCP
  - nats
  - bazel BEP
  - build analytics
  - build engineer AI agent
maintainers:
  - name: Hermetiq
