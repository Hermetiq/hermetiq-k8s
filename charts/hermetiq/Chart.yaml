apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.8
appVersion: "0.9.6"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Hermetiq Software License Agreement
      url: https://github.com/Hermetiq/hermetiq-k8s/blob/main/charts/hermetiq/SOFTWARE-LICENSE-AGREEMENT.md
  artifacthub.io/changes: |
    - kind: security
      description: "Admit only grafana-oauth2-proxy and vmagent to the Grafana pod with a new grafana-from-oauth2-proxy NetworkPolicy, rendered with the Grafana proxy (opt out with grafana.networkPolicy.enabled=false), because Grafana's auth.proxy trusts X-Forwarded-User from any caller"
    - kind: security
      description: "Forward only gateway.routes.bepGrpcServices (default google.devtools.build.v1.PublishBuildEvent) on the public BEP route for every routing provider, so a gateway or ingress proxy can no longer relay internet CompletedActionLogger calls into the publisher's trustedCalCidrs exemption"
    - kind: security
      description: "Remove caller-supplied X-Forwarded-User, X-Forwarded-Email, X-Forwarded-Groups, X-Forwarded-Preferred-Username and X-Hermetiq-Project-Id on the public api-web route (gateway.routes.apiWebRemoveRequestHeaders; opt in on Ingress with ingress.apiWeb.stripIdentityHeaders)"
    - kind: changed
      description: "Document that publisher.trustedCalCidrs must name only the Buildbarn worker range and exclude gateway and ingress proxy pods"
keywords:
  - hermetiq
  - MCP
  - nats
  - bazel BEP
  - build analytics
  - build engineer AI agent
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
