apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
version: 0.6.6
appVersion: "0.6.0"
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: gRPC authentication moved out of the grpc-auth-proxy sidecar and into the bep-nats core, which reads a new GRPC_AUTH_* environment family. The legacy JWKS_* variables were removed from the application outright with no aliases, so this chart version is required by the matching image - the core no longer reads JWKS_AUTH_ENABLED, JWKS_URL, JWKS_ISSUER, JWKS_AUDIENCE, JWKS_KEY_FILE, or JWKS_GROUPS_CLAIM at all. Every core that serves gRPC now renders GRPC_AUTH_USER_PROVIDER (new value app.grpcAuthUserProvider, default "jwks"; the process refuses to start without it), and api.jwt.* / publisher.jwks.* render as GRPC_AUTH_JWKS_URL, GRPC_AUTH_JWKS_FILE, GRPC_AUTH_ISSUER, GRPC_AUTH_AUDIENCE, and GRPC_AUTH_GROUPS_CLAIM. There is no replacement for the *_AUTH_ENABLED boolean - selecting the provider is what turns verification on, so api.jwt.enabled and publisher.jwks.enabled now decide only whether the chart supplies the JWKS settings. The api pods keep the sidecar for gRPC-web framing and CORS, and its own JWT_* variables are unchanged.
    - kind: added
      description: New publisher.trustedCalCidrs value, rendered as GRPC_AUTH_TRUSTED_CAL_CIDRS on the publisher core. Buildbarn workers stream completed actions to bep-nats-pub:50091 directly and present no user credential, so network position is now the only thing that admits them. LEAVING IT EMPTY DISABLES CAL INGEST - the exemption fails closed, every CAL call is rejected with UNAUTHENTICATED, and remote-execution action telemetry silently stops arriving. Set it to the cluster pod CIDR or the narrower range the Buildbarn workers run in. It ships empty because the chart cannot guess a safe default. GRPC_AUTH_TRUSTED_XFCC_CIDRS is deliberately never set, since nothing in this chart terminates mTLS in front of bep-nats.
    - kind: fixed
      description: The api core's token audience now lists both the MCP resource URL and the gRPC API audience, comma-separated, because one process authenticates both callers and they carry different audiences. Previously JWKS_AUDIENCE carried only the MCP resource URL, which was correct while the sidecar authenticated gRPC traffic separately. The gRPC half is api.jwt.audience when set, and otherwise the dashboard oauth2-proxy client ID - that lives in a Secret, so it is injected as GRPC_AUTH_AUDIENCE_CLIENT_ID and interpolated with the kubelet's $(VAR) expansion. Templating now fails when api.jwt.enabled=true, dashboard.oauth2Proxy.enabled=false, and api.jwt.audience is unset, because the list would carry only the MCP audience and every gRPC API token would be rejected.
    - kind: changed
      description: GRPC_AUTH_ISSUER and GRPC_AUTH_AUDIENCE are mandatory for the jwks provider, where the JWKS_* equivalents were optional and an unset value meant "accept any" - which let any token signed by any key in the keyset through. api.jwt.enabled and publisher.jwks.enabled now default true for chart-managed JWKS. When either is disabled, validate.yaml instead requires that component's env map to provide exactly one non-empty GRPC_AUTH_JWKS_URL, GRPC_AUTH_JWKS_FILE, or GRPC_AUTH_JWKS_INLINE plus non-empty GRPC_AUTH_ISSUER and GRPC_AUTH_AUDIENCE. The chart refuses to render either core with an incomplete or mixed managed/custom contract, rather than letting the pod CrashLoopBackOff. publisher.jwks.audience in particular was commonly left empty and must now be set.
    - kind: changed
      description: The core strips X-Forwarded-User and every other caller-supplied identity header before authenticating, closing a gap where a caller could self-assert groups (which grant admin) and have them survive to the backend. This retires publisher.authProxy.staticForwardedUser as an authentication mechanism - the static user the sidecar injects is now discarded, so publisher pods configured that way reject BEP ingest. The values are retained so existing installs can upgrade without a values rewrite, but such deployments must move to publisher.jwks against a real IdP, or supply the GRPC_AUTH_* variables through publisher.env. Admin resolution by group now also reads GRPC_AUTH_ADMIN_GROUP and GRPC_AUTH_ADMIN_EMAIL_ALLOWLIST, which the chart renders alongside the existing HERMETIQ_ADMIN_GROUP and ADMIN_EMAIL_ALLOWLIST from the same values.
    - kind: added
      description: Grant the chart ServiceAccount namespaced read-only get/list access to bb.hermetiq.com RbeWorker objects by default, gated by rbac.rules.rbeWorkers, so grpc-api can discover worker pools for cost and behavior reporting.
    - kind: changed
      description: Add stable Kubernetes application labels to chart-managed Pods, component labels to workload-related resources, configurable podLabels, and namespaced stream-partition labels while preserving all legacy selectors.
    - kind: changed
      description: Enable maxUnavailable=1 PodDisruptionBudgets and preferred hostname pod anti-affinity by default for grpc-api and bep-nats-pub.
    - kind: added
      description: Report each chart-managed external endpoint in NOTES.txt with its https:// or grpcs:// scheme and active routing provider.
    - kind: fixed
      description: Propagate app.costReportTickerEnabled to the dashboard so OpenCost-dependent navigation, reports, charts, and pricing fields are hidden when the backend integration is disabled.
    - kind: added
      description: License enforcement and self-serve trials (Keygen-backed). New required value license.contactEmail (validated as an email; templating fails without it) plus a license block - key.value/key.existingSecret/key.existingSecretKey for a paid key (mounted read-only at /config/license with hot reload), trial.enabled (default true) to auto-issue a 30-day trial via the Hermetiq SaaS when no key is configured, airGapped for offline license-file mode (requires a key Secret carrying licenseFileSecretKey and forbids trials), fingerprintOverride, and saasUrl. Enforcement is probe-based and off the request path - when a license lapses past its grace window the grpc-api and bep-nats-pub pods go unready on a "license" readiness check and CrashLoopBackOff on restart until a valid key is installed; subscribers and the dashboard are unaffected. A new NOTES.txt documents the trial flow and the /api/v1/license/status diagnosis endpoint.
    - kind: added
      description: Two license RBAC grants, both enabled by default and individually gated. rbac.rules.clusterFingerprint renders the chart's first ClusterRole+ClusterRoleBinding - `get` on the kube-system Namespace object only (resourceNames-scoped) - whose UID is the stable cluster fingerprint for license identity; it cannot list namespaces or read anything inside kube-system, and disabling it falls back to the weaker own-namespace UID fingerprint. rbac.rules.licenseState renders a namespaced Role+RoleBinding letting the app write the single hermetiq-license-state Secret (trial key and signed validation cache; get/update/patch resourceNames-scoped plus bare create) and read its own Namespace object as the fallback fingerprint.
    - kind: changed
      description: The grpc-api Deployment now runs APP_MODE=api instead of pub, sharpening roles - the api pod serves query/MCP/REST only and drops its NATS dependency, and BES ingest is served exclusively by the bep-nats-pub Service (all bep routes already targeted it). The optional bbcal route (gateway.routes.bbcalGrpcEnabled) now targets bep-nats-pub instead of grpc-api, because the CompletedActionLogger service publishes to NATS and no longer exists on the api pod.
    - kind: changed
      description: Tune the packaged build-tool and progress JetStream consumers to the validated high-throughput profile - larger bounded pulls and ACK-pending budgets, 50 build-tool affinity workers, 1,000-event/5ms mixed-invocation SQL coalescing across 24 lanes, a three-minute build-tool acknowledgement deadline, and independently sized progress consumption. Stream topology, durability, and build_tool invocation-start mode are unchanged.
    - kind: fixed
      description: Extend gateway.timeouts to the mcp and api-web HTTPRoutes (gateway.timeouts.mcp, gateway.timeouts.apiWeb, both 300s). Only the three gRPC routes were covered, so on routing.provider=gateway the dashboard's REST/gRPC-web traffic and MCP tool calls kept Envoy Gateway's 15s default route timeout. The timeouts render into each route's existing health-check BackendTrafficPolicy, so no additional policies are created.
    - kind: fixed
      description: Suffix the schema bootstrap Job name with the release revision and add bootstrap.ttlSecondsAfterFinished when bootstrap.hook.enabled=false. As an ordinary release resource the Job kept a fixed name, and a Job's spec.template is immutable, so a later helm upgrade failed with "field is immutable". Hook mode is unchanged.
    - kind: fixed
      description: Roll the api, publisher, and subscriber pods when the shared env ConfigMap (bep-nats-shared-env) changes, via a new hermetiq.com/shared-env-checksum pod annotation. Every consumer reads that ConfigMap through envFrom, which the kubelet never re-reads after container start, so a values-only upgrade that changed nats.url, redis.host, otel.*, postgres.sslMode, app.invocationStartEvent, app.streamPartitionCount, app.environment, app.rawBepExportEnabled, or app.normalizeRepoUrls rewrote the ConfigMap and left the running pods on the old values indefinitely with no error.
    - kind: fixed
      description: Render the oauth2-proxy-config-web-ui ConfigMap whenever either oauth2-proxy consumes it, not just when dashboard.oauth2Proxy.enabled. Both the dashboard sidecar and the standalone Grafana oauth2-proxy reference it through a non-optional envFrom, so enabling only the Grafana proxy (grafana.oauth2Proxy.enabled with gateway.routes.grafanaEnabled, both default true) left that pod in CreateContainerConfigError.
    - kind: fixed
      description: Stop passing --retention-days to the partition-maintenance CronJob. dbadmin run-maintenance treats the flag as deprecated, logs "WARNING - run-maintenance --retention-days=N is ignored", and reads retention from public.part_config, so every run emitted a warning and bootstrap.retentionDays appeared adjustable after first bootstrap when it is not. Change retention with an UPDATE on public.part_config.
    - kind: changed
      description: Projects with "Store compressed invocation logs in cloud object storage" enabled now write BEP progress logs straight to the bucket as compressed chunk objects at ingest, instead of writing Postgres progress rows and compressing them later in a background ticker. The progresses table stays essentially empty for those projects, and the background log-compression ticker and the logs table it wrote are gone. Two operator requirements come with it - subscriber pods need bucket access (the shared chart ServiceAccount plus azureWorkloadIdentity/gcpWorkloadIdentity, and network egress to the storage endpoint) and the bucket needs its own lifecycle/TTL rule scoped to the <prefix>/progress/ key prefix, because Hermetiq never deletes these objects and retention is now the bucket's TTL rather than a database window. Log reads prefer objects and fall back to progress rows for invocations that have none, so invocations from before the setting was enabled stay readable. If the bucket is unreachable, subscribers keep ingesting by writing progress rows to Postgres — watch hermetiq_progress_chunk_flush_total{outcome="spilled"}. Chunk sizing is tunable via PROGRESS_BLOB_CHUNK_FLUSH_INTERVAL, PROGRESS_BLOB_CHUNK_MAX_BYTES, and PROGRESS_BLOB_CHUNK_MAX_EVENTS on subscriber.env. Projects left on the Postgres default are unaffected.
    - kind: changed
      description: Raise public.progresses retention from 8 hours to 2 days, applied by the schema bootstrap Job on upgrade. Progress rows used to be a short-lived staging tier behind the 30-day compressed logs table; with that tier gone they are the only database copy of a build's stdout/stderr, and this retention is what bounds how far back logs can be read for projects that do not store progress logs in cloud object storage. Expect roughly 6x the progress-row volume on disk and check database headroom before upgrading. Raise it further with a part_config update on public.progresses if you need longer in-database log history.
    - kind: removed
      description: Removed the background log-compression ticker and all reads and writes of the public.logs table, which previously held a separate 30-day compressed copy of each build's stdout/stderr. Build logs are now served only from the project's chosen progress storage, so log availability equals that window - roughly 8 hours for the default Postgres mode (the public.progresses partition window) or the bucket's lifecycle age for projects using cloud object storage. After upgrading, logs for builds older than that window return empty; new builds are unaffected. The logs table is left in place so its historical contents remain queryable until you choose to drop it. Enable cloud object storage per project for long-term log retention, or raise the pg_partman retention on public.progresses if you would rather keep logs in Postgres and can size the database for the extra volume.
    - kind: changed
      description: Progress logs written to cloud object storage are now best effort. Progress messages are acked as soon as their text is buffered in memory and chunk objects upload asynchronously on a worker pool, so nothing on the ack path waits for the storage provider. Records still buffered when a subscriber pod is killed are lost, as are records shed when the in-memory buffer or the upload queue is full (both counted as outcome="dropped" on hermetiq_progress_chunk_flush_total, with hermetiq_progress_chunk_buffered_records and hermetiq_progress_chunk_upload_queue_depth showing the writer falling behind). This is deliberate for Bazel console output, which arrives at a multiple of every other event type's rate; build results, targets, tests, and metrics remain fully durable. Tunable via PROGRESS_BLOB_UPLOAD_WORKERS, PROGRESS_BLOB_UPLOAD_QUEUE_DEPTH, and PROGRESS_BLOB_BUFFER_MAX_BYTES on subscriber.env.
    - kind: changed
      description: Set the first-bootstrap Postgres partition defaults for all partitioned tables to 6-hour intervals, 30 days of retention, and premake 30.
    - kind: fixed
      description: Set explicit Envoy Gateway stream timeouts on the BEP, API, and optional bbcal gRPC routes (gateway.timeouts, routing.provider=gateway only). These routes previously carried no timeout override, so Envoy applied its 15s default route timeout — the only provider this chart supports that left them capped by omission, since Contour already applies contour.httpProxy.responseTimeout and GKE gateway.gke.backendPolicy.timeoutSec (both 300s) to the same backends. The BEP route now disables the request timeout and max stream duration, because Envoy's route timer starts at the client's half-close and would otherwise cap the drain where Bazel blocks waiting for the publisher to ack remaining events under the default --bes_upload_mode=wait_for_upload_complete; bound it with Bazel's --bes_timeout instead. The unary API route is bounded at 300s to match the other providers. The bbcal route, which is handed to users as their Bazel --remote_cache endpoint, gets the same streaming treatment as the Buildbarn frontend because server-streaming ByteStream/Read is capped in full by the 15s default. Timeouts render into each route's existing BackendTrafficPolicy rather than new resources, since Envoy Gateway applies the oldest of several same-level policies and marks the rest Overridden. Set gateway.timeouts.enabled=false to restore the previous behavior.
    - kind: added
      description: Add an opt-in Envoy Gateway ClientTrafficPolicy (gateway.clientTrafficPolicy, routing.provider=gateway only) tuning the downstream leg for high-RTT clients — raises the per-connection buffer limit off Envoy Gateway's 32Ki default, lifts the HTTP/2 stream and connection flow-control windows and max concurrent streams, adds TCP keepalives, and lengthens the request-based HTTP idle timeout. Being Gateway-scoped it covers every route on the listener, including the buildbarn chart's, and is the preferred place to enable this when both charts share a Gateway. Enable it in only one chart — ClientTrafficPolicy resources do not merge.
    - kind: fixed
      description: Render the dashboard Quickstart remote cache URL from dashboard.remoteCacheUrl, defaulting on-prem to the Buildbarn frontend gRPC host instead of allowing the web UI to fall back to the Hermetiq SaaS cache.
    - kind: fixed
      description: Disable the OpenCost-backed cost report ticker by default for on-prem installs and wire cost report settings through app.costReportTickerEnabled and app.openCostUrl.
    - kind: added
      description: Allow the packaged NATS stream and consumer config to be replaced by an externally managed ConfigMap via nats.streamConfig.existingConfigMap, configMapKey, and rolloutChecksum.
    - kind: fixed
      description: Improve graceful shutdown of publisher pods with open BEP streams.
    - kind: fixed
      description: Set APP_ENV=on-prem on the API container so on-prem MCP and query paths consistently use the default project and on-prem feature gating.
    - kind: fixed
      description: Treat expired or invalid oauth2-proxy sessions as unauthenticated in the auth proxy and dashboard, triggering logout/login recovery and clearing cached auth/project state instead of leaving the web UI stuck on permission-denied errors.
    - kind: changed
      description: Hide the SaaS-only AI-agent Bazel configuration step from on-prem Quickstart pages because the MCP Quickstart tool is not available on-prem.
    - kind: changed
      description: Gate on-prem MCP tools for optional integrations - cache-event tools are hidden when cache events are disabled, VictoriaLogs-backed Buildbarn event/log tools are hidden when VictoriaLogs is disabled, and OpenCost tools are hidden outside cloud deployments.
    - kind: fixed
      description: Remove platform filtering from Buildbarn scheduler dashboards while preserving platform grouping, add RBAC regression coverage for Buildbarn config discovery, and improve MCP/query behavior for on-prem cache-event and user/project lookup flows.
    - kind: added
      description: Add BEP TestSummary ingestion with a new test_summaries analytics projection for target-level test status, timing, cache counts, run counts, shards, attempts, and summary outputs.
    - kind: added
      description: Capture richer invocation metadata from StructuredCommandLine and BuildMetadata, including remote download mode, upload-local-results, visibility, run IDs, parent run IDs, and tags.
    - kind: added
      description: Expose action/test/target configuration IDs and mark root-cause targets from failed TargetComplete action children for better failure attribution.    
    - kind: fixed
      description: Scope Build History filter option loading to the selected time range, so distinct filter values match the active filter panel instead of a fixed backend window.
    - kind: changed
      description: Move branch and build user filters to time-range-scoped type-ahead lookup, and support multi-select for branch, build user, and role filters.
    - kind: fixed
      description: Recompute stale cached empty build-list responses so cached zero-result pages do not hide newly available builds.
    - kind: fixed
      description: Align API Gateway health checks with the actual backend protocols by using TCP checks for Envoy Gateway gRPC routes, unauthenticated HTTP readiness/metadata checks for Envoy Gateway HTTP routes, and a fixed /ready probe on port 8008 for the GKE API Service HealthCheckPolicy.
    - kind: added
      description: Allow cache TTL settings to be mounted from an externally managed ConfigMap via cacheTtl.existingConfigMap and cacheTtl.configMapKey, with cacheTtl.rolloutChecksum available to trigger API pod rollouts when external data changes.
    - kind: fixed
      description: Wire JWKS_* auth environment variables onto the api container so the MCP server verifies bearer tokens against the configured OIDC issuer (driven by api.jwt.*), instead of falling back to claims-based auth mode and rejecting valid tokens. Fixes MCP authentication for on-prem deployments that authenticate against an external IdP with Dynamic Client Registration.
    - kind: changed
      description: Derive the MCP server's token audience from the MCP host (api.mcpResourceUrl) and the advertised authorization server (api.mcpAuthorizationServer) from the OIDC issuer, so MCP auth needs no MCP-specific audience or resource values. api.jwt.audience now configures only the gRPC auth-proxy.
    - kind: changed
      description: Bump the bep-nats image to include server-side MCP auth handling that complements the chart changes — trailing-slash-insensitive token audience comparison, an OpenID Connect Discovery (/.well-known/openid-configuration) redirect, and redaction of bearer tokens from request logs.
    - kind: changed
      description: BEP subscribers now process events through independent per-worker pipelines instead of lock-step batches — one build streaming an unusually large volume of events no longer slows ingestion for other builds on the same partition, and fetching overlaps processing for higher sustained throughput. Fetch-ahead is bounded per consumer via workerQueueCapacity, pipelineMaxQueuedMessages, and pipelineMaxQueuedBytes in nats_streams.json, and setting NATS_BEP_WORKER_PIPELINE_ENABLED=false via subscriber.env restores the previous behavior.
    - kind: changed
      description: Modernize the packaged nats_streams.json to the interest-retention layout — a dedicated file-backed BEP_BUILD_TOOL stream (3 replicas, 30m consumer-outage backstop) carrying build-tool and progress events, a progress consumer block tuned separately from build events, explicit redelivery backoff, the 64MiB per-fetch payload cap, and maxAckPending headroom sized for the worker pipeline's double-buffer. A BEP_LIFECYCLE stream is provisioned only in the legacy app.invocationStartEvent=lifecycle mode. Memory storage remains available as an opt-in for the highest ingest volumes during production sizing and tuning. The stream migration is automatic and needs no rollout ordering - upgraded subscriber pods migrate the topology at startup, and publisher pods stay unready (rejecting BEP ingest with UNAVAILABLE) until every partition is migrated. Upgrade from chart 0.4.6, during a period of low build activity.
    - kind: changed
      description: New app.invocationStartEvent value (default "build_tool") rendered into the shared env ConfigMap as INVOCATION_START_EVENT for publisher and subscriber together. In build_tool mode invocations are created from BEP build-tool events, no BEP_LIFECYCLE streams are provisioned or required, and the lifecycle-backlog migration steps do not apply; set "lifecycle" to keep the legacy dedicated-lifecycle-stream mode. Change the mode on a live deployment only during a quiet period — a mixed-mode rollout can briefly produce duplicate invocation rows for builds starting mid-upgrade.
keywords:
  - hermetiq
  - MCP
  - nats
  - bazel BEP
  - build analytics
maintainers:
  - name: Hermetiq
