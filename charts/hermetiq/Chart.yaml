apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
home: https://www.hermetiq.com
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.1
appVersion: "0.9.2"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Hermetiq Software License Agreement
      url: https://github.com/Hermetiq/hermetiq-k8s/blob/main/charts/hermetiq/SOFTWARE-LICENSE-AGREEMENT.md
  artifacthub.io/changes: |
    - kind: added
      description: "Allow storage MCP tools to read namespaced Pod placement without granting cluster-scoped node access"
    - kind: changed
      description: "Document what rbac.rules.rbeWorkers grants and what it costs to turn off: the list_rbe_workers and get_rbe_worker tools report not_permitted rather than failing, and nothing else degrades"
    - kind: fixed
      description: "Resync the bundled PromQL queries with the ones the bep-nats binary ships: the chart was pinning an older schedulerCompletedByCode that dropped the result label, and because the ConfigMap overlays the binary's defaults that stale query won even on an updated image"
    - kind: added
      description: "Add api.mcpExposeUserIdentities (default false) to control whether the MCP server exposes developer names and emails; it sets MCP_EXPOSE_USER_IDENTITIES on the api Deployment, and an explicit api.env.MCP_EXPOSE_USER_IDENTITIES overrides it without a duplicate entry"
    - kind: fixed
      description: "Stop enabling MCP on the publisher Deployment: it set MCP_ENABLED=true plus MCP resource and proto-intel settings, starting an MCP server that no Service port or route reaches, since MCP is served only by the api Deployment"
    - kind: fixed
      description: "Accept MCP tokens issued for the <origin>/mcp resource as well as the origin, and reject an api.mcpResourceUrl that includes a path (with /mcp in it the server advertised .../mcp/mcp metadata and a 401 challenge URL it does not serve). The install notes, the dashboard Quickstart, and the Auth0 runbook now use https://mcp.<domain>/mcp, the one resource URL every MCP client sends identically"
    - kind: fixed
      description: "Point the build links MCP tools and prompts return at this install's dashboard (MCP_BUILD_DETAILS_URL defaults to <dashboard URL>/build) instead of Hermetiq Cloud's; an explicit api.env.MCP_BUILD_DETAILS_URL overrides it without a duplicate entry"
keywords:
  - hermetiq
  - MCP
  - nats
  - bazel BEP
  - build analytics
  - build engineer AI agent
maintainers:
  - name: Hermetiq
