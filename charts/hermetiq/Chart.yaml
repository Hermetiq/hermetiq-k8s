apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 0.9.2
appVersion: "0.9.3"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Hermetiq Software License Agreement
      url: https://github.com/Hermetiq/hermetiq-k8s/blob/main/charts/hermetiq/SOFTWARE-LICENSE-AGREEMENT.md
  artifacthub.io/changes: |
    - kind: changed
      description: "Use cloud-native v0.9.3 images for the API, publisher, subscribers, bootstrap jobs, auth proxy, and dashboard"
    - kind: changed
      description: "Filter the Buildbarn dashboards by a namespace variable instead of the hidden hermetiq_project_id variable, and scope their dependent dropdowns to the selected namespace. Requires Buildbarn chart 0.9.4 or later, whose recording rules aggregate by namespace"
    - kind: added
      description: "Add victoriaMetrics.projectLabel (default namespace), rendered as METRICS_PROJECT_LABEL. With victoriaMetrics.projectLabelEnabled, the MCP infrastructure tools scope queries to the project's Buildbarn namespace, or to the project ID for any other label"
