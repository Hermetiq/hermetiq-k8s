apiVersion: v2
name: hermetiq
description: Hermetiq gRPC API, MCP server, publisher, subscriber, dashboard, and DB maintenance jobs
type: application
home: https://www.hermetiq.com
icon: https://www.hermetiq.com/logo.png
sources:
  - https://github.com/Hermetiq/hermetiq-k8s
version: 1.0.0
appVersion: "1.0.0"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Hermetiq Software License Agreement
      url: https://github.com/Hermetiq/hermetiq-k8s/blob/main/charts/hermetiq/SOFTWARE-LICENSE-AGREEMENT.md
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: project authorization is always enforced. Access comes from viewer, builder and admin roles granted through authorization.groupBindings, authorization.serviceAccounts and project memberships; publishing builds needs the builder role, and app.adminEmails no longer grants admin"
    - kind: changed
      description: "Breaking: the dashboard calls the API through its own host behind oauth2-proxy, which must stay enabled, and dashboard.oauth2Proxy.emailDomains is required"
    - kind: changed
      description: "Breaking: Buildbarn configuration is read and validated in the CDC (RepMaxCDC) schema only; run with the Buildbarn 1.0.0 chart"
    - kind: changed
      description: "Default application images are v1.0.0; images from v0.9.8 and earlier are rejected at render time"
    - kind: added
      description: "Optional SCIM provisioning (api.scim), independent JWT trust profiles (api.jwt.profiles, publisher.jwks.profiles) and independent publisher signing keys with configurable JWKS refresh"
    - kind: added
      description: "With routing.provider=gateway an EnvoyPatchPolicy keeps dashboard gRPC-web intact. Envoy Gateway needs extensionApis.enableEnvoyPatchPolicy; set gateway.dashboardGrpcWeb.enabled=false for other Gateway controllers"
    - kind: changed
      description: "The dashboard is not verified behind Contour in this release: dashboard queries are expected to return HTTP 505, and the install notes say so. Envoy Gateway, nginx Ingress and GKE Gateway are not affected"
    - kind: fixed
      description: "Dashboard API calls and assistant streams get the API route timeout on every routing provider and are no longer cut at the oauth2-proxy 30-second upstream default"
    - kind: fixed
      description: "Buildbarn dashboards read CDC chunk and chunk-mapping metrics alongside legacy CAS, and worker-pool CPU and memory queries are bounded during pod churn"
    - kind: fixed
      description: "Preserve security defaults on upgrades reusing pre-hardening values, and validate custom ingress snippets only when generated header stripping would conflict"
    - kind: security
      description: "Admit only grafana-oauth2-proxy and vmagent to the Grafana pod with a new grafana-from-oauth2-proxy NetworkPolicy, retained when the public Grafana route is disabled (opt out with grafana.networkPolicy.enabled=false), because Grafana's auth.proxy trusts X-Forwarded-User from any caller"
    - kind: security
      description: "Forward only gateway.routes.bepGrpcServices (default google.devtools.build.v1.PublishBuildEvent) on the public BEP route for every routing provider, so a gateway or ingress proxy can no longer relay internet CompletedActionLogger calls into the publisher's trustedCalCidrs exemption"
    - kind: security
      description: "Remove caller-supplied X-Forwarded-User, X-Forwarded-Email, X-Forwarded-Groups, X-Forwarded-Preferred-Username and X-Hermetiq-Project-Id on the public api-web route (gateway.routes.apiWebRemoveRequestHeaders; opt in on Ingress with ingress.apiWeb.stripIdentityHeaders)"
    - kind: changed
      description: "Document that publisher.trustedCalCidrs must name only the Buildbarn worker range and exclude gateway and ingress proxy pods"
keywords:
  - hermetiq
  - MCP
  - nats
  - bazel BEP
  - build analytics
  - build engineer AI agent
maintainers:
  - name: Hermetiq
    email: support@hermetiq.com
    url: https://www.hermetiq.com
