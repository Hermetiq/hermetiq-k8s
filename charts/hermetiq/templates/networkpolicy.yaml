{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermetiq-core.apiName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
    {{- include "hermetiq-core.componentLabel" (dict "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "hermetiq-core.apiName" . }}
  policyTypes:
    - Ingress
  ingress:
    {{- /* The Service's gRPC ports target grpc-auth-proxy on 50081, so the api
         container's own 50091 is left closed. */}}
    - ports:
        - protocol: TCP
          port: 50081
        - protocol: TCP
          port: 5150
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- /* 8008 serves both the REST API (Service port 80) and /metrics, so it
         admits ingress callers and scrapers alike. */}}
    - ports:
        - protocol: TCP
          port: 8008
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- concat . ($.Values.networkPolicy.metricsFrom | default list) | toYaml | nindent 8 }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermetiq-core.publisherName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
    {{- include "hermetiq-core.componentLabel" (dict "component" "publisher") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "hermetiq-core.publisherName" . }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          {{- if eq (include "hermetiq-core.publisherAuthProxyEnabled" .) "true" }}
          port: 50081
          {{- else }}
          port: 50091
          {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - protocol: TCP
          port: 8008
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if gt (int .Values.subscriber.replicas) 0 }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bep-nats-sub
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
    {{- include "hermetiq-core.componentLabel" (dict "component" "subscriber") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app-mode: bep-nats-sub
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8008
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermetiq-core.dashboardName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
    {{- include "hermetiq-core.componentLabel" (dict "component" "dashboard") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "hermetiq-core.dashboardName" . }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          {{- if .Values.dashboard.oauth2Proxy.enabled }}
          port: 8888
          {{- else }}
          port: {{ int .Values.dashboard.appPort }}
          {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if and (eq (include "hermetiq-core.grafanaOauth2ProxyEnabled" .) "true") .Values.gateway.routes.grafanaEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermetiq-core.grafanaOauth2ProxyName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
    {{- include "hermetiq-core.componentLabel" (dict "component" "grafana-auth-proxy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "hermetiq-core.grafanaOauth2ProxyName" . }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8888
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermetiq-batch-deny-ingress
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
    {{- include "hermetiq-core.componentLabel" (dict "component" "maintenance") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - bootstrap
          - maintenance
  policyTypes:
    - Ingress
{{- end }}
{{- /* Grafana's auth.proxy takes the login from X-Forwarded-User, so only the
     oauth2-proxy that sets it (and the metrics scraper) may reach Grafana.
     Independent of networkPolicy.enabled: see grafana.networkPolicy. */}}
{{- if and (eq (include "hermetiq-core.grafanaOauth2ProxyEnabled" .) "true") .Values.gateway.routes.grafanaEnabled .Values.grafana.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-from-oauth2-proxy
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
    {{- include "hermetiq-core.componentLabel" (dict "component" "grafana") | nindent 4 }}
spec:
  {{- $selector := .Values.grafana.networkPolicy.podSelector | default (dict "matchLabels" (dict "app.kubernetes.io/name" "grafana")) }}
  {{- if not (or $selector.matchLabels $selector.matchExpressions) }}
  {{- fail "grafana.networkPolicy.podSelector must set matchLabels or matchExpressions: an empty selector applies the Grafana policy to every pod in the namespace" }}
  {{- end }}
  podSelector:
    {{- toYaml $selector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          {{- /* A string names the Grafana container port. */}}
          {{- $port := required "grafana.networkPolicy.port is required" .Values.grafana.networkPolicy.port }}
          port: {{ kindIs "string" $port | ternary (quote $port) (int $port) }}
      from:
        - podSelector:
            matchLabels:
              app: {{ include "hermetiq-core.grafanaOauth2ProxyName" . }}
        {{- with .Values.grafana.networkPolicy.scrapersFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
