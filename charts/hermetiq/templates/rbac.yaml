{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if eq .Values.rbac.mode "namespace" }}Role{{ else }}ClusterRole{{ end }}
metadata:
  name: {{ if eq .Values.rbac.mode "namespace" }}{{ printf "%s-%s" .Release.Name .Values.rbac.namespaceRoleName }}{{ else }}{{ printf "%s-%s" .Release.Name .Values.rbac.clusterRoleName }}{{ end }}
  {{- if eq .Values.rbac.mode "namespace" }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  {{- end }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
rules:
  {{- if .Values.rbac.rules.certManager }}
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - get
      - list
      - create
      - update
      - delete
  {{- end }}
  {{- if .Values.rbac.rules.secrets }}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
  {{- end }}
  {{- if .Values.rbac.rules.leases }}
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  {{- end }}
  {{- if .Values.rbac.rules.deployments }}
  # Workload discovery for the Buildbarn MCP tools: which ConfigMaps each
  # component mounts (the worker jsonnet lives in a ConfigMap that only the
  # worker Deployments mount), and the worker pools' container images. Storage
  # is a StatefulSet and mounts the shared component ConfigMap; get_buildbarn_status
  # also reports its replica count, which is the shard count that the per-shard
  # storage metrics key on.
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
  {{- end }}
  {{- if .Values.rbac.rules.configMaps }}
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
  {{- end }}
  {{- if .Values.rbac.rules.rbeWorkers }}
  # Worker-pool configuration for the list_rbe_workers and get_rbe_worker MCP
  # tools, and for grpc-api cost reporting. list_worker_pools reports the
  # Deployment a pool produced; an RbeWorker reports what the pool is configured
  # to do — the platform it advertises to the scheduler, its per-worker
  # concurrency and size class, and whether its container-image property is tied
  # to the image that actually runs actions. None of that is in the Deployment.
  # Disabling this leaves those two tools reporting not_permitted and says so;
  # nothing else degrades.
  # The RoleBinding below limits this ClusterRole rule to the release namespace.
  - apiGroups:
      - bb.hermetiq.com
    resources:
      - rbeworkers
    verbs:
      - get
      - list
  {{- end }}
  {{- if .Values.rbac.rules.pods }}
  # Pod placement for the storage MCP tools. A Buildbarn store's write latency
  # is a property of the disk under it, and those metrics are keyed by node —
  # so answering "is this store's device saturated" needs to know which node
  # each storage Pod landed on. A Pod carries that itself: spec.nodeName and
  # status.hostIP. Reading Pods in the Buildbarn namespace is therefore enough,
  # and no cluster-scoped `nodes` grant is required — deliberately, because
  # cluster-scoped node read is not a reasonable ask of a self-hosted operator.
  # The RoleBinding below limits this rule to the release namespace.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  {{- end }}
  # Reading the release Namespace object is allowed by a namespaced Role and
  # RoleBinding. Its UID is the on-prem license fingerprint in both RBAC
  # modes. resourceNames limits this to the release Namespace.
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - {{ include "hermetiq-core.namespace" . }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ if eq .Values.rbac.mode "namespace" }}{{ printf "%s-%s" .Release.Name .Values.rbac.namespaceRoleBindingName }}{{ else }}{{ .Values.rbac.roleBindingName }}{{ end }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hermetiq-core.serviceAccountName" . }}
    namespace: {{ include "hermetiq-core.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if eq .Values.rbac.mode "namespace" }}Role{{ else }}ClusterRole{{ end }}
  name: {{ if eq .Values.rbac.mode "namespace" }}{{ printf "%s-%s" .Release.Name .Values.rbac.namespaceRoleName }}{{ else }}{{ printf "%s-%s" .Release.Name .Values.rbac.clusterRoleName }}{{ end }}
{{- if .Values.rbac.rules.licenseState }}
---
# License state writer: the app persists its auto-issued trial key and the
# signed validation cache (offline grace) in the hermetiq-license-state
# Secret via the K8s API. Write verbs are resourceNames-scoped to that one
# Secret; create carries no resourceNames because Kubernetes cannot
# name-scope creation. The release Namespace UID read is in the runtime Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-license-state" .Release.Name }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ include "hermetiq-core.licenseStateSecretName" . }}
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-license-state" .Release.Name }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hermetiq-core.serviceAccountName" . }}
    namespace: {{ include "hermetiq-core.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-license-state" .Release.Name }}
{{- end }}
{{- end }}
