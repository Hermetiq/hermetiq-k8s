{{- if not .Values.postgres.password.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermetiq-core.postgresSecretName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.password.existingSecretKey }}: {{ required "postgres.password.value or postgres.password.existingSecret is required" .Values.postgres.password.value | quote }}
---
{{- end }}
{{- if not .Values.redis.password.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermetiq-core.redisSecretName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redis.password.existingSecretKey }}: {{ required "redis.password.value or redis.password.existingSecret is required" .Values.redis.password.value | quote }}
---
{{- end }}
{{- if and .Values.dashboard.oauth2Proxy.enabled (not .Values.dashboard.oauth2Proxy.client.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermetiq-core.oauth2ProxySecretName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- include "hermetiq-core.oauth2ProxySecretData" . | nindent 2 }}
---
{{- end }}
{{- if and .Values.publisher.jwks.enabled (not (include "hermetiq-core.publisherJwksUrl" .)) (not .Values.publisher.jwks.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermetiq-core.pubJwksSecretName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwks.json: {{ required "publisher.jwks.json or publisher.jwks.existingSecret is required when JWKS auth is enabled without publisher.jwks.url" .Values.publisher.jwks.json | quote }}
---
{{- end }}
{{- if and .Values.slack.botToken.value (not .Values.slack.botToken.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermetiq-core.slackSecretName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.slack.botToken.existingSecretKey }}: {{ .Values.slack.botToken.value | quote }}
---
{{- end }}
{{- if and .Values.license.key.value (not .Values.license.key.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermetiq-core.licenseSecretName" . }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.license.key.existingSecretKey }}: {{ .Values.license.key.value | quote }}
---
{{- end }}
{{- if .Values.dashboard.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: web-ui-secret-env
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.dashboard.secretEnv }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
