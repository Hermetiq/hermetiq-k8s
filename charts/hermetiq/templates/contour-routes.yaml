        {{- toYaml .Values.contour.cors.allowOrigins | nindent 8 }}
        {{- else }}
        - {{ include "hermetiq-core.dashboardUrl" . | quote }}
        {{- end }}
      allowMethods:
        {{- toYaml .Values.contour.cors.allowMethods | nindent 8 }}
      allowHeaders:
        {{- toYaml .Values.contour.cors.allowHeaders | nindent 8 }}
      exposeHeaders:
