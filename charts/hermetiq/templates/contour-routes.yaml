{{- if .Values.gateway.routes.bbcalGrpcEnabled }}
---
{{/* ============================================================ */}}
{{/* HTTPProxy: BBCal gRPC (optional)                             */}}
{{/* ============================================================ */}}
{{- if eq (include "hermetiq-core.renderPerRouteCertificates" .) "true" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.routes.bbcalGrpcName }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "hermetiq-core.bbcalGrpcHost" . | quote }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .Values.contour.certManager.clusterIssuer }}
  secretName: {{ include "hermetiq-core.routeTlsSecretName" (dict "root" . "defaultName" .Values.gateway.routes.bbcalGrpcName "secretName" .Values.contour.tls.bbcalGrpc.secretName) }}
  usages:
    - digital signature
    - key encipherment
---
{{- end }}
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ .Values.gateway.routes.bbcalGrpcName }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
spec:
  routes:
    - conditions:
        - prefix: /
      services:
        # CompletedActionLogger publishes to NATS, so it only exists on
        # NATS-ingest pods — the publisher, now that grpc-api runs
        # APP_MODE=api (which serves no ingest gRPC services).
        - name: {{ include "hermetiq-core.publisherName" . }}
          port: 50091
          protocol: h2c
      loadBalancerPolicy:
        strategy: {{ .Values.contour.httpProxy.loadBalancerPolicy }}
      timeoutPolicy:
        response: {{ .Values.contour.httpProxy.responseTimeout | quote }}
  virtualhost:
    fqdn: {{ include "hermetiq-core.bbcalGrpcHost" . }}
    tls:
      secretName: {{ include "hermetiq-core.routeTlsSecretName" (dict "root" . "defaultName" .Values.gateway.routes.bbcalGrpcName "secretName" .Values.contour.tls.bbcalGrpc.secretName) }}
      {{- if .Values.contour.tls.bbcalGrpc.clientValidation.enabled }}
      clientValidation:
        caSecret: {{ required "contour.tls.bbcalGrpc.clientValidation.caSecret is required" .Values.contour.tls.bbcalGrpc.clientValidation.caSecret }}
        optionalClientCertificate: {{ .Values.contour.tls.bbcalGrpc.clientValidation.optionalClientCertificate }}
        skipClientCertValidation: {{ .Values.contour.tls.bbcalGrpc.clientValidation.skipClientCertValidation }}
        forwardClientCertificate:
          cert: true
          subject: true
      {{- end }}
{{- end }}
---
