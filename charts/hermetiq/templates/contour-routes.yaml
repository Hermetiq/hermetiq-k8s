{{- if eq (include "hermetiq-core.routingProvider" .) "contour" }}
{{/* ============================================================ */}}
{{/* HTTPProxy: BEP gRPC                                          */}}
{{/* ============================================================ */}}
{{- if eq (include "hermetiq-core.renderPerRouteCertificates" .) "true" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.gateway.routes.bepGrpcName }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "hermetiq-core.bepGrpcHost" . | quote }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ required "contour.certManager.clusterIssuer is required" .Values.contour.certManager.clusterIssuer }}
  secretName: {{ include "hermetiq-core.routeTlsSecretName" (dict "root" . "defaultName" .Values.gateway.routes.bepGrpcName "secretName" .Values.contour.tls.bepGrpc.secretName) }}
  usages:
    - digital signature
    - key encipherment
---
{{- end }}
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: {{ .Values.gateway.routes.bepGrpcName }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
spec:
  routes:
    - conditions:
        - prefix: /
      services:
        - name: {{ include "hermetiq-core.publisherName" . }}
          port: 50091
          protocol: h2c
      loadBalancerPolicy:
        strategy: {{ .Values.contour.httpProxy.loadBalancerPolicy }}
      timeoutPolicy:
        response: {{ .Values.contour.httpProxy.responseTimeout | quote }}
  virtualhost:
    fqdn: {{ include "hermetiq-core.bepGrpcHost" . }}
    {{- if .Values.contour.cors.enabled }}
    corsPolicy:
      allowCredentials: {{ .Values.contour.cors.allowCredentials }}
      allowPrivateNetwork: {{ .Values.contour.cors.allowPrivateNetwork }}
      allowOrigin:
        {{- if .Values.contour.cors.allowOrigins }}
        {{- toYaml .Values.contour.cors.allowOrigins | nindent 8 }}
        {{- else }}
        - {{ include "hermetiq-core.dashboardUrl" . | quote }}
        {{- end }}
      allowMethods:
        {{- toYaml .Values.contour.cors.allowMethods | nindent 8 }}
      allowHeaders:
        {{- toYaml .Values.contour.cors.allowHeaders | nindent 8 }}
      exposeHeaders:
        {{- toYaml .Values.contour.cors.exposeHeaders | nindent 8 }}
      maxAge: {{ .Values.contour.cors.maxAge | quote }}
    {{- end }}
    tls:
      secretName: {{ include "hermetiq-core.routeTlsSecretName" (dict "root" . "defaultName" .Values.gateway.routes.bepGrpcName "secretName" .Values.contour.tls.bepGrpc.secretName) }}
---
{{/* ============================================================ */}}
{{/* HTTPProxy: API gRPC                                          */}}
{{/* ============================================================ */}}
