{{- if .Values.gateway.routes.bbcalGrpcEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.gateway.routes.bbcalGrpcName }}
  namespace: {{ include "hermetiq-core.namespace" . }}
  labels:
    {{- include "hermetiq-core.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- include "hermetiq-core.commonAnnotations" $ | nindent 4 }}
    {{- end }}
    {{- if eq (include "hermetiq-core.renderPerRouteCertificates" .) "true" }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManager.clusterIssuer }}
    {{- end }}
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.grpc.proxyReadTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.grpc.proxySendTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
    {{- with .Values.ingress.bbcalGrpc.annotations }}
    {{- include "hermetiq-core.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ include "hermetiq-core.bbcalGrpcHost" . }}
      http:
        paths:
          - backend:
              service:
                # CompletedActionLogger publishes to NATS, so it only exists
                # on NATS-ingest pods — the publisher, now that grpc-api runs
                # APP_MODE=api (which serves no ingest gRPC services).
                name: {{ include "hermetiq-core.publisherName" . }}
                port:
                  name: grpc
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - {{ include "hermetiq-core.bbcalGrpcHost" . }}
      secretName: {{ include "hermetiq-core.routeTlsSecretName" (dict "root" . "defaultName" .Values.gateway.routes.bbcalGrpcName "secretName" "") }}
{{- end }}
