{{- if .Values.partitionMaintenance.enabled }}
{{/* No --retention-days here: run-maintenance reads retention from
     public.part_config, and dbadmin logs a WARNING and ignores the flag.
     bootstrap.retentionDays only seeds retention on first bootstrap; change it
     later with an UPDATE on public.part_config. */ -}}
{{ include "hermetiq-core.dbadminCronJob" (dict "root" . "name" (include "hermetiq-core.partitionMaintenanceName" .) "schedule" .Values.partitionMaintenance.schedule "workload" .Values.partitionMaintenance "args" (list "run-maintenance")) }}
---
{{- end }}
{{- if .Values.progressesPartitionMaintenance.enabled }}
{{ include "hermetiq-core.dbadminCronJob" (dict "root" . "name" (include "hermetiq-core.progressesPartitionMaintenanceName" .) "schedule" .Values.progressesPartitionMaintenance.schedule "workload" .Values.progressesPartitionMaintenance "args" (list "run-maintenance" "--parent-table=public.progresses")) }}
---
{{- end }}
{{- if .Values.targetTrendsRefresh.enabled }}
{{- $root := . }}
{{- range $job := list (dict "name" (include "hermetiq-core.targetTrendsShortName" $root) "schedule" $root.Values.targetTrendsRefresh.shortSchedule "windows" "3d,7d") (dict "name" (include "hermetiq-core.targetTrendsLongName" $root) "schedule" $root.Values.targetTrendsRefresh.longSchedule "windows" "15d,30d") }}
{{ include "hermetiq-core.dbadminCronJob" (dict "root" $root "name" $job.name "schedule" $job.schedule "workload" $root.Values.targetTrendsRefresh "args" (list "refresh-target-trends" (printf "--windows=%s" $job.windows | quote) "--concurrently")) }}
---
{{- end }}
{{- end }}
