suite: oauth2-proxy web-ui ConfigMap rendering
templates:
  - templates/configmaps.yaml
  - templates/secrets.yaml
  - templates/deployment-grafana-oauth2-proxy.yaml
values:
  - ../ci-values/ci.yaml
set:
  dashboard.oauth2Proxy.client.existingSecret: oauth2-client
tests:
  - it: renders the ConfigMap when only the dashboard oauth2-proxy is enabled
    template: templates/configmaps.yaml
    set:
      dashboard.oauth2Proxy.enabled: true
      grafana.oauth2Proxy.enabled: false
    documentSelector:
      path: metadata.name
      value: oauth2-proxy-config-web-ui
    asserts:
      - isKind:
          of: ConfigMap

  - it: renders the ConfigMap when both oauth2-proxies are enabled
    template: templates/configmaps.yaml
    set:
      dashboard.oauth2Proxy.enabled: true
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: true
    documentSelector:
      path: metadata.name
      value: oauth2-proxy-config-web-ui
    asserts:
      - isKind:
          of: ConfigMap

  - it: renders the shared client Secret and Grafana rollout checksums
    set:
      dashboard.oauth2Proxy.client.existingSecret: ""
      dashboard.oauth2Proxy.client.clientId: grafana-id
      dashboard.oauth2Proxy.client.clientSecret: grafana-secret
      dashboard.oauth2Proxy.client.cookieSecret: grafana-cookie
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: true
    asserts:
      - isKind:
          of: Secret
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: oauth2-proxy-client
      - isNotEmpty:
          path: spec.template.metadata.annotations["hermetiq.com/oauth2-proxy-config-checksum"]
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
      - isNotEmpty:
          path: spec.template.metadata.annotations["hermetiq.com/oauth2-proxy-secret-checksum"]
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH2_PROXY_SKIP_AUTH_ROUTES")].value
          value: ""
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER")].value
          value: "false"
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH2_PROXY_PASS_ACCESS_TOKEN")].value
          value: "false"
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS")].value
          value: "false"
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: preserves dashboard token forwarding in the shared ConfigMap while suppressing it on Grafana
    set:
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: true
    asserts:
      - equal:
          path: data.OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER
          value: "true"
        template: templates/configmaps.yaml
        documentSelector:
          path: metadata.name
          value: oauth2-proxy-config-web-ui
      - equal:
          path: data.OAUTH2_PROXY_PASS_ACCESS_TOKEN
          value: "true"
        template: templates/configmaps.yaml
        documentSelector:
          path: metadata.name
          value: oauth2-proxy-config-web-ui

  - it: lets explicit grafana.oauth2Proxy.env overrides replace token defaults without duplicates
    template: templates/deployment-grafana-oauth2-proxy.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: true
      grafana.oauth2Proxy.env.OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
      grafana.oauth2Proxy.env.OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      grafana.oauth2Proxy.env.OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER, value: "true"}
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH2_PROXY_PASS_ACCESS_TOKEN, value: "true"}
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS, value: "true"}
          count: 1
