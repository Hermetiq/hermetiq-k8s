suite: oauth2-proxy web-ui ConfigMap rendering
templates:
  - templates/configmaps.yaml
  - templates/secrets.yaml
  - templates/deployment-grafana-oauth2-proxy.yaml
values:
  - ../ci-values/ci.yaml
set:
  dashboard.oauth2Proxy.client.existingSecret: oauth2-client
tests:
  # Both the dashboard oauth2-proxy sidecar and the standalone Grafana
  # oauth2-proxy read oauth2-proxy-config-web-ui through a non-optional envFrom.
  # Gating the ConfigMap on dashboard.oauth2Proxy alone left the Grafana pod in
  # CreateContainerConfigError whenever only the Grafana proxy was enabled.
  - it: renders the ConfigMap when only the Grafana oauth2-proxy is enabled
    template: templates/configmaps.yaml
    set:
      dashboard.oauth2Proxy.enabled: false
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: true
    documentSelector:
      path: metadata.name
      value: oauth2-proxy-config-web-ui
    asserts:
      - isKind:
          of: ConfigMap

  - it: renders the ConfigMap when only the dashboard oauth2-proxy is enabled
    template: templates/configmaps.yaml
    set:
      dashboard.oauth2Proxy.enabled: true
      grafana.oauth2Proxy.enabled: false
    documentSelector:
      path: metadata.name
      value: oauth2-proxy-config-web-ui
    asserts:
      - isKind:
          of: ConfigMap

  - it: renders the ConfigMap when both oauth2-proxies are enabled
    template: templates/configmaps.yaml
    set:
      dashboard.oauth2Proxy.enabled: true
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: true
    documentSelector:
      path: metadata.name
      value: oauth2-proxy-config-web-ui
    asserts:
      - isKind:
          of: ConfigMap

  - it: omits the ConfigMap when neither oauth2-proxy consumes it
    template: templates/configmaps.yaml
    set:
      dashboard.oauth2Proxy.enabled: false
      grafana.oauth2Proxy.enabled: false
    asserts:
      - notMatchRegex:
          path: metadata.name
          pattern: ^oauth2-proxy-config-web-ui$

  - it: omits the ConfigMap when the Grafana route is disabled and the dashboard proxy is off
    template: templates/configmaps.yaml
    set:
      dashboard.oauth2Proxy.enabled: false
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: false
    asserts:
      - notMatchRegex:
          path: metadata.name
          pattern: ^oauth2-proxy-config-web-ui$

  - it: renders the client Secret and rollout checksums when only the Grafana oauth2-proxy is enabled
    set:
      dashboard.oauth2Proxy.enabled: false
      dashboard.oauth2Proxy.client.existingSecret: ""
      dashboard.oauth2Proxy.client.clientId: grafana-id
      dashboard.oauth2Proxy.client.clientSecret: grafana-secret
      dashboard.oauth2Proxy.client.cookieSecret: grafana-cookie
      grafana.oauth2Proxy.enabled: true
      gateway.routes.grafanaEnabled: true
    asserts:
      - isKind:
          of: Secret
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: oauth2-proxy-client
      - isNotEmpty:
          path: spec.template.metadata.annotations["hermetiq.com/oauth2-proxy-config-checksum"]
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
      - isNotEmpty:
          path: spec.template.metadata.annotations["hermetiq.com/oauth2-proxy-secret-checksum"]
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH2_PROXY_SKIP_AUTH_ROUTES")].value
          value: ""
        template: templates/deployment-grafana-oauth2-proxy.yaml
        documentSelector:
          path: kind
          value: Deployment
