suite: gateway request header security
values:
  - ../ci-values/ci.yaml
tests:
  - it: strips untrusted forwarded client certificates from all gRPC GRPCRoutes
    templates:
      - templates/gateway-routes.yaml
    set:
      routing.provider: gateway
      gateway.name: test-gateway
      gateway.routes.bbcalGrpcEnabled: true
    asserts:
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestHeaderModifier
        documentSelector:
          path: metadata.name
          value: api-cloud-grpc
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove[0]
          value: x-forwarded-client-cert
        documentSelector:
          path: metadata.name
          value: api-cloud-grpc
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove[0]
          value: x-forwarded-client-cert
        documentSelector:
          path: metadata.name
          value: bep-cloud-grpc
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove[0]
          value: x-forwarded-client-cert
        documentSelector:
          path: metadata.name
          value: bbcal-grpc

  - it: strips untrusted forwarded client certificates from all gRPC HTTPRoutes
    templates:
      - templates/gateway-routes.yaml
    set:
      routing.provider: gateway-httproute-only
      gateway.name: test-gateway
      gateway.routes.bbcalGrpcEnabled: true
    asserts:
      - equal:
          path: spec.rules[0].matches[0].method
          value: OPTIONS
        documentSelector:
          path: metadata.name
          value: api-cloud-grpc
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestHeaderModifier
        documentSelector:
          path: metadata.name
          value: api-cloud-grpc
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove[0]
          value: x-forwarded-client-cert
        documentSelector:
          path: metadata.name
          value: api-cloud-grpc
      - equal:
          path: spec.rules[1].filters[0].type
          value: RequestHeaderModifier
        documentSelector:
          path: metadata.name
          value: api-cloud-grpc
      - equal:
          path: spec.rules[1].filters[0].requestHeaderModifier.remove[0]
          value: x-forwarded-client-cert
        documentSelector:
          path: metadata.name
          value: api-cloud-grpc
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove[0]
          value: x-forwarded-client-cert
        documentSelector:
          path: metadata.name
          value: bep-cloud-grpc
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove[0]
          value: x-forwarded-client-cert
        documentSelector:
          path: metadata.name
          value: bbcal-grpc

  - it: scopes gateway-cors-policy to this chart's routes and disables credentials on MCP CORS
    templates:
      - templates/gateway-routes.yaml
    set:
      routing.provider: gateway
      gateway.name: test-gateway
      gateway.namespace: shared-gateway-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: gateway-cors-policy
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: GRPCRoute
              name: bep-cloud-grpc
            - group: gateway.networking.k8s.io
              kind: GRPCRoute
              name: api-cloud-grpc
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: api-web
        documentSelector:
          path: metadata.name
          value: gateway-cors-policy
      - equal:
          path: spec.cors.allowCredentials
          value: true
        documentSelector:
          path: metadata.name
          value: gateway-cors-policy
      - equal:
          path: spec.cors.allowCredentials
          value: false
        documentSelector:
          path: metadata.name
          value: mcp-cors-policy
      - equal:
          path: spec.cors.allowOrigins
          value:
            - "https://*"
        documentSelector:
          path: metadata.name
          value: mcp-cors-policy

  - it: disables credentialed CORS on MCP routes in Contour and Ingress
    templates:
      - templates/contour-routes.yaml
      - templates/ingress-routes.yaml
    set:
      routing.provider: contour
    asserts:
      - equal:
          path: spec.virtualhost.corsPolicy.allowCredentials
          value: false
        template: templates/contour-routes.yaml
        documentSelector:
          path: spec.virtualhost.fqdn
          value: mcp.ci.hermetiq.test
      - equal:
          path: spec.virtualhost.corsPolicy.allowOrigin
          value:
            - "https://*"
        template: templates/contour-routes.yaml
        documentSelector:
          path: spec.virtualhost.fqdn
          value: mcp.ci.hermetiq.test

  - it: disables credentialed CORS on the MCP nginx Ingress while keeping https://* origin
    templates:
      - templates/ingress-routes.yaml
    set:
      routing.provider: ingress
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/cors-allow-credentials"]
          value: "false"
        documentSelector:
          path: metadata.name
          value: mcp
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/cors-allow-origin"]
          value: "https://*"
        documentSelector:
          path: metadata.name
          value: mcp
