pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr notice;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 3000;
    # Match the BFF's HTTP/1.1 transport and ID-token Authorization forwarding.
    # The public fixture intentionally does not embed private application code.
    location /grpc/ {
      proxy_pass http://auth-proxy:50091/;
      proxy_http_version 1.1;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header x-hermetiq-jwt "";
      proxy_set_header x-hermetiq-m2m-access-token "";
      proxy_set_header X-Forwarded-Access-Token "";
      proxy_set_header X-Forwarded-User "";
      proxy_set_header X-Forwarded-Email "";
      proxy_set_header X-Forwarded-Groups "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
    }
    location / { return 200 "fixture BFF\n"; }
  }
}
