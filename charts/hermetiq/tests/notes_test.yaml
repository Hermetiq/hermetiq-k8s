suite: install notes
templates:
  - templates/NOTES.txt
values:
  - ../ci-values/ci.yaml
tests:
  # Envoy Gateway accepts the EnvoyPatchPolicy and ignores it while the
  # controller flag is off. Helm cannot see that, so the notes say what to check.
  - it: tells Envoy Gateway installs to confirm the dashboard patch policy is programmed
    set:
      routing.provider: gateway
      gateway.name: public-edge
    asserts:
      - matchRegexRaw:
          pattern: 'DASHBOARD gRPC-WEB'
      - matchRegexRaw:
          pattern: 'extensionApis\.enableEnvoyPatchPolicy'
      - matchRegexRaw:
          pattern: 'get envoypatchpolicy'

  - it: stays quiet when the patch policy is not rendered
    set:
      routing.provider: gateway
      gateway.name: public-edge
      gateway.dashboardGrpcWeb.enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: 'DASHBOARD gRPC-WEB'

  # The ci-values fixture renders with Contour. Nothing exempts the dashboard
  # host from Contour's gRPC-web translation, so the notes say so up front.
  - it: warns that the dashboard is expected to fail behind Contour
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: DASHBOARD gRPC-WEB'
      - matchRegexRaw:
          pattern: 'HTTP 505'
      - notMatchRegexRaw:
          pattern: 'enableEnvoyPatchPolicy'

  - it: does not print the Contour warning for Envoy Gateway
    set:
      routing.provider: gateway
      gateway.name: public-edge
    asserts:
      - notMatchRegexRaw:
          pattern: 'WARNING: DASHBOARD gRPC-WEB'

  - it: prints no dashboard gRPC-web note for nginx Ingress
    set:
      routing.provider: ingress
    asserts:
      - notMatchRegexRaw:
          pattern: 'DASHBOARD gRPC-WEB'

  - it: prints no dashboard gRPC-web note for GKE Gateway
    set:
      routing.provider: gateway-httproute-only
      gateway.name: public-edge
    asserts:
      - notMatchRegexRaw:
          pattern: 'DASHBOARD gRPC-WEB'

  # The Grafana NetworkPolicy renders whenever grafana.oauth2Proxy.enabled is
  # true, even without the public route, so the notes say who it admits.
  - it: describes the Grafana NetworkPolicy and how to admit other clients
    asserts:
      - matchRegexRaw:
          pattern: 'GRAFANA NETWORKPOLICY'
      - matchRegexRaw:
          pattern: 'grafana\.networkPolicy\.scrapersFrom'
      - notMatchRegexRaw:
          pattern: 'grafana-oauth2-proxy is not\s+deployed'

  - it: warns that the Grafana policy admits only scrapers when the proxy is not deployed
    set:
      gateway.routes.grafanaEnabled: false
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: gateway\.routes\.grafanaEnabled=false'
      - matchRegexRaw:
          pattern: 'grafana\.oauth2Proxy\.enabled=false'

  - it: says nothing about the Grafana policy when it is not rendered
    set:
      grafana.networkPolicy.enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: 'GRAFANA NETWORKPOLICY'

  # The BEP Ingress path is a prefix only on ingress-nginx.
  - it: warns when the BEP Ingress uses a class other than nginx
    set:
      routing.provider: ingress
      ingress.className: gce
    asserts:
      - matchRegexRaw:
          pattern: 'WARNING: BEP INGRESS'
      - matchRegexRaw:
          pattern: 'ingress\.className is "gce"'

  - it: does not warn about the BEP Ingress path on ingress-nginx
    set:
      routing.provider: ingress
    asserts:
      - notMatchRegexRaw:
          pattern: 'BEP INGRESS'

  - it: reminds Ingress installs that api-web identity headers pass through
    set:
      routing.provider: ingress
    asserts:
      - matchRegexRaw:
          pattern: 'API-WEB HEADERS'
      - matchRegexRaw:
          pattern: 'annotations-risk-level: Critical'

  - it: drops the api-web header reminder once Ingress strips them
    set:
      routing.provider: ingress
      ingress.apiWeb.stripIdentityHeaders: true
    asserts:
      - notMatchRegexRaw:
          pattern: 'API-WEB HEADERS'
