suite: browser authorization activation
templates:
  - templates/deployment-dashboard.yaml
  - templates/deployment-grafana-oauth2-proxy.yaml
  - templates/deployment-api.yaml
  - templates/networkpolicy.yaml
  - templates/validate.yaml
values:
  - ../ci-values/ci.yaml
  - ../ci-values/authorization.yaml
tests:
  - it: activates the same-origin BFF and authoritative /auth/me together
    template: templates/deployment-dashboard.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "BROWSER_AUTHORIZATION")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "GRPC_API_HOST")].value
          value: grpc-api
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_PROJECT_AUTHORIZATION_MODE")].value
          value: enforced
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_HMQ_API_URL")].value
          value: https://dashboard.ci.hermetiq.test
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "BFF_USE_ID_TOKEN")].value
          value: "true"
      - exists:
          path: spec.template.spec.containers[?(@.name == "web-ui")].volumeMounts[?(@.name == "dashboard-bff")]

  - it: keeps the dashboard oauth2-proxy on its environment configuration
    template: templates/deployment-dashboard.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name == "oauth2-proxy")]
      - notExists:
          path: spec.template.spec.containers[?(@.name == "oauth2-proxy")].args
      - notExists:
          path: spec.template.spec.containers[?(@.name == "oauth2-proxy")].volumeMounts

  - it: leaves Grafana behind its own oauth2-proxy with no Hermetiq gate
    template: templates/deployment-grafana-oauth2-proxy.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: oauth2-proxy
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "OAUTH2_PROXY_UPSTREAMS")].value
          value: http://vm-grafana:80

  - it: admits the dashboard BFF, and not Grafana, on the API's REST port
    template: templates/networkpolicy.yaml
    documentSelector:
      path: metadata.name
      value: grpc-api
    set:
      networkPolicy.enabled: true
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
            - podSelector:
                matchLabels:
                  app: web-ui

  - it: renders no session reset settings
    template: templates/deployment-api.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[?(@.name == "api")].env[?(@.name == "PROJECT_AUTHORIZATION_CONFIG")]
      - notExists:
          path: spec.template.spec.containers[?(@.name == "api")].env[?(@.name == "BROWSER_SESSION_RESET_ENABLED")]
      - notExists:
          path: spec.template.spec.containers[?(@.name == "api")].env[?(@.name == "BROWSER_SESSION_COOKIES_JSON")]

  - it: retains all legacy dashboard settings until explicit activation
    template: templates/deployment-dashboard.yaml
    set:
      authorization.mode: legacy
      publisher.enforceProjectAuthorization: false
      browserAuthorization.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "BROWSER_AUTHORIZATION")]
      - notExists:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "GRPC_API_HOST")]
      - notExists:
          path: spec.template.spec.containers[?(@.name == "web-ui")].volumeMounts[?(@.name == "dashboard-bff")]

  - it: requires browser authorization for enforced mode
    template: templates/validate.yaml
    set:
      browserAuthorization.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: authorization.mode=enforced requires browserAuthorization.enabled=true

  - it: requires the dashboard oauth2-proxy for browser authorization
    template: templates/validate.yaml
    set:
      dashboard.oauth2Proxy.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: browserAuthorization requires dashboard.oauth2Proxy.enabled=true
