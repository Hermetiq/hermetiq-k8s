suite: hermetiq buildbarn CDC compatibility annotation
values:
  - ../ci-values/ci.yaml
templates:
  - templates/deployment-api.yaml
  - templates/deployment-publisher.yaml
  - templates/deployment-subscribers.yaml
tests:
  - it: does not claim CDC compatibility by default
    template: templates/deployment-api.yaml
    asserts:
      - notExists:
          path: metadata.annotations["hermetiq.com/cdc-compatible"]
  - it: does not claim CDC compatibility on the publisher by default
    template: templates/deployment-publisher.yaml
    asserts:
      - notExists:
          path: metadata.annotations["hermetiq.com/cdc-compatible"]
  - it: annotates grpc-api when buildbarnCdcCompatible is set
    template: templates/deployment-api.yaml
    set:
      buildbarnCdcCompatible: true
    asserts:
      - equal:
          path: metadata.annotations["hermetiq.com/cdc-compatible"]
          value: "true"
  - it: annotates bep-nats-pub when buildbarnCdcCompatible is set
    template: templates/deployment-publisher.yaml
    set:
      buildbarnCdcCompatible: true
    asserts:
      - equal:
          path: metadata.annotations["hermetiq.com/cdc-compatible"]
          value: "true"
  - it: leaves subscribers unannotated because they do not validate configurations
    template: templates/deployment-subscribers.yaml
    set:
      buildbarnCdcCompatible: true
    asserts:
      - notExists:
          path: metadata.annotations["hermetiq.com/cdc-compatible"]
