suite: network policies
templates:
  - templates/networkpolicy.yaml
values:
  - ../ci-values/ci.yaml
tests:
  # Grafana's auth.proxy trusts X-Forwarded-User from any caller, so the
  # Grafana policy renders with the Grafana oauth2-proxy even while
  # networkPolicy.enabled is false.
  - it: renders only the Grafana NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: grafana-from-oauth2-proxy

  - it: admits only grafana-oauth2-proxy and vmagent to Grafana
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels: {app.kubernetes.io/name: grafana}
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - ports:
                - {protocol: TCP, port: 3000}
              from:
                - podSelector:
                    matchLabels: {app: grafana-oauth2-proxy}
                - podSelector:
                    matchLabels: {app.kubernetes.io/name: vmagent}

  - it: replaces the default Grafana selector instead of merging into it
    set:
      grafana.networkPolicy.podSelector.matchLabels.app: grafana
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels: {app: grafana}

  - it: refuses a Grafana selector that would select every pod
    set:
      grafana.networkPolicy.podSelector.matchLabels: null
    asserts:
      - failedTemplate:
          errorPattern: "grafana.networkPolicy.podSelector must set matchLabels or matchExpressions"

  - it: renders no Grafana NetworkPolicy without the Grafana oauth2-proxy
    set:
      grafana.oauth2Proxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Grafana NetworkPolicy without the Grafana route
    set:
      gateway.routes.grafanaEnabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no NetworkPolicies when the Grafana policy is opted out
    set:
      grafana.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: restricts web-ui ingress to oauth2-proxy port 8888 when dashboard oauth2Proxy is enabled
    set:
      networkPolicy.enabled: true
      dashboard.oauth2Proxy.enabled: true
      dashboard.oauth2Proxy.client.existingSecret: dashboard-oauth
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8888
        documentSelector:
          path: metadata.name
          value: web-ui
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 50091
        documentSelector:
          path: metadata.name
          value: bep-nats-pub
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8008
        documentSelector:
          path: metadata.name
          value: bep-nats-sub
      - notExists:
          path: spec.ingress
        documentSelector:
          path: metadata.name
          value: hermetiq-batch-deny-ingress

  - it: restricts publisher ingress to auth-proxy port 50081 when publisher authProxy is enabled
    set:
      networkPolicy.enabled: true
      publisher.jwks.enabled: false
      publisher.authProxy.staticForwardedUser: build-bot@example.com
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 50081
        documentSelector:
          path: metadata.name
          value: bep-nats-pub

  - it: allows web-ui appPort when dashboard oauth2Proxy is disabled
    set:
      networkPolicy.enabled: true
      dashboard.oauth2Proxy.enabled: false
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 3000
        documentSelector:
          path: metadata.name
          value: web-ui

  # The Service's gRPC ports target grpc-auth-proxy (50081); the api
  # container's own listener stays unreachable from other pods.
  - it: admits grpc-api only on its Service target ports
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value:
            - {protocol: TCP, port: 50081}
            - {protocol: TCP, port: 5150}
        documentSelector:
          path: metadata.name
          value: grpc-api
      - equal:
          path: spec.ingress[1].ports
          value:
            - {protocol: TCP, port: 8008}
        documentSelector:
          path: metadata.name
          value: grpc-api
      - notExists:
          path: spec.ingress[1].from
        documentSelector:
          path: metadata.name
          value: grpc-api

  # grpc-api's REST API (Service port 80) and its /metrics share 8008, so
  # setting metricsFrom must not cut off ingress callers.
  - it: admits ingress callers and scrapers on grpc-api's shared 8008 port
    set:
      networkPolicy.enabled: true
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
      networkPolicy.metricsFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: monitoring}
        documentSelector:
          path: metadata.name
          value: grpc-api
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: monitoring}
        documentSelector:
          path: metadata.name
          value: bep-nats-pub

  - it: keeps grpc-api's REST port open when only metricsFrom is set
    set:
      networkPolicy.enabled: true
      networkPolicy.metricsFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
    asserts:
      - notExists:
          path: spec.ingress[1].from
        documentSelector:
          path: metadata.name
          value: grpc-api
