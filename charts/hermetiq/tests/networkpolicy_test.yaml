suite: network policies
templates:
  - templates/networkpolicy.yaml
values:
  - ../ci-values/ci.yaml
tests:
  - it: renders no NetworkPolicies by default
    asserts:
      - hasDocuments:
          count: 0

  - it: restricts web-ui ingress to oauth2-proxy port 8888 when dashboard oauth2Proxy is enabled
    set:
      networkPolicy.enabled: true
      dashboard.oauth2Proxy.enabled: true
      dashboard.oauth2Proxy.client.existingSecret: dashboard-oauth
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8888
        documentSelector:
          path: metadata.name
          value: web-ui
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 50091
        documentSelector:
          path: metadata.name
          value: bep-nats-pub
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8008
        documentSelector:
          path: metadata.name
          value: bep-nats-sub
      - notExists:
          path: spec.ingress
        documentSelector:
          path: metadata.name
          value: hermetiq-batch-deny-ingress

  - it: restricts publisher ingress to auth-proxy port 50081 when publisher authProxy is enabled
    set:
      networkPolicy.enabled: true
      publisher.jwks.enabled: false
      publisher.authProxy.staticForwardedUser: build-bot@example.com
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 50081
        documentSelector:
          path: metadata.name
          value: bep-nats-pub

  - it: allows web-ui appPort when dashboard oauth2Proxy is disabled
    set:
      networkPolicy.enabled: true
      dashboard.oauth2Proxy.enabled: false
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 3000
        documentSelector:
          path: metadata.name
          value: web-ui

  # The Service's gRPC ports target grpc-auth-proxy (50081); the api
  # container's own listener stays unreachable from other pods.
  - it: admits grpc-api only on its Service target ports
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value:
            - {protocol: TCP, port: 50081}
            - {protocol: TCP, port: 5150}
        documentSelector:
          path: metadata.name
          value: grpc-api
      - equal:
          path: spec.ingress[1].ports
          value:
            - {protocol: TCP, port: 8008}
        documentSelector:
          path: metadata.name
          value: grpc-api
      - notExists:
          path: spec.ingress[1].from
        documentSelector:
          path: metadata.name
          value: grpc-api

  # grpc-api's REST API (Service port 80) and its /metrics share 8008, so
  # setting metricsFrom must not cut off ingress callers.
  - it: admits ingress callers and scrapers on grpc-api's shared 8008 port
    set:
      networkPolicy.enabled: true
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
      networkPolicy.metricsFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: monitoring}
        documentSelector:
          path: metadata.name
          value: grpc-api
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels: {kubernetes.io/metadata.name: monitoring}
        documentSelector:
          path: metadata.name
          value: bep-nats-pub

  - it: keeps grpc-api's REST port open when only metricsFrom is set
    set:
      networkPolicy.enabled: true
      networkPolicy.metricsFrom:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
    asserts:
      - notExists:
          path: spec.ingress[1].from
        documentSelector:
          path: metadata.name
          value: grpc-api
