suite: dashboard route timeouts outside Envoy Gateway
templates:
  - templates/contour-routes.yaml
  - templates/ingress-routes.yaml
  - templates/gke-gateway-policies.yaml
values:
  - ../ci-values/ci.yaml
tests:
  # The dashboard calls the API through its own host, so this route carries
  # the queries that used to go to the API host. Without a bound of its own it
  # falls back to the controller default: 15s (Contour), 60s (nginx), 30s (GKE).
  - it: bounds the Contour dashboard route like the API route
    template: templates/contour-routes.yaml
    set:
      routing.provider: contour
      contour.certManager.enabled: false
    asserts:
      - equal:
          path: spec.routes[0].timeoutPolicy
          value: {response: 300s}
        documentSelector:
          path: metadata.name
          value: dashboard

  - it: follows contour.httpProxy.responseTimeout on the dashboard route
    template: templates/contour-routes.yaml
    set:
      routing.provider: contour
      contour.certManager.enabled: false
      contour.httpProxy.responseTimeout: 90s
    asserts:
      - equal:
          path: spec.routes[0].timeoutPolicy.response
          value: 90s
        documentSelector:
          path: metadata.name
          value: dashboard

  - it: raises the Contour dashboard route to the assistant stream timeout
    template: templates/contour-routes.yaml
    set:
      routing.provider: contour
      contour.certManager.enabled: false
      assistant.enabled: true
      assistant.anthropic.apiKey.existingSecret: llm-key
      assistant.streamTimeoutSeconds: 720
    asserts:
      - equal:
          path: spec.routes[0].timeoutPolicy
          value: {response: 720s, idle: 720s}
        documentSelector:
          path: metadata.name
          value: dashboard

  - it: bounds the nginx dashboard route like the API route
    template: templates/ingress-routes.yaml
    set:
      routing.provider: ingress
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          value: "300"
        documentSelector:
          path: metadata.name
          value: dashboard
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-send-timeout"]
          value: "300"
        documentSelector:
          path: metadata.name
          value: dashboard

  - it: raises the nginx dashboard route to the assistant stream timeout
    template: templates/ingress-routes.yaml
    set:
      routing.provider: ingress
      assistant.enabled: true
      assistant.anthropic.apiKey.existingSecret: llm-key
      assistant.streamTimeoutSeconds: 720
    asserts:
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          value: "720"
        documentSelector:
          path: metadata.name
          value: dashboard
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-send-timeout"]
          value: "720"
        documentSelector:
          path: metadata.name
          value: dashboard

  - it: keeps user annotations on the nginx dashboard route
    template: templates/ingress-routes.yaml
    set:
      routing.provider: ingress
      ingress.dashboard.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
        documentSelector:
          path: metadata.name
          value: dashboard

  - it: gives the GKE dashboard backend the API backend timeout
    template: templates/gke-gateway-policies.yaml
    set:
      routing.provider: gateway-httproute-only
      gateway.name: public-edge
    asserts:
      - equal:
          path: spec.default.timeoutSec
          value: 300
        documentSelector:
          path: metadata.name
          value: bp-web-ui
      - equal:
          path: spec.targetRef.name
          value: web-ui
        documentSelector:
          path: metadata.name
          value: bp-web-ui

  - it: raises the GKE dashboard backend to the assistant stream timeout
    template: templates/gke-gateway-policies.yaml
    set:
      routing.provider: gateway-httproute-only
      gateway.name: public-edge
      assistant.enabled: true
      assistant.anthropic.apiKey.existingSecret: llm-key
      assistant.streamTimeoutSeconds: 720
    asserts:
      - equal:
          path: spec.default.timeoutSec
          value: 720
        documentSelector:
          path: metadata.name
          value: bp-web-ui
      - equal:
          path: spec.default.timeoutSec
          value: 300
        documentSelector:
          path: metadata.name
          value: bp-bep-nats-pub

  - it: renders no GKE dashboard backend policy when backend policies are off
    template: templates/gke-gateway-policies.yaml
    set:
      routing.provider: gateway-httproute-only
      gateway.name: public-edge
      gateway.gke.backendPolicy.enabled: false
    asserts:
      - containsDocument:
          kind: GCPBackendPolicy
          apiVersion: networking.gke.io/v1
          any: true
        not: true
