suite: hermetiq labels and availability defaults
values:
  - ../ci-values/ci.yaml
templates:
  - templates/deployment-api.yaml
  - templates/deployment-publisher.yaml
  - templates/deployment-subscribers.yaml
  - templates/pdb.yaml
tests:
  - it: gives grpc-api stable labels and preferred pod anti-affinity
    template: templates/deployment-api.yaml
    set:
      commonLabels:
        app.kubernetes.io/component: must-not-override-component
      podLabels:
        owner: platform
        app: must-not-override-selector
        helm.sh/chart: must-not-roll-with-chart
        app.kubernetes.io/version: must-not-roll-with-version
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.selector.matchLabels.app
          value: grpc-api
      - equal:
          path: spec.template.metadata.labels.app
          value: grpc-api
      - equal:
          path: spec.template.metadata.labels.owner
          value: platform
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: hermetiq
      - isNotNull:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: hermetiq
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - notExists:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels.app
          value: grpc-api
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - notExists:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution

  - it: gives bep-nats-pub preferred pod anti-affinity
    template: templates/deployment-publisher.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: publisher
      - equal:
          path: spec.selector.matchLabels.app
          value: bep-nats-pub
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: publisher
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels.app
          value: bep-nats-pub
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
      - notExists:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution

  - it: labels subscriber pods with their component and stream partition
    template: templates/deployment-subscribers.yaml
    documentSelector:
      path: metadata.labels["hermetiq.com/stream-partition"]
      value: "0"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: subscriber
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: subscriber
      - equal:
          path: spec.template.metadata.labels["hermetiq.com/stream-partition"]
          value: "0"

  - it: enables api and publisher disruption budgets by default
    template: templates/pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentSelector:
          path: metadata.name
          value: grpc-api
      - equal:
          path: spec.selector.matchLabels.app
          value: grpc-api
        documentSelector:
          path: metadata.name
          value: grpc-api
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
        documentSelector:
          path: metadata.name
          value: grpc-api
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentSelector:
          path: metadata.name
          value: bep-nats-pub
      - equal:
          path: spec.selector.matchLabels.app
          value: bep-nats-pub
        documentSelector:
          path: metadata.name
          value: bep-nats-pub
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: publisher
        documentSelector:
          path: metadata.name
          value: bep-nats-pub

  - it: allows api preferred pod anti-affinity to be disabled
    template: templates/deployment-api.yaml
    set:
      api.podAntiAffinity.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: allows publisher preferred pod anti-affinity to be disabled
    template: templates/deployment-publisher.yaml
    set:
      publisher.podAntiAffinity.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.affinity
