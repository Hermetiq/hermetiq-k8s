suite: rbac
templates:
  - templates/rbac.yaml
values:
  - ../ci-values/ci.yaml
tests:
  - it: grants bep-nats access to discover Buildbarn config from deployments and ConfigMaps
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: rules[3].apiGroups[0]
          value: apps
        documentIndex: 0
      - equal:
          path: rules[3].resources[0]
          value: deployments
        documentIndex: 0
      # Storage is a StatefulSet and mounts the shared component ConfigMap, so
      # workload discovery has to see StatefulSets too.
      - contains:
          path: rules[3].resources
          content: statefulsets
        documentIndex: 0
      - contains:
          path: rules[3].verbs
          content: get
        documentIndex: 0
      - contains:
          path: rules[3].verbs
          content: list
        documentIndex: 0
      - equal:
          path: rules[4].apiGroups[0]
          value: ""
        documentIndex: 0
      - equal:
          path: rules[4].resources[0]
          value: configmaps
        documentIndex: 0
      - contains:
          path: rules[4].verbs
          content: get
        documentIndex: 0
      - contains:
          path: rules[4].verbs
          content: list
        documentIndex: 0
      - equal:
          path: rules[5].apiGroups[0]
          value: bb.hermetiq.com
        documentIndex: 0
      - equal:
          path: rules[5].resources[0]
          value: rbeworkers
        documentIndex: 0
      - equal:
          path: rules[5].verbs
          value:
            - get
            - list
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: bep-nats
        documentIndex: 1
      - equal:
          path: roleRef.kind
          value: ClusterRole
        documentIndex: 1

  - it: omits RbeWorker discovery access when disabled
    set:
      rbac.rules.rbeWorkers: false
    asserts:
      - notExists:
          path: rules[?(@.resources[0] == "rbeworkers")]
        documentIndex: 0
  - it: grants namespaced Pod reads so storage tools can resolve node placement
    # Disk metrics are keyed by node, and a Pod carries its own placement in
    # spec.nodeName / status.hostIP. Reading Pods in the Buildbarn namespace is
    # therefore sufficient, and no cluster-scoped `nodes` grant is needed — which
    # matters because cluster-scoped node read is not a reasonable ask of a
    # self-hosted operator.
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: rules[6].apiGroups[0]
          value: ""
        documentIndex: 0
      - equal:
          path: rules[6].resources[0]
          value: pods
        documentIndex: 0
      - contains:
          path: rules[6].verbs
          content: get
        documentIndex: 0
      - contains:
          path: rules[6].verbs
          content: list
        documentIndex: 0
      # Read-only: a storage diagnostic must never be able to mutate a Pod.
      - notContains:
          path: rules[6].verbs
          content: delete
        documentIndex: 0
      - notContains:
          path: rules[6].verbs
          content: create
        documentIndex: 0
  - it: omits the Pod rule when the operator declines it
    set:
      rbac.rules.pods: false
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - notExists:
          path: rules[6]
        documentIndex: 0
