suite: optional dashboard cost and VictoriaLogs integrations
templates:
  - templates/deployment-dashboard.yaml
  - templates/deployment-publisher.yaml
  - templates/deployment-subscribers.yaml
  - templates/validate.yaml
values:
  - ../ci-values/ci.yaml
tests:
  - it: disables both optional integrations by default
    template: templates/deployment-dashboard.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_COST_INTEGRATION_ENABLED")].value
          value: "false"
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_ENABLE_VICTORIA_LOGS")].value
          value: "false"
  - it: disables VictoriaLogs and cost report ticker on publisher and subscriber deployments
    asserts:
      - template: templates/deployment-publisher.yaml
        equal:
          path: spec.template.spec.containers[?(@.name == "bep-nats")].env[?(@.name == "VICTORIA_LOGS_ENABLED")].value
          value: "false"
      - template: templates/deployment-publisher.yaml
        equal:
          path: spec.template.spec.containers[?(@.name == "bep-nats")].env[?(@.name == "COST_REPORT_TICKER_ENABLED")].value
          value: "false"
      - template: templates/deployment-subscribers.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[?(@.name == "bep-nats-sub")].env[?(@.name == "VICTORIA_LOGS_ENABLED")].value
          value: "false"
      - template: templates/deployment-subscribers.yaml
        documentIndex: 0
        equal:
          path: spec.template.spec.containers[?(@.name == "bep-nats-sub")].env[?(@.name == "COST_REPORT_TICKER_ENABLED")].value
          value: "false"
  - it: enables VictoriaLogs independently of costs
    template: templates/deployment-dashboard.yaml
    set:
      app.victoriaLogsEnabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_ENABLE_VICTORIA_LOGS")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_COST_INTEGRATION_ENABLED")].value
          value: "false"
  - it: enables costs independently of VictoriaLogs and RBE visibility
    template: templates/deployment-dashboard.yaml
    set:
      app.costReportTickerEnabled: true
      app.openCostUrl: http://opencost.opencost.svc.cluster.local:9003
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_COST_INTEGRATION_ENABLED")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_ENABLE_VICTORIA_LOGS")].value
          value: "false"
      - equal:
          path: spec.template.spec.containers[?(@.name == "web-ui")].env[?(@.name == "REACT_APP_ENABLE_RBE_UI")].value
          value: "false"
  - it: requires app.openCostUrl when app.costReportTickerEnabled is true
    template: templates/validate.yaml
    set:
      app.costReportTickerEnabled: true
      app.openCostUrl: "   "
    asserts:
      - failedTemplate:
          errorMessage: app.openCostUrl is required when app.costReportTickerEnabled=true
  - it: rejects conflicting VictoriaLogs environment settings
    template: templates/validate.yaml
    set:
      dashboard.env.REACT_APP_ENABLE_VICTORIA_LOGS: "true"
    asserts:
      - failedTemplate:
          errorMessage: dashboard.env must not set REACT_APP_ENABLE_VICTORIA_LOGS; use app.victoriaLogsEnabled
  - it: rejects conflicting cost integration environment settings
    template: templates/validate.yaml
    set:
      dashboard.env.REACT_APP_COST_INTEGRATION_ENABLED: "true"
    asserts:
      - failedTemplate:
          errorMessage: dashboard.env must not set REACT_APP_COST_INTEGRATION_ENABLED; use app.costReportTickerEnabled
  - it: rejects conflicting API optional integration environment settings
    template: templates/validate.yaml
    set:
      api.env.COST_REPORT_TICKER_ENABLED: "true"
    asserts:
      - failedTemplate:
          errorMessage: api.env must not set COST_REPORT_TICKER_ENABLED; use app.costReportTickerEnabled
  - it: rejects conflicting API OPEN_COST_URL environment setting
    template: templates/validate.yaml
    set:
      api.env.OPEN_COST_URL: "http://opencost:9003"
    asserts:
      - failedTemplate:
          errorMessage: api.env must not set OPEN_COST_URL; use app.openCostUrl
  - it: rejects conflicting API VICTORIA_LOGS_ENABLED environment setting
    template: templates/validate.yaml
    set:
      api.env.VICTORIA_LOGS_ENABLED: "true"
    asserts:
      - failedTemplate:
          errorMessage: api.env must not set VICTORIA_LOGS_ENABLED; use app.victoriaLogsEnabled
