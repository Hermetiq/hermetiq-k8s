# Explicit compatibility fixture for installations migrating from legacy mode.
# Keep this separate from ci.yaml so the primary CI render uses chart defaults.
authorization:
  mode: legacy
publisher:
  enforceProjectAuthorization: false
browserAuthorization:
  enabled: false
api:
  scim:
    enabled: false
# Exercise the historical cross-origin deployment without dashboard OAuth.
dashboard:
  oauth2Proxy:
    enabled: false
