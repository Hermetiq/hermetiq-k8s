name: Installation help
description: Get help with a documented installation or upgrade step
title: "[install] "
labels:
  - question
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Tell us where the installation stopped and include the diagnostics below. If you can reproduce incorrect chart behavior, use **Chart bug report** instead.

        Do not include passwords, tokens, license keys, private certificates, unredacted Kubernetes Secrets, or customer-identifying data.

  - type: textarea
    id: blocked-step
    attributes:
      label: Where are you stuck?
      description: Link or name the guide and section, then describe the blocker.
      placeholder: "Root README > Install Hermetiq > Prepare routing, DNS, and TLS"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Chart
      options:
        - hermetiq
        - buildbarn
        - bb-worker-operator
        - full supported bundle
    validations:
      required: true

  - type: input
    id: chart-version
    attributes:
      label: Chart version
      placeholder: "0.9.0"
    validations:
      required: true

  - type: input
    id: helm-version
    attributes:
      label: Helm version
      description: Paste the output of `helm version --short`.
    validations:
      required: true

  - type: input
    id: kubernetes-environment
    attributes:
      label: Kubernetes environment
      description: Include the distribution/provider and server version.
      placeholder: "GKE 1.33.2, EKS 1.32, kind 1.34, ..."
    validations:
      required: true

  - type: textarea
    id: command-output
    attributes:
      label: Command and output
      description: Paste the exact failing command and its complete redacted output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: changed-values
    attributes:
      label: Redacted non-default values
      description: Paste only relevant values that differ from the chart defaults. Replace sensitive values with `<redacted>`.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: Include relevant `helm status`, `kubectl describe`, events, or container logs as text.
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I have removed secrets, credentials, license material, private certificates, and customer-identifying data.
          required: true
