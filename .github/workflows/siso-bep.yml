name: siso-bep

permissions:
  contents: read

on:
  pull_request:
    paths:
      - tools/siso-bep/**
      - .github/workflows/siso-bep.yml
  push:
    branches: [main]
    paths:
      - tools/siso-bep/**
      - .github/workflows/siso-bep.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/siso-bep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/siso-bep/go.mod
          cache-dependency-path: tools/siso-bep/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /dev/null .
