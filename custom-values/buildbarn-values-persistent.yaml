# Explicit persistent-index settings for all five CDC storage-tier stores.
# These match the chart defaults. Use this overlay to override older deployment
# values that explicitly selected inMemory; a new installation does not need it.
# Apply AFTER your deployment values:
#   helm template buildbarn charts/buildbarn -f my-values.yaml \
#     -f custom-values/buildbarn-values-persistent.yaml
#
# Review docs/buildbarn-storage-operations.md before applying to an existing
# release. Filesystem stores need free space for their index.
#
# Raw PVC stores add immutable <store>-meta claim templates and need a
# StatefulSet recreate. This profile does not set the class of those claims:
# each store's blockDevice.metadata.storageClassName defaults to premium-rwo,
# whatever class its blocks use. Set it in your deployment values for every
# raw store, to a class whose volumes are lost together with the blocks. For
# node-local blocks (TopoLVM, local PVs) that means the same local class:
# metadata left on a network class survives a node replacement that blanks
# the blocks, and the surviving index then reports blobs that are gone. NOTES
# prints "STORAGE CLASS MISMATCH" on install or upgrade when the two differ.
#
# Raw hostPath stores require each blockDevice.metadata.hostPath.path. The
# directory must already exist on the node, on the same storage as the blocks:
# blockDevice.metadata.hostPath.type defaults to Directory, so a missing
# directory fails the volume mount instead of being created on the boot disk.
# Do not override it with DirectoryOrCreate.
#
# This profile cannot preserve data written by a release on a chart older
# than 1.0.0; see docs/migrate-to-1.0.0-buildbarn.md.
#
# Only index modes change here. Existing enable flags (including optional
# ISCC/FSAC), backends, volume modes, sizes, StorageClasses, paths, and resource
# budgets are preserved. Tune disk-index sizes for your workload: RAM `entries`
# settings do not size file indexes. Later -f files or --set may override this
# profile. Avoid resizing or moving an already-persistent index unintentionally.
#
# Recovery requires retained blocks, index, and persistent_state together.
# Local blocks and metadata must share storage and reset lifecycle. Never keep
# boot-disk/network metadata over wiped Local SSD blocks. The bundled Local SSD
# overlay already selects persistent indexes and supplies same-SSD metadata
# paths for its mount/generation-checking provisioner. See the GKE validation
# runbook before adopting another layout. emptyDir cannot survive pod replacement.
storage:
  persistence:
    cas:
      # Filesystem CAS already has a file-backed index.
      blockDevice:
        keyLocationMap: file
    cms:
      # sharedCas stays on the CAS filesystem or companion metadata volume.
      # Its blocks, index, and state must fit alongside the CAS metadata.
      keyLocationMap:
        type: blockDevice
      blockDevice:
        keyLocationMap: file
    ac:
      keyLocationMap:
        type: blockDevice
      blockDevice:
        keyLocationMap: file
    iscc:
      keyLocationMap:
        type: blockDevice
      blockDevice:
        keyLocationMap: file
    fsac:
      keyLocationMap:
        type: blockDevice
      blockDevice:
        keyLocationMap: file
