# Optional overlay for GKE Standard raw-block Local SSD storage.
#
# Apply after the portable base values:
#   helm upgrade --install ... -f buildbarn-values.yaml -f buildbarn-values-local-ssd-block.yaml
#
# Prerequisites:
# - A non-preemptible storage node pool created with raw local SSDs, for example
#   gcloud ... --local-nvme-ssd-block count=N
# - Nodes labeled node-type=ssd-block and tainted hermetiq/ssd-block:NoSchedule.
# - custom-values/partition-ephemeral-disks-daemonset.yaml applied first, by
#   hand: it is not part of the Helm release. It creates
#   /dev/ephemeral/{cas,ac,iscc,fsac}, mounts a 16Gi metadata LV on the same
#   SSDs, and labels verified nodes hermetiq/ephemeral-lvm=ready. On a pool
#   that already runs the 0.9.9 layout, apply it only after storage is stopped:
#   see "Cut-over procedure for an existing Local SSD pool" in
#   docs/buildbarn-block-storage.md.
# - A namespace that permits privileged pods. HostPath raw block devices require
#   privileged Buildbarn storage containers.
#
# All five stores use persistent indexes. Their metadata directories are on the
# Local SSD metadata filesystem, not on the boot disk containing its mountpoint.
# Process/pod restarts retain warmed data and learned history while the SSDs
# survive. SSD/node replacement starts cold; reset blocks and metadata together.
# An old full VG without a metadata LV needs a cold cut-over to a fresh layout;
# the provisioner refuses to shrink data LVs or format existing metadata.
#
# Every index file and the shared CMS blocks file live on the one 16Gi metadata
# LV: 11008 MiB of indexes (CAS 7360, CMS 1280, AC 1344, ISCC 512, FSAC 512)
# plus 1024 MiB of CMS blocks is 12032 MiB of its 16384 MiB. Nothing checks
# that sum. The per-store metadata.size values below are budgets that the
# chart compares with each store's own index; in hostPath mode they reserve
# and enforce nothing on the node. The provisioner gives CAS every remaining
# extent, so the metadata LV cannot be extended later: growing an index past
# what the LV holds means a new layout and a cold reset. A 2 TiB CAS LV with
# a 15360 MiB index does not fit 16Gi; see "Layout and readiness" in
# docs/buildbarn-block-storage.md.
#
# The metadata hostPaths use type: Directory, which is also the chart default.
# Keep it: with DirectoryOrCreate the kubelet creates a missing directory on
# the boot disk and the store starts with an empty index there.
#
# Apply buildbarn-values-ephemeral.yaml LAST only for an intentional opt-out.
# See docs/buildbarn-block-storage.md (GKE Example B) and the validation runbook
# docs/buildbarn-gke-storage-validation.md before rolling out a new node image.

storage:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      # File-backed indexes total 11008 MiB (10.75 GiB). The sizing rule in
      # docs/buildbarn-storage-model.md is total index size plus about 6 GiB:
      # 16.75 GiB here. 16Gi, the base values' request, is slightly under
      # that rule. Resident index pages, CMS blocks, Go heap/GC and RPC
      # buffers share it, and the limit leaves room above it. Measure
      # working-set and page-cache pressure before reducing these
      # workload-specific bounds.
      memory: 16Gi
      # CAS/AC/ISCC/FSAC live on raw block devices; this only covers scratch.
      ephemeral-storage: 2Gi
    limits:
      cpu: 7100m
      memory: 24Gi
      ephemeral-storage: 2Gi
  # Checks the file-backed indexes against the capacity formula in
  # the chart's storage.keyLocationMapSizing. An undersized map drops location
  # records once it saturates, and clients see "Lost inputs no longer available
  # remotely" (Bazel exit 39) for blobs that are actually on disk.
  # The check uses the chart's averageObjectSizeBytes assumptions, not
  # measurements. After real traffic, watch
  # buildbarn_lossymap_hash_map_put_too_many_iterations_total per
  # name="KeyLocationMap:<store>" on the storage pods; if it rises, that index
  # is too small whatever this check said. Enlarging it empties that store,
  # and the larger file must still fit the metadata LV.
  keyLocationMapSizing:
    validate: true
    minimumRatio: 2
  persistence:
    mode: hostPath
    blockDevice:
      allowHostPath: true
      # GKE device-mapper nodes are root-owned, so grant the non-root storage
      # container access through an init container.
      deviceAccess: chownInit
    cas:
      backend: blockDevice
      blockDevice:
        keyLocationMap: file
        # Unused while keyLocationMap is file. It is here so that applying
        # buildbarn-values-ephemeral.yaml after this file renders: the chart
        # default of 24000000 entries is sized for a 200Gi device and fails
        # the sizing guard on this one, which needs at least 82534707
        # (2 x 718Gi x 41/44 / 17408 B). As a RAM index it takes about 5 GiB
        # of Go heap. Recompute it when size below changes.
        keyLocationMapInMemoryEntries: 83000000
        # Documentation only in hostPath mode — but the sizing guard reads it, so
        # it must match the real LV or the check is meaningless.
        # GKE's two "375GB" SSDs expose 375Gi each: after the 16Gi metadata LV
        # and 8/2/6Gi small stores, CAS is 717.992Gi (718Gi rounded up for the
        # sizing guard). Adjust for the actual node's device capacity.
        size: 718Gi
        hostPath:
          devicePath: /dev/ephemeral/cas
        metadata:
          # Budget for this directory: the 7360 MiB CAS index plus shared CMS
          # (1024 MiB blocks and a 1280 MiB index) is 9664 MiB. The four
          # budgets in this file add up to 14Gi of the 16Gi metadata LV.
          size: 10Gi
          keyLocationMapSizeMi: 7360
          hostPath:
            path: /mnt/stateful_partition/buildbarn-local-ssd/metadata/cas
            type: Directory
    cms:
      # Shared CMS (the default backend): its 1Gi blocks file and its index
      # (keyLocationMap.sizeMi, chart default 1280) are files under the CAS
      # metadata directory above. It has no LV and no directory of its own.
      keyLocationMap:
        type: blockDevice
    ac:
      backend: blockDevice
      blockDevice:
        keyLocationMap: file
        # Matches the 8G LV carved by partition-ephemeral-disks-daemonset.yaml.
        size: 8Gi
        hostPath:
          devicePath: /dev/ephemeral/ac
        metadata:
          size: 2Gi
          keyLocationMapSizeMi: 1344
          hostPath:
            path: /mnt/stateful_partition/buildbarn-local-ssd/metadata/ac
            type: Directory
    # ISCC/FSAC devices are deliberately SMALL: they hold one tiny object per
    # distinct action, and a larger device only inflates the key-location map they
    # need. Sizes match the LVs cut by partition-ephemeral-disks-daemonset.yaml.
    iscc:
      enabled: true
      backend: blockDevice
      blockDevice:
        keyLocationMap: file
        size: 2Gi
        hostPath:
          devicePath: /dev/ephemeral/iscc
        metadata:
          size: 1Gi
          keyLocationMapSizeMi: 512
          hostPath:
            path: /mnt/stateful_partition/buildbarn-local-ssd/metadata/iscc
            type: Directory
    fsac:
      enabled: true
      backend: blockDevice
      blockDevice:
        keyLocationMap: file
        size: 6Gi
        hostPath:
          devicePath: /dev/ephemeral/fsac
        metadata:
          size: 1Gi
          # 512 MiB (the raw-store default) indexes the 6Gi LV 2.82x at the
          # chart's 2048 B per record; the filesystem default of 256 MiB
          # would not.
          keyLocationMapSizeMi: 512
          hostPath:
            path: /mnt/stateful_partition/buildbarn-local-ssd/metadata/fsac
            type: Directory
  nodeSelector:
    node-type: ssd-block
    hermetiq/ephemeral-lvm: ready
    kubernetes.io/arch: amd64
    kubernetes.io/os: linux
  tolerations:
    - effect: NoSchedule
      key: hermetiq/ssd-block
      operator: Exists
  podAntiAffinity:
    enabled: true

config:
  actionCache:
    # Periodic-rebuild hygiene only. It is completenessChecking (always on) that
    # keeps an AC hit from referencing evicted CAS blobs, so leaving this disabled
    # is still correct. Keep minimumValidity comfortably BELOW real CAS retention
    # — derive that from the eviction rate, not from the device size:
    #   retention ~= (old+current+new) x blockBytes / bytesWrittenPerDay
    # A store whose block_allocator_releases_total is still 0 has not evicted
    # anything yet.
    actionResultExpiring:
      enabled: true
      minimumValidity: 2592000s # 30d
      maximumValidityJitter: 259200s # 3d — MUST be nonzero; bb-storage divides by it
      minimumTimestamp: "" # break-glass AC flush; empty => Unix epoch

frontend:
  contentAddressableStorage:
    # After an intentional cold reset or disk loss, positive existence entries
    # can be stale for up to 180s. Drain builds and restart frontends before
    # resuming clients after the paired reset. Ordinary clean storage restarts
    # preserve the underlying stores.
    existenceCaching:
      enabled: true
      cacheSize: 1000000
      cacheDuration: 180s

scheduler:
  # Requires storage.persistence.iscc.enabled=true above. Wires the ISCC into the
  # scheduler and switches the analyzer to feedbackDriven, which is what actually
  # writes to the ISCC store.
  sizeClassAnalysis:
    enabled: true
  # Must match every RbeWorker pool that can scale to zero (minReplicas: 0 or
  # idleReplicas: 0), including the starter pools in custom-values/rbeworkers/
  # and optional size-class pools. Each platform must equal the pool's
  # spec.config.generated.platformProperties exactly.
  predeclaredPlatformQueues:
    - platform:
        - name: container-image
          value: docker://ghcr.io/catthehacker/ubuntu:act-22.04
      sizeClasses: [0]
    - platform:
        - name: Arch
          value: amd64
        - name: OSFamily
          value: Linux
        - name: container-image
          value: docker://docker.io/mbolin491/codex-bazel@sha256:0a8e56bfaa3b2e5279db0d3bb2d62b44ba5e5d63a37d97eb8790f49da570af70
      sizeClasses: [0]
    - platform:
        - name: container-image
          value: docker://gcr.io/envoy-ci/envoy-build@sha256:7d3c99085fa5f1cff6b7293de256cc6c93ce61cd7ccb63432113a1f8fbf12a43
        - name: dockerAddCapabilities
          value: SYS_PTRACE,NET_RAW,NET_ADMIN
        - name: dockerNetwork
          value: standard
        - name: dockerPrivileged
          value: "True"
      sizeClasses: [0]
    - platform:
        - name: pool
          value: sizeclass
      sizeClasses: [1, 2]
