# Starter overrides. Advanced settings: ../charts/buildbarn/values.yaml

hosts:
  # External DNS suffix. The chart derives browser.<base>, bb.<base> for Bazel
  # gRPC, and optional RBE web/asset hosts from it.
  domainBase: helm.hermetiq.dev
  # In-cluster OTLP collector hostname, without scheme or port. Used as the
  # tracing TLS server name and the grpc-cache-proxy's http://<host>:4317
  # fallback when it has no separate OTEL endpoint.
  otel: otel-collector.hermetiq.svc.cluster.local

config:
  # Maximum unary gRPC message size shared by Buildbarn services and workers.
  # This 800 MiB example allows large BatchUpdateBlobs/Tree requests; streaming
  # ByteStream transfers are unaffected. Size pod memory for large requests.
  maximumMessageSizeBytes: 838860800

routing:
  # Attach routes to an existing Gateway with GRPCRoute support.
  provider: gateway

storage:
  # Per storage shard; tune these requests for your shard count and cache load.
  # For 10 TiB deployments (e.g. 10 x 1 TiB or 5 x 2 TiB shards), also set
  # terminationGracePeriodSeconds: 120 (or 180) and scale memory so the mmap'd
  # key-location map stays resident in the OS page cache (16Gi for 1 TiB shards,
  # 28Gi-32Gi for 2 TiB shards). See charts/buildbarn/README.md for 10 TiB profiles.
  resources:
    requests:
      cpu: 7100m
      memory: 16Gi
  # Fail helm render if any store's key-location map cannot index at least 2x
  # the objects its blocks volume can hold.
  keyLocationMapSizing:
    validate: true
  # Storage gRPC :8981 is the cache itself and has no authentication of its
  # own. Admit only Buildbarn components and RbeWorker pods in this namespace;
  # list any other client in additionalClientPeers before installing. Needs a
  # CNI that enforces NetworkPolicy (GKE Dataplane V2, Calico, Cilium).
  # Build actions run inside the admitted worker pods; only security.grpcMtls
  # (charts/buildbarn/README.md#in-cluster-mutual-tls) shuts them out too.
  networkPolicy:
    enabled: true
    # Example: limit metrics :9980 to your scraper's namespace.
    # metricsPeers:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: hermetiq
  persistence:
    # Enable ISCC and FSAC before first install when using mode=pvc: StatefulSet
    # volumeClaimTemplates are immutable after creation, and the starter
    # RbeWorker manifests in custom-values/rbeworkers/ require FSAC for
    # FUSE input prefetching. If you first installed with an older copy of this
    # file that left them disabled, `helm upgrade` is rejected until you follow
    # "Recreate the Storage StatefulSet" in docs/buildbarn-storage-operations.md
    # (or keep both disabled).
    iscc:
      enabled: true
    fsac:
      enabled: true
    # Example: scale to a 10 TiB persistent cache across 10 x 1 TiB shards
    # (also set storage.replicas: 10 and storage.terminationGracePeriodSeconds: 120):
    # cas:
    #   storageClassName: premium-rwo
    #   size: 1Ti
    #   blocksSizeGi: 950
    #   keyLocationMapSizeMi: 7680
    # ac:
    #   storageClassName: premium-rwo
    #   size: 25Gi
    #   blocksSizeGi: 20
    #   keyLocationMap:
    #     type: blockDevice
    #     sizeMi: 2688

images:
  # Hermetiq grpc-cache-proxy sidecar, used when frontend.grpcCacheProxy.enabled
  # is true. Hermetiq releases bump this tag here, so a new proxy image does not
  # need a Buildbarn chart release.
  grpcCacheProxy:
    repository: us-docker.pkg.dev/hermetiq-cloud/hermetiq-public/grpc-cache-proxy
    tag: v0.9.6
    digest: ""
    pullPolicy: IfNotPresent

frontend:
  # Optional Hermetiq grpc-cache-proxy sidecar for Action Cache Hit Tracker:
  # grpcCacheProxy:
  #   enabled: true
  #   natsUrl: nats://nats.hermetiq.svc:4222
  #   cacheEvents:
  #     subjectPrefix: cache
  #     numShards: 4 # Must equal app.streamPartitionCount in hermetiq-values.yaml
  jwks:
    # Validate Bazel JWTs against your IdP. These must match the token's exact
    # issuer and audience; use the publisher audience if both share a token.
    enabled: true
    issuer: https://<tenant>.auth0.com/ # TODO: your OIDC issuer URL
    audience: https://bep.helm.hermetiq.dev
    # Issuer + audience alone admit a token from ANY client in the tenant that
    # can get this audience, and every such token may write and execute. Bind
    # it to the Bazel machine-to-machine client. The chart requires the
    # issuer/audience check to be true and contains(allowedClientIds, payload.azp);
    # set clientIdClaim to cid (Okta), appid (Entra v1) or client_id if your IdP
    # names the claim differently.
    allowedClientIds:
      - <bazel-m2m-client-id> # TODO: the Bazel M2M application's client ID
    # Or bind to a scope/permission instead of a client, replacing the
    # generated expression (allowedClientIds still applies when set):
    # claimsValidationExpression: "payload.iss == 'https://<tenant>.auth0.com/' && contains(to_array(payload.aud), 'https://bep.helm.hermetiq.dev') && contains(payload.permissions || `[]`, 'rbe:write')"
    sync:
      # Fetch the IdP's public signing keys into frontend-jwks at install and
      # on a schedule so frontend can verify tokens without calling the IdP.
      enabled: true
      url: https://<tenant>.auth0.com/.well-known/jwks.json # TODO: your OIDC provider's JWKS URL
      # Seconds: skip a missed CronJob run after 10 minutes; cap each sync Job
      # at 5 minutes and clean completed Jobs after an hour.
      startingDeadlineSeconds: 600
      job:
        activeDeadlineSeconds: 300
        ttlSecondsAfterFinished: 3600
      initialJob:
        activeDeadlineSeconds: 300
        ttlSecondsAfterFinished: 3600
  # Reads stay open; a valid JWT adds canWriteToCache metadata internally.
  # These modes require that metadata for uploads, cache writes, and Execute.
  # The IdP does not need to issue a separate canWriteToCache claim.
  actionCache:
    putAuthorizer:
      mode: requireCanWriteToCache
  contentAddressableStorage:
    putAuthorizer:
      mode: requireCanWriteToCache
  executeAuthorizer:
    mode: requireCanWriteToCache
  resources:
    requests:
      cpu: "2"
      memory: 3Gi

browser:
  oauth2Proxy:
    # Reuse the dashboard's OAuth2 ConfigMap and Secret from the Hermetiq chart
    # to require sign-in before showing Buildbarn Browser. The flags below only
    # take effect when existingConfigMap is "" (chart-rendered ConfigMap); with
    # the Hermetiq ConfigMap in use, harden that chart's oauth2-proxy values.
    enabled: true
    # existingConfigMap: ""
    # oidcIssuerUrl: https://<tenant>.auth0.com/
    # insecureOidcAllowUnverifiedEmail: false
    # insecureOidcSkipIssuerVerification: false
    # sslInsecureSkipVerify: false
    # showDebugOnError: false
    # setXAuthRequest: false
    # skipAuthPreflight: false

scheduler:
  # Requires storage.persistence.iscc.enabled=true above.
  sizeClassAnalysis:
    enabled: true
  # Client gRPC :8982 accepts Execute without the frontend's authorizers, and
  # anything reaching worker gRPC :8983 can register as a worker and receive
  # other users' actions. Admit only the frontend (:8982), bb-portal (:8984)
  # and RbeWorker pods (:8983) in this namespace. Build actions run inside
  # those worker pods and can still reach :8983; enabling security.grpcMtls,
  # with the client key pair mounted on the worker container only, is the
  # step that stops them.
  networkPolicy:
    enabled: true
  # Declare every platform queue whose RbeWorker pool can scale to zero
  # (minReplicas: 0, or idleReplicas: 0), so builds queue and trigger KEDA
  # instead of failing with "No workers exist". Each platform must equal the
  # pool's spec.config.generated.platformProperties exactly; these mirror the
  # starter manifests in custom-values/rbeworkers/, so re-check them after
  # editing a worker's platformProperties.
  predeclaredPlatformQueues:
    # worker-ubuntu22-04.yaml (replicas: 0, minReplicas: 0)
    - platform:
        - name: container-image
          value: docker://ghcr.io/catthehacker/ubuntu:act-22.04
      sizeClasses: [0]
    # worker-codex.yaml (replicas: 0, minReplicas: 0)
    - platform:
        - name: Arch
          value: amd64
        - name: OSFamily
          value: Linux
        - name: container-image
          value: docker://docker.io/mbolin491/codex-bazel@sha256:0a8e56bfaa3b2e5279db0d3bb2d62b44ba5e5d63a37d97eb8790f49da570af70
      sizeClasses: [0]
    # worker-envoy.yaml (minReplicas: 4, idleReplicas: 0)
    - platform:
        - name: container-image
          value: docker://gcr.io/envoy-ci/envoy-build@sha256:7d3c99085fa5f1cff6b7293de256cc6c93ce61cd7ccb63432113a1f8fbf12a43
        - name: dockerAddCapabilities
          value: SYS_PTRACE,NET_RAW,NET_ADMIN
        - name: dockerNetwork
          value: standard
        - name: dockerPrivileged
          value: "True"
      sizeClasses: [0]
    # Uncomment if applying custom-values/rbeworkers/optional/sizeclass:
    # - platform:
    #     - name: pool
    #       value: sizeclass
    #   sizeClasses: [1, 2]

keda:
  frontend:
    # Scale frontend from its metrics through KEDA and VictoriaMetrics.
    # The chart keeps at least one replica so metrics can reactivate scaling.
    enabled: true

gateway:
  # Name of an existing Gateway in the release namespace (or set namespace
  # in the full chart values when the Gateway lives elsewhere).
  name: hermetiq-gateway
  cors:
    # Allow the Hermetiq dashboard to call Buildbarn Browser across origins.
    # Include the scheme; add other UI origins only when they need access.
    allowOrigins:
      - https://dashboard.helm.hermetiq.dev
  httpRoutes:
    rbeWeb:
      # Off by default. The scheduler web UI can kill operations and drain
      # workers, and the render refuses to publish it while
      # scheduler.adminHttpServers.authenticationPolicy is allow.
      enabled: false
