    retentionPeriod: 14d
    vminsert:
      extraArgs:
        maxLabelsPerTimeseries: "100"
#      nodeSelector:
#        node-type: core8
#      tolerations:
#        - effect: NoSchedule
#          key: hermetiq/core8
#          operator: Exists
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 1Gi
    vmselect:
      replicaCount: 2
#      nodeSelector:
#        node-type: core8
#      tolerations:
#        - effect: NoSchedule
#          key: hermetiq/core8
#          operator: Exists
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 2Gi
    vmstorage:
      extraArgs:
        search.maxConcurrentRequests: "16"
#      nodeSelector:
#        node-type: core8
#      tolerations:
#        - effect: NoSchedule
#          key: hermetiq/core8
#          operator: Exists
      resources:
        limits:
          cpu: 5000m
          memory: 16Gi
        requests:
          cpu: 1000m
          memory: 1Gi
      storage:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 30Gi
vmsingle:
  enabled: false
