# Starter overrides. Full chart defaults:
# helm show values open-telemetry/opentelemetry-collector --version 0.153.0
fullnameOverride: otel-collector
mode: deployment
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  limits:
    cpu: "1"
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi
presets:
  kubernetesAttributes:
    enabled: true
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
config:
  extensions:
    zpages:
      endpoint: 0.0.0.0:55679
  receivers:
    otlp:
      protocols:
        grpc:
          include_metadata: true
  processors:
    attributes/grpc_metadata:
      actions:
        - key: hermetiq_project_id
          from_context: metadata.x-hermetiq-project-id
          action: upsert
  exporters:
    otlphttp/victoriametrics:
      metrics_endpoint: http://vminsert-vmks.hermetiq.svc:8480/insert/0/opentelemetry/v1/metrics
      compression: gzip
      encoding: proto
      tls:
        insecure: true
  service:
    pipelines:
      logs: null
      traces: null
      metrics:
        receivers: [otlp]
        processors: [attributes/grpc_metadata, memory_limiter, batch]
        exporters: [otlphttp/victoriametrics]
