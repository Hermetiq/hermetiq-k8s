# Starter overrides. Advanced settings: ../charts/hermetiq/values.yaml
# Set these installation-specific license inputs before installing. See the
# Hermetiq chart README's "Licensing and trials" section for paid keys.
license:
  # Work email for trial issuance and license notices. Replace this example:
  # the application rejects example.com addresses on startup.
  contactEmail: build-team@example.com
  # REQUIRED. Installing Hermetiq confirms acceptance of the Hermetiq Software
  # License Agreement (SOFTWARE-LICENSE-AGREEMENT.md in the chart package; URL
  # in license.agreement.url). The install fails while accepted is false.
  agreement:
    accepted: true

hosts:
  # External DNS suffix for dashboard, API, MCP, BEP, Browser, and Grafana.
  # Search this file for helm.hermetiq.dev and replace it consistently.
  domainBase: helm.hermetiq.dev

bootstrap:
  # These seed pg_partman on first bootstrap; later value changes do not reset
  # existing partition policy. Size them for your expected BEP ingest volume.
  # Days of analytics data to retain.
  retentionDays: 30
  # Time covered by each new Postgres partition.
  partitionInterval: 6 hour
  # Optional: auto-create the initial project and link Buildbarn Browser /
  # Grafana URLs on first bootstrap:
  # projectId: "0"
  # projectName: "build-analytics"

postgres:
  # PostgreSQL 16+ primary with pg_partman installed for this database.
  host: <db-host>
  # Database and login owned by this installation.
  database: hermetiq_helm
  user: hermetiq_helm
  password:
    # Pre-create this Secret in the Hermetiq namespace with a "password" key.
    # The bootstrap hook runs before normal chart-managed Secrets exist.
    existingSecret: "postgres-db"
    existingSecretKey: password
  # Optional read replica for offloading dashboard Trends and MCP analytics:
  # readReplica:
  #   host: <db-read-replica-host>

routing:
  # Use an existing Gateway and a controller that supports GRPCRoute.
  provider: gateway

gateway:
  # Existing Gateway that should receive the chart's HTTPRoute/GRPCRoute.
  name: hermetiq-gateway
  # Gateway-scoped HTTP/2 flow-control and stream tuning for both Hermetiq and
  # Buildbarn routes. Enable here (preferred) and keep disabled in buildbarn-values.yaml.
  clientTrafficPolicy:
    enabled: true

redis:
  # Redis-compatible cache; the DragonflyDB starter chart provides this DNS
  # name when installed as "dragonfly" in the hermetiq namespace.
  host: dragonfly.hermetiq.svc.cluster.local
  password:
    # Secret created during DragonflyDB setup; change the name if yours differs.
    existingSecret: dragonfly-auth

nats:
  # NATS JetStream client endpoint for partitioned BEP ingest. Hermetiq
  # creates its streams; set the host for your NATS installation.
  url: nats://nats.hermetiq.svc:4222

otel:
  # OTLP/gRPC receiver for Hermetiq metrics and traces; include the scheme
  # and port (unlike Buildbarn's hosts.otel hostname-only setting).
  endpoint: http://otel-collector.hermetiq.svc.cluster.local:4317

victoriaMetrics:
  # Enable MCP infrastructure-health tools that query Buildbarn metrics.
  metricsEnabled: true
  # Scope Buildbarn recording-rule queries by the release namespace label
  # (required for RBE Infrastructure page and Barn Owl namespace evidence).
  projectLabelEnabled: true
  projectLabel: namespace
  # VictoriaMetrics Prometheus-compatible READ endpoint (vmselect), including
  # its /select/<tenant>/prometheus path. This is not the vminsert endpoint.
  baseUrl: http://vmselect-vmks.hermetiq.svc.cluster.local:8481/select/0/prometheus

gcpWorkloadIdentity:
  # GKE only. Remove this block outside GKE and configure the cloud identity
  # method for your cluster in the full chart values instead.
  enabled: true
  # Google service account bound to the chart's bep-nats ServiceAccount.
  serviceAccount: "hermetiq-bep@<gcp-project>.iam.gserviceaccount.com"

app:
  # Number of partitioned BEP streams and subscriber Deployments. Pick this
  # before a large rollout (e.g. 8-16 for high-volume 5-10 shard RBE clusters);
  # must equal frontend.grpcCacheProxy.cacheEvents.numShards in buildbarn-values.yaml.
  streamPartitionCount: 4
  # Grant the Hermetiq admin role on sign-in so initial admins can open
  # Project Settings and manage users:
  adminEmails: []
  #   - admin@your-company.com
  # Enable Action Cache Hit Tracker queries and MCP cache-event tools:
  cacheEventsEnabled: true
  normalizeRepoUrls: true
  # Recommended for production scale: offload BEP stdout/stderr progress chunks
  # to cloud object storage (requires a bucket lifecycle TTL rule on <prefix>/progress/):
  # rawBepExportBucket: gs://<bucket>/<prefix>

oidc:
  # Shared OIDC issuer for API, publisher, and dashboard. Use the exact issuer
  # URL in your tokens (including its trailing slash, if present).
  issuerUrl: https://issuer.example.com/

api:
  # Example capacity for grpc-api; size requests and replica counts to load.
  replicas: 2
  resources:
    api:
      requests:
        cpu: 500m
        memory: 1000Mi

publisher:
  # REQUIRED when running Buildbarn RbeWorkers: set to the range the worker
  # pods run in (e.g. "10.244.8.0/21") so workers can stream Completed Action
  # Logs (CAL) to bep-nats-pub:50091. It must not contain gateway or ingress
  # proxy pods; see publisher.trustedCalCidrs in the chart's values.yaml.
  # Leaving this empty rejects all worker CAL calls.
  trustedCalCidrs: ""
  # Example capacity for bep-nats-pub, which authenticates and publishes BEP.
  replicas: 2
  resources:
    requests:
      cpu: 600m
      memory: 1200Mi
  # JWKS audience defaults to https://bep.<hosts.domainBase>; register that
  # identifier with the IdP and configure Bazel's BEP token to match.

dashboard:
  # Quickstart's Bazel remote-cache URL derives as grpcs://bb.<hosts.domainBase>.
  # Override dashboard.remoteCacheUrl only if Buildbarn uses another host.
  oauth2Proxy:
    # .<hosts.domainBase> is auto-included when hosts.domainBase is set. Add
    # external redirect domains here only when needed (e.g. [".auth0.com"]).
    whitelistDomains: []
    # Optional IdP logout URL. Without it, sign-out clears only the local
    # cookie. Auth0 example (add returnTo to Auth0 Allowed Logout URLs first):
    # backendLogoutUrl: https://<tenant>.auth0.com/v2/logout?client_id=<clientId>&returnTo=https://dashboard.helm.hermetiq.dev
    backendLogoutUrl: ""
    client:
      # Secret with OAuth2 client credentials shared by dashboard and Browser.
      existingSecret: oauth2-proxy-client

# Optional: enable the RBE Infrastructure page and live fleet evidence for project IDs:
# rbe:
#   enabled: true
#   accessPolicy:
#     projects:
#       "0":
#         enabled: true
#         minimum_role: viewer

# Optional: enable the Barn Owl AI assistant (requires an Anthropic API key Secret):
# assistant:
#   enabled: true
#   anthropic:
#     apiKey:
#       existingSecret: anthropic-api
#       existingSecretKey: ANTHROPIC_API_KEY

rbac:
  enabled: true
  mode: namespace
  # Set rbeFleet: true when enabling the RBE Infrastructure page above:
  # rules:
  #   rbeFleet: true
