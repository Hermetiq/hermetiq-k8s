config:
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 30Gi
        storageClassName: premium-rwo
    memoryStore:
      enabled: true
      maxSize: 1Gi
  merge:
    max_payload: << 16MB >>
container:
  resources:
    limits:
      cpu: 1100m
      memory: 2Gi
    requests:
      cpu: 1100m
      memory: 2Gi
fullnameOverride: nats
podTemplate:
  configChecksumAnnotation: true
#  merge:
#    spec:
#      nodeSelector:
#        node-type: core8
#      tolerations:
#        - effect: NoSchedule
#          key: hermetiq/core8
#          operator: Exists
promExporter:
  enabled: true
