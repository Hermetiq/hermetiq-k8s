# Starter overrides. Full chart defaults: helm show values nats/nats
config:
  cluster:
    enabled: true
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 30Gi
        storageClassName: premium-rwo
    memoryStore:
      enabled: true
  merge:
    max_payload: << 16MB >>
container:
  resources:
    limits:
      cpu: 1100m
      memory: 2Gi
    requests:
      cpu: 1100m
      memory: 2Gi
podTemplate:
  configChecksumAnnotation: true
promExporter:
  enabled: true
